利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人甲区域干系人，权利大，利益小", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-044", "s": "在监督干系人参与的时候，()确定干系人群体和个人在项目任何特定时间的状态。", "o": ["备选方案分析", "根本原因分析", "干系人分析", "多标准决策分析"], "a": 2, "an": "P516-517,备选方案分析：在干系人参与效果没有达到期望要求时，应该开展备选方案分析，评估应对偏差的各种备选方案。根本原因分析：开展根本原因分析，确定干系人参与未达预期效果的根本原因。干系人分析：确定干系人群体和个人在项目任何特定时间的状态。多标准决策分析：考察干系人成功参与项目的标准，识别出最适当的选项。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-045", "s": "在管理干系人参与中需要更新的项目文件不包括()。", "o": ["变更日志", "问题日志", "干系人参与计划", "干系人登记册"], "a": 2, "an": "P515,干系人参与计划是项目管理计划，不是项目文件。可在管理干系人参与过程更新的项目文件主要包括。变更日志、问题日志、经验教训登记册、干系人登记册。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-046", "s": "()考察干系人成功参与项目的标准，识别出最适当的选项。", "o": ["备选方案分析", "根本原因分析", "干系人分析", "多标准决策分析"], "a": 3, "an": "P516-517,备选方案分析：在干系人参与效果没有达到期望要求时，应该开展备选方案分析，评估应对偏差的各种备选方案。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-047", "s": "在监督干系人参与过程中，()减少理解错误和沟通错误。", "o": ["反馈", "演示", "积极倾听", "领导力"], "a": 2, "an": "P517,积极倾听：通过积极倾听，减少理解错误和沟通错误。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-048", "s": "项目经理根据干系人的需求、期望、利益和对项目的潜在影响，制定项目干系人参与项目的方法，则该项目经理正在执行()过程。", "o": ["规划干系人参与", "识别干系人", "管理干系人参与", "监督干系人参与"], "a": 0, "an": "P509,规 划干 系人 参与规划定义规划干系人参与是根据干系人的需求、期望、利益和对项目的潜在影响，制定项目于系人参与项目的方法的过程。作用提供与干系人进行有效互动的可行计划。开展次数需要在整个项目期间定期开展", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-049", "s": "项目管理过程中，针对低权利、高利益类的干系人应()。", "o": ["将项目的相关事项信息随时告知对方", "重点解决其提出的主要需求，争取其支持", "判断其对项目产生的影响，实施令其满意的行动策略", "避免其对项目产生负面影响，不需过多进行干预"], "a": 0, "an": "P508:虽然这个知识点课本没有，但是它会考，而且经常考。重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-050", "s": "适用于监督干系人参与过程的数据表现技术主要是()。", "o": ["干系人参与度评估矩阵", "思维导图", "龙卷风图", "直方图"], "a": 0, "an": "P517:适用于监督干系人参与过程的数据表现技术主要是干系人参与度评估矩阵。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-051", "s": "()用于对干系人信息、相互关系以及他们与组织的关系进行可视化整理。", "o": ["思维导图", "干系人参与度评估矩阵", "根本原因分析", "优先级排序或分级"], "a": 0, "an": "P512,思维导图：用于对干系人信息、相互关系以及他们与组织的关系进行可视化整理。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-052", "s": "在了解和管理干系人期望时，可以采用多种分类方法对干系人进行分类管理。其中()方法是根据干系人主动参与项目的程度改变项目计划或执行的能力进行分组。", "o": ["权力/利益方格", "权力/影响方格", "影响/作用方格", "凸显模型"], "a": 2, "an": "P508:对项目成果的影响能力(影响),改变项目计划或执行的能力(作用)", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-053", "s": "随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果，属于()。", "o": ["识别干系人", "规划干系人", "管理干系人", "监督干系人"], "a": 3, "an": "P504,监 督干 系人 参与监控定义监督干系人参与是监督项目干系人的关系，并通过修订参与策略和计划来引导干系人合理参与项目的过程。作用随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果。开展次数需要在整个项目期间反复开展", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-054", "s": "处理与干系人管理有关的风险或潜在关注点，预测干系人可能引发的问题，属于干系人管理中的那个过程的活动()。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 2, "an": "P513,在管理干系人参与过程中，需要开展多项活动，包括：引导干系人参与，以便获取、确认或维持他们对项目成功的持续承诺；通过谈判和沟通的方式管理干系人期望；处理与干系人管理有关的风险或潜在关注点，预测干系人可能引发的问题；澄清和解决已识别的问题等。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-055", "s": "在监督干系人参与过程中，()传递愿景并激励干系人支持项目工作和成果。", "o": ["反馈", "演示", "积极倾听", "领导力"], "a": 3, "an": "P517,成功的干系人参与，需要强有力的领导技能，以传递愿景并激励干系人支持项目工作和成果。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-056", "s": "以下()不是规划干系人管理的输入。", "o": ["资源管理计划", "风险管理计划", "干系人登记册", "干系人参与计划"], "a": 3, "an": "P510-511,干系人参与计划是输出。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-057", "s": "适用于监督干系人参与过程的数据表现技术是()。", "o": ["沟通技能", "根本原因分析", "干系人参与度评估矩阵", "干系人分析技术"], "a": 2, "an": "P517:适用于监督干系人参与过程的数据表现技术主要是干系人参与度评估矩阵。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-058", "s": "在管理干系人参与过程中，需要开展多项活动，下面那个不属于管理干系人的活动()。", "o": ["澄清和解决已识别的问题", "通过谈判和沟通的方式管理干系人期望", "处理与干系人管理有关的风险或潜在关注点，预测干系人可能引发的问题", "调整与干系人的沟通频率和沟通方法，以便更好的管理干系人"], "a": 3, "an": "P513,在管理干系人参与过程中，需要开展多项活动，包括：●在适当的项目阶段引导干系人参与，以便获取、确认或维持他们对项目成功的持续承诺：●通过谈判和沟通的方式管理干系人期望；●处理与干系人管理有关的任何风险或潜在关注点，预测干系人可能在未来引发的问题；●澄清和解决已识别的问题等。D属于监督干系人参与的内容", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-059", "s": "在进行项目干系人分析时，经常用到权力/利益分析法，()属于第二区域的项目干系人。高权力低令其满意一重点管理二监督(花最少的精力)三随时告知四利益高", "o": ["项目客户", "项目团队成员", "项目经理", "供应商"], "a": 0, "an": "P508:这题的争议主要是在AC之间，C没有说明是甲方还是乙方的项目经理，如果是甲方的那么需要重点管理，根据优中选优的原则，选A更合适。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-060", "s": "在监督干系人参与过程中，()有助于理解组织战略，理解谁能行使权力和施加影响，以及培养与这些干系人沟通的能力。", "o": ["积极倾听", "文化意识", "人际交往", "政策意识"], "a": 3, "an": "P517,政策意识：有助于理解组织战略，理解谁能行使权力和施加影响，以及培养与这些干系人沟通的能力。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-061", "s": "关于干系人参与度评估矩阵，以下说法，错误的是()。", "o": ["干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较", "C是项目团队评估出来的、为确保项目成功所必不可少的参与水平(期望的)", "支持型是指了解项目及其潜在影响，并且会支持项目工作及其成果", "应根据每个干系人的当前与期望参与水平的差距，开展必要的沟通，有效引导干系人参与项目"], "a": 1, "an": "P512,干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较，干系人参与水平可分为如下：*①不了解型：不知道项目及其潜在影响。*②抵制型：知道项目及其潜在影响，但抵制项目工作或成果可能引发的任何变更。*③中立型：了解项目，但既不支持，也不反对。*④支持型：了解项目及其潜在影响，并且会支持项目工作及其成果。*⑤领导型：了解项目及其潜在影响，而且积极参与以确保项目取得成功。C代表每个干系人的当前参与水平，而D是项目团队评估出来的、为确保项目成功所必不可少的参与水平(期望的)。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-062", "s": "对于干系人的管理可使项目预期轨道进行，在进行干系人分析时，可使用权利/利益方格的方法，以下叙述中，正确的是()。", "o": ["对与权力高、利益低的干系人管理策略是随时汇报、重点关注", "对于权力高、利益高的干系人的管理策略是重点管理，及时报告", "对于权利低、利益高的干系人的管理策略是花较少的经理监督即可", "对于权利低、利益低的干系人的管理策略是可以忽略不计"], "a": 1, "an": "P508:虽然这个知识点课本没有，但是它会考，而且经常考。重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-063", "s": "某项目经理在编制干系人管理计划，绘制的如下表格是()。干系人不知晓抵制中立支持领导干系人1CD干系人2CD干系人3DC", "o": ["干系人职责分配矩阵", "干系人优先矩阵", "干系人参与度评估矩阵", "干系人亲和图"], "a": 2, "an": "P512,可以使用“干系人参与度评估矩阵”这个工具用于将干系人当前参与水平与期望参与水平进行比较。其中，C表示干系人当前参与程度，D表示所需干系人参与程度。C代表每个干系人的当前参与水平，而D是项目团队评估出来的、为确保项目成功所必不可少的参与水平(期望的)。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-064", "s": "在需求调研完毕后，项目经理小张，举行一场需求评审会，邀请到了客户代表来参加，这属于()。", "o": ["识别干系人", "规划干系人管理", "管理干系人参与", "监督干系人参与"], "a": 2, "an": "管理干系人参与就是按照计划组织干系人参与项目，简单点讲就是要各干系人参与到项目中来", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-065", "s": "复杂的干系人大型群体，适用()来分析。", "o": ["权力利益方格", "干系人立方体", "凸显模型", "影响方向"], "a": 2, "an": "P508,凸显模型：通过评估干系人的权力、紧迫性和合法性(参与的适当性),对干系人进行分类。在凸显模型中，也可以用邻近性取代合法性。适用于复杂的干系人大型群体。凸显模型可用于确定已识别干系人的相对重要性。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-066", "s": "在以下干系人参与度矩阵中，需要授权管理职责并引导其积极参与项目执行的干系人是()。注：O表示期望参与水平，●表示实际参与水平", "o": ["干系人1干系人不知晓抵制中立支持领导干系人1干系人2●0干系人3O", "干系人3", "干系人2", "干系人2和干系人3"], "a": 1, "an": "P512,这题属于文字游戏，从题意来看，希望他领导，当然需要授权管理职责，所以干系人3正确。干系人2为什么不正确，因为干系人2只需要他支持，可以不用授权管理职责，大家一定要看清楚是“管理”职责。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-067", "s": "在干系人分类方法中，干系人改变项目计划或执行的能力，属于干系人的()。", "o": ["权力", "利益", "影响", "作用"], "a": 3, "an": "P508,权力利益方格、权力影响方格或作用影响方格：基于干系人的职权级别(权力)、对项目成果的关心程度(利益)、对项目成果的影响能力(影响),或改变项目计划或执行的能力(作用)。适用于干系人关系简单的项目。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-068", "s": "规划干系人参与是根据干系人的需求、期望、利益和对项目的潜在影响，制定项目干系人参与项目的方法的过程，其主要作用是()。", "o": ["在整个项目期间为如何管理项目成本提供指南和方向", "确定项目所需的资金", "提供与干系人进行有效互动的可行计划", "为及时向干系人提供相关信息、引导干系人有效参与项目而编制书面沟通计划"], "a": 2, "an": "P509,规划干系人参与是根据干系人的需求、期望、利益和对项目的潜在影响，制定项目干系人参与项目的方法的过程。本过程的主要作用是提供与干系人进行有效互动的可行计划。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-069", "s": "根据权利/利益方格，对于权利高利益低干系人的管理方式应该是()。", "o": ["令其满意", "重点管理", "监督", "随时告知"], "a": 0, "an": "P508,虽然这个知识点课本没有，但是它会考，而且经常考。重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-070", "s": "关于项目干系人管理的描述，不正确的是()。", "o": ["项目成员的家属也可能成为项目干系人", "整个项目周期中项目干系人都可能发生增减变化", "规划干系人参与应由项目经理在项目规划阶段完成", "应把干系人满意度作为一个关键的项目目标来管理"], "a": 2, "an": "P509,规划干系人参与是一个反复过程，应由项目经理定期开展。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-071", "s": "牛主任是某集成项目的关键客户，对项目的验收有一票否决权，但他对项目的的进度似乎不太关心，对于张主任应该采取的管理策略是()。", "o": ["重点管理", "监督", "令其满意", "随时告知"], "a": 2, "an": "P508,虽然这个知识点课本没有，但是它会考，而且经常考。一票否决权，权利大，对项目的的进度似乎不太关心，利益小重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-072", "s": "提供与干系人进行有效互动的可行计划，属于()过程的主要作用。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 1, "an": "P509,规划干系人参与：提供与干系人进行有效互动的可行计划。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-073", "s": "依据权利/利益方格，对单位内部生产核心部件的干系人应采取管理策略是()。", "o": ["重点管理", "令其满意", "监督", "随时告知"], "a": 1, "an": "P508,虽然这个知识点课本没有，但是它会考，而且经常考。核心部件的干系人权利大，但是利益一般较小重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-074", "s": "()识别是什么根本原因导致了干系人对项目的某种支持水平。", "o": ["标杆对照", "假设条件和制约因素分析", "根本原因分析", "干系人参与度评估矩阵"], "a": 2, "an": "P511,根本原因分析：识别是什么根本原因导致了干系人对项目的某种支持水平。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-075", "s": "执行组织或客户组织、发起人和指导委员会的高级管理层，属于影响方向中()类的干系人。", "o": ["向上", "向下", "向外", "横向"], "a": 0, "an": "P508,影响方向：可以根据干系人对项目工作或项目团队本身的影响方向，对干系人进行分类。可以把干系人分类为：①向上。执行组织或客户组织、发起人和指导委员会的高级管理层。②向下。临时贡献知识或技能的团队或专家。③向外。项目团队外的干系人群体及其代表，如供应商、政府机构、公众、最终用户和监管部门。④横向。项目经理的同级人员，如其他项目经理或中层管理人员，他们与项目经理竞争稀缺项目资源或者合作共享资源或信息。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-076", "s": "临时贡献知识或技能的团队或专家，属于影响方向中()类的干系人。", "o": ["向上", "向下", "向外", "横向"], "a": 1, "an": "P508,影响方向：可以根据干系人对项目工作或项目团队本身的影响方向，对干系人进行分类。可以把干系人分类为：①向上。执行组织或客户组织、发起人和指导委员会的高级管理层。②向下。临时贡献知识或技能的团队或专家。③向外。项目团队外的干系人群体及其代表，如供应商、政府机构、公众、最终用户和监管部门。④横向。项目经理的同级人员，如其他项目经理或中层管理人员，他们与项目经理竞争稀缺项目资源或者合作共享资源或信息。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-077", "s": "会触发干系人参与计划更新的情况不包括()。", "o": ["项目新阶段开始", "组织结构或行业内部发生变化", "项目管理计划的更新", "新的个人或群体成为干系人，现有干系人不再是干系人群体的成员，或特定干系人对项目成功的重要性发生变化"], "a": 2, "an": "P509-510,会触发干系人参与计划更新的情况主要包括：项目新阶段开始；组织结构或行业内部发生变化；新的个人或群体成为干系人，现有干系人不再是干系人群体的成员，或特定干系人对项目成功的重要性发生变化；当其他项目过程导致需要重新审查干系人参与策略等。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-078", "s": "项目团队外的干系人群体及其代表，如供应商、政府机构、公众、最终用户和监管部门，属于影响方向中()类的干系人。", "o": ["向上", "向下", "向外", "横向"], "a": 2, "an": "P508,影响方向：可以根据干系人对项目工作或项目团队本身的影响方向，对干系人进行分类。可以把干系人分类为：①向上。执行组织或客户组织、发起人和指导委员会的高级管理层。②向下。临时贡献知识或技能的团队或专家。③向外。项目团队外的干系人群体及其代表，如供应商、政府机构、公众、最终用户和监管部门。④横向。项目经理的同级人员，如其他项目经理或中层管理人员，他们与项目经理竞争稀缺项目资源或者合作共享资源或信息。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-079", "s": "应该在什么时候编制第一版的干系人参与计划()。", "o": ["明确最初的干系人群体之后", "制订项目章程", "制定项目管理计划", "识别干系人"], "a": 0, "an": "P509,在通过识别干系人过程明确最初的干系人群体之后，就应该编制第一版的干系人参与计划，然后定期更新干系人参与计划，以反映干系人群体的变化。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-080", "s": "项目经理的同级人员，属于影响方向中()类的干系人。", "o": ["向上", "向下", "向外", "横向"], "a": 3, "an": "P508,影响方向：可以根据干系人对项目工作或项目团队本身的影响方向，对干系人进行分类。可以把干系人分类为：①向上。执行组织或客户组织、发起人和指导委员会的高级管理层。②向下。临时贡献知识或技能的团队或专家。③向外。项目团队外的干系人群体及其代表，如供应商、政府机构、公众、最终用户和监管部门。④横向。项目经理的同级人员，如其他项目经理或中层管理人员，他们与项目经理竞争稀缺项目资源或者合作共享资源或信息。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-081", "s": "下面那种情况可以不用更新干系人计划()。", "o": ["项目成员小张晋升为小组长", "项目需求阶段完毕，开始进入开发阶段", "甲方项目经理高升", "公司的组织战略发生了调整，新增了SAAS平台运营部"], "a": 3, "an": "P509-510,ABC都是和项目有直接关联的事件，这个时候是需要更新干系人。D和项目直接关系不大，可以不用更新干系人计划", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-082", "s": "()不属于干系人登记册的内容。", "o": ["身份信息", "评估信息", "隐私信息", "干系人分类"], "a": 2, "an": "P508-509,记录已识别干系人的信息，主要包括：身份信息：姓名、组织职位、地点、联系方式，以及在项目中扮演的角色。评估信息：主要需求、期望、影响项目成果的潜力，以及干系人最能影响或冲击的项目生命周期阶段。干系人分类：用内部或外部，作用、影响、权力或利益，上级、下级、外围或横向，或者项目经理选择的其他分类模型进行分类的结果等。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-083", "s": "()将干系人分析的结果与其他被视为具备引领级的组织或项目的信息进行比较。", "o": ["标杆对照", "根本原因分析", "思维导", "干系人参与度评估矩阵"], "a": 0, "an": "P511,标杆对照：将干系人分析的结果与其他被视为具备引领级的组织或项目的信息进行比较。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-084", "s": "以下属于监督干系人参与过程输出的工作绩效信息的是()。", "o": ["干系人对项目的当前支持水平", "干系人身份信息", "干系人分类", "干系人参与度评估矩阵"], "a": 0, "an": "P517,工作绩效信息包括与干系人参与状态有关的信息，例如，干系人对项目的当前支持水平，以及与干系人参与度评估矩阵、干系人立方体或其他工具所确定的期望参与水平相比较的结果。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-085", "s": "首次识别干系人的输出有()。", "o": ["变更请求", "项目管理计划更新", "干系人登记册", "沟通管理计划更新"], "a": 2, "an": "P508-509,首次识别干系人的时候，还没有项目管理计划等其他文件，自然不需要提出变更请求，也不需要更新其他项目文件", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-086", "s": "()对干系人信息、相互关系以及他们与组织的关系进行可视化整理。", "o": ["标杆对照", "思维导图", "根本原因分析", "干系人参与度评估矩阵"], "a": 1, "an": "P512,思维导图：对干系人信息、相互关系以及他们与组织的关系进行可视化整理。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-087", "s": "在编制沟通计划时，干系人登记册是沟通计划编制的输入，()不是干系人登记册的内容。", "o": ["主要沟通对象", "关键影响人", "次要沟通对象", "组织结构与干系人的责任关系"], "a": 3, "an": "P508-509,干系人登记册。用于记录已经识别的干系人的相关详细信息。主要包括高牛：身份信息：姓名、组织职位、地点、联系方式，以及在项目中扮演的角色。评估信息：主要需求、期望、影响项目成果的潜力，以及干系人最能影响或冲击的项目生命周期阶段。干系人分类：用内部或外部，作用、影响、权力或利益，上级、下级、外围或横向，或者项目经理选择的其他分类模型进行分类的结果等。组织结构与干系人的责任关系是RACI矩阵的内容", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-088", "s": "某手机应用上线后，收到老年用户的多起投诉：界面繁琐，字体太小，使用不方便。这反映了项目组在()工作中存在不足。", "o": ["变更控制", "识别干系人", "质量控制", "团队建设"], "a": 1, "an": "对项目用户群体识别不全，其中项目用户属于项目的干系人。项目干系人包括项目当事人和其利益受该项目影响(受益或受损)的个人和组织；也可以把他们称作项目的利害关系者。除了上述的项目当事人外，项目干系人还可能包括政府的有关部门、社区公众、项目用户、新闻媒体、市场中潜在的竞争对手和合作伙伴等；甚至项目班子成员的家属也应视为项目干系人。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-089", "s": "()用于将干系人当前参与水平与期望参与水平进行比较，对干系人参与水平进行分类的。", "o": ["思维导图", "干系人参与度评估矩阵", "干系人参与计划", "根本原因分"], "a": 1, "an": "P512,干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较。对干系人参与水平进行分类的方式之一。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-090", "s": "A公司正在给B公司做一个运维管理体系咨询项目，小张作为 B公司的项目接口人，主要完成两家公司间的资料传递工作。但最近 A公司提交的文档经常出现问题，小张经常受到批评，因此B公司的项目经理要求小张做资料初审工作。针对这一变化情况，A公司的项目经理在干系人管理上应该做()。*①更新干系人联系手册；②更新项目管理计划；③形成问题日志；④填写变更请求；⑤修改项目章程", "o": ["①②③", "③④⑤", "②④⑤", "①②④"], "a": 0, "an": "首先肯定有问题日志，这样CD就排除掉了。然后B里面修改项目章程明显错误，所以答案选A。", "cm": "这种场景题有的时候答案并不是很明确，用排除法来做才是最好的。"}, {"c": 17, "cn": "项目干系人管理", "no": "17-091", "s": "关于项目干系人的描述，正确的是()。", "o": ["项目干系人是从项目中获利的个人、群体或组织", "自认为受项目决策、活动或结果影响的个人、群体或组织也是干系人", "干系人分析是在项目计划阶段实施的工作，在项目其它阶段不涉及", "干系人之间的关系不是干系人分析的工作内容"], "a": 1, "an": "A错误。受项目影响的都是干系人。C错误。干系人分析是一个反复的过程，应由项目经理定期展开。D错误。干系人分析还要分析干系人之间的关系。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-092", "s": "某大型环保信息系统工程建设项目，项目发起人与项目经理一起识别出如下3类项目干系人：甲方信息系统管理人员、项目组主要技术人员、监理方，并准备针对他们编制干系人管理计划。对此，您的建议是()。", "o": ["重新识别干系人", "编制干系人管理计划", "召开干系人管理沟通会议", "编制项目进度计划"], "a": 0, "an": "该项目是大型项目，但是识别的干系人较少，需要重新识别干系人，保证识别的完整性和准确性。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-093", "s": "以下说法中不正确的是()。", "o": ["干系人参与计划可以是正式的或非正式的，非常详细的或高度概括的", "在通过识别干系人过程明确最初的干系人群体之后，就应该编制第一版的干系人参与计划，然后定期更新干系人参与计划", "团队评估项目干系人A对项目的参与程度是不抵制，现在A非常积极的支持项目，这种是好情况，代表项目深受干系人欢迎，所以不用采取引导措施", "当特定干系人对项目成功的重要性发生变化时，需要重新规划干系人参与"], "a": 2, "an": "P512,C不正确。团队评估项目干系人A对项目的参与程度是不抵制，现在A非常积极的支持项目，这种情况需要采取引导。项目干系人不是越支持项目就对项目越有利，有时候会因为过多参与项目，导致项目受负面影响。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-094", "s": "以下不属于监督干系人参与过程的人际关系与团队技能的是()。", "o": ["积极倾听", "文化意识", "人际交往", "反馈"], "a": 3, "an": "P517,适用于监督干系人参与过程的人际关系技能主要包括：积极倾听：通过积极倾听，减少理解错误和沟通错误。文化意识：文化意识和文化敏感性有助于项目经理分析干系人和团队成员的文化差异和文化需求，并对沟通进行规划。领导力：成功的干系人参与，需要强有力的领导技能，以传递愿景并激励干系人支持项目工作和成果。人际交往：通过人际交往了解关于干系人参与水平。政策意识：政策意识有助于理解组织战略，理解谁能行使权力和施加影响，以及培养与这些干系人沟通的能力。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-095", "s": "A公司承接了某银行网上银行系统的建设项目，包括应用软件开发、软硬件集成适配、系统运", "o": ["该项目的干系人包括客户、公司高层领导、项目成员及网上银行用户", "干系人管理工作应由该项目成员分工负责", "干系人管理有助于为项目赢得更多的资源", "通常来说，干系人对项目的影响能力在项目启动阶段最大，随着项目的进展逐渐减弱"], "a": 1, "an": "B错误。识别干系人是大家一起参与，但是管理干系人应该由项目经理来负责", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-096", "s": "在对干系人参与水平分类时可以分为()。*①不了解型；②抵制型；③中立型；④支持型；⑤领导型", "o": ["①②④", "①③⑤", "②③④", "①②③④"], "a": 3, "an": "P512,干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较，干系人参与水平可分为如下：*①不了解型：不知道项目及其潜在影响。*②抵制型：知道项目及其潜在影响，但抵制项目工作或成果可能引发的任何变更。*③中立型：了解项目，但既不支持，也不反对。*④支持型：了解项目及其潜在影响，并且会支持项目工作及其成果。*⑤领导型：了解项目及其潜在影响，而且积极参与以确保项目取得成功。C代表每个干系人的当前参与水平，而D是项目团队评估出来的、为确保项目成功所必不可少的参与水平(期望的)。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-097", "s": "随着项目的开展，项目周会的出席人数一直在下降，如果要鼓励干系人积极参加，项目经理应该查阅()。", "o": ["干系人登记册", "沟通管理计划", "人力资源管理计划", "干系人参与计划"], "a": 3, "an": "要鼓励干系人积极参加，就要采取措施来提高干系人的参与度，所以需要管理干系人参与这个过程。这道题问的是应该查阅，说的就是管理干系人参与的输入。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-098", "s": "在项目进行一段时间后，项目经理蜗牛老师发现总部调来的技术专家业务繁忙，总是不能及时的参加我们的技术交流会。为此蜗牛老师在和技术专家进行深入沟通后，约定了每次参会时间由原来的1小时改成30分钟，并且专家只需要来回答问题，不用准备课题，随后蜗牛老师更改了沟通管理计划和干系人参与计划，这属于()。", "o": ["识别干系人", "规划干系人管理", "管理干系人参与", "监督干系人参与"], "a": 3, "an": "干系人参与项目不足的时候，需要采取措施让干系人参与到项目中来，这就是监督干系人参与", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-001", "s": "以下说法不正确的是()。", "o": ["项目绩效域分为：干系人、团队、开发方法和生命周期、规划、项目工作、交付、测量、不确定性8大绩效域", "项目8大绩效域相互重叠和关联，我们不能把某一个绩效域当作一个孤立的工作进行处理", "实际项目进行过程中，每个绩效域中开展的活动是由组织的背景、项目、可交付物、项目团队、干系人和其他因素确定的", "绩效域中的活动是按顺序执行的"], "a": 3, "an": "P520,实际项目进行过程中，每个绩效域中开展的活动是由组织的背景、项目、可交付物、项目团队、干系人和其他因素确定的，它们之间并没有特定的执行顺序和权重。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-002", "s": "有效执行干系人绩效域可以实现的预期目标不包含()。", "o": ["与干系人建立高效的工作关系", "满足干系人的利益", "支持项目的干系人提高了满意度，并从中收益", "反对项目的干系人没有对项目产生负面影响"], "a": 1, "an": "P520,干系人绩效域预期目标：◆ 与干系人建立高效的工作关系；◆ 干系人认同项目目标；◆ 支持项目的干系人提高了满意度，并从中收益；◆ 反对项目的干系人没有对项目产生负面影响。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-003", "s": "交付绩效域的绩效要点包括()。*①质量；②成本；③风险；④可交付物；⑤价值的交付", "o": ["①②③", "②③④", "①④⑤", "②④⑤"], "a": 2, "an": "P540:在项目整个生命周期过程中，为了有效执行交付绩效域，项目经理需要重点关注价值的交付、可交付物、质量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-004", "s": "()在整个项目期间的不同时间交付。", "o": ["一次性交付", "多次交付", "定期交付", "持续交付"], "a": 1, "an": "P527:一次性交付。一次性交付的项目只在项目结束时交付。多次交付。一个项目可能包含多个组件，这些组件会在整个项目期间的不同时间交付，因此有些项目会进行多次交付。定期交付。定期交付与多次交付非常相似，但定期交付是按固定的交付计划进行。持续交付。持续交付是将项目特性增量交付给客户，通常通过使用小批量工作和自动化技术完成。持续交付", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-005", "s": "有效执行规划绩效域，能够达到的目标不包括()。", "o": ["项目以有条理、协调一致的方式推进", "可以根据新出现的和不断变化的需求进行调整", "对实物资源进行了有效管理", "以系统的方法交付项目成果"], "a": 2, "an": "P532:规划绩效域涉及整个项目期间组织与协调相关的活动与职能，这些活动和职能是最终交付项目和成果所必须的。规划绩效域预期目标：项目以有条理、协调一致的方式推进；应用系统的方法交付项目成果；对演变情况进行详细说明；规划投入的时间成本是适当的；规划的内容对管理干系人的需求而言是充分的；可以根据新出现的和不断变化的需求进行调整。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-006", "s": "以下()不是交付绩效域需要重点关注的内容。", "o": ["价值的交付", "可交付物", "质量", "范围"], "a": 3, "an": "P540,在项目整个生命周期过程中，为了有效执行交付绩效域，项目经理需要重点关注价值的交付、可交付物、质量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-007", "s": "在项目工作绩效域，管理实物资源的主要目标不包括()。", "o": ["促进安全的工作环境", "杜绝报废和浪费", "消除材料等待时间", "减少现场的材料搬运和储存"], "a": 1, "an": "P538,管理实物资源的目标主要包括：减少或消除现场的材料搬运和储存；消除材料等待时间；最小化报废和浪费；促进安全的工作环境等。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-008", "s": "下列关于建设团队的说法，不正确的是()。", "o": ["团队成员对成果的主人翁意识越强，表现就越好", "出现问题或故障时能够快速定位，体现了团队绩效高，韧性强", "所有团队成员都应展现出相应的领导力和人际关系技能", "团队成员相互协作与合作，有助于产生多样化的想法，获得更好成果"], "a": 1, "an": "P523,", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-009", "s": "在交付绩效域，为了有效执行项目交付工作，项目经理需要重点关注的内容包括：()。*①可交付物；②价值的交付；③质量；④规划；⑤预算", "o": ["②③④", "①②③", "①②③④⑤", "①②④"], "a": 1, "an": "P540:在项目整个生命周期过程中，为了有效执行交付绩效域，项目经理需要重点关注价值的交付、可交付物、质量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-010", "s": "以下()不是概率估算的相关因素。", "o": ["具有一定区间的点估算", "置信程度", "概率分布", "管理储备"], "a": 3, "an": "P534,可采用的估算方法包括：*(1)确定性估算和概率估算。确定性估算，也称为点估算，表示为一个数字或金额，如36个月。概率估算包括一定区间内的估算以及该区间内的相关概率。概率估算的三个因素：具有一定区间、置信程度、概率分布。*(2)绝对估算和相对估算。绝对估算是具体信息，使用实际数字，相对估算一般会基于某一个特定基准进行。*(3)基于工作流的估算。基于工作流的估算是通过确定周期和产量来制定的。*(4)对不确定性的调整估算。可根据不确定性模拟的结果，通过增加应急储备的方式，调整关键可交付物的交付日期或成本估算值。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-011", "s": "处理基于系统的复杂性的方法主要包括()。*①解耦；②模拟；③多样性；④平衡", "o": ["①②", "③④", "①③", "②④"], "a": 0, "an": "P551。处理复杂性的方法主要有：*(1)基于系统的复杂性。处理基于系统的复杂性的方法主要包括：①解耦②模拟*(2)重新构建的复杂性。处理需要重新构建的复杂性的方法主要包括：①多样性②平衡*(3)基于过程的复杂性。处理基于过程的复杂性的方法主要包括：①迭代②参与③故障保护", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-012", "s": "在一个信息化系统开发项目中，()是属于交付物的度量指标。", "o": ["系统可用性百分比", "项目文档的总页数", "开发进度报告更新频率", "项目经理加班工时"], "a": 0, "an": "P543,*(1)可交付物的度量指标。针对可交付物，常见的度量指标包括：有关错误或缺陷的信息：包括缺陷来源、识别的缺陷数量和已解决的缺陷数量等。绩效度量指标：描述与系统运行相关的物理或功能属性，例如尺寸、重量、容量、准确度、可靠性和效率等。技术绩效度量指标：用于度量系统组件是否符合技术要求。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-013", "s": "()按固定的交付计划进行。", "o": ["一次性交付", "多次交付", "定期交付", "持续交付"], "a": 2, "an": "P527:一次性交付。一次性交付的项目只在项目结束时交付。多次交付。一个项目可能包含多个组件，这些组件会在整个项目期间的不同时间交付，因此有些项目会进行多次交付。定期交付。定期交付与多次交付非常相似，但定期交付是按固定的交付计划进行。持续交付。持续交付是将项目特性增量交付给客户，通常通过使用小批量工作和自动化技术完成。持续交付聚焦于在整个产品生命周期内产生的收益和价值。这种交付类型更适合于人员稳定的项目团队。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-014", "s": "探索各种选项，权衡包括时间与成本、质量与成本、风险与进度、进度与质量等多种因素，在整个过程中，舍弃无效或次优的替代方案，这种不确定性应对方法是()。", "o": ["集合设计", "坚韧性", "多种结果", "收集信息"], "a": 0, "an": "P552,针对不确定性的应对方法主要包括：*(1)收集信息。可以对信息收集和分析工作进行规划，以便发现更多信息(如进行研究、争取专家参与或进行市场分析)来减少不确定性。*(2)为多种结果做好准备。制定可用的解决方案，包括备份或应急计划，为每一个不确定性做好准备。*(3)集合设计。探索各种选项，来权衡包括时间与成本、质量与成本、风险与进度、进度与质量等多种因素，在整个过程中，舍弃无效或次优的替代方案，以便项目团队能够从各种备选方案中选择最佳方案。*(4)增加韧性。韧性是对意外变化快速适应和应对的能力，韧性既适用于项目团队成员，也适用于组织过程。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-015", "s": "干系人绩效域的绩效要点是()。", "o": ["识别干系人", "管理干系人参与", "促进干系人参与", "监督干系人参与"], "a": 2, "an": "P520,在项目整个生命周期过程中，为了有效执行干系人绩效域，项目经理需要重点促进干系人的参与。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-016", "s": "有效的度量指标具有SMART特征，其中T是指()。", "o": ["具体的", "可实现的", "具有相关性", "具有及时性"], "a": 3, "an": "P543,有效的度量指标具有SMART特征如下：·S=Specific(具体的):针对要度量的内容，度量指标是具体的。例如缺陷数量、已修复的缺陷和修复缺陷平均花费的时间等。·M=Measurable(有意义的):度量指标应与基准或需求相关。·A=Attainable(可实现的):在人员、技术和环境既定的情况下，目标是可以实现的。·R=Relevant(具有相关性):度量指标应具有相关性，度量结果应能带来价值，并且可付诸行动。·T=Time-bount(具有及时性):有用的度量指标具有及时性，新信息比旧信息有用，前瞻性信息(例如新趋势)可以帮助项目团队窝牛 改变方向并更好地决策。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-017", "s": "项目不确定性的应对方法包括()。*①听取专家分析和专项市场分析*②提高组织和团队的适应性能力*③建立项目关键绩效指标*④权衡项目多种因素选择最佳方案*⑤应用系统的方法交付项目成果*⑥对潜在的不确定性估算发生概率", "o": ["①②③⑤", "①③④⑥", "①③⑤⑥", "①②④⑥"], "a": 3, "an": "P552,针对不确定性的应对方法主要包括：收集信息。可以对信息收集和分析工作进行规划，以便发现更多信息(如进行研究、争取专家参与或进行市场分析)来减少不确定性。为多种结果做好准备。制定可用的解决方案，包括备份或应急计划，为每一个不确定性做好准备。如果存在大量潜在不确定性，项目团队需要对潜在原因进行分类和评估，估算其发生的可能性。集合设计。探索各种选项，来权衡包括时间与成本、质量与成本、风险与进度、进度与质量等多种因素，在整个过程中，舍弃无效或次优的替代方案，以便项目团队能够从各种备选方案中选择最佳方案。增加韧性。韧性是对意外变化快速适应和应对的能力，韧性既适用于项目团队成员，也适用于组织过程。如果对产品设计的初始方法或原型无效，则项目团队和组织需要能够快速学习、适应和应对变化。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-018", "s": "在项目整个生命周期过程中，为了有效执行项目工作绩效域，项目经理需要重点关注的重点不包括()。", "o": ["管理实物资源", "管理人力资源", "学习与持续改进", "管理沟通和参与"], "a": 1, "an": "P536,", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-019", "s": "关于项目工作绩效域目标和工作内容的描述，不正确的是()。", "o": ["使干系人接受项目可交付物和成果，并对其满意", "使项目团队保持专注，并使项目活动顺利进行", "通过持续学习和过程改进，提高团队能力", "涉及大量的沟通工作，与干系人绩效域关联"], "a": 0, "an": "P536,使干系人接受项目可交付物和成果，并对其满意，是干系人绩效域的预期目标预期目标【重点】高效且有数的项目绩效；适合项目和环境的项目过程；干系人适当的沟通和参与；对实物资源进行了有效管理；对采购进行了有效管理；有效处理了变更；通过持续学习和过程改进提高了团队能力。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-020", "s": "处理基于系统的复杂性的方法主要包括()。*①迭代；②参与；③解耦；④故障保护；⑤模拟；⑥多样性；⑦平衡", "o": ["③⑤", "③⑤⑦", "①②④⑥", "①⑦"], "a": 0, "an": "P551,处理复杂性的方法主要有：处理基于系统的复杂性的方法主要包括：*①解耦。断开系统的各个部分之间的关联，确定系统的独立工作的一部分，以简化系统并减少相互之间有关联的变量的数量，可降低问题的总体规模。*②模拟。模拟系统的组件。处理需要重新构建的复杂性的方法主要包括：*①多样性。需要从不同的角度看待复杂的系统；*②平衡。平衡使用的多种数据类型。处理基于过程的复杂性的方法主要包括：*①迭代。以迭代或增量方式进行构建，一次增加一个特性，每次迭代后，确定哪些特性有效、哪些特性无效。*②参与。创造机会争取干系人参与，可以减少假设数量，并将学习和参与融入到过程之中。*③ 故障保护。对系统中的关键要素，要增加冗余，或者增加在关键组件出现故障时能提供功能正常降级的要素。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-021", "s": "从计算机模拟中得出的概率估算有3个相关因素，这3个因素共同构成了一个可描述概率估算的完整的度量指标，其中不包含()。", "o": ["具有一定区间的点估算", "置信程度", "概率分布", "期望值"], "a": 3, "an": "P534。从计算机模拟中得出的概率估算有3个相关因素：*(1)具有一定区间(例如，36个月+3个月/-1个月)的点估算。*(2)置信程度，例如95??水平。*(3)概率分布，描述特定区间内和周围的数据分布情况。这3个因素共同构成了一个可描述概率估算的完整的度量指标。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-022", "s": "有效执行交付绩效域可以实现的预期目标，不包括()。", "o": ["项目实现了预期成果", "在预定时间内实现了项目收益", "项目团队对可交付物有清晰的理解", "干系人接受项目可交付物和成果，并对其满意"], "a": 2, "an": "P539-540:预期目标【重点】项目有助于实现业务目标和战略；项目实现了预期成果；在预定时间内实现了项目收益；项目团队对需求有清晰的理解；干系人接受项目可交付物和成果，并对其满意。重点关注价值的交付、可交付物、质量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-023", "s": "在项目整个生命周期过程中，为了有效执行项目工作绩效域，项目经理高浒需要关注的重点不包括()。", "o": ["项目过程", "专注于工作过程和能力", "管理实物资源", "可以根据新出现的和不断变化的需求进行调整"], "a": 3, "an": "P536,为了有效执行项目工作绩效域，项目经理需要重点关注：项目过程、项目制约因素、专注于工作过程和能力、管理沟通和参与、管理实物资源、处理采购事宜、监督新工作和变更、学习与持续改进。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-024", "s": "在项目整个生命周期过程中，为了有效执行交付绩效域，项目经理需要关注的重点不包括()。", "o": ["价值的交付", "可交付物", "质量", "进度"], "a": 3, "an": "P540:在项目整个生命周期过程中，为了有效执行交付绩效域，项目经理需要重点关注价值的交付、可交付物、质量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-025", "s": "()将项目特性增量交付给客户。", "o": ["一次性交付", "多次交付", "定期交付", "持续交付"], "a": 3, "an": "P527:持续交付。持续交付是将项目特性增量交付给客户，通常通过使用小批量工作和自动化技术完成。持续交付聚焦于在整个产品生命周期内产生的收益和价值。这种交付类型更适合于人员稳定的项目团队", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-026", "s": "()指出，对某一事物进行度量时会对其行为产生影响，因此需要谨慎制定度量指标。", "o": ["霍桑效应", "虚荣指标", "士气低落", "确认偏见"], "a": 0, "an": "P548,我们避免常见的度量陷阱：*(1)霍桑效应。霍桑效应指出，对某一事物进行度量时会对其行为产生影响，因此需要谨慎制定度量指标。*(2)虚荣指标。对决策没有帮助的度量指标一般属于虚荣指标*(3)士气低落。如果设定了无法实现的度量指标和目标，项目团队的士气可能会下降，因此需要设定拓展性目标和激励人心的度量指标。*(4)误用度量指标。尽量避免度量指标的误用。*(5)确认偏见：度量过程中应尽量摆脱偏见。人们倾向于寻找并看到支持原有观点的信息，可能会导致对数据作出错误解释；*(6)相关性与因果关系混淆。解释度量数据的一个常见错误是将两个变量之间的相关性与一个变量导致了另一个变量的因果性混淆。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-027", "s": "以下说法不正确的是()。", "o": ["可交付物是指项目的临时或最终的产品、服务或结果", "可交付物反映了干系人的需求、范围和质量", "在采用迭代型、增量型或适应型开发方法的项目中，一般要先明确定义需求", "范围可以预先被定义好，也可以随着时间的推移而演变，或可以新发现"], "a": 2, "an": "P540:在采用迭代型、增量型或适应型开发方法的项目中，需求一般不能预先明确定义，可以使用原型、演示、故事板和模型等方法，通过需求的演变，让干系人“眼见为实”地制定需求。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-028", "s": "有效执行项目工作绩效域可以实现的预期目标，不包括()。", "o": ["高效且有数的项目绩效", "干系人认同项目目标", "对实物资源进行了有效管理", "对采购进行了有效管理"], "a": 1, "an": "P536,干系人认同项目目标，是干系人绩效域的预期目标。预期目标【重点】高效且有数的项目绩效；适合项目和环境的项目过程；干系人适当的沟通和参与；对实物资源进行了有效管理；对采购进行了有效管理；有效处理了变更；", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-029", "s": "某项工作被分配了64个故事点，项目经理根据已知的工作人力投入比较后进行估算，这属于()。", "o": ["绝对估算", "相对估算", "确定性估算", "概率估算"], "a": 1, "an": "P534,课本原例。绝对估算是具体信息，使用实际数字，例如某工作人力投入的绝对估算值为120小时，假设某全职员工每个工作日工作8小时，则该员工可在15个工作日内完成该项工作。相对估算一般会基于某一个特定基准进行，比如开展工作的项目团队会对所需的人力投入达成共识，并使用故事点来估算工作。假如与以前工作的点数相对比后，某项工作被分配了64个故事点，则新工作的64个故事点是在与以前已知的工作人力投入比较后估算得出的相对估算值。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-030", "s": "项目团队通过预测来考虑未来可能发生的情况，以便决定是否调整计划和项目工作。以下哪个不属于可用于预测的度量指标()。", "o": ["完工尚需估算(ETC)", "完工估算(EAC)", "回归分析", "成本绩效指数(CPI)"], "a": 3, "an": "P545。预测型度量指标。可用于预测的度量指标包括：*①完工尚需估算(ETC)。*②完工估算(EAC)。*③完工偏差(VAC)。*④完工尚需绩效指数(TCPI)。*⑤回归分析。回归分析通过考察一系列输入变量及其对应的输出结果建立数学或统计关系，可以用来推断未来的绩效。*⑥产量分析。这种分析方法可评估在固定时间范围内已完成事项的数量。采用适应型方法的项目使用产量度量指标来评估项目进展情况，并估算可能的完成日期。项目团队稳定情况下的持续时间估算和燃烧率有助于核实和更新成本估算。D属于基准绩效的度量指标。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-031", "s": "有效执行工作绩效域可以实现的预期目标，不包括()。", "o": ["高效且有效的项目绩效", "适合项目和环境的项目过程", "有效处理了变更", "有效进行配置管理"], "a": 3, "an": "P536,预期目标【重点】高效且有数的项目绩效；适合项目和环境的项目过程；干系人适当的沟通和参与；对实物资源进行了有效管理；对采购进行了有效管理；有效处理了变更；", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-032", "s": "以下()不是度量绩效域需要重点关注的内容。", "o": ["制定有效的度量指标", "度量内容及相应指标", "度量陷阱", "风险"], "a": 3, "an": "P542,在项目整个生命周期过程中，为了有效执行度量绩效域，项目经理需要重点关注制定有效的度量指标、度量内容及相应指标、展示度量信息和结果、度量陷阱、基于度量进行诊断、持续改进。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-033", "s": "()通过一些方式打造高绩效项目团队。", "o": ["项目经理", "项目经理和团队", "项目团队", "质量管理人员"], "a": 1, "an": "P523,项目经理和项目团队通过以下方式打造高绩效项目团队。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-034", "s": "范围和()聚焦于需要交付的内容，而()聚焦于需要达到的绩效水平。", "o": ["需求、质量", "质量、需求", "可交付成果、质量", "需求、可交付成果"], "a": 0, "an": "P541,范围和需求聚焦于需要交付的内容，而质量聚焦于需要达到的绩效水平。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-035", "s": "管理实物资源的主要目标不包括()。", "o": ["减少或消除现场的材料搬运和储存。", "消除材料等待时间。", "最小化报废和浪费。", "与供应商谈判，降低采购价格。"], "a": 3, "an": "P538,管理实物资源的目标主要包括：减少或消除现场的材料搬运和储存；消除材料等待时间；最小化报废和浪费；促进安全的工作环境等。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-036", "s": "价值的度量指标包含()。*①成本效益比；②计划收益交付与实际收益交付的对比；③投资回报率(ROI);④净现值(NPV)", "o": ["①②③④", "①②③", "②③④", "③④"], "a": 0, "an": "P544,针对价值常见的度量指标包括：*①成本效益比。成本效益比用于确定项目的成本是否超过其收益。如果成本高于收益，结果将大于1.0,在这种情况下，除非有监管、社会利益或其他原因，否则不应考虑该项目。一个类似的度量指标是效益成本比，效益成本比使用相同的度量指标，但分子是收益，分母是成本，如果比率大于1.0,则应考虑该项目。*②计划收益交付与实际收益交付的对比：组织可以把价值确定为项目实施后将带来的收益。对于预期在项目生命周期内交付收益的项目，度量项目进展中交付的收益和价值，并与预期收益进行比较，以决定继续开展项目还是取消项目。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-037", "s": "()也称为信息发射源，是一种可见的实物展示工具，可向组织内成员提供度量信息和结果，支持及时的知识共享。", "o": ["大型可见图表", "仪表盘", "任务板", "燃烧图"], "a": 0, "an": "P546,大型可见图表(BVC)也称为信息发射源，是一种可见的实物展示工具，可向组织内成员提供度量信息和结果，支持及时的知识共享。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-038", "s": "有效执行规划绩效域可以实现的预期目标，不包括()。", "o": ["项目以有条理、协调一致的方式推进", "对演变情况进行详细说明", "规划投入的时间成本是适当的", "针对新出现的和不断变化的需求无需调整"], "a": 3, "an": "P532:规划绩效域预期目标：项目以有条理、协调一致的方式推进；应用系统的方法交付项目成果；对演变情况进行详细说明；规划投入的时间成本是适当的；规划的内容对管理干系人的需求而言是充分的；可以根据新出现的和不断变化的需求进行调整。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-039", "s": "有效执行度量绩效域可以实现的预期目标，不包括()。", "o": ["项目实现了预期成果", "对项目状况充分理解", "数据充分，可支持决策", "及时采取行动，确保项目最佳绩效"], "a": 0, "an": "P542,有效执行度量绩效域可以实现的预期目标：*①对项目状况充分理解；*②数据充分，可支持决策；*③及时采取行动，确保项目最佳绩效；*④能够基于预测和评估作出决策，实现目标并产生价值。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-040", "s": "()不属于规划绩效域的预期目标。", "o": ["项目以有条理、协调一致的方式推进", "对项目状况充分了解，支持决策", "应用系统的方法交付项目成果", "可以根据新出现的和不断变化的需求进行调整"], "a": 1, "an": "P532:规划绩效域预期目标：项目以有条理、协调一致的方式推进；", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-041", "s": "新访问者的数量比网站的页面访问量更加有用，这是()的举例。", "o": ["虚荣指标", "误用度量指标", "确认偏见", "相关性与因果关系混淆"], "a": 0, "an": "P548。虚荣指标：对决策没有帮助的度量指标一般属于虚荣指标。例如，新访问者的数量比网站的页面访问量更加有用。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-042", "s": "对决策没有帮助的度量指标一般属于()。", "o": ["士气低落", "虚荣指标", "误用度量指标", "确认偏见"], "a": 1, "an": "P548,对决策没有帮助的度量指标一般属于虚荣指标。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-043", "s": "对某一事物进行度量会对其行为产生影响，因此需要谨慎制定度量指标，表明了度量具有()。", "o": ["霍桑效应", "蝴蝶效应", "木桶效应", "青蛙效应"], "a": 0, "an": "P548,霍桑效应(Hawthorne effect)。霍桑效应指出，对某一事物进行度量时会对其行为产生影响，因此需要谨慎制定度量指标。虚荣指标(Vanity metric)。对决策没有帮助的度量指标一般属于虚荣指标。士气低落。如果设定了无法实现的度量指标和目标，项目团队的士气可能会下降。误用度量指标。尽量避免度量指标的误用。确认偏见：度量过程中应尽量摆脱偏见。相关性与因果关系混淆。解释度量数据的一个常见错误是将两个变量之间的相关性与一个变量导致了另一个变量的因果性混淆。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-044", "s": "以下关于项目工作绩效域的说法中不正确的是()。", "o": ["在大多数组织中，项目经理没有签订合同的权限。", "将适应多变的工作放入附录或增补条款中，这样可以灵活应对变更，而不会对总体合同造成影响。", "采购在项目生命周期过程中的任何阶段都可进行。", "因为项目具有独特性特点，项目完成后大部分知识可能会丢失，因此项目完成后的知识转移对组织非常重要。"], "a": 3, "an": "P539,项目具有临时性特点，项目完成后大部分知识可能会丢失，因此项目完成后的知识转移对组织非常重要。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-045", "s": "在制定预算的过程中，项目的总成本为100万，项目团队把预算确定为95万，这种估算为()。", "o": ["概率估算", "确定性估算", "粗略量级估算", "自下而上估算"], "a": 1, "an": "P533:概率估算：概率估算包括一定区间内的估算以及该区间内的相关概率，这个不正确。粗略量级估算：其区间为-25?+75启动阶段的估算方法，这个也不正确。自下而上估算，是从下而上进行汇总。确定性估算：也称为点估算，表示为一个数字或金额，如36个月。所以B正确。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-046", "s": "()可以度量项目的生产率，可以对照计划跟踪已完成的工作量，显示剩余工作的数量或已减少的风险的数量。", "o": ["仪表盘", "燃烧图", "气泡图", "任务板"], "a": 1, "an": "P548,燃烧图。燃烧图(包括燃起图或燃尽图)用于显示项目团队的“速度”,此“速度”可度量项目的生产率。燃起图可以对照计划，跟踪已完成的工作量，燃尽图可以显示剩余工作(例如采用适应型方法的项目中的故事点)的数量或己减少的风险的数量。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-047", "s": "以下关于项目工作绩效域的说法中不正确的是()。", "o": ["精益生产法通过价值流图来测量增值活动和非增值活动之间的比率，用以识别增值活动是否得到满足。", "在整个项目生命周期过程中，制约因素可能会发生变化。", "项目工作要聚焦在工作过程和保护项目团队的工作能力两个方面。", "如有大量的新的沟通请求提出，说明沟通规划不足以满足干系人的需要。"], "a": 0, "an": "P537,精益生产法通过价值流图来测量增值活动和非增值活动之间的比率，用以识别是否存在非增值的冗余活动。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-048", "s": "以下关于交付节奏的说法中不正确的是()。", "o": ["持续交付聚焦于在整个产品生命周期内产生的收益和价值。这种交付类型适合需求变化频繁的项目", "一次性交付的项目只在项目结束时交付", "一个项目可能包含多个组件，这些组件会在整个项目期间的不同时间交付，因此有些项目会进行多次交付", "定期交付。定期交付与多次交付非常相似，但定期交付是按固定的交付计划进行"], "a": 0, "an": "P527:持续交付。持续交付是将项目特性增量交付给客户窩件，通常通过使用小批量工作和自动化技术完成。持续交付聚焦于在整个产品生命周期内产生的收益和价值。这种交付类型更适合于人员稳定的项目团队。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-049", "s": "有效执行不确定性绩效域可以实现的预期目 和严格的流程来降低风险，可采用()开发方法，新药开发项目可能会进行(),临床前建议、第1阶段临床试验结果、第2阶段临床试验结果、第3阶段临床试验结果、注册和上市，按照顺序进行交付。", "o": ["混合型、多次交付", "混合型、定期交付", "预测型、多次交付", "适应型、持续交付"], "a": 2, "an": "P528:高风险的产品需要在选择开发方法之前进行分析。某些高风险产品需要大量的前期规划和严格的流程来降低风险，可适当采用预测型方法，通过模块化构建、调整设计和开发，从而降低风险。P527:多次交付。一个项目可能包含多个组件，这些组件会在整个项目期间的不同时间交付，因此有些项目会进行多次交付。例如，新药开发项目可能会进行多次交付：临床前建议、第1阶段临床试验结果、第2阶段临床试验结果、第3阶段临床试验结果、注册和上市，在此示例中，交付是按顺序进行的。", "cm": "这题虽然第2问不好确定，但是第1问非常明显是预测型。"}, {"c": 18, "cn": "项目绩效域", "no": "18-111", "s": "()是识别自己的和他人的情绪的能力。", "o": ["领导力", "情商", "意识", "管理力"], "a": 1, "an": "P524,情商是识别自己的和他人的情绪的能力，情商是领导力的基础，有助于积极沟通、协作，并形成有效领导力。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-112", "s": "情商的四个层次()。", "o": ["自我意识、自我管理、社交意识、社交技能", "团队意识、团队管理、社交意识、社交技能", "自我意识、自我管理、社交意识、社交管理", "团队意识、团队管理、社交意识、社交管理"], "a": 0, "an": "P524,情商一般集中在4个层次：①自我意识。②自我管理。③社交意识。④社交技能。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-113", "s": "培训内容由基础培训、后勤培训和巡查培训模块构成，各模块由不同人员负责开发。开发时可以采用多个模块同时进行的方式，也可以先开发一个模块、收集反馈，然后再开发后续模块，但只有在所有模块均开发完毕并且进行了集成与部署后，培训方案才算是开发完成，这属于()开发方法。", "o": ["预测型", "迭代型", "增量型", "适应型"], "a": 2, "an": "P528,课本原例。增量型方法是用于在一系列迭代过程中生成可交付物，每个迭代都会在预先确定的煎间期限(时间盒)内增加功能，该可交付物包含的功能只有在最后一个迭代结束后才被完成。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-114", "s": "即与自我相关，又与管理和技能相关，属于情商四层中的()。", "o": ["自我意识", "自我管理", "社交意识", "社交技能"], "a": 1, "an": "P524,自我意识、自我管理与自我相关；社交意识、社交技能与社交相关自我意识、社交意识与意识相关；自我管理、社交技能与管理和技能相关", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-115", "s": "对于有多层级、严格汇报结构、官僚作风浓厚的组织常适合采用()。", "o": ["预测型方法", "混合型方法", "适应型方法", "面向对象方法"], "a": 0, "an": "P530,对于有多层级、严格汇报结构、官僚作风浓厚的组织常适合采用预测型方法。采用适应型方法的项目往往具有扁平式结构，更有利于与自组织的项目团队一起开展工作。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-116", "s": "()首先由干系人分别参与，制定一套广泛的备选解决方案；然后项目团队再将方案汇聚一起，确定一个首选的解决方案。", "o": ["汇聚/发散", "单方面决策", "发散/汇聚", "群体决策"], "a": 2, "an": "P525,发散/汇聚的模式：首先由干系人分别参与，制定一套广泛的备选解决方案；然后项目团队再将方案汇聚一起，确定一个首选的解决方案。", "cm": ""}, {"c": 18, "cn": "项目绩效域", "no": "18-117", "s": "有效执行开发方法和生命周期绩效域可以实现的预期目标，不包括()。", "o": ["交付节奏、开发方法及其选择", "开发方法与项目可交付物相符合", "将项目交付与干系人价值紧密关联", 的风险评估和审批等。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-004", "s": "以下关于文档的说法中，错误的是()。", "o": ["对于信息系统开发项目来说，其文档一般分开发文档、产品文档和管理文档。", "产品文档描述开发过程的产物，基本的产品文档包括：培训手册、参考手册和用户指南、软件支持手册、产品手册和信息广告。", "工作文档(3级文档):适合于由同一单位内若干人联合开发的程序，或可被其他单位使用的程序。", "文档书写规范是在管理信息系统的开发过程中用到很多的图表，对这些图表进行有规则地编号，可以方便图表的查找。"], "a": 3, "an": "P570,文档的规范化管理主要体现在文档书写规范、图表编号规则、文档目录编写标准和文档管理制度等几个方面。*(1)文档书写规范。管理信息系统的文档资料涉及文本、图形和表格等多种类型，无论是哪种类型的文档都应该遵循统一的书写规范，包括符号的使用、图标的含义、程序中注释行的使用、注明文档书写人及书写日期等。*(2)图表编号规则。在管理信息系统的开发过程中用到很多的图表，对这些图表进行有规则地编号，可以方便图表的查找。*(3)文档目录编写标准。为了存档及未来使用的方便，应该编写文档目录。管理信息系统的文档目录中应包含文档编号、文档名称、格式或载体、份数、每份页数或件数、存储地点、存档时间、保管人等。*(4)文档管理制度。文档的管理制度须根据组织实体的具体情况而定，主要包括建立文档的相关规范、文档借阅记录的登记制度、文档使用权限控制规则等。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-005", "s": "对于信息系统开发项目来说，需求规格说明、功能规格说明属于()。", "o": ["管理文档", "开发文档", "配置文档", "产品文档"], "a": 1, "an": "P569:信息系统文档一般分为三类：开发文档、产品文档、管理文档。类型作用文档种类开发文档描述开发过程本身可行性研究报告和项目任务书；需求规格说明；功能规格说明；设计规格说明，包括程序和数据规格说明；开发计划；软件集成和测试计划；质量保证计划；安全和测试信息。产品文档描述开发的产物培训手册；参考手册和用户指南；软件支持手册；产品手册和信息广告。管理文档记录项目管理信息开发过程的每个阶段的进度和进度变更的记录；软件变更情况的记录；开发团队的职责定义。项目管理计划、项目阶段报告、配置管理计划", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-006", "s": "关于变更管理工作程序描述，不正确的是()。", "o": ["项目的干系人都可以提出变更申请", "变更初审可以由配置管理员负责", "变更方案的论证需要有技术和经济方面的专家参与", "涉及项目目标及交付成果的变更，技术专家的意见应放在核心位置"], "a": 3, "an": "P567,审查过程应注意分工，项目投资人虽有最终的决策权，但通常技术上并不专业。所以应当在评审过程中将专业评审、经济评审分开，对于涉及项目目标和交付成果的变更，客户和服务对象的意见应放在核心位置。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-007", "s": "关于配置审计的描述，不正确的是()。", "o": ["审计软件即使发现不一致的情况，也不允许自动更新配置库或配置管理数据库，必须由有关负责人调查后再进行更新", "配置审计也称配置审核或配置评价，包括功能配置审计和物理配置审计", "功能配置审计是审计配置项的完整性，物理配置审计是审计配置项的一致性", "验证配置项的开发已圆满完成属于功能配置审计"], "a": 2, "an": "P563:配置审计也称配置审核或配置评价，包括功能配置审计和物理配置审计功能配置审计功能配置审计是审计配置项的一致性(配置项的实际功效是否与其需求一致)配置项的开发已圆满完成。配置项已达到配置标识中规定的性能和功能特征。配置项的操作和支持文档已完成并且是符合要求的。物理配置审计物理配置审计是审计配置项的完整性(配置项的物理存在是否与预期一致)要交付的配置项是否存在。配置项中是否包含了所有必需的项目。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-008", "s": "在评审发布内容时对存在风险的发布项做重点评估，确定相应的回退范围，制定相应的回退策略。回退步骤通常包括：①通知相关用户系统开始回退；②通知各关联系统进行版本回退；③回退存储过程等 {"c": 19, "cn": "配置与变更管理", "no": "19-034", "s": "在配置控制中，()不属于CCB变更申请评估的内容。", "o": ["变更实施方案可行性", "变更工作量的合理性", "变更对项目的影响", "记录变更信息的准确性"], "a": 3, "an": "P561-562,CCB负责组织对变更申请进行评估并确定以下内容：*①变更对项目的影响，故C正确。*②变更的内容是否必要。*③变更的范围是否考虑周全。*④变更的实施方案是否可行，故A选项正确。*⑤变更工作量估计是否合理，故B选项正确。CCB决定是否接受变更，并将决定通知相关人员。P562:项目经理组织修改相关的配置项，并在相应的文档、程序代码或配置管理数据中记录变更信息", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-035", "s": "配置项的状态有三种：草稿、正式发布和正在修改。以下叙述中，不正确的是()。", "o": ["配置项刚建立时状态为“草稿”,通过评审后，状态变为“正式发布”", "配置项的状态变为“正式发布”后，若需要修改必须通过变更控制流程进行", "已发布的配置项通过了CCB的审批同意修改，此时其状态变为“正在修改”", "通过了变更控制流程审批的配置项，修改完成后即可发布，其状态再次变为“正式发布”"], "a": 3, "an": "P556,D错误。修改完成后还需要正式评审后才能正式发布。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-036", "s": "A公司承接了某海外信息系统集成项目，项目进行中，项目经理获悉因天气和汇率原因，预计设备到场的运费比预算高出 30接下来他应该首先()。", "o": ["项目还没有结束，暂时不做处理", "给主管领导打电话，汇报情况，寻求解决方案", "填写项目变更申请，启动变更流程", "寻找新的承运商，评估变更影响，提交合同变更申请"], "a": 2, "an": "P566-567,按变更控制流程，发生变更首先要提交变更申请。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-037", "s": "根据GB/T8566-2007《信息技术 软件生存周期过程》有关配置管理的规定，()是配置控制的任务。*①建立基线的文档；②批准或否决变更请求；③审核跟踪变更；④确定和保证软件项目对其需求的功能完善性、物理完整性；⑤分析和评价变更；⑥编制配置管理计划；⑦实现、验证和发布已修改的配置项", "o": ["②③⑤⑦", "①③⑤⑥", "①③⑤⑦", "②④⑥⑦"], "a": 0, "an": "P561,配置控制此项活动包括下述任务：应标识和记录的变更请求；分析和评价变更；批准或否决的请求；实现、验证和发布已修改的软件项。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-038", "s": "软件系统的版本号由3部分构成，即主版本号+次版本号+修改号。某个配置项的版本号是1.0,按照配置版本号规则表明()。", "o": ["目前配置项处于“不可变更”状态", "目前配置项处于“正式发布”状态", "目前配置项处于“草稿”状态", "目前配置项处于“正在修改”状态"], "a": 1, "an": "P556,配置项第一次成为“正式”文件时，版本号为1.0。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-039", "s": "在项目配置项与基线的变更控制中，()是配置管理员的主要工作。", "o": ["确定受变更影响的关联配置项和有关基线", "将变更申请的决议通知受此变更影响的每个干系人", "组织修改配置项，并在相应的文档或程序代码中记录变更信息", "将变更后的配置项纳入基线，并将变更内容和结果通知相关人"], "a": 3, "an": "P562,D属于配置控制的主要内容。变更的发布。配置管理员将变更后的配置项纳入基线。配置管理员将变更内容和结果通知相关人员，并做好记录。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-040", "s": "某个配置项的版本号是2.01,按照配置项版本号规则表明()。", "o": ["目前配置项处于“不可变更”状态", "目前配置项处于“正式发布”状态", "目前配置项处于“草稿”状态", "目前配置项处于“正在修改”状态"], "a": 3, "an": "P556,配置项的版本号规则与配置项的状态相关：处于“草稿”状态的配置项的版本号格式为0.YZ。处于“正式”状态的配置项的版本号格式为X.Y,X为主版本号，取值范围为1~9。Y为次版本号，取值范围为0~9。升级幅度比较小时增加Y值，升级幅度比较大时增加X值。配置项第一次成为“正式”文件时，版本号为1.0。处于“修改”状态的配置项的版本号格式为X.YZ。配置项正在修改时，一般只增大Z值，X.Y值保持不变。当配置项修改完毕，状态成为“正式”时，将Z值设置为0,增加X.Y值。", "cm": ":只要版本号以0开头那么状态就是“草稿”,只要版本号的开头大于0且位数为2位那么状态就是“正式”,只要版本号的开头大于0且位数为3位那么状态就是“修改”。"}, {"c": 19, "cn": "配置与变更管理", "no": "19-041", "s": "下图是变更控制管理流程图，该流程图缺少()。", "o": ["评估影响记录", "配置审计", "变更定义", "记录变更实施情况"], "a": 3, "an": "P566-567,A评估影响记录，在影响分析里有B配置审计，这个属于配置管理C变更定义，在提出变更申请的时候就会进行定义这里缺少变更实施后的监控和效果评估，在监控和评估的时候需要记录变更实施情况", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-042", "s": "信息系统项目完成后，最终产品或项目成果应置于产品库内，当需要在此基础上进行后续开发时，应将其转移到()后进行。", "o": ["开发库实施变更", "服务器结束", "受控库取消变更", "产品库"], "a": 2, "an": "P562-563,当需要在此基础上进行后续开发时，应将其转移到受控库后进行。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-043", "s": "某软件开发项目的需求规格说明书第一次正式发布，命名为《需求规格说明书V1.0》,此后经过两次较小的升级，版本号升至V1.2,此时客户提出一次需求变更，项目组接受了变更，按客户的要求对需求规格说明书进行了较大的改动并通过评审，此时版本号应升级为()。", "o": ["V1.3", "V1.5", "V2.0", "V3.0"], "a": 2, "an": "P556,升级幅度较大那么直接增加X值，Y值恢复成0。所以选C处于“正式”状态的配置项的版本号格式为X.Y,X为主版本号，取值范围为1~9。Y为次版本号，取值范围为0~9。升级幅度比较小时增加Y值，升级幅度比较大时增加X值。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-044", "s": "项目配置管理的主要任务中，不包括()。", "o": ["版本管理", "发行管理", "检测配置", "变更控制"], "a": 2, "an": "P560:配置管理的日常管理活动主要包括：制订配置管理计划、配置项识别、配置项控制、配置状态报告、配置审计、配置管理回顾与改进等", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-045", "s": "项目组的测试人员在软件系统测试时，发现了一个重大缺陷并报告了项目经理，项目经理接下来应该()。", "o": ["提交一个变更申请", "和质量保证人员商量如何修改", "将任务分配给开发人员小王修改", "评估是否需要修改"], "a": 0, "an": "P566-567,有变更发生首先要提交变更申请。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-046", "s": "某个配置项的版本由1.0变为2.0,按照配置版本号规则表明()。", "o": ["目前配置项处于正式发布状态，配置项版本升级幅度较大", "目前配置项处于正式发布状态，配置项版本升级幅度较小", "目煎配置项处于正在修改状态，配置项版本升级幅度较大", "目前配置项处于正在修改状态，配置项版本升级幅度较小"], "a": 0, "an": "P556,从版本号可以看出当前配置项处于正式状态，从主版本号的变更可以看出配置项版本升级幅度较大。所以选A。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-047", "s": "根据配置版本号规则，某个配置项的版本号是1.0说明()。", "o": ["目前配置项处理第一次“正在修改”状态", "目前配置项处于第一次“正式发布”状态", "目前配置项处于“草稿”状态", "目前配置项处于“不可变更”状态"], "a": 1, "an": "P556,配置项第一次成为“正式”文件时，版本号为1.0。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-048", "s": "在软件配置管理中，版本控制的目的是按照一定的规则保存配置项的()。", "o": ["重要版本", "基线版本", "所有版本", "需要得版本"], "a": 2, "an": "P556,版本管理的目的是按照一定的规则保存配置项的所有版本，避免发生版本丢失或混淆等现象，并且可以快速准确地查找到配置项的任何版本。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-049", "s": "在配置项版本控制过程中，处于“正式发布”状态的配置项的版本号格式为()(X、Y、Z均为1-9的数字)。", "o": ["0.YX", "X.Y", "X.Y.Z", "X.YZ"], "a": 1, "an": "P556,正式发布状态只有主版本和次版本号。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-050", "s": "根据配置项版本编号规则，版本编号为1.72的配置项应处于()状态。", "o": ["第一次正式发布", "修改后重新正式发布", "正在修改", "草稿"], "a": 2, "an": "P556,只要版本号以0开头那么状态就是“草稿”,只要版本号的开头大于0且位数为2位那么状态就是“正式”,只要版本号的开头大于0且位数为3位那么状态就是“修改”", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-051", "s": "变更管理首要完成的任务是()。", "o": ["分析变更的必要性和合理性，确认是否实施变更", "记录变更信息、填写变更控制单", "做出变更，并交上级审批", "修改相应的软件配置项(基线),确立新的版本"], "a": 1, "an": "P566-567,首要任务就是提出变更申请，B就是提出变更申请", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-052", "s": "某个配置项的版本由1.11变为1.12,按照配置版本号规则表明()。", "o": ["目前配置项处于正在修改状态，配置项版本升级幅度较大", "目前配置项处于正在修改状态，配置项版本升级幅度较小", "目前配置项处于正式发布状态，配置项版本升级幅度较小", "目前配置项处于正式发布状态，配置项版本升级幅度较大"], "a": 1, "an": "P556,从版本号就可以看出当前处于修改状态，从第一次到第二次的变化就可以看出当前升级幅度较小。如果升级幅度较大那么需要变更主版本号。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-053", "s": "基线是项目配置管理的基础，()不属于基线定义中的内容。", "o": ["建立基线的条件", "基线识别", "受控制项", "批准基线变更的权限"], "a": 1, "an": "P557,建立基线的事件、受控的配置项、建立和变更基线的程序、批准变更基线所需的权限。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-054", "s": "基线由一组配置项组成，这些配置项构成了一个相对稳定的逻辑实体，是一组经过()正式审查，批准，达成一致的范围或工作产品。", "o": ["用户", "配置管理员", "配置管理委员会", "专家组"], "a": 2, "an": "P557,配置基线(常简称为基线)由一组配置项组成，这些配置项构成一个相对稳定的逻辑实体。基线中的配置项被“冻结”了，不能再被任何人随意修改。对基线的变更必须遵循正式的变更控制程序。由配置管理委员会负责审批。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-055", "s": "在采用基于配置库的变更控制对软件代码进行修改过程中，请将下列活动按照时间先后顺序排列：()。*①将新基线存入产品库；②从产品库中取出待修改代码；③程序员在开发库中修改代码；④将待修改代码从受控库中检出", "o": ["①②③④", "②①④③", "②④③①", "③①②④"], "a": 2, "an": "P562-563,基于配置库的变更控制：将待升级的基线从产品库中取出，放入受控库。程序员将欲修改的代码段从受控库中检出Check out,放入自己的开发库中进行修改。程序员将开发库中修改好的代码段检入 Check in受控库。软件产品的升级修改工作全部完成后，将受控库中的新基线存入产品库中。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-056", "s": "在配置管理中，基线是一组经过审查并且达成一致的规范或工作产品，是开发工作的基础。配置管理员根据《项目计划文档》、《配置管理计划》、《配置项管理表》等文档，创建了()基线。", "o": ["内部或外部", "设计或构造", "计划或发行", "构造或发行"], "a": 3, "an": "P557,基线通常对应于开发过程中的里程碑(Milestone),一个产品可以有多个基线，也可以只有一个基线。交付给外部顾客的基线一般称为发行基线(Release),内部开发使用的基线一般称为构造基线(Build)。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-057", "s": "小王是某软件开发公司负责某项目的项目经理，该项目己经完成了前期的工作进入实现阶段，但用户提出要增加一项新的功能，小王应该()。", "o": ["立即实现该变更", "拒绝该变更", "通过变更控制过程管理该变更", "要求客户与公司领导协商"], "a": 2, "an": "P566-567,有变更走变更流程即可。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-058", "s": "以下有关基线的叙述，错误的是()。", "o": ["基线由一组配置项组成", "基线不能再被任何人任意修改", "基线是一组经过正式审查并且达成一致的范围或工作产品", "产品的测试版本不能被看作基线"], "a": 3, "an": "P557,配置基线由一组配置项组成，这些配置项构成一个相对稳定的逻辑实体。基线中的配置项被“冻结”了，不能再被任何人随意修改。所以AB正确。一组拥有唯一标识号的需求、设计、源代码文卷以及相应的可执行代码、构造文卷和用户文档构成一条基线。产品的一个测试版本(可能包括需求分析说明书、概要设计说明书、详细设计说明书、已编译的可执行代码、测试大纲、测试用例、使用手册等)是基线的一个例子。D错误", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-059", "s": "在配置管理中，用于管理当前基线和控制对基线的变更的配置库是()。", "o": ["动态库", "备份库", "受控库", "静态库"], "a": 2, "an": "P558,受控库也称主库，用于管理当前基线和控制对基线的变更。配置库可以分开发库、受控库、产品库3种类型。配置库解释说明修改原则开发库也称动态库、程序员库或工作库，用于保存开发人员当前正在可以自行修改", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-060", "s": "A,B两个开发人员对信息系统的同一软件部件的两个bug(位于同一代码段)进行修改，当B欲把计划修改的代码段从()检出时，显示锁定，基于配置库的变更控制，可知此时该代码段正在工程师A的()中进行修改。", "o": ["开发库 受控库", "受控库 开发库", "受控库 产品库", "产品库 开发库"], "a": 1, "an": "P562-563,基于配置库的变更控制：将待升级的基线从产品库中取出，放入受控库。程序员将欲修改的代码段从受控库中检出Check out,放入自己的开发库中进行修改。程序员将开发库中修改好的代码段检入 Check in受控库。软件产品的升级修改工作全部完成后，将受控库中的新基线存入产品库中。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-061", "s": "变更管理组织机构的工作程序按时间先后顺序，排列正确的是：()。*①变更效果评估*②项目工程师提出变更申请*③项目经理审批变更申请*④ 发出变更通知并组织实施*⑤变更申请文档审核流转*⑥变更方案论证*⑦项目管理委员会审查*⑧项目经理和监理单位监控实施", "o": ["②⑤③④⑥⑧⑦①", "②⑤④③⑦①⑥⑧", "②③⑤⑦⑥④①⑧", "②③⑤⑥⑦④⑧①"], "a": 3, "an": "P566-567,变更的工作程序【流程】:变更申请对变更的初审变更方案论证变更审查发出通知并实施实施监控", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-062", "s": "在开发的软件产品 响进行评估", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-107", "s": "某软件开发组针对两个相关联但工作环境可能有些差异的系统1(对应“用户1”)和系统2(对应“用户2”)进行配置管理。产品设计阶段的内部设计模块对应如下：用户1:采用", "o": ["", "", "", "E和F模块用户2:采用A、B、C、D、E、G和H模块根据配置管理要求，以下做法正确的是()。A、在设计阶段用户1和用户2 对应的相同模块的配置项可以合并为一个配置项B、在设计阶段只需分别建立模块F、G、H的配置项，形成不同的基线C、在设计阶段就要对两个用户所要求的所有模块分别建立配置项并形成基线D、在后续开发阶段两个用户所要求的所有模块都要作为不同的分配置进行管理"], "a": 2, "an": "老题目，有参考价值。只要是不同的系统或模块，那么就必须分别建立相应的配置项，而且在设计阶段就要开始。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-108", "s": "项目变更的依据是()。", "o": ["干系人的需求", "甲方的要求", "项目基准", "项目成员的请求"], "a": 2, "an": "P565,基准管理：基准是变更的依据。在项目实施过程中，基准计划确定并经过评审后(通常用户应参与部分评审工作),建立初始基准。此后每次变更通过评审后，都应重新确定基准。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-109", "s": "在对一项任务的检查中，项目经理发现一个团队成员正在用与WBS字典规定不符的方法来完成这项工作。项目经理应首先()。", "o": ["告诉这名团队成员采取纠正措施", "确定这种方法对职能经理而言是否尚可接受", "问这名团队成员，这种变化是否必要", "确定这种变化是否改变了工作包的范围"], "a": 3, "an": "评估变化对项目的影响，如果涉及到基准，那么就要走变更流程", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-110", "s": "关于变更的流程和规则的做法中，错误的是()。", "o": ["以口头方式提出某项变更，在评估前针对该变更提交了书面报告", "项目组成员变更以邮件发出，在评审前填写了变更申请", "为了规范，监理不对变更进行分级，所有变更流程都不能简化", "按照影响范围、紧急程度把变更分为3个优先级别"], "a": 2, "an": "P567-568,项目规模小，与其他项目的关联度小时，变更的提出与处理过程可在操作上力求简便、高效", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-111", "s": "对于信息系统开发项目来说，其文档一般分开发文档、产品文档和管理文档。不属于开发文档的是()。", "o": ["软件集成计划", "安全和测试信息", "配置管理计划", "可行性研究报告"], "a": 2, "an": "P569:信息系统文档一般分为三类：开发文档、产品文档、管理文档。【口诀：开餐馆】类型作用文档种类开发文档描述开发过程本身可行性研究报告和项目任务书；需求规格说明；功能规格说明；设计规格说明，包括程序和数据规格说明；开发计划；软件集成和测试计划；质量保证计划；安全和测试信息。产品文档描述开发的产物培训手册；参考手册和用户指南；软件支持手册；产品手册和信息广告。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-112", "s": "关于版本发布的回退步骤是()*①通知各关联系统进行版本回退；②通知相关用户系统开始回退；③通知用户回退完成等；④回退存储过程等数据对象；⑤回退后进行相关测试，保证回退系统能够正常运行；⑥回退完成通知各周边关联系统；⑦应用程序、接口程序、工作流等版本回退；⑧配置数据回退；", "o": ["①②④⑧⑦⑤③⑥", "②①④⑧⑦⑤③⑥", "①②④⑧⑦⑥⑤③", "②①④⑧⑦⑥⑤③"], "a": 3, "an": "P568-569,回退步骤通常包括：*(1)通知相关用户系统开始回退；*(2)通知各关联系统进行版本回退；*(3)回退存储过程等数据对象；*(4)配置数据回退；*(5)应用程序、接口程序、工作流等版本回退；*(6)回退完成通知各周边关联系统；*(7)回退后进行相关测试，保证回退系统能够正常运行；*(8)通知用户回退完成等。", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-113", "s": "()适合那些要正式发行供普遍使用的软件产品。", "o": ["最低文档(1级文档)", "内部文档(2级文档)", "工作文档(3级文档)", "正式文档(4级文档)"], "a": 3, "an": "P569:文档的质量可以分为四级最低文档(1级文档)适合开发工作量低于一个人月的开发者自用程序。该文档应包含程序清单、开发记录、测试数据和程序简介内部文档(2级文档)可用于没有与其他用户共享资源的专用程序。2级文档还包括程序清单内足够的注释以帮助用户安装和使用程序工作文档(3级文档)适合于由同一单位内若干人联合开发的程序，或可被其他单位使用的程序。正式文档(4级文档)适合那些要正式发行供普遍使用的软件产品", "cm": ""}, {"c": 19, "cn": "配置与变更管理", "no": "19-114", "s": "文档的规范化管理主要体现在()方面。*①文档书写规范；②文档质量级别；③图表编号规则；④文档目录编写标准；⑤文档管理制度；⑥文档安全标准", "o": ["①②③④", "②③④⑤", "③④⑤⑥", "①③④⑤"], "a": 3, "an": "P569:文档的规范化管理主要体现在文档书写规范、图表编号规则、文档目录编写标准和文档管理制度等几个方面。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-001", "s": "项目集发起人的主要职责不包括()。", "o": ["消除项目集交付的困难和障碍", "为项目组合经理进行交互，确保提供适当的资源和优先级", "确保项目集目标与战略愿景保持一致", "提供资金"], "a": 1, "an": "P572,项目集发起人的典型职责包括：● 为项目集提供资金，确保项目集目标与战略愿景保持一致；● 使效益实现交付；● 消除项目集管理与交付的困难和障碍。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-002", "s": "以下()不属于项目集交付阶段的内容。", "o": ["组件授权与规划", "组件监督与整合", "组件移交与收尾", "组件实施"], "a": 3, "an": "P577,项目集交付阶段。为产生项目集管理计划各组件的预期成果而进行的项目集活动。各项目集组件的实施将包括以下项目集交付子阶段。①组件授权与规划；②组件监督与整合；③组件移交与收尾。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-003", "s": "项目组合生命周期由启动、规划、执行与优化4个阶段组成，()阶段的主要活动是制订并评审项目组合管理计划并就主要内容与干系人达成共识。", "o": ["启动", "规划", "执行", "优化"], "a": 1, "an": "P579:规划阶段。规划阶段制订并评审项目组合管理计划并就主要内容与干系人达成共识。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-004", "s": "关于项目集管理的理解，不正确的是()。", "o": ["项目集经理是承诺将组织的资源应用于项目集，并致力于使项目集取得成功的人", "组件项目或项目集不能促进共同目标或互补目标的实现时，则使用项目组合管理的效果更好", "项目集管理绩效域包括项目集战略一致性、项目集效益管理、项目集干系人参与、项目集治理、项目集生命周期管理", "项目集效益管理的主要活动包括效益识别、效益分析和规划、效益交付、效益移交、效益维持"], "a": 0, "an": "P572,项目集发起人和收益人是负责承诺将组织的资源应用于项目集，并致力于使项目集取得成功的人。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-005", "s": "关于统计过程控制方法的描述，不正确的是()。", "o": ["统计过程控制是一种预防性方法，强调全员参与", "统计过程控制技术可以判定工作过程运行的状态是否稳定，也可以判断过程能力是否满足规格要求", "统计过程控制方法认为任何组织或个人执行过程的能力都会有一定的波动性，这是正常的", "统计过程控制方法认为项目团队或人员的能力应该是恒定的，不应发生波动"], "a": 3, "an": "P589,统计过程控制理论认为，过程的能力是存在波动性的：一种波动是正常的波动，任何组织或个人执行过程的能力都会有一定的波动性，这是正常的；另一种波动是异常的波动，可能有特殊成因造成了能力的异常波动，这是异常情况，需要识别并管理。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-006", "s": "为实现高效的项目组合价值，需要执行的关键活动不包括()。", "o": ["测量和报告价值", "最大化价值", "协商期望的价值", "输出正确价值观"], "a": 3, "an": "P582,高效的项目组合价值管理需要的关键活动主要包括：协商期望的价值、最大化价值、实现价值、测量价值和报告价值等。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-007", "s": "项目集管理绩效域不包括()。", "o": ["项目集战略一致性", "项目集生命周期管理", "项目集不确定性管理", "项目集干系人参与"], "a": 2, "an": "P574,项目集管理绩效域包括：项目集战略一致性项目集效益管理项目集干系人参与项目集治理项目集生命周期管理。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-008", "s": "以下不属于项目集发起人的典型职责的是()。", "o": ["为项目集提供资金，确保项目集目标与战略愿景保持一致", "使效益实现交付", "消除项目集管理与交付的困难和障碍", "批准项目集收尾和终止"], "a": 3, "an": "P572,项目集发起人一般属于高管，主要是负责指导组织和投资决策，一般不负责具体事务的实现。其典型职责包括：●为项目集提供资金，确保项目集目标与战略愿景保持一致；●使效益实现交付；●消除项目集管理与交付的困难和障碍。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-009", "s": "在项目过程中，技术过程可大致分为()两类。", "o": ["开发性活动和运维性活动", "设计性活动和开发性活动", "设计性活动和测试性活动", "开发性活动和验证性活动"], "a": 3, "an": "P592,在项目过程中，技术过程可大致分为两类；开发性活动和验证性活动。需求开发、软件设计、编码实现、产品集成等活动均为开发性活动，此类活动在整个项目中所占工作量相对较大，对生产率或项目工期的影响较大；技术评审、代码走查和测试类活动为验证性活动，此类活动重点关注缺陷的移除，", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-010", "s": "()不是项目集指导委员会的职责。", "o": ["为项目集提供治理支持，包括监督、控制、整合和决策职能", "对项目组合的投资以及优先级进行决策", "支持或批准项目集的建议和变更", "批准项目集收尾和终止"], "a": 1, "an": "P573,项目集指导委员会的典型职责包括：●为项目集提供治理支持，包括监督、控制、整合和决策职能；●提供有能力的治理资源，监督与效益交付相关的项目集的不确定性和复杂性；●确保项目集目标和规划的效益符合组织战略和运营目标；●举行计划会议，确认项目集，并对项目集进行优先级排序和提供资金；●支持或批准项目集的建议和变更；●解决并补救上报的项目集问题和风险；●提供监督，使项目集效益得以规划、衡量并最终达成；●管理决策的制定、施行、执行和沟通；●定义要传达给干系人的关键信息，并确保其保持一致、透明；●审查预期效益和效益交付；●批准项目集收尾和终止。B为项目组合的内容", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-011", "s": "办公软件开发公司A非常重视软件过程管理，按照 CMMI(能力成熟度模型)逐步进行过程改进，刚刚实现了组织级过程性能、定量项目管理，按照 CMMI(能力成熟度模型),A公司达到了()级别。", "o": ["CMMI2", "CMMI3", "CMMI4", "CMMI5"], "a": 2, "an": "P600,关键词，定量第 4级量化管理级组织的管理实现了量化，实现了可预测。通过统计或其他量化技术来实现过程性能的稳定性监控和复合型监控，实现管理的精细化，降低项目在过程能力和质量上的波动。组织能够通过历史数据构建可预测模型，对组织和项目的质量和过程性能目标实现可预测。使用统计和其他量化技术来监测，完善或预测关键过程领域，从而实现组织或项目的质量与过程性能目标；以统计和量化管理的方式了解组织或项目的效率效能变化，并根据质量和过程性能目标的情况管理组织和项目的效率效能。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-012", "s": "关于项目集生命周期管理的说法中，错误的是()。", "o": ["为成功向组织交付效益，项目集要分为3个主要阶段来实施，包括项目集定义阶段、项目集交付阶段和项目集收尾阶段", "项目集定义阶段。为达成预期成果构建和批准项目集，制定项目集线路图，制定项目评估和项目集章程。", "项目集收尾阶段为产生项目集管理计划各组件的预期成果而进行的项目集活动。", "项目集交付阶段包括①组件授权与规划；②组件监督与整合；③组件移交与收尾。"], "a": 2, "an": "P577,项目集要分为3个主要阶段来实施，包括项目集定义阶段、项目集交付阶段和项目集收尾阶段。项目集定义阶段。为达成预期成果构建和批准项目集，制定项目集线路图，制定项目评估和项目集章程。上述内容批准后，则要制订项目集管理计划。项目集交付阶段。为产生项目集管理计划各组件的预期成果而进行的项目集活动。各项目集组件的实施将包括以下项目集交付子阶段。组件授权与规划；组件监督与整合；组件移交与收尾。项目集收尾阶段。将项目集效益移交给维护组织，并以可控的方式正式结束项目集活动。在项目集收尾阶段主要工作包括项目集移交和收尾或提前终止，或者将工作移交给另一个项目集。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-013", "s": "在项目集生命周期中被执行的活动取决于项目集的具体类型，通常在资金获得批准和项目集经理被指定前开始。为成功向组织交付效益，项目集要分为3个主要阶段来实施，包括()、项目集交付阶段和项目集收尾阶段。", "o": ["项目集构建阶段", "项目集启动阶段", "项目集规划阶段", "项目集定义阶段"], "a": 3, "an": "P577,为成功向组织交付效益，项目集要分为3个主要阶段来实施，包括项目集定义阶段、项目集交付阶段和项目集收尾阶段", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-014", "s": "以下不属于项目集经理的典型职责的是()。", "o": ["项目集管理绩效域内开展工作", "与项目组合经理进行交互，以确保提供适当的资源和优先级", "为项目集团队提供有效和适当的管理决策", "批准项目集收尾和终止"], "a": 3, "an": "P573,项目集经理是由执行组织授权，组建并带领团队实现项目集目标的人员。项目集经理对项目集的管理、实施和绩效负责。项目集经理的典型职责包括窩件：●在项目集管理绩效域内开展工作；●与项目经理和其他项目集经理交互，为支持项目集各项计划提供支持和指导；●与项目组合经理进行交互，以确保提供适当的资源和优先级；●与治理机构、发起人及(适用时)项目集管理办公室合作，以确保项目集持续与组织战略和持续的组织支持保持一致；●与运营负责人和干系人进行交互，以确保项目集能够获得适当的运营支持，并有效地维持项目集所带来的", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-015", "s": "企业能够将软件管理和工程两方面的过程文档化、标准化，并综合成该组织的标准软件过程。所有项目均使用经批准、裁剪的标准软件过程来开发和维护软件。软件产品的生产在整个软件过程是可见的。由此判断，该企业已经达到了CMMI()级。", "o": ["2", "3", "4", "5"], "a": 1, "an": "P600,第 3级定义级组织不仅能够在当前同类项目上取得成功，采用组织标准流程开展各项工作；能够依据项目特征对组织的标准流程进行裁剪也能够在其他项目上成功。组织的管理流程以解决特定的项目和工作特征；成为组织的一种文化，成为组织的财富。项目能够使用和向组织贡献过程资产。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-016", "s": "从项目集立项开始，通过(),来验证项目集的交付效益，并作为项目集章程和项目集路线图的输入。", "o": ["可行性研究和项目集评估", "可行性研究和商业评估", "可行性研究和立项依据", "立项依据和立项评估"], "a": 0, "an": "P574,从项目集立项开始，通过可行性研究和项目集评估，来验证项目集的交付效益，并作为项目集章程和项目集路线图的输入。可行性研究报告和项目集评估成果批准后，项目集指导委员会将通过批准项目集章程的形式来批准项目集，指定并授权项目集经理。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-017", "s": "()对项目集的管理、实施和绩效负责。", "o": ["项目集发起人", "项目集指导委员会", " cn": "高级项目管理", "no": "20-087", "s": "组织能够通过历史数据构建可预测模型，对组织和项目的质量和过程性能目标实现可预测。属于CMMI()的特征。", "o": ["5", "2", "3", "4"], "a": 3, "an": "", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-088", "s": "CMMI V2.0的三种评估方法()。", "o": ["基准评估、绩效评估和评价评估", "业务评估、绩效评估和质量评估", "基准评估、维持性评估和评价评估", "业务评估、维持性评估和基准评估"], "a": 2, "an": "P601,CMMI V2.0有3种评估方法，分别是基准评估、维持性评估和评价评估。基准评估和维持性评估是可以产生评级的评估类型，评价评估是基准评估的裁剪实施，不产生评级。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-089", "s": "在项目管理中，以下关于OPM方法论裁剪的描述，()是不正确的。", "o": ["所有的OPM方法论都需要裁剪，以确保与组织背景和环境保持一致。", "裁剪在OPM方法论的初始建立过程、维护过程和增强过程中都可以进行。", "项目组合、项目集和项目可以在各自的边界范围内以最匹配项目特定需求的方式应用OPM方法论。", "对OPM方法进行裁剪和确定如何应用，应在项目的执行阶段进行，过程中可以依据变化进行变更调整。"], "a": 3, "an": "P585,所有的OPM方法论都需要裁剪，裁剪在0PM方法论初始建立过程、维护过程和增强过程都可以进行。为了确保与组织背景和环境保持一致，更适用于不同类型项目需求，应允许项目组合、项目集和项目在各自的边界范围内，以最匹配项目特定需求的方式应用OPM方法论。可以对OPM方法进行裁剪，确定如何应用OPM方法，应在项目的规划阶段进行，过程中可以依据变化进行变更调整。", "cm": ""}, {"c": 20, "cn": "高级项目管理", "no": "20-090", "s": "在项目集生命周期中，组件授权与规划属于()阶段的活动。", "o": ["项目集规划", "项目集定义", "项目集交付", "项目集收尾"], "a": 2, "an": "P577,项目集交付阶段：为产生项目集管理计划各组件的预期成果而进行的项目集活动。各项目集组件的实施将包括以下项目集交付子阶段。组件授权与规划；组件监督与整合；组件移交与收尾。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-001", "s": "()体现了组织的使命、愿景和价值观，反映管理者对于行动、环境和业绩之间关键联系的理解。它是组织策划具体行动计划的起点。", "o": ["组织战略", "组织目标", "组织文化", "组织愿景"], "a": 0, "an": "P641,组织战略体现了组织的使命、愿景和价值观，反映管理者对于行动、环境和业绩之间关键联系的理解。它是组织策划具体行动计划的起点。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-002", "s": "关于组织战略的创新和改进的描述，不准确的是()。", "o": ["在不同的生存和发展阶段，组织会对目标、实力和环境做出不同的认识和反应，组织战略必须具备动态适应性，因此组织需要战略回顾和创新分析", "通过财务目标跟踪是最有效的组织战略的回顾、创新和改进的方法", "组织战略的回顾、改进和创新分析宜建立并维护战略绩效管理体系", "把人力资源系统整合到战略里，推进对管理者的评价和激励有助于战略举措的成功执行"], "a": 1, "an": "P645,在不同的生存和发展阶段，组织会对其目标、实力和环境做出不同的认识和反应，因此组织战略必须具备动态适应性。组织需要进行战略回顾和创新分析，分析和回顾战略实施是否存在偏差，是否需要进行调整或创新。在分析和回顾战略实施过程中进行创新和改进的要素主要包括：●内外部发展环境对战略规划的影响，包括客户和用户需求、技术或监管环境等；●在业务增长、发展趋势等方面的预测及其与实际的差异；●提升业务增长和盈利的措施；●竞争优势和发展水平分析及措施；●风险分析及措施。实施创新和改进还应包括战略绩效管理体系和人力资源系统的整合优化。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-003", "s": "关于组织定位的描述，不正确的是：()。", "o": ["组织定位包括使命、愿景和价值观，不包括产品和服务定位", "组织使命是组织较长期的业务发展的总方向和总特征", "组织文化为日常工作提供具体的实践方法", "组织愿景描述了组织发展的目的和如何达到这个目的的理性认知"], "a": 0, "an": "P642,组织定位包括应有清晰的使命、愿景和目标，有明确的价值观和组织文化来帮助组织实现战略要点，并能够向组织的内外部传达清晰的定位。组织定位还应包括对业务单元的定位战略。所谓业务单元定位战略，是指组织或组织的分支机构在决定进入某行业和领域，生产什么产品或提供何种服务所作出的长远性的谋划与方略。业务单元定位战略实质上是行业或领域中的产品或服务定位战略，也就是在行业或领域定位之后，所作出的产品定位决策或服务定位决策", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-004", "s": "()是指将绩效评估结果进行分档，评估者根据分档档次和分档比例对被评估者进行分派的方", "o": ["硬性分布法", "尺度评价表法", "关键事件法", "平衡计分卡法"], "a": 0, "an": "651-652,硬性分布法是指将绩效评估结果进行分档，评估者根据分档档次和分档比例对被评估者进行分派的方法。这种评估方法成本相对较低，但绩效评估标准模糊，主观性较高。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-005", "s": "关于绩效实施的描述，不正确的是()。", "o": ["绩效实施的核心是持续沟通式的绩效辅导", "绩效实施的具体内容包括绩效沟通和绩效评估", "组织管理者应当投入一定的精力进行绩效实施", "绩效实施的过程是对绩效计划的执行情况的指导，监督和管理"], "a": 1, "an": "P648,绩效实施的具体内容一般包括两个方面：一是持续不断的绩效沟通；二是绩效信息的记录和收集。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-006", "s": "()是绩效管理体系的关键步骤，也是实施绩效管理系统的主要平台和关键手段。", "o": ["绩效实施", "绩效计划", "绩效治理", "绩效评估"], "a": 1, "an": "P645,绩效计划是绩效管理体系的第一个关键步骤，也是实施绩效管理系统的主要平台和关键手段。", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-007", "s": "以下说法不正确的是()。", "o": ["组织战略体现了组织的使命、愿景和价值观，反映管理者对于行动、环境和业绩之间关键联系的理解。它是组织策划具体行动计划的起点", "战略目标是组织在一定的战略期内总体发展的总水平和总任务。它决定了组织在该战略期间的总体发展的主要行动方向，是组织战略的核心", "组织的战略目标是多元化的，包含经济性目标和非经济性目标，也包含定量目标和定性目标", "不同类型的组织，其战略目标的组成和覆盖领域相同"], "a": 3, "an": "P641:不同类型的组织，其战略目标的组成和覆盖领域不同", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-008", "s": "绩效实施的3大关键点不包括()。", "o": ["统一思维", "引发热情", "训练能力", "持续沟通"], "a": 3, "an": "P648,对于绩效实施来说，有3大关键点：统一思维：将不同能级、不同的思维进行统一，达成共识，形成一致的价值观，确保绩效实施可以有效落地。引发热情：组织管理者需要和员工明确为什么要做绩效管理，做与不做有什么不同，在勾画愿景的同时升华意愿。训练能力：绩效不是少数人能力的体现，而应成为组织管理者的共同能力的体现，需要进行持续深入的学习", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-009", "s": "绩效信息的记录和收集有多种方法，但不包括：()。", "o": ["观察法", "工作记录法", "网络收集法", "他人反馈法"], "a": 2, "an": "P649:记录和收集绩效信息的方法包括观察法、工作记录法、他人反馈法", "cm": ""}, {"c": 22, "cn": "组织通用治理", "no": "22-010", "s": "()是组织的生存基石和存在理由宣言，体现了组织的宗旨、核心价值观和未来方向。", "o": ["组织目标", "组织愿景", "组织使命", "组织文化"], "a": 2, "an": "P643,组织使命 ": "P696:隐性知识由技术技能、个人观点、信念和心智模型等认知维度构成，隐性知识交流在很大程度上依赖于个人经验和认知，难以交流和分享，例如主观见解、直觉和预感等这一类的知识", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-029", "s": "市场营销组合工具4P指的是：产品、()、渠道和促销。", "o": ["市场", "服务", "人员", "定价"], "a": 3, "an": "P707:市场营销组合工具4P:产品(Product)、定价(Price)、渠道(Place)和促销(Promotion)。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-030", "s": "知识管理需要遵循积累原则、共享原则和交流原测。其中()是实施知识管理的基础，()需要建立有利于知识管理的组织结构和文化气氛。", "o": ["共享原则、交流原则", "积累原则、交流原则", "积累原则、共享原则", "交流原则、共享原则"], "a": 1, "an": "P697,知识管理是一个复杂的过程，要遵循以下3条原则：①积累原则。知识积累是实施知识的管理基础。②共享原则。知识共享是指一个组织内部的信息和知识要尽可能公开，使每一个员工都能接触和使用组织的知识和信息。③交流原则。知识管理的核心就是要在组织内部建立一个有利于交流的组织结构和文化气氛，使人员之间的交流毫无障碍卧浏。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-031", "s": "()是面向未来的，为组织提供发展方向和整体管理。", "o": ["战略流程", "运行流程", "支持流程", "端到端的流程"], "a": 0, "an": "P686:战略流程是面向未来的，为组织提供发展方向和整体管理。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-032", "s": "流程优化需求大致可分为3种()。", "o": ["问题导向、流程导向、变革导向", "战略导向、绩效导向、变革导向", "问题导向、绩效导向、变革导向", "问题导向、战略导向、流程导向"], "a": 2, "an": "P692,流程优化需求大致可分为3种：问题导向、绩效导向、变革导向。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-033", "s": "由于个体自身利益、兴趣爱好等方面的考虑，隐性知识拥有者不会将有价值的隐性知识轻易转移出去，指的是隐性知识的()特征。", "o": ["非陈述性", "个体性", "情境性", "交互性"], "a": 1, "an": "P696:个体性。隐性知识为个人知识，来自个人经验且存储在拥有它的个人头脑中。隐性知识由个体在某种情境下的心智模式构成，并深深地嵌入在个体中并被个体认为是理所当然的，这也造成隐性知识难以表述。由于个体自身利益、兴趣爱好等方面的考虑，隐性知识拥有者不会将有价值的隐性知识轻易转移出去。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-034", "s": "知识共享三要素不包括()", "o": ["共享对象", "共享主体", "共享手段", "共享原则"], "a": 3, "an": "P700,知识共享三要素：共享对象、共享主体和共享手段。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-035", "s": "市场营销组合工具4P,不包括()。", "o": ["产品(Product)", "定价(Price)", "渠道(Place)", "计划(Plan)"], "a": 3, "an": "P707:市场营销组合工具4P:产品(Product)、定价(Price)、渠道(Place)和促销(Promotion)。", "cm": ""}, {"c": 23, "cn": "组织通用管理", "no": "23-036", "s": "某企业管理层采取纠偏措施缩小目标与实际业绩之间的差距。该企业正在执行()阶段的营销活动。", "o": ["市场营销组织", "市场营销执行", "市场营销控制", "市场营销分析"], "a": 2, "an": "P713,市场营销控制。由于在营销计划的执行过程中会发生许多意想不到的情况，市场营销者必须进行持续的市场营销控制，即评价市场营销战略和计划的结果，并采取纠偏措施以确保既定目标的实现。市场营销控制的步骤包括：①
