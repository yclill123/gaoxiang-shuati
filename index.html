案分析", "成本效益分析", "绩效审查", "趋势分析"], "a": 2, "an": "P410:备选方案分析：有助于选择最佳解决方案以纠正资源使用偏差。成本效益分析：有助于项目成本出现差异时确定最佳的纠正措施。绩效审查：测量、比较和分析计划的资源使用和实际资源使用的不同。趋势分析：趋势分析检查项目绩效随时间的变化情况，可用于确定绩效是在改善还是在恶化。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-103", "s": "以下说法中不正确的是()。", "o": ["冲突是指两个或两个以上的社会单元在目标上互不相容或互相排斥，从而产生心理上的或行为上的矛盾", "竞争的双方则具有同一个目标，不需要发生势不两立的争夺", "冲突并不一定是有害的，“一团和气”的集体不一定是一个高效率的集体", "项目经理要尽量避免团队冲突，保持团队积极向上"], "a": 3, "an": "P382:项目经理对于有害的冲突要设法加以解决或减少；对有益的冲突要加以利用，要鼓励团队成员良性竞争", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-104", "s": "项目经理蜗牛老师在接手项目A时，由于处于项目初期，仅了解了WBS的几个高层级情况，这个时候蝎牛老師应该采用那种方式来估算资源更合适()。", "o": ["专家判断", "自下而上估算", "类比估算", "参数估算"], "a": 2, "an": "P394,类比估算将以往类似项目的资源相关信息作为估算未来项目的基础。这是一种快速估算方法，适用于项目经理只能识别WBS的几个高层级的情况。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-105", "s": "()不属于项目资源管理的范畴。", "o": ["人员获取和能力匹配", "建立项目组织计划", "项目人员入职培训", "有效利用冲突和竞争"], "a": 1, "an": "A正确。属于获取资源的范畴。C正确。属于建设项目团队的范畴。D正确。属于管理项目团队的范畴。B不正确。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-106", "s": "()不属于控制资源关注的内容。", "o": ["及时识别和处理资源缺乏/剩余情况监督资源支出", "出现资源相关问题时通知相应干系人", "监督团队建设的绩效情况", "确保根据计划和项目需求使用并释放资源"], "a": 2, "an": "P409:控制资源过程关注：监督资源支出；及时识别和处理资源缺乏/剩余情况；确保根据计划和项目需求使用并释放资源；出现资源相关问题时通知相应干系人；影响可以导致资源使用变更的因素；在变更实际发生时对其进行管理等。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-107", "s": "关于X理论和Y理论的描述不正确的是()。", "o": ["X理论认为对员工采取强制惩罚和解雇等手段，强迫员工努力工作", "Y理论认为应将员工目标和组织目标结合，发挥员工的智慧和能力", "用X理论可以加强管理，用Y理论可以激发员工主动性", "项目初始阶段建议运用Y理论，执行阶段建议运用X理论"], "a": 3, "an": "P385:在项目团队的开始阶段，大家互相还不是很熟悉，对项目不是很了解或者还有某种抵触等，这时候需要项目经理运用X理论去指导和管理；当项目团队进入执行阶段，成员对项目的目标已经了解，都愿意努力完成项目，这时候可以运用Y理论授权团队完成所负责的工作，并提供支持和相应的环境。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-108", "s": "()冲突管理方法是指综合考虑不同的观点和意见，采用合作的态度和开放式对话引导各方达成共识和承诺。", "o": ["妥协/调解", "缓和/包容", "撤退/回避", "合作/解决问题"], "a": 3, "an": "P406-407,5种常用的冲突解决方法【必须掌握】方法类型撤退/回避释义将问题推迟到准备充分的时候，或者将问题推给其他人员解决。撤退是一种暂时性的冲突解决方法。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-109", "s": "()是提高工作能力、促进团队成员互动、改善团队整体氛围，以提高项目绩效的过程。", "o": ["管理团队", "控制团队", "获取资源", "建设团队"], "a": 3, "an": "P387:建设团队是提高工作能力、促进团队成员互动、改善团队整体氛围，以提高项目绩效的过程。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-110", "s": "()是获取项目所需的团队资源、设施、设备、材料、用品和其他资源的过程。", "o": ["获取资源", "管理资源", "控制资源", "规划资源"], "a": 0, "an": "P387:获取资源是获取项目所需的团队资源、设施、设备、材料、用品和其他资源的过程。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-111", "s": "近期，国家多个部委发布相关文件，其中“督促平台及第三方合作单位为建立劳动关系的外卖送餐员参加社会保险，支持其他外卖送餐员参加社会保险”。本条信息按照马斯洛的需求层次理论，属于()的需求。", "o": ["生理", "安全", "社会交往", "受尊重"], "a": 1, "an": "P384,安全需求：包括对人身安全、生活稳定、不致失业以及免遭痛苦、威胁或疾病等的需求。和生理需求一样，在安全需求没有得到满足之前，人们一般不追求更高层的需求。常见的激励措施：养老保险、医疗保障、长期劳动合同、意外保险、失业保险等。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-112", "s": "矩阵型图表的一个例子是职责分配矩阵(RAM),它显示了分配给每个工作包的项目资源，用于说明工作包或活动与项目团队成员之间的关系。RAM的一个例子是RACI矩阵。其中RACI中的C指的是()。", "o": ["知情", "咨询", "负责", "执行"], "a": 1, "an": "P391,R执行；A负责；C咨询；I知情", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-113", "s": "以下说法中不正确的是()。", "o": ["领导者确定方向，统一思想，激励和鼓舞", "领导者设定目标，管理者率众实现目标", "尊重和信任，而非畏惧和顺从，是有效领导力的关键要素", "项目经理是团队的领导者而非管理者，需要加强领导力的锻炼"], "a": 3, "an": "P381:项目经理具有领导者和管理者的双重身份。对项目经理而言，管理能力和领导能力二者均不可或缺。对于大型复杂项目，领导能力尤为重要。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-114", "s": "()不是影响资源规划的事业环境因素。", "o": ["组织文化和结构", "设施和资源的物理分布", "现有资源的能力和可用性", "物质资源管理政策和程序"], "a": 3, "an": "P390,事业环境因素：能够影响规划资源管理过程的事业环境因素包括：组织文化和结构；设施和资源的物理分布；现有资源的能力和可用性；市场条件等。组织过程资产：能够影响规划资源管理过程的组织过程资产包括：人力资源政策和程序；物质资源管理政策和程序；安全政策；安保政策；资源管理计划模板；类似项目的历史信息等。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-115", "s": "项目经理被分配管理一个智能型新产品研发项目。项目团队是按照专业知识从不同地方选择的，发现难以管理分处不同地方的项目团队成员后，项目经理申请了一个新地点将团队整合在一起。项目经理可使用( )技术。", "o": ["虚拟团队", "团队建设", "集中办公", "基本规则"], "a": 2, "an": "因为虚拟团队成员日常并不面对面集中办公，而是主要通过网络联系，所以他们之间的沟通和团队建设会更加困难。虚拟团队特别需要有效的沟通管理计划与真正的团队建设。应该在项目关键时点(如阶段开始或结束时)把虚拟团队成员召集在一起进行临时的集中办公(如开会),以加强团队建设。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-116", "s": "团队往往对未来有美好的期待，属于团队发展阶段的()。", "o": ["形成阶段", "震荡阶段", "规范阶段", "发挥阶段"], "a": 0, "an": "P382-383,阶段解释说明一个个的个体转变为团队成员。团队往往对未来有美好的期待。形成阶段震荡阶段个体之间开始争执，互相指责，并且开始怀疑项目经理的能力。规范阶段团队成员开始相互信任，项目经理能够得到团队的认可。发挥阶段团队就像一个组织有序的单位。团队成员的集体荣誉感会非常强。解散阶段工作完成后，项目结束，团队解散。不管目前处于什么阶段，增加一个人或减少一个人，都从形成期重新开始。项目团队建设也可跳过某些阶段。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-117", "s": "以下关于资源管理的说法不正确的是()。", "o": ["协作型团队可以促进不同工作活动的快速整合、改善沟通、增加知识分享，同时可以灵活地分配工作。", "对于易变性高的项目，更适合采用虚拟团队的方式。", "在协作型环境中，快速供应协议和精益方法对控制成本和实现进度非常重要。", "对于易变性高的项目，对实物和人力资源规划具有较高的不可预测性。"], "a": 1, "an": "P388,对于易变性高的项目，更适合采用能够最大限度地集中和协作的团队结构形式。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-118", "s": "()属于人力资源管理中的Y理论。", "o": ["一般人天性好逸恶劳，只要有可能就会逃避工作", "在适当的条件下，人们愿意主动承担责任", "人缺乏进取心逃避职责，甘愿听从指挥安于现状，没有创新性", "人生来就以自我为中心，漠视组织的要求"], "a": 1, "an": "P385:Y理论：◆ 人天生并不是好逸恶劳，他们热爱工作，从工作得到满足感和成就感。◆ 下属能够自我确定目标，自我指挥和自我控制。◆ 在适当的条件下，人们愿意主动承担责任。◆ 大多数人具有一定的想象力和创造力。◆ 如果给予机会，人们喜欢工作，并渴望发挥其才能。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-119", "s": "以下说法不正确的是()。", "o": ["团队章程是为团队创建团队价值观、共识和工作指南的文件。", "团队章程对项目团队成员的可接受行为确定了明确的期望。", "团队章程由项目经理制订。", "可定期审查和更新团队章程，确保团队成员始终了解团队基本规则，并指导新成员融入团队。"], "a": 2, "an": "P392,由团队制定或参与制定的团队章程可发挥最佳效果，所有项目团队成员都分担责任，确保遵守团队章程中规定的规则。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-120", "s": "控制资源在项目期间开展的频次()", "o": ["一次", "整个项目期间", "定期", "反复"], "a": 1, "an": "P408:控制资源需要在整个项目期间开展", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-121", "s": "项目中的设备、材料设施和基础设施属于()。", "o": ["实物资源", "人力资源", "设备资源", "基础资源"], "a": 0, "an": "P409:控制资源过程重点关注实物资源，例如设备、材料设施和基础设施。管理团队过程重点关注人力资源。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-122", "s": "()指识别、评估和管理个人情绪、他人情绪及团体情绪的能力。", "o": ["制定决策", "影响力", "领导力", "情商"], "a": 3, "an": "P407,情商指识别、评估和管理个人情绪、他人情绪及团体情绪的能力。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-123", "s": "()不是管理团队的工具和技术。", "o": ["情商", "影响", "领导力", "虚拟团队"], "a": 3, "an": "P406-407,虚拟团队时获取资源的工具和技术", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-124", "s": "()用于展示团队成员的职责分配和角色。", "o": ["干系人参与度评估矩阵", "责任分配矩阵", "组织分解结构", "工作分解结构"], "a": 1, "an": "P391:组织分解结构(OBS):按照组织现有的部门、单元或团队排列，并在每个部门下列出项目活动或工作包。资源分解结构：按资源类别和类型，对团队和实物资源的层级列表，用于规划、管理和控制项目工作，每向下一个层级代表对资源的更详细描述，直到信息细到可以与工作分解结构(WBS)相结合。责任分配矩阵：RAM可确保任何一项任务都只有一个人负责。如果团队由内部和外部人员组成，则RACI矩阵对明确划分角色和职责特别有用。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-125", "s": "估算活动资源是估算执行项目所需的团队资源，以及材料、设备和用品的类型和数量的过程，其主要作用是()。", "o": ["在整个项目期间为如何管理项目成本提供指南和方向", "确定项目所需的资金", "明确完成项目所需的资源种类、数量和特性", "在整个项目期间为如何管理和核实质量提供指南和方向"], "a": 2, "an": "P393,估算活动资源是估算执行项目所需的团队资源、设施、设备、材料、用品和其他资源的类型和数量的过程。本过程的主要作用是明确完成项目所需的资源种类、数量和特性。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-126", "s": "由于每个项目都是独特的，项目经理可以根据需要对项目资源管理过程进行裁剪。裁剪时考虑的因素不包括()。", "o": ["物理位置", "团队管理", "沟通技术", "生命周期方法"], "a": 2, "an": "P388,裁剪时应考虑的因素包括：多元化、物理位置、行业特定资源、团队成员的获得、团队管理、生命周期方法。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-127", "s": "()不属于规划资源管理的输出。", "o": ["资源管理计划", "团队章程", "干系人登记册", "风险登记册更新"], "a": 2, "an": "P392-393,干系人登记册是规划资源管理的输入", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-128", "s": "项目管理信息系统包括()软件，这些软件有助于规划、组织与管理资源库，以及编制资源估算。", "o": ["资源管理", "CRM系统", "采购系统或智能分析", "BOM系统"], "a": 0, "an": "项目管理信息系统可以包括资源管理软件，这些软件有助于规划、组织与管理资源库，以及编制资源估算。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-129", "s": "项目经理卧牛 负责某项目管理，考虑到项目人力资源紧张，就与三个在校学生签订了兼职劳务合同，并允许这三名在校学生可以利用互联网进行办公，同时规定每周三上午这些学生必须参与团队的工作会议。以下针对上述情况的观点中，正确的是()。", "o": ["三名学生不属于项目团队成员", "项目经理小王组建了虚拟项目团队", "三名学生不可以参加项目团队会议", "项目经理小王利用了谈判技术来组建团队"], "a": 1, "an": "AC都错误。D错误。采用的是招募来组建项目团队。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-130", "s": "项目经理为了使团队高效运行并达成项目目标，可采用的方式不包含()。", "o": ["提高项目要求并增加每日工作时长，刺激成员创新", "每周组织一次知识分享，提高团队成员的知识和技能", "每日组织站会，及时收集成员遇到的问题，协作解决", "不定期组织聚餐和团建活动，增加团队凝聚力"], "a": 0, "an": "提高项目要求并增加每日工作时长，刺激成员创新，不利于团队高效运行和提高凝聚力等。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-131", "s": "某公司人员流动性强，最近频频发生人员的变更。作为公司项目经理，此时需要处理的事项不包含()。", "o": ["变更项目管理计划", "变更问题描述和项目人员分派文件", "更新项目范围和目标", "总结历史信息和经验教训文档"], "a": 2, "an": "公司人员流动性强，最近频频发生人员的变更，人员流动频繁是跟人力资源管理有关的问题，不需要更新项目范围和目标。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-132", "s": "为了暂时或部分解决冲突，寻找能让各方在一定程度上都满意的方案。这种冲突解决方法称为()。", "o": ["妥协/调解", "缓和/包容", "撤退/回避", "合作/解决问题"], "a": 0, "an": "P406-407,5种常用的冲突解决方法【必须掌握】方法类型释义", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-133", "s": "问题解决的步骤()*①识别问题；②定义问题；③调查；④分析，找出问题的根本原因；⑤解决，从众多解决方案中选择最合适的一个；⑥检查解决方案，确认是否已解决问题", "o": ["③②①④⑤⑥", "②①③④⑤⑥", "①②③④⑥⑤", "①②③④⑤⑥"], "a": 3, "an": "P410:项目经理应采取有条不紊的步骤来解决问题：①识别问题。②定义问题。③调查。④分析，找出问题的根本原因。⑤解决，从众多解决方案中选择最合适的一个。⑥检查解决方案，确认是否已解决问题。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-134", "s": "()规定了在项目期间确定的团队和实物资源何时可用、可用多久。", "o": ["物质资源分配单", "项目团队派工单", "资源日历", "资源需求"], "a": 2, "an": "P394,资源日历规定了在项目期间确定的团队和实物资源何时可用、可用多久。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-135", "s": "改进团队协作、增强人际关系技能、激励员工、减少摩擦以及提升整体项目绩效，是()过程的主要作用。", "o": ["建设团队", "管理团队", "控制资源", "获取资源"], "a": 0, "an": "P400:建设团队的主要作用是：改进团队协作、增强人际关系技能、激励员工、减少摩擦以及提升整体项目绩效。小鹅远淘宝扫码购课微信公众号扫码川老师Q扫码加老师V蝌牛钦考小鹅通店铺", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-001", "s": "项目沟通管理是确保及时、正确地产生、收集、分发、()和处理项目信息所需的过程。", "o": ["存储", "分析", "接收", "分享"], "a": 0, "an": "P414,项目沟通管理是确保及时、正确地产生、收集、分发、存储和最终处理项目信息所需的过程。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-002", "s": "()是用来传递信息的方法。", "o": ["编码", "解码", "媒介", "信息"], "a": 2, "an": "P415,编码：把思想或想法转化为他人能理解的语言。信息和反馈信息：编码过程所得到的结果。媒介：用来传递信息的方法。噪声：干扰信息传输和理解的一切因素(如距离、新技术、缺乏背景信息等)。解码：把信息还原成有意义的思想或想法。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-003", "s": "关于管理沟通过程中工作绩效报告的描述，不正确的是()。", "o": ["工作绩效报告通过分析绩效测量结果得出，能够提供关于项目工作绩效的信息", "工作绩效报告的典型示例包括状态报告、进度报告，是管理沟通过程的输出", "工作绩效报告可以包含挣值图表、缺陷直方图、合同绩效以及风险概述信息", "工作绩效报告可以表现为有助于制定决策和采取行的仪表指示图"], "a": 1, "an": "P424-425,工作绩效报告是管理沟通的输入，不是输出。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-004", "s": "在管理沟通过程中，某项目经理认为所谓的激烈的权力游戏、控制战术和冲突管理与自己的工作毫无关联，则他缺少人际关系交往中的()。", "o": ["文化意识", "积极倾听", "政策意识", "人际交往"], "a": 2, "an": "P426:适用于管理沟通过程的人际关系与团队技能主要包括：积极倾听：包括告知已收到、澄清与确认信息、理解，以及消除妨碍理解的障碍。冲突管理：采用特定方式对冲突进行管理。文化意识：理解个人、群体和组织之间的差异，并据此调整项目的沟通策略。会议管理：采取步骤确保会议有效并高效地达到预期目标。规划会议时的一般步骤包括：①准备并发布会议议程(其中包含会议目标);②确保会议在规定的时间开始和结束；③确保适当参与者受邀并出席；④切题；*⑤处理会议中的期望、问题和冲突；⑥记录所有行动以及所分配的行动责任人。人际交往：通过与他人互动交流信息，建立联系。人际交往有利于项目经理及其团队通过非正式组织解决问", "cm": "这题就比较难选了，我认为选C更妥当。政策意识：有助于项目经理在项目期间引导干系人参与，以保持干系人的支持。文化意识：主要考虑的是文化差异。积极倾听：主要考虑的是沟通上的理解。政策意识：主要考虑的是组织战略和权力的行使。这个我答案我认为更妥当。人际交往：主要考虑的是通过与他人互动交流信息，建立联系。"}, {"c": 14, "cn": "项目沟通管理", "no": "14-005", "s": "监督沟通是确保满足项目及其干系人的信息需求的过程。本过程的主要作用是()。", "o": ["按沟通管理计划和干系人参与计划的要求优化信息传递流程", "及时向干系人提供相关信息", "引导干系人有效参与项目", "促成项目团队与干系人之间的有效信息流动"], "a": 0, "an": "P427,监督沟通是确保满足项目及其干系人的信息需求的过程。本过程的主要作用是，按沟通管理计划和干系人参与计划的要求优化信息传递流程。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-006", "s": "()有助于明确关键信息的目的、实现信息共享和采取领导行为。", "o": ["沟通胜任力", "反馈", "非口头技能", "演示"], "a": 0, "an": "P425,沟通技能：沟通胜任力。有助于明确关键信息的目的、实现信息共享和采取领导行为。反馈。反馈是关于沟通、可交付成果或情况的反应信息。反馈支持项目经理和团队及所有其他项目干系人之间的互动沟通，例如指导、辅导和磋商。非口头技能。例如，通过示意、语调和面部表情等适当的肢体语言来表达意思。镜像模仿和眼神交流也是重要的技能。演示。演示是信息和文档的正式交付。包括：①向干系人报告项目进度和信息更新；②提供背景信息；③提供关于项目及其目标的通用信息；④提供具体信息等。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-007", "s": "不能用于规划沟通管理过程的人际关系与团队技能是()。", "o": ["冲突管理", "政策意识", "文化意识", "沟通风格评估"], "a": 0, "an": "P422,人际关系与团队技能：*(1)沟通风格评估：评估沟通风格并识别偏好的沟通方法、形式和内容的技术。*(2)政策意识：政策意识有助于项目经理根据项目环境和组织的政策环境来规划沟通。*(3)文化意识：文化意识指理解个人、群体和组织之间的差异，并据此调整项目的沟通策略。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-008", "s": "()包括告知已收到、澄清与确认信息、理解，以及消除妨碍理解的障碍。", "o": ["文化意识", "积极倾听", "政策意识", "人际交往"], "a": 1, "an": "P426:适用于管理沟通过程的人际关系与团队技能主要包括：积极倾听：包括告知已收到、澄清与确认信息、理解，以及消除妨碍理解的障碍。冲突管理：采用特定方式对冲突进行管理。文化意识：理解个人、群体和组织之间的差异，并据此调整项目的沟通策略。会议管理：采取步骤确保会议有效并高效地达到预期目标。规划会议时的一般步骤包括：①准备并发布会议议程(其中包含会议目标);②确保会议在规定的时间开始和结束；③确保适当参与者受邀并出席；④切题；*⑤处理会议中的期望、问题和冲突；⑥记录所有行动以及所分配的行动责任人。人际交往：通过与他人互动交流信息，建立联系。人际交往有利于项目经理及其团队通过非正式组织解决问题，影响干系人的行动，以及提高干系人对项目工作和成果的支持，从而改善绩效。政策意识：有助于项目经理在项目期间引导干系人参与，以保持干系人的支持。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-009", "s": "关于项目报告的描述，不正确的是()。", "o": ["项目报告发布是收集和发布项目信息的行为", "项目报告应尽量详尽，让所有干系人全面了解项目情况", "项目信息应发布给众多干系人", "可以定期或临时准备项目信息并编制项目报告"], "a": 1, "an": "P426,项目报告：项目信息应发布给众多干系人群体。应针对每种干系人来调整项目信息发布的适当层次、形式和细节。从简单的沟通到详尽的定制报告和演示，报告的形式各不相同。可以定期准备信息或基于例外情况准备。虽然工作绩效报告是监控项目工作过程的输出，但是本过程会编制临时报告、项目演示、博客，以及其他类型的信息。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-010", "s": "管理沟通是()。", "o": ["基于每个干系人或干系人群体的信息需求、可用的组织资产，以及具体项目的需求，为项目沟通活动制定恰当的方法和计划的过程", "确保项目信息及时且恰当地收集、生成、发布、存储、检索、管理、监督和最终处置的过程", "确保满足项目及其干系人的信息需求的过程", "按沟通管理计划和干系人参与计划的要求优化沟通的过程"], "a": 1, "an": "P423,管理沟通过程的作用：管理沟通是确保项目信息及时且恰当地收集、生成、发布、存储、检索、管理、监督和最终处置的过程。促成项目团队与干系人之间的有效信息流动。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-011", "s": "关于项目报告的描述，不正确的是()。", "o": ["项目信息应发布给众多干系人", "可以定期或临时准备项目信息并编制项目报告", "为了使沟通更清晰，项目报告应采用统一的格式", "工作绩效报告是监控项目工作过程的输出"], "a": 2, "an": "P426,项目报告：项目信息应发布给众多干系人群体。应针对每种干系人来调整项目信息发布的适当层次、形式和细节。从简单的沟通到详尽的定制报告和演示，报告的形式各不相同。可以定期准备信息或基于例外情况准备。虽然工作绩效报告是监控项目工作过程的输出，但是本过程会编制临时报告、项目演示、博客，以及其他类型的信息。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-012", "s": "视频会议属于()。", "o": ["互动沟通", "拉式沟通", "推式沟通", "非正式沟通"], "a": 0, "an": "P421,沟通方法方法定义方法举例互动沟通在两方或多方之间进行多向信息交换。会议、电话、即时通信、视频会议、社交媒体推式沟通向需要接收信息的特定接收方发送或发布信息。这种方法可以确保信息的发送，但不能确保信息送达受众或被目标受众理解信件、备忘录、报告、电子邮件、传真、语音邮件、博客、新闻稿拉式沟通用于信息量很大或受众很多的情况。要求接收者自行地访问信息内容门户网站、组织内网、电子在线课程、经验教训数据库、知识库", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-013", "s": "项目团队可以根据需要裁剪项目沟通管理过程。裁剪时应考虑的因素不包括()。", "o": ["干系人", "物理地点", "沟通技术", "收集信息"], "a": 3, "an": "P418,裁剪考虑因素包括：干系人、物理地点、沟通技术、语言、知识管理。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-014", "s": "“监督沟通”过程采用的措施不包括()。", "o": ["整理经验教训、开展团队观察", "审查问题日志、评估变更", "开展客户满意度调查", "识别和确定沟通需求"], "a": 3, "an": "P428,监督沟通可能需要采取各种方法，例如，开展客户满意度调查、整理经验教训、开展团队观察、审查问题日志和评估变更。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-015", "s": "适用于管理沟通过程的沟通技能不包括()。", "o": ["反馈", "非口头技能", "演示", "社交媒体管理"], "a": 3, "an": "P425,沟通技能：沟通胜任力。有助于明确关键信息的目的、实现信息共享和采取领导行为。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-016", "s": "下面属于工作绩效报告的是()*①挣值图表和信息；②趋势线和预测；③储备燃尽图；④缺陷直方图；⑤合同绩效信息", "o": ["①②⑤", "①③④⑤", "①④⑤", "①②③④⑤"], "a": 3, "an": "P424-425,工作绩效报告典型示例包括状态报告和进展报告。工作绩效报告可以包含挣值图表和信息、趋势线和预测、储备燃尽图、缺陷直方图、合同绩效信息以及风险概述信息。可表现为仪表指示图、热点报告、信号灯图或其他形式。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-017", "s": "适用于规划沟通管理过程的数据表现技术是()。", "o": ["沟通模型", "沟通需求分析", "权力/利益方格", "干系人参与度评估矩阵"], "a": 3, "an": "P422,适用于规划沟通管理过程的数据表现技术是干系人参与度评估矩阵。干系人参与度评估矩阵显示了个体干系人当前和期望参与度之间的差距。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-018", "s" ", "拉式沟通", "情景式沟通"], "a": 1, "an": "P421,沟通方法方法定义方法举例互动沟通在两方或多方之间进行多向信息交换。会议、电话、即时通信、视频会议、社交媒体推式沟通向需要接收信息的特定接收方发送或发布信息。这种方法可以确保信息的发送，但不能确保信息送达受众或被目标受众理解信件、备忘录、报告、电子邮件、传真、语音邮件、博客、新闻稿拉式沟通用于信息量很大或受众很多的情况。要求接收者自行地访问信息内容门户网站、组织内网、电子在线课程、经验教训数据库、知识库", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-060", "s": "与客户、供应商、公众沟通属于()。", "o": ["外部沟通", "官方沟通", "正式沟通", "非正式沟通"], "a": 0, "an": "P415,", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-061", "s": "在项目沟通管理过程中，()是“管理沟通”过程的作用。", "o": ["确保所有沟通参与者之间的信息流动的最优化", "促进项目干系人之间实现有效率且有效果的沟通", "识别与记录与干系人最有效率且最有效果的沟通方式", "针对问题和关键绩效指标的沟通，可引发修正措施"], "a": 1, "an": "P423,规划沟通管理的作用：①及时向干系人提供相关信息；②引导干系人有效参与项目；③编制书面沟通计划。管理沟通过程的作用：促成项目团队与干系人之间的有效信息流动。监督沟通过程的作用：按沟通管理计划和干系人参与计划的要求优化信息传递流程。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-062", "s": "在规划沟通管理时，需要考虑并合理记录用来()、检索和最终处置项目信息的方法。", "o": ["存储", "分析", "接收", "分享"], "a": 0, "an": "P419,在规划沟通管理时，需要考虑并合理记录用来存储、检索和最终处置项目信息的方法。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-063", "s": "在沟通模型中，()是这是整个过程中最难的一环。", "o": ["已发送", "已转化为积极的行动", "已认可", "已理解"], "a": 1, "an": "P415,已转化为积极的行动：正确地理解和达成一致的认可比较难，但更加困难的是让对方转化为实际的、积极的行动，而且是方向正确无误的行动。这是整个过程中最难的一环，通常需要反复地沟通，在一定的监督或帮助下才能较好地完成。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-064", "s": "()不属于书面沟通的5C原则。", "o": ["简洁的表述(concise)", "可以证明的结论(certification)", "连贯的思维逻辑(coherent)", "清晰的目的和表述(clarity)"], "a": 1, "an": "P416。书面沟通的5C原则：", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-065", "s": "把思想或想法转化为他人能理解的语言，属于沟通模型中的()。", "o": ["编码", "解码", "媒介", "信息"], "a": 0, "an": "P415,编码：把思想或想法转化为他人能理解的语言。信息和反馈信息：编码过程所得到的结果。媒介：用来传递信息的方法。噪声：干扰信息传输和理解的一切因素(如距离、新技术、缺乏背景信息等)。解码：把信息还原成有意义的思想或想法。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-066", "s": "在沟通模型中，对方信息已收到。但这并不表示对方有意图去读取、理解或解决信息，目前是处于()。", "o": ["已转化为积极的行动", "已收到", "已理解已认可", "已认可"], "a": 1, "an": "P415,沟通模型包含5种状态：已发送、已收到、已理解、已认可、已转化为积极的行动。*(1)已发送：信息已发送。*(2)已收到：对方信息已收到。但这并不表示对方有意图去读取、理解或解决信息。*(3)已理解：正确地消化和理解信息中的内容是简单接收信息中关键的一环。*(4)已认可：理解了传达的信息并不代表对方已同意这个观点。或许对方明白了发送者的意思，但完全不同意。所以在两个聪明的、有主见的人之间达成一致既复杂又耗时，尤其是两个人的观点不能清晰地向对方阐述的时候。因此，达成一致仍然是做出项目决策和有效沟通的关键一环。*(5)已转化为积极的行动：正确地理解和达成一致的认可比较难，但更加困难的是让对方转化为实际的、积极的行动，而且是方向正确无误的行动。这是整个过程中最难的一环，通常需要反复地沟通，在一定的监督或帮助下才能较好地完成。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-067", "s": "呈交监管机构或政府部门的报告属于()。", "o": ["外部沟通", "官方沟通", "正式沟通", "非正式沟通"], "a": 1, "an": "P415,沟通分类适用范围内部沟通项目内部或组织内部的干系人外部沟通外部干系人，如客户、供应商、公众等。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-068", "s": "在沟通模型中，发送者发送了信息，接受者也及时收到了消息，也认可了发送者的观点，但是接受者不去执行，目前是处于()。", "o": ["已转化为积极的行动", "已收到", "已理解已认可", "已认可"], "a": 3, "an": "P415,沟通模型包含5种状态：已发送、已收到、已理解、已认可、已转化为积极的行动。*(1)已发送：信息已发送。*(2)已收到：对方信息已收到。但这并不表示对方有意图去读取、理解或解决信息。*(3)已理解：正确地消化和理解信息中的内容是简单接收信息中关键的一环。*(4)已认可：理解了传达的信息并不代表对方已同意这个观点。或许对方明白了发送者的意思，但完全不同意。所以在两个聪明的、有主见的人之间达成一致既复杂又耗时，尤其是两个人的观点不能清晰地向对方阐述的时候。因此，达成一致仍然是做出项目决策和有效沟通的关键一环。*(5)已转化为积极的行动：正确地理解和达成一致的认可比较难，但更加困难的是让对方转化为实际的、积极的行动，而且是方向正确无误的行动。这是整个过程中最难的一环，通常需要反复地沟通，在一定的监督或帮助下才能较好地完成。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-069", "s": "某公司某项目沟通渠道为66,则该项目干系人为()人。", "o": ["9", "10", "11", "12"], "a": 3, "an": "第三版，计算需要会。沟通渠道的计算公式为=n*(n-1)/2,题目中已知某项目沟通渠道为66,n*(n-1)/2=66,n*(n-1)=132,分别将A、B、C、D4个选项代入，只有n=12满足条件。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-070", "s": "()适用个人之间交换信息，通常以面对面的方式进行。", "o": ["人际沟通", "小组沟通", "公众沟通", "大众传播"], "a": 0, "an": "P421,人际沟通：个人之间交换信息，通常以面对面的方式进行。小组沟通：在3~6名人员的小组内部开展。公众沟通：单个演讲者面向一群人。大众传播：信息发送人员或小组与大量目标受众之间只有最低程度的联系。网络和社交工具沟通：借助社交工具和媒体，开展多对多的沟通。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-071", "s": "在项目沟通管理过程中，()是确保满足项目及其干系人的信息需求的过程。", "o": ["规划沟通管理", "管理沟通", "监督沟通", "控制沟通"], "a": 2, "an": "P427,规划沟通管理的作用：①及时向干系人提供相关信息；②引导干系人有效参与项目；③编制书面沟通计划。管理沟通过程的作用：促成项目团队与干系人之间的有效信息流动。监督沟通过程的作用：监督沟通是确保满足项目及其干系人的信息需求的过程。按沟通管理计划和干系人参与计划的要求优化信息传递流程。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-072", "s": "A公司任命黄总为新项目的项目经理，黄总任命小张为开发经理，并在公司内部调集10人组成项目团队，则该项目团队内的沟通渠道共()条。", "o": ["45", "55", "66", "78"], "a": 2, "an": "第三版，计算需要会。沟通渠道=N(N-1)÷2,N指参与沟通的人数。项目的人数为：黄总，小张，10人的项目团队，总共N=12人。根据公式可以得出沟通渠道=12×(12-1)÷2=66", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-073", "s": "已开展的沟通类型和数量的数据属于()。", "o": ["工作绩效数据", "工作绩效信息", "工作绩效报告", "项目沟通记录"], "a": 0, "an": "P428,工作绩效数据包含关于已开展的沟通类型和数量的数据", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-074", "s": "()适用在3~6名人员的小组内部开展。", "o": ["人际沟通", "小组沟通", "公众沟通", "大众传播"], "a": 1, "an": "P421,人际沟通：个人之间交换信息，通常以面对面的方式进行。小组沟通：在3~6名人员的小组内部开展。公众沟通：单个演讲者面向一群人。大众传播：信息发送人员或小组与大量目标受众之间只有最低程度的联系。网络和社交工具沟通：借助社交工具和媒体，开展多对多的沟通。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-075", "s": "项目经理需在项目生命周期的早期，针对项目干系人多样性的信息需求，制订有效的()。", "o": ["沟通管理计划", "干系人登记册", "项目进度计划", "沟通风格评估"], "a": 0, "an": "P418,项目经理需在项目生命周期的早期，针对项目干系人多样性的信息需求，制订有效的沟通管理计划。应该在整个项目期间，定期审查本过程的成果并做必要修改，以确保其持续适用。例如，在干系人发生变化或每个新项目阶段开始时。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-076", "s": "以下对沟通管理计划的理解中，正确的是()。", "o": ["沟通管理计划不仅包括项目干系人的需求和预期，还包括用于沟通的信息。如格式、内容、细节水平等", "由于项目具有独特性，一个公司的各种项目不宜采取统一格式记录及传递信息", "对于不同层次的项目干系人，也应规定相同的信息格式", "沟通需求分析是项目干系人信息需求的汇总，而项目的组织结构不会影响项目的沟通需求"], "a": 0, "an": "P423,沟通管理计划包括干系人的沟通需求，还需针对沟通信息的描述，包括格式、内容、详尽程度等。所以A正确。一个公司的各个项目应该基本采取统一格式记录信息以及进行传递，管理部门总结好的模板进行分享，有助于信息格式标准化，以免引起不必要的混乱。所以B错误。对于不同层次的项目干系人，应规定不同的信息格式。所以C错误。项目的组织结构肯定会影响项目的沟通需求。所以D错误。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-077", "s": "监督沟通时，适用的数据表现技术是()。", "o": ["干系人管理计划", "故事板", "原型图", "干系人参与度评估矩阵"], "a": 3, "an": "P429,监督沟通时，适用的数据表现技术是干系人参与度评估矩阵。应该检查干系人的期望与当前参与度的变化情况，并对沟通进行必要调整。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-078", "s": "在干系人发生变化或每个新项目阶段开始时，需要()。", "o": ["规划沟通管理", "管理沟通", "监督沟通", "管理干系人参与"], "a": 0, "an": "P418,项目经理需在项目生命周期的早期，针对项目干系人多样性的信息需求，制订有效的沟通管理计划。应该在整个项目期间，定期审查本过程的成果并做必要修改，以确保其持续适用。例如，在干系人发生变化或每个新项目阶段开始时。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-079", "s": "某项目沟通协调会共有9人参加会议，此次会议沟通渠道有()条。", "o": ["42", "28", "45", "36"], "a": 3, "an": "第三版，计算需要会。沟通渠道：n(n-1)/2,n 表示干系人数量。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-080", "s": "开展团队观察调查属于()的方法。", "o": ["收集需求", "规划沟通管理", "管理沟通", "监督沟通"], "a": 3, "an": "P427-428,监督沟通可能需要采取各种方法，例如，开展客户满意度调查、整理经验教训、开展团队观察、审查问题日志和评估变更。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-081", "s": "你正在组织项目沟通协调会，参加会议的人数为12人，沟通渠道有()条。", "o": ["66", "72", "96", "132"], "a": 0, "an": "第三版，计算需要会。沟通渠道=N(N-1)÷2,N指参与沟通的人数。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-082", "s": "()确定项目干系人的信息需求，包括所需信息的类型和格式，以及信息对干系人的价值。", "o": ["沟通需求分析", "沟通技术", "沟通模型", "沟通方法"], "a": 0, "an": "P420,沟通需求分析，分析沟通需求，确定项目干系人的信息需求，包括所需信息的类型和格式，以及信息对干系人的价值。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-083", "s": "项目经理卧泮在采购活动结束后依然向供应商发送采购工作跟进表，这属于那个()出错了。", "o": ["规划沟通管理", "管理沟通", "监督沟通", "监督干系人参与"], "a": 2, "an": "采购工作结束后，那么是不用再去向供应商发送采购工作跟进表了，这个就是属于没有在正确的时间获取争取的消息。需要改变沟通策略，所以属于监督沟通。管理沟通是按计划去执行沟通工作，不合题意", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-084", "s": "沟通的基本模型用于显示信息如何在双方之间被发送和被接收，日常与人交往过程中发生的误解，通常在()环节发生。", "o": ["编码", "解码", "媒介", "信息"], "a": 1, "an": "P415,解码就是将信息还原，但是在还原的过程中肯定会因为各种原因造成与实际信息不符的情况，就会出现误解。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-085", "s": "开展客户满意度调查属于()的方法。", "o": ["收集需求", "规划沟通管理", "管理沟通", "监督沟通"], "a": 3, "an": "P427-428,监督沟通可能需要采取各种方法，例如，开展客户满意度调查、整理经验教训、开展团队观察、审查问题日志和评估变更。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-086", "s": "()评估沟通风格并识别偏好的沟通方法、形式和内容的技术。", "o": ["沟通风格评估", "网络和社交工具沟通", "规划沟通", "沟通需求分析"], "a": 0, "an": "P422,沟通风格评估：评估沟通风格并识别偏好的沟通方法、形式和内容的技术。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-087", "s": "项目经理通过微信群告知项目组成员每天早上9:00在会议室召开5分钟站立会议，讨论项目进展和当日工作，并要求每个组员对上述内容进行确认回复，十分钟后他收到了所有回复信息。其中，微信群属沟通模型中的()关键要素。", "o": ["编码", "解码", "噪声", "媒介"], "a": 3, "an": "P415,沟通模型关键要素释义把思想或想法转化为他人能理解的语言编码信息和反馈信息编码过程所得到的结果媒介用来传递信息的方法噪声干扰信息传输和理解的因素(如距离、新技术、缺乏背景信息等)解码把信息还原成有意义的思想或想法", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-088", "s": "项目经理在()过程中，发现参加会议的主要领导无法出席，项目组原定的周一的项目例会，改为周二召开。", "o": ["实施整体变更控制", "规划沟通管理", "管理沟通", "监督沟通"], "a": 3, "an": "A错误。不管是实施整体变更控制还是变更管理也好，都强调的是对变更的流程进行管理。B错误。规划沟通管理是制定一系列方法蜗和牛政策为如何管理和控制沟通提供指南和方向。C错误。管理沟通是按照沟通管理计划的内容去执行。D最符合题意。监督沟通是当实际沟通和计划沟通发生偏差时，进行纠偏。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-089", "s": "在编制沟通计划时，()不是沟通计划编制的输入。", "o": ["干系人参与计划", "沟通技术", "组织的社交媒体", "需求文件"], "a": 1, "an": "P419,沟通计划编制的输入包括：项目章程、资源管理计划、干系人参与计划、事业环境因素、需求文件、干系人登记册，组织过程资产。组织的社交媒体是组织过程资产B错误。B属于规划沟通管理的工具和技术", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-090", "s": "影响沟通技术的选择的因素包括：()。*①信息需求的紧迫性；②技术的可用性与可靠性；③易用性；④项目环境；⑤信息的敏感性和保密性。", "o": ["①②③", "①②③⑤", "①③④⑤", "①②③④⑤"], "a": 3, "an": "P420,影响沟通技术的选择的因素包括：①信息需求的紧迫性；②技术的可用性与可靠性；*③易用性；④项目环境；⑤信息的敏感性和保密性。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-091", "s": "写作思路连贯，在整个书面文件中使用诸如“引言”和“小结”的小标题。说的是书面沟通的5C原则的()原则。", "o": ["正确的语法和拼写", "简洁的表述", "连贯的思维逻辑", "善用控制语句和承接"], "a": 2, "an": "P416,连贯的思维逻辑(Coherent):写作思路连贯，在整个书面文件中使用诸如“引言”和“小结”的小标题。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-092", "s": "()信息发送人员或小组与大量目标受众之间只有最低程度的联系。", "o": ["人际沟通", "小组沟通", "公众沟通", "大众传播"], "a": 3, "an": "P421,人际沟通：个人之间交换信息，通常以面对面的方式进行。小组沟通：在3~6名人员的小组内部开展。公众沟通：单个演讲者面向一群人。大众传播：信息发送人员或小组与大量目标受众之间只有最低程度的联系。网络和社交工具沟通：借助社交工具和媒体，开展多对多的沟通。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-093", "s": "()不仅能支持信息交换，而且也有助于建立更深层次的信任和社群关系。", "o": ["将干系人纳入项目评审范围", "让干系人参加项目会议", "社交媒体工具", "多面性沟通方法"], "a": 2, "an": "P417,社交媒体工具不仅能支持信息交换，而且也有助于建立更深层次的信任和社群关系。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-094", "s": "项目团队可以根据需要裁剪项目沟通管理过程。裁剪时应考虑的因素不包括()。", "o": ["知识管理", "语言", "团队文化", "物理地点"], "a": 2, "an": "P418,裁剪考虑因素包括：干系人、物理地点、沟通技术、语言、知识管理。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-095", "s": "项目沟通记录不包括()。", "o": ["绩效报告", "可交付成果的状态", "进度进展", "项目报告"], "a": 3, "an": "P426,项目报告是管理沟通的工具", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-096", "s": "沟通管理计划包括确定项目干系人的信息和沟通需求，在编制沟通计划时，()不是沟通计划编制的输入。", "o": ["组织过程资产", "项目章程", "沟通需求分析", "需求文件"], "a": 2, "an": "P419,沟通计划编制的输入包括：项目章程、资源管理计划、干系人参与计划、事业环境因素、需求文件、干系人登记册，组织过程资产。B项目章程中包含了项目相关的干系人。C错误。C属于规划沟通管理的工具和技术", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-097", "s": "会议和虚拟办公支持软件属于()。", "o": ["电子项目管理工具", "电子沟通管理", "社交媒体管理", "虚拟沟通工具"], "a": 0, "an": "P425,电子项目管理工具：项目管理软件、会议和虚拟办公支持软件、网络界面、专门的项目门户网站和状态仪表盘，以及协同工作管理工具；电子沟通管理：电子邮件、传真和语音邮件，音频、视频和网络会议，以及网站和网络发布；社交媒体管理：网站和网络发布，以及为促进干系人参与和形成在线社区而建立的博客和应用程序。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-098", "s": "可能影响控制沟通过程的组织过程资产不包括()。", "o": ["以往项目的经验教训知识库", "组织对沟通的要求", "制作、交换、储存和检索信息的标准化指南", "组织治理框架"], "a": 3, "an": "P428,组织治理框架是事业环境因素，事业环境因素和组织资产之间最大的区别是，事业环境因素是不可更改的，只能适应的。组织资产可以选择性使用", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-099", "s": "在模糊不定的项目环境中，应采取哪些沟通方法()。*①简化团队成员获取信息的通道*② 让团队成员集中办公*③以透明的方式发布项目成果*④定期邀请干系人评审项目成果", "o": ["①②③", "②③", "②③④", "①②③④"], "a": 3, "an": "P418,在模糊不定的项目环境中，必然需要对不断演变和出现的细节情况进行更频繁和快速地沟通。因此，应该尽量简化团队成员获取信息的通道，要经常进行团队检查，并让团队成员集中办公。此外，为了促进与高级管理层和干系人的沟通，还需要以透明的方式发布项目成果，并定期邀请干系人评审项目成果。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-100", "s": "理解组织战略、了解谁能行使权力和施加影响，以及培养与这些干系人沟通的能力，属于()。", "o": ["冲突管理", "政策意识", "文化意识", "沟通风格评估"], "a": 1, "an": "P422,政策意识有助于项目经理根据项目环境和组织的政策环境来规划沟通。政策意识是指对正式和非正式权力关系的认知，以及在这些关系中工作的意愿。理解组织战略、了解谁能行使权力和施加影响，以及培养与这些干系人沟通的能力，都属于政策意识范畴。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-101", "s": "()运用反馈循环，为互动和参与提供机会，并清除妨碍有效沟通的障碍。", "o": ["发送方-接收方模型", "积极倾听", "写作风格", "媒介选择"], "a": 0, "an": "P424,发送方-接收方模型：运用反馈循环，为互动和参与提供机会，并清除妨碍有效沟通的障碍。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-102", "s": "适用于监督沟通过程的人际关系与团队技能主要包括()。", "o": ["积极倾听", "人际交往", "冲突管理", "观察和交谈"], "a": 3, "an": "P428,适用于监督沟通过程的人际关系与团队技能主要包括观察和交谈。", "cm": ""}, {"c": 14, "cn": "项目沟通管理", "no": "14-103", "s": "沟通效果的调查结果，属于()。", "o": ["工作绩效数据", "工作绩效信息", "工作绩效报告", "项目沟通记录"], "a": 1, "an": "P428,工作绩效信息包括：计划沟通的实际开展情况；对沟通的反馈，例如关于沟通效果的调查结果。淘宝扫码购课微信公众号扫码加老师Q扫码加老师V蜗牛软考小鹅通店铺", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-001", "s": "关于项目风险的描述，不正确的是()。", "o": ["风险具有随机性、相对性、可变性", "项目收益越大，人们愿意承担的风险越大", "项目投入越多，人们愿意承担的风险越大", "风险按照影响范围可分为局部风险和总体风险"], "a": 2, "an": "P432,风险总是相对项目活动主体而言的，人们承受风险的能力受下列几个因素的影响：收益的大小。收益越大，人们愿意承担的风险也就越大。投入的大小。项目活动投入的越多，愿意冒的风险也就越小。项目活动主体的地位和拥有的资源。个人或组织拥有的资源越多，其风险承受能力也越大。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-002", "s": "关于风险识别的描述，不正确的是()。", "o": ["应鼓励所有项目人员参与风险的识别", "风险登记册的编制始于风险识别过程", "在某些项目中，识别风险后可以跳过定性分析过程直接进入定量分析", "识别风险是在项目计划阶段的工作，在其他阶段不涉及"], "a": 3, "an": "P443,D错误。在整个项目生命周期中，单个项目风险可能随项目进展而不断变化，整体项目风险的级别也会发生变化。因此，识别风险是一个迭代的过程。迭代的频率和每次迭代所需的参与程度因情况而异，应在风险管理计划中做出相应规定。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-003", "s": "以下关于气泡图的说法中，错误的是()。", "o": ["气泡图能显示三维数据", "在气泡图中，把每个风险都绘制成一个气泡，并用x轴值、y轴值和气泡大小来表示风险的3个参数", "气泡图中，可以用X轴代表可监测性，Y轴代表邻近性，影响值则以气泡大小表示", "气泡图是识别风险的工具"], "a": 3, "an": "P451,气泡图能显示三维数据。在气泡图中，把每个风险都绘制成一个气泡，并用x轴值、y轴值和气泡大小来表示风险的3个参数。气泡图中X轴代表可监测性，Y轴代表邻近性，影响值则以气泡大小表示。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-004", "s": "在一个大型项目实施过程中，项目经理发现项目风险已经发生，并且对项目进度和成本产生了显著影响。为了准确评估风险对项目目标的影响程度，项目经理应该采取的定量风险分析技术是()。", "o": ["风险分类", "风险数据质量评估", "风险概率和影响评估", "敏感性分析"], "a": 3, "an": "P455,其它3个都属于定性风险分析的工具和技术", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-005", "s": "关于风险的描述，不正确的是()。", "o": ["具有不确定性的事件不一定是风险", "项目风险既包括对项目目标的威胁，也包括促进项目目标的机会", "风险是零和游戏，有风险受益者，同时也有风险受害者", "在项目中应规避投机风险向纯粹风险的转化"], "a": 2, "an": "P433,风险不是零和游戏。在许多情况下，涉及风险的各有关方面都要蒙受损失，无一幸免。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-006", "s": "通过与供应商签订固定总价合同来应对成本的不可控，属于风险应对策略中的()。", "o": ["提高", "回避", "转移", "接受"], "a": 2, "an": "首先，确定风险的类型，“成本的不可控”属于威胁风险，再来判断属于哪个具体策略，“通过与供应商签订固定总价合同”,这个就是转移。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-007", "s": "关于规划风险应对过程的概述，不正确的是()。", "o": ["如果选定的策略并不完全有效，需要制定应急计划，识别采取风险应对措施后仍然存在的未被完全消除的次生风险", "风险应对方案可以用结构化的决策技术来选择最适当的应对策略，为每个风险选择最可能有效的策略或策略组合", "对于大型或复杂的项目，可能需要以数学优化模型或实际方案分析为基础，进行备选风险应对策略经济分析", "风险应对方案应在当前项目背景下现实可行，获得全体干系人同意，并由一名责任人具体负责"], "a": 0, "an": "次生风险是实施风险应对措施直接导致的风险，A说的是识别采取风险应对措施后仍然存在的未被完全消除的次生风险，这个不正确。P458,风险应对方案应该与风险的重要性相匹配，并且能够经济有效地应对挑战，同时在当前项目背景下现实可行，获得全体干系人的同意，并由一名责任人具体负责。往往需要从几套可选方案中选出最优的风险应对方案，为每个风险选择最可能有效的策略或策略组合。可用结构化的决策技术来选择最适当的应对策略；对于大型或复杂项目，可能需要以数学优化模型或实际方案分析为基础，进行备选风险应对策略经济分析。要为实施商定的风险应对策略制定具体的应对行动。如果选定的策略并不完全有效，或者发生了已接受的风险，就需要制订应急计划。同时，也需要识别次生风险。次生风险是实施风险应对措施直接导致的风险卧浒。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-008", "s": "项目风险识别是指找出影响项目目标顺利实现的主要风险因素，并识别出这些风险有哪些基本特征，可能会影响到项目的哪些方面等问题。以下关于项目风险识别的叙述中，正确的是()。", "o": ["主要由项目经理负责项目风险识别活动", "风险识别是一种系统活动，而不是一次性行为", "主要识别项目的内在风险", "风险识别包括外在因素对项目本身可能造成的影响评估"], "a": 1, "an": "A错误。应鼓励所有项目人员参与风险的识别。B正确。识别风险是一项反复过程。C错误。项目内外风险都要识别D错误。影响评估属于定性风险分析的内容。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-009", "s": "采用较简单的流程、进行更多次测试和选用更可靠的卖方属于()策略。", "o": ["减轻", "规避", "上报", "转移"], "a": 0, "an": "P460,减轻。风险减轻是指采取措施来降低威胁发生的概率和影响。提前采取减轻措施通常比威胁出现后尝试进行弥补更加有效。减轻措施包括采用较简单的流程、进行更多次测试和选用更可靠的卖方。还可能涉及原型开发，以降低从实验台模型放大到实际工艺或产品中的风险。如果无法降低概率，也许可以从决定风险严重性的因素入手，来减轻风险发生的影响。例如，在一个系统中加入冗余部件，可减轻原始部件故障所造成的影响。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-010", "s": "在项目执行过程中，项目经理发现项目进展顺利，但某些潜在风险因素仍然存在。为了确保项目能够顺利完成，项目经理应采取()措施，有效地监督这些风险。", "o": ["增加项目预算，以应对可能出现的风险", "定期进行进行风险审查会议，并更新风险登记册", "减少项目开支，以降低潜在风险的影响", "分析风险因素对项目的潜在影响，并调整项目计划"], "a": 1, "an": "本题说某些潜在风险因素仍然存在，这说明监督风险，结合选项，风险审查属于监督风险的技术，所以选B最合适。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-011", "s": "敏感性分析的结果通常用()来表示。", "o": ["气泡图", "龙卷风图", "SWOT", "概率影响矩阵"], "a": 1, "an": "P455,敏感性分析的结果通常用龙卷风图来表示。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-012", "s": "风险审计属于()过程的工具与技术。", "o": ["定性风险分析", "监督风险", "定量风险分析", "风险规划"], "a": 1, "an": "P467,风险审计属于监督风险的工具与技术", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-013", "s": "以下说法错误的是()。", "o": ["风险审计是一种审计类型，可用于评估风险管理过程的有效性", "风险审计由外部人员开展，一般只在各关键节点开展", "在实施审计前，应明确定义风险审计的程序和目标", "项目经理负责确保按项目风险管理计划所规定的频率开展风险审计"], "a": 1, "an": "P467,风险审计是一种审计类型，可用于评估风险管理过程的有效性。项目经理负责确保按项目风险管理计划所规定的频率开展风险审计。风险审计可以在日常项目审查会和风险审查会上开展，团队也可以召开专门的风险审计会。在实施审计前，应明确定义风险审计的程序和目标", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-014", "s": "已规划的目标、活动或决策的某些关键方面存在不确定性，属于()。", "o": ["变异性风险", "模糊性风险", "整合式风险", "纯粹风险"], "a": 0, "an": "P435:变异性风险：已规划的目标、活动或决策的某些关键方面存在不确定性", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-015", "s": "在风险识别时，可以用到多种工具和技术。其中()指的是从项目的优势、劣势、机会和威胁出发，对项目进行考察，从而更全面地考虑风险。", "o": ["头脑风暴法", "因果图", "SWOT分析法", "专家判断法"], "a": 2, "an": "P446,SWOT分析：对项目的优势、劣势、机会和威胁(简称SWOT)进行逐个检查。在识别风险时，它会将内部产生的风险包含在内，从而拓宽识别风险的范围。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-016", "s": "()不属于定性风险分析的技术。", "o": ["风险数据质量评估", "概率和影响矩阵", "风险紧迫性评估", "预期货币价值分析"], "a": 3, "an": "P449-450,实施定性风险分析的数据分析技术包括：风险数据质量评估。风险数据是开展定性风险分析的基础。凤险概率和影响评估。风险概率评估考虑的是特定风险发生的可能性，而风险影响评估考虑的是风险对一项或多项项目目标的潜在影响，如进度、成本、质量或绩效。低概率和影响的风险将被列入风险登记册中的观察清单，以供未来监控。其他风险参数评估。紧迫性、邻近性、潜伏期、可管理性、可控性、可监测性、连通性、战略影响力、密切度。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-017", "s": "关于风险的描述，正确的是()。", "o": ["不能带来机会、无获利可能的风险叫投机风险", "根据经验可以预见其发生，但不可预见其后果的风险叫已知风险", "地震、百年不遇的暴雨等属于不可预测的风险", "风险是零和游戏，有人受损就有人获利"], "a": 2, "an": "P433-434,", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-018", "s": "关于定性风险分析的描述，不正确的是()。", "o": ["风险数据是开展定性风险分析的基础", "定性风险分析，具有主观性", "气泡图的X轴代表风险概率，Y轴代表风险影响，影响值则以气泡大小表示", "概率和影响矩阵使用两个维度对风险进行分类"], "a": 2, "an": "P450-451,气泡图能显示三维数据，在气泡图中，把每个风险都绘制成一个气泡，并用x(横)轴值、y(纵)轴值和气泡大小来表示风险的3个参数。X轴代表可监测性，Y轴代表邻近性，影响值则以气泡大小表示。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-019", "s": "应对可能对项目目标存在消极影响和威胁的风险，不宜采用的策略是()。", "o": ["提高", "规避", "转移", "接受"], "a": 0, "an": "P459-460:威胁应对策略：上报：风险超出了项目经理的权限，就应该采用上报策略规避：改变项目计划，以排除风险或条件转移：将应对威胁的责任转移给第三方减轻：提前采取措施来降低威胁发生的概率和影响。接受：最常见的主动接受策略是建立应急储备，安排一定的时间、资金或资源来应对风险。被动接受策略定期对威胁进行审查，确保其未发生重大改变", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-020", "s": "关于风险分析的技术，不正确的是()。", "o": ["概率影响矩阵适用于两个以上的参数对风险进行分类的情况", "蒙特卡洛分析，是使用模型模拟大量单个项目风险和其他不确定性来源的综合影响，以评估它们对项目目标的潜在影响", "敏感性分析，是将项目结果变化与定量风险分析模型中的要素变化之间建立联系的方法", "影响图是不确定条件下进行决策的图形辅助工具"], "a": 0, "an": "P451:层级图：如果使用了两个以上的参数对风险进行分类，那就不能使用概率和影响矩阵，而需要使用其他图形。例如，气泡图能显示三维数据。在气泡图中，把每个风险都绘制成一个气泡，并用x(横)轴值、y(纵)轴值和气泡大小来表示风险的3个参数。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-021", "s": "整体项目风险应对策略不包括()。", "o": ["开拓", "接受", "上报", "转移或分享"], "a": 2, "an": "P461:机会应对策略：上报、开拓、分享、提高、接受。整体项目风险应对策略：规避、开拓、转移或分享、减轻或提高、接受。威胁应对策略：上报、规避、转移、减轻、接受。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-022", "s": "关于风险的描述，正确的是()。", "o": ["风险审计可以在日常项目审查中进行，也可以单独召开风险审计会议", "蒙特卡洛分析有助于确定哪些风险对项目具有最大的潜在影响", "制定有效的风险应对策略需要风险量化分析", "建立应急储备，安排资金和资源应对风险是常见的回避风险策略"], "a": 0, "an": "P467,风险审计是一种审计类型，可用于评估风险管理过程的有效性。项目经理负责确保按项目风险管理计划所规定的频率开展风险审计。风险审计可以在日常项目审查会和风险审查会上开展，团队也可以召开专门的风险审计会。在实施审计前，应明确定义风险审计的程序和目标，故A正确。敏感性分析有助于确定哪些风险对项目具有最大的潜在影响，故B错误。定量风险分析一般在定性风险分析之后进行，但是，经验丰富的风险经理有时在风险分析过程之后径直进行定量分析。有时，制定有效的风险应对策略并不需要风险量化分析，故C错误。D是应急应对策略", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-023", "s": "()不属于识别风险过程的成果。", "o": ["已识别风险清单", "潜在应对措施清单", "风险根本原因", "风险描述格式和模板"], "a": 3, "an": "P447,识别风险过程的成果一般载入风险登记册中，风险登记册包括以下内容：已识别风险的清单、潜在风险责任人、潜在风险应对措施清单、还要记录关于每项已识别风险的其他数据，包括简短的风险名称、风险类别、当前风险状态、一项或多项原因、一项或多项对目标的影响、风险触发条件等等", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-024", "s": "因时间紧、任务急，经过评估，某智能监控软件涉及的图像传输速度与精度指标难以满足客户需求，故项目团队欲将该软件开发分包给技术实力很强的企业完成。这种风险应对措施被称为风险()。", "o": ["接受", "规避", "减轻", "转移"], "a": 3, "an": "P459-460:威胁应对策略：上报：风险超出了项目经理的权限，就应该采用上报策略规避：改变项目计划，以排除风险或条件转移：将应对威胁的责任转移给第三方减轻：提前采取措施来降低威胁发生的概率和影响。接受：最常见的主动接受策略是建立应急储备，安排一定的时间、资金或资源来应对风险。被动接受策略定期对威胁进行审查，确保其未发生重大改变", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-025", "s": "关于风险的描述，不正确的()。", "o": ["已知风险为其后果可以预见的风险", "随机性、相对性、可变性都是风险的属性", "按可预测性划分为可预测风险和不可预测风险两种", "项目管理人员必须避免投机风险转化为纯粹风险"], "a": 2, "an": "P434,按风险的可预测性划分，风险可以分为已知风险、可预测风险和不可预测风险。已知风险就是在认真、严格地分析项目及其计划之后就能够明确的那些经常发生的，而且其后果亦可预见的风险。已知风险发生概率高，但一般后果轻微，不严重。可预测风险就是根据经验，可以预见其发生，但不可预见其后果的风险。不可预测风险就是有可能发生，但其发生的可能性即使最有经验的人亦不能预见的风险。不可预测风险有时也称未知风险或未识别的风险。它们是新的、以前未观察到或很晚才显现出来的风险。这些风险-般是外部因素作用的结果。例如地震、百年不遇的暴雨、通货膨胀、政策变化等。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-026", "s": "以下()不是定量风险分析的工具和技术。", "o": ["气泡图", "期望货币值", "蒙特卡洛", "敏感性分析"], "a": 0, "an": "P454-456,气泡图是定性风险分析的数据表现工具。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-027", "s": "通过概率和影响级别定义以及专家访谈，有助于纠正该过程所使用的数据中的偏差属于()。", "o": ["定性风险分析", "识别风险", "定量风险分析", "风险监控"], "a": 0, "an": "P449-450,凤险概率和影响评估属于定性分析的工具和技术", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-028", "s": "监督风险的输出有()。", "o": ["工作绩效报告", "工作绩效信息", "工作绩效数据", "储备分析"], "a": 1, "an": "P467-468,工作绩效信息是监督风险的输出", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-029", "s": "()不属于风险识别的依据。", "o": ["成本管理计划", "范围基准", "采购文件", "风险报告"], "a": 3, "an": "P447,风险报告是识别风险的输出", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-030", "s": "项目团队在规划风险管理时进行了分析，发现本次项目的完成对于即将在某个月上线的展销会有重大影响，因此客户对项目进 在影响。", "o": ["蒙特卡洛技术", "概率影响分析", "帕累托分析", "SWTO分析法"], "a": 0, "an": "P454-455,模拟：在定量风险分析中，使用模型来模拟单个项目风险和其他不确定性来源的综合影响，以评估它们对项目目标的潜在影响。模拟通常采用蒙特卡洛分析。B错误。是定性风险分析的工具C错误。是控制质量的老七工具D错误。是识别风险的工具", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-052", "s": "关于识别风险的描述，不正确的是()。", "o": ["可使用类似项目信息的核查替代所需的风险识别", "在风险管理计划中应规定识别风险的迭代频率和迭代参与程度", "从组织外部采购商品和服务可能引发新的项目风险", "使用SWOT分析法可以拓宽项目识别风险的范围"], "a": 0, "an": "P445,核查单：包括需要考虑的项目、行动或要点的清单。它常被用作提醒。基于从类似项目和其他信息来源积累的历史信息和知识来编制核查单。编制核查单时，可列出过去曾出现且可能与当前项目相关的具体项目风险，这是吸取已完成的蜗类似项目的经验教训的有效方式。可基于已完成的项目来编制核查单，也可采用特牛定行业的通用风险核查单。虽然核查单简单易用，但它不可能穷尽所有风险。所以，必须确保不要用核查单来取代蜗所牛需的风险识别工作；同时，项目团队也应该注意考察未在核查单中列出的事项。此外，还应该不时地审查核查单，增加新信息，删除或存档过时信息。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-053", "s": "有一种风险只有在发生后才能被发现，这种风险称为()风险。可以通过加强项目韧性来应对这种风险。", "o": ["随机性", "可预测风险", "模糊性风险", "突发性"], "a": 3, "an": "P436:有一种风险只有在发生后才能被发现，这种风险称为突发性风险。可以通过加强项目韧性来应对这种风险", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-054", "s": "保证项目决策是在整体项目风险和单个项目风险当前信息的基础上进行，是()过程的主要作用。", "o": ["规划风险管理", "规划风险应对", "实施风险应对", "监督风险"], "a": 3, "an": "P465,规划风险管理作用：确保风险管理的水平、方法和可见度与项目风险程度相匹配，与对组织和其他干系人的重要程度相匹配。识别风险作用：识别风险是识别单个项目风险以及整体项目风险的来源，并记录风险特征的过程。实施定性风险分析作用：实施定性风险分析是通过评估单个项目风险发生的概率和影响及其他特征，对风险进行优先级排序，从而为后续分析或行动提供基础的过程。实施定量风险分析作用：实施定量风险分析是就已识别的单个项目风险和不确定性的其他来源对整体项目且标的影响进行定量分析的过程。规划风险应对作用：规划风险的应对措施是为了应对项目风险，而制定可选方案、选择应对策略并商定应对行动的过程。实施风险应对作用：实施风险应对是执行商定的风险应对计划的过程。监督风险作用：监督风险是在整个项目期间，监督风险应对计划的实施，并跟踪已识别风险、识别和分析新风险，以及评估风险管理有效性的过程。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-055", "s": "关于风险识别的描述，不正确的是()。", "o": ["应鼓励所有项目参与人员识别风险", "风险登记册的内容可能包括潜在应对措施清单", "可以跳过定性风险分析过程直接进入定量风险分析", "识别风险是一次性工作"], "a": 3, "an": "P443,D错误。在整个项目生命周期中，单个项目风险可能随项目进展而不断变化，整体项目风险的级别也会发生变化。因此，识别风险是一个迭代的过程。迭代的频率和每次迭代所需的参与程度因情况而异，应在风险管理计划中做出相应规定。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-056", "s": "规划风险管理的输入不包括()。", "o": ["项目章程", "项目管理计划", "干系人登记册", "风险管理计划"], "a": 3, "an": "P439,风险管理计划是规划风险管理的输出", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-057", "s": "关于项目风险的描述，不正确的是()。", "o": ["已知风险与未知风险都可以进行管理", "风险既有可能对项目产生正面的影响，也有可能产生负面的影响", "同样的风险对于不同的主体有不同的影响", "收益越大，人们愿意承担的风险也就越大"], "a": 0, "an": "P434,已知风险是那些已经经过识别和分析的风险，对于已知风险，对其进行规划，寻找应对方案是可行的。虽然项目经理们可以依据以往类似项目的经验，采取一般的应急措施处理未知风险，但未知风险是无法管理的。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-058", "s": "关于风险管理的描述，不正确的是()。", "o": ["不可预测风险有时也称未知风险或未识别的风险。一般是外部因素作用的结果", "纯粹风险和投机风险在一定条件下可以相互转化。要避免投机风险转化为纯粹风险", "因火灾导致的受伤人员的医疗费、休养费、工资等属于直接成本", "有一种风险只有在发生后才能被发现，这种风险称为变异性风险"], "a": 3, "an": "P447变异性风险：已规划的目标、活动或决策的某些关键方面存在不确定性。例如，生产率可能高于或低于目标值，测试发现的错误数量可能多于或少于预期。变异性风险可通过蒙特卡洛分析加以处理。模糊性风险：对未来可能发生什么存在不确定性。知识不足可能影响项目达成目标的能力，例如，不太了解需求或技术解决方案的要素、法规框架的未来发展，或项目内在的系统复杂性。可以采用增量开发、原型搭建或模拟等方法来处理模糊性风险。有一种风险只有在发生后才能被发现，这种风险称为突发性风险。可以通过加强项目韧性来应对这种风险。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-059", "s": "()不属于风险管理计划编制的成果。", "o": ["风险类别", "风险概率", "风险影响力的定义", "风险记录"], "a": 3, "an": "P440-442,规划风险管理的成果如下：风险管理策略、方法论、角色与职责、资金、时间安排、风险类别、干系人风险偏好、风险概率和影响、概率和影响矩阵、报告格式、跟踪。风险记录是属于风险识别过程的成果，一般又称为风险登记册。此文件随着项目风险管理过程的推进，不断更新。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-060", "s": "()不属于风险定性分析的输出。", "o": ["风险优先级别或风险分值", "实现项目目标的概率", "风险紧迫性信息", "风险分类"], "a": 1, "an": "P451-452,风险登记册(更新):用实施定性风险分析过程生成的新信息，去更新风险登记册。风险登记册的更新内容可能包括：每项单个项目风险的概率和影响评估、优先级别或风险分值、指定风险责任人、风险紧迫性信息或风险类别，以及低优先级风险的观察清单和需要进一步分析的风险。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-061", "s": "管理整体项目风险入口、最小化单个项目威胁，以及最大化单个项目机会，是()过程的主要", "o": ["规划风险管理", "规划风险应对", "实施风险应对", "监督风险"], "a": 2, "an": "P463,规划风险管理作用：确保风险管理的水平、方法和可见度与项目风险程度相匹配，与对组织和其他干系人的重要程度相匹配。识别风险作用：识别风险是识别单个项目风险以及整体项目风险的来源，并记录风险特征的过程。实施定性风险分析作用：实施定性风险分析是通过评估单个项目风险发生的概率和影响及其他特征，对风险进行优先级排序，从而为后续分析或行动提供基础的过程。实施定量风险分析作用：实施定量风险分析是就已识别的单个项目风险和不确定性的其他来源对整体项目且标的影响进行定量分析的过程。规划风险应对作用：规划风险的应对措施是为了应对项目风险，而制定可选方案、选择应对策略并商定应对行动的过程。实施风险应对作用：实施风险应对是执行商定的风险应对计划的过程。监督风险作用：监督风险是在整个项目期间，监督风险应对计划的实施，并跟踪已识别风险、识别和分析新风险，以及评估风险管理有效性的过程。", "cm": ""}, {"c": 15, "cn": "项目风险管理", "no": "15-062", "s": "某信息系统建设项目中，为防范系统安全风险，项目经理请第三方安全机构来进行安全整改和评估。项目经理采用的风险应对策略为()。", "o": ["减轻", "转移", "规避", "消除"], "a": 1, "an": "P459-460:威胁应对策略：上报：风险超出了项目经理的权限 , "s": "在控制采购过程中，项目经理发现某些供应商提供的产品存在质量问题，并且这些问题可能导致项目延期。项目经理应()。", "o": ["立即终止与存在问题的供应商合作，并寻找新的供应商", "自行决定采取补救措施，如增加项目预算或延长项目工期，以弥补供应商的问题", "首先与供应商沟通，了解问题的原因，并尝试解决或减轻其对项目的影响", "通知高层领导，并等待高层领导的决策后再采取行动"], "a": 2, "an": "发生问题，找到原因，解决问题，控制过程的主要工作", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-013", "s": "关于合同违约索赔的描述，不正确的是：()。", "o": ["项目索赔事件中，监理工程师和政府建设主管机构承担调解责任，经济合同仲裁委员会承担调解或仲裁责任", "合同索赔遵循的原则包括：索赔的有理性、索赔依据的有效性、索赔计算的正确性", "对于属于买方的原因造成拖延工期，只需给卖方延长工期，不应给予费用补偿", "《民法通则》、《合同法》中与合同纠纷相关条款，可以作为工程索赔的法律依据"], "a": 2, "an": "P500:合同索赔的重要前提条件是合同一方或双方存在违约行为和事实，并且由此造成了损失，责任应由对方承担。对提出的合同索赔，凡属于客观原因造成的延期、属于买方也无法预见到的情况，例如，特殊反常天气达到合同中特殊反常天气的约定条件.卖方可能得到延长工期，但得不到费用补偿。对于属于买方的原因造成拖延工期，不仅应给卖方延长工期，还应给予费用补偿。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-014", "s": "在项目中经常会利用外包的手段，以提高项目的验利能力，对于工作规模或产品规定不是特别清楚的项目。外包时一般应采用()。", "o": ["成本补偿合同", "采购单形式的合同", "工时材料合同", "固定总价合同"], "a": 2, "an": "P496:对于工作规模或产品界定不是特别清楚的项目，并且采用外包的形式。一般采用工时材料合同(工料合同)。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-015", "s": "项目发生索赔事件后，一般先由()依据合同进行调解。", "o": ["政府行政主管部门", "监理工程师", "仲裁委员会", "项目经理"], "a": 1, "an": "P500:合同索赔流程：项目发生索赔事件后，一般先由监理工程师调解，若调解不成，由政府建设主管机构进行调解，若仍调解不成，由经济合同仲裁委员会进行调解或仲裁。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-016", "s": "关于项目采购管理的描述，不正确的是()。", "o": ["对于项目非标准化的采购需求，应使用最低成本法", "在选择供方时应有适当理由才使用，唯一来源法，且应将其视为特殊情况", "项目进度计划会影响规划采购管理过程中，采购策略的制定", "项目章程是规划采购管理过程的输入文件"], "a": 0, "an": "P479,【这个知识点很重要，请大家注意，无论采用那类选择标准，成本都不能超过预算，这是一条隐藏红线】最低成本：适用于标准化或常规采购。此类采购有成熟的实践与标准，有具体明确的预期成果，可以用不同的成本来取得。仅凭资质：适用于采购价值相对较小，不值得花时间和成本开展完整选择过程的情况。买方会确定短名单，", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-017", "s": "关于合同类型的描述，不正确的是()。", "o": ["总承包合同有利于技术力量较强、经验丰富的大承包商发挥专业优势", "分包合同中的工程可以进行二次分包且必须经过发包人同意", "单项工程承包方式有利于吸引较多的承包人参与投标竞争", "总价合同适用于工程量不太大且能精确计算、风险不大的项目"], "a": 1, "an": "P493:订立项目分包合同必须同时满足5个条件：①经过买方认可；②分包的部分必须是项目非主体工作；③只能分包部分项目，而不能转包整个项目；④分包方必须具备相应的资质条件；⑤分包方不能再次分包", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-018", "s": "()是解决所有索赔和争议的首选方法。", "o": ["申诉", "谈判", "起诉", "替代争议解决方法(ADR)"], "a": 1, "an": "P490:索赔管理。谈判是解决所有索赔和争议的首选方法。送分题，答案选B。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-019", "s": "项目外包是承接项目可能采取的方式，但只有()是允许的。", "o": ["部分外包", "整体外包", "主体外包", "层层转包"], "a": 0, "an": "P493:订立项目分包合同必须同时满足5个条件：①经过买方认可；②分包的部分必须是项目非主体工作；③只能分包部分项目，而不能转包整个项目；④分包方必须具备相应的资质条件；⑤分包方不能再次分包", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-020", "s": "关闭合同属于()的内容。", "o": ["规划采购管理", "实施采购", "控制采购", "沟通管理"], "a": 2, "an": "P474,项目采购管理过程包括：*(1)规划采购管理：记录项目采购决策、明确采购方法及识别潜在卖方。*(2)实施采购：获取卖方应答、选择卖方并授予合同。*(3)控制采购：管理采购关系、监督合同绩效、实施必要变更和纠偏，以及关闭合同。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-021", "s": "项目()对规划采购管理过程中的采购策略制定有重要影响。在制订采购管理计划时所做出的决定也会影响项目()。", "o": ["质量计划", "进度计划", "风险计划", "范围计划"], "a": 1, "an": "P475,项目进度计划对规划采购管理过程中的采购策略制定有重要影响。在制订采购管理计划时所做出的决定也会影响项目进度计划。在开展制定进度计划过程、估算活动资源过程以及自制或外购决策制定时，都需要考虑这些决定。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-022", "s": "()向卖方支付为完成工作而发生的全部合法实际成本，除此之外还向卖方支付一笔费用作为卖方的人工费用以及合理的利润。", "o": ["成本加酬金合同", "总价加激励费用合同", "总价加经济价格调整合同", "工料合同"], "a": 0, "an": "P494:成本补偿合同：买方向卖方支付为完成工作而发生的全部合法实际成本(可报销成本),外加一笔费用作为卖方的利润。适用范围：工作范围在开始时无法准确定义，从而需要在以后进行调整；项目工作存在较高的风险。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-023", "s": "与控制采购相关的工作绩效数据不包括()。", "o": ["已向卖方付款的情况", "技术绩效", "商定好的技术标准", "已产生或投入的成本"], "a": 2, "an": "P489:商定好的技术标准应该在规划采购时就要制订好，所以C不正确。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-024", "s": "仅开展一次或仅在项目的预定义时开展的过程是()。", "o": ["规划采购管理", "实施采购", "控制采购", "结束采购"], "a": 0, "an": "P475,注意：结束采购在第四版已经没有了，所以不用考虑规划采购管理：仅开展一次或仅在项目的预定义时开展实施采购：需要在整个项目期间定期开展控制采购：需要在整个项目期间反复开展", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-025", "s": "一般的采购步骤为：①准备采购工作说明书(SOW)或工作大纲(TOR);②准备高层级的成本估算，制定预算；③发布招标广告；④确定合格卖方的名单；⑤准备并发布招标文件；⑥由卖方准备并提交建议书；⑦对建议书开展技术(包括质量)评估；⑧对建议书开展成本评估；⑨准备最终的综合评估报告(包括质量及成本),选出中标建议书；⑩结束谈判，买方和卖方签署合同。其正确的是排序是()。", "o": ["①②③④⑤⑥⑦⑧⑨⑩", "⑤⑥⑦⑧⑨⑩①②③④", "①②③④⑦⑧⑨⑩⑤⑥", "⑧⑨⑩①⑤⑥⑦②③④"], "a": 0, "an": "P475,一般的采购步骤为：①准备采购工作说明书(SOW)或工作大纲(TOR);②准备高层级的成本估算，制定预算；③发布招标广告；④确定合格卖方的名单；⑤准备并发布招标文件；⑥由卖方准备并提交建议书；⑦对建议书开展技术(包括质量)评估；⑧对建议书开展成本评估；⑨准备最终的综合评估报告", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-026", "s": "关于合同的描述不正确的是()。", "o": ["总价合同能使建设单位在评标时易于确定报价最低的承包商", "在成本补偿合同中，承包人承担了项目的大部分风险", "成本补偿合同和工料合同都是开口合同", "在工料合同中，为防止成本失控，可以规定最高价值和时间限制"], "a": 1, "an": "P494:成本补偿合同：在这种合同下，买方的成本风险最大。这种合同适用于买方仅知道要一个什么产品但不知道具体工作范围的情况，也就是工作范围很不清楚的项目。当然，成本补偿合同也适用于买方特别信得过的卖方，想要与卖方全面合作的情况。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-027", "s": "在CPIF 合同下，A公司是卖方，B公司是买方，合同的实际成本大于目标成本时，A公司得到的付款总数是()。", "o": ["目标成本+目标费用-B公司应担负的成本超支", "目标成本+目标费用+A公司应担负的成本超支", "目标成本+目标费用-A公司应担负的成本超支", "目标成本+目标费用+B公司应担负的成本超支"], "a": 3, "an": "P495:成本加激励费用(CPIF),为卖方报销一切合法成本，并在卖方达到合同规定的绩效目标时，向卖方支付预先确定的激励费用。在CPIF合同下：如果实际成本大于目标成本卖方可以得到的付款总数=“目标成本+目标费用+买方应负担的成本超支”如果实际成本小于目标成本卖方可以得到的付款总数=“目标成本+目标费用-买方应享受的成本节约”。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-028", "s": "批准的变更请求是()过程的输入。", "o": ["规划采购管理", "实施采购", "控制采购", "合同变更"], "a": 2, "an": "P489:批准的变更请求可能包括对合同条款和条件的修改，例如，修改采购工作说明书、定价，以及对产品、服务或成果的描述。与采购相关的任何变更，在通过控制采购过程实施之前，都需要以书面形式正式记录，并取得正式批准。在复杂的项目和项目集中，变更请求可能由参与项目的卖方提出，并对参与项目的其他卖方造成影响。项目团队应该有能力识别、沟通和解决会影响多个卖方的工作的变更。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-029", "s": "关于协议/采购合同，不正确的是()。", "o": ["协议可以是合同、服务水平协议(SLA)、谅解备忘录、协议备忘录(MOA)或订购单", "开展国际合作的项目，不用考虑当地文化和法律对合同的影响", "合同或协议需要经过更多的审批程序，而且通常会涉及法务部", "在复杂项目中，可能需要同时或先后管理多个合同"], "a": 1, "an": "P472,开展国际合作的项目经理应牢记，无论合同规定如何详尽，文化和当地法律对合同及其可执行性均有影响", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-030", "s": "对照协议，对质量、资源、进度和成本绩效进行测量、比较和分析，属于控制采购过程的()。", "o": ["绩效审查", "挣值分析", "趋势分析", "审计"], "a": 0, "an": "P490:绩效审查：对照协议，对质量、资源、进度和成本绩效进行测量、比较和分析。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-031", "s": "某项目在招标时被分成若干个项目包，分别发包给不同的承包人，承包人中标后与招标人签订的合同属于()。", "o": ["单项项目承包合同", "分包合同", "单价合同", "成本激励合同"], "a": 0, "an": "P493:项目单项承包合同：一个卖方只承包项目中的某一项或某几项内容，买方分别与不同的卖方订立wo项目niu 单项承包合同。采用项目单项承包合同的方式有利于吸引更多的卖方参与投标竞争，使买方可以选择在某一单项上实力强的卖方。同时也有利于卖方专注于自身经验丰富且技术实力雄厚的部分的建设，但这种方式对于买方的组织管理协调能力提出了较高的要求。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-032", "s": "采购步骤为()。*①准备并发布招标文件*②确定合格卖方的名单*③结束谈判，买方和卖方签署合同*④对建议书开展技术(包括质量)评估*⑤准备采购工作说明书(SOW)*⑥由卖方准备并提交建议书*⑦发布招标广告", "o": ["⑤⑦②①④⑥③", "⑤⑦①⑥②④③", "⑤⑦①⑥④②③", "⑤⑦②①⑥④③"], "a": 3, "an": "P475,采购步骤为：准备采购工作说明书(SOW)或工作大纲(TOR);准备高层级的成本估算，制定预算；发布招标广告；确定合格卖方的名单；准备并发布招标文件；由卖方准备并提交建议书；对建议书开展技术(包括质量)评估；对建议书开展成本评估；准备最终的综合评估报告(包括质量及成本),选出中标建议书；结束谈判，买方和卖方签署合同。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-033", "s": "()是对采购过程的结构化审查。", "o": ["绩效审查", "挣值分析", "趋势分析", "采购审计"], "a": 3, "an": "P490:审计。采购审计是对采购过程的结构化审查。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-034", "s": "在确定项目合同类型时，如果项目工作范围很明确且风险不大，建议使用()。", "o": ["总价合同", "工料合同", "成本补偿合同", "成本加激励费用合同"], "a": 0, "an": "P496:在项目工作中，要根据项目的实际情况和外界条件的约束来选择合同类型：①如果工作范围很明确，且项目的设计已具备详细的细节，则使用总价合同；②如果工作性质清楚，但范围不是很清楚，而且工作不复杂，又需要快速签订合同，则使用工料合同；③如果工作范围尚不清楚，则使用成本补偿合同；④如果双方分担风险，则使用工料合同；如果买方承担成本风险，则使用成本补偿合同；如果卖方承担成本风险，则使用总价合同；⑤如果是购买标准产品，且数量不大，则使用单边合同等。卧浒", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-035", "s": "()场景适宜签署成本补偿合同。*①工作范围尚不清楚；②买方承担成本风险；③购买标准产品且数量不大；④买卖双方已建立了长期稳定的合作关系；⑤项目设计已具备详细的细节；⑥工期短且不复杂的项目", "o": ["①⑤⑥", "①②④", "②③⑤", "③④⑥"], "a": 1, "an": "P494:成本补偿合同在这种合同下，买方的成本风险最大。这种合同适用于买方仅知道要一个什么产品但不知道具体工作范围的情况，也就是工作范围很不清楚的项目。当然，成本补偿合同也适用于买方特别信得过的卖方，想要与卖方全面合作的情况。【蜗牛老师总结】:工作范围不清楚、买方特别信得过的卖方、买方承担成本风险", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-036", "s": "以下说法不正确的是()。", "o": ["对于有多个供应商的较大项目，沟通管理尤为重要", "为了方便管理，采购管理员只能是项目团队成员", "控制采购的质量，包括采购审计的独立性和可信度，是采购系统可靠性的关键决定因素", "在合同收尾前，若双方达成共识，可以根据协议中的变更控制条款，随时对协议进行修改"], "a": 1, "an": "P487:虽然采购管理员可以是项目团队成员，但通常还应向另一部门的合同管理经理报告。", "cm": "采购管理员可以是项目团队成员，也可以是职能部门成员。"}, {"c": 16, "cn": "项目采购管理", "no": "16-037", "s": "以下说法不正确的是()。", "o": ["谈判是解决所有索赔和争议的首选方法", "检查是指买方对承包商的可交付成果进行结构化审查", "审计是对采购过程的结构化审查", "采购文档还包括由卖方编制的技术文件，以及其他工作绩效信息"], "a": 1, "an": "P490:检查是指对承包商正在执行的工作进行结构化审查，可能涉及对可交付成果的简单审查或对工作本身的实地审查。检查包括买方和承包商联合巡检现场。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-038", "s": "SoW的内容通常不包括()。", "o": ["所需数量", "质量水平", "技术方案", "履约期间"], "a": 2, "an": "P480-481,采购工作说明书(SOW)的内容包括：规格、所需数量、质量水平、绩效数据、履约期间、工作地点和其他要求。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-039", "s": "以下关于采购管理的说法中不正确的是()。", "o": ["采购管理员一般直接归属项目经理管辖", "控制采购的质量，包括采购审计的独立性和可信度，是采购系统可靠性的关键决定因素", "在合同收尾前，可以对协议进行修改", "谈判是解决所有索赔和争议的首选方法"], "a": 0, "an": "A不正确，事实上，大部分采购管理员一般都不属于项目经理管辖，而是属于采购部。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-040", "s": "在编制项目采购计划时，根据采购类型的不同，需要不同类型的合同来配合，()包括支付给卖方的实际成本，加上一些通常作为卖方利润的费用。", "o": ["固定总价合同", "成本补偿合同", "工时和材料合同", "单价合同"], "a": 1, "an": "P494:固定总价合同：为既定产品或服务的采购设定一个总价。适用范围：买方必须准确定义要采购的产品或服务。成本补偿合同：买方向卖方支付为完成工作而发生的全部合法实际成本(可报销成本),外加一笔费用作为卖方的利润。适用范围：工作范围在开始时无法准确定义，从而需要在以后进行调整；项目工作存在较高的风险。工时和材料合同：兼具成本补偿合同和总价合同的某些特点的混合型合同。与成本补偿合同的相似之处在于，它们都是开口合同，合同价因成本增加而变化。但是会设定天花板。适用范围：在不能很快编写出准确工作说明书的情况下，经常使用工料合同来增加人员、聘请专家以及寻求其他外部支持。工料合同在金额小、工期短、不复杂的项目上可以有效使用。采购单：订购单，一种简单的固定价格合同。单边合同。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-041", "s": "确定合格供方的名单属于()。", "o": ["规划采购", "实施采购", "控制采购", "识别干系人"], "a": 1, "an": "P483,实施采购的作用：选定合格卖方并签署关于货物或服务交付的法律协议。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-042", "s": "蜗牛在一家系统集成公司做运维项目经理，随着公司业务的扩大，他发现公司现行的备件方式经常在时间和质量上达不到要求，因此他向公司提出了以下合理化建议，其中()不属于项目采购管理过程", "o": ["对关键备件的供应商进行深入调查，对供应商进行分级管理", "对于紧急采购的备件，可以先采购，后进行供方审核评价", "定期盘点库存，将报废的或不再需要的备件及时进行处理", "对于出现货到即损情况的供应商应重点关注，及时重新评定"], "a": 2, "an": "C属于仓库管理工作，不属于采购管理。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-043", "s": "关于项目合同的分类，正确的是()。", "o": ["信息系统工程项目合同通常按照信息系统范围和项目总价划分", "需要立即开展工作的项目不适宜采用成本补偿合同", "工程量大、工期较长、技术复杂的项目宜采用总价合同", "工料合同兼有成本补偿合同和总价合同的特点，适用范围较宽"], "a": 3, "an": "P496:工料合同：工料合同是兼具成本补偿合同和总价合同的某些特点的混合型合同。这类合同与成本补偿合同的相似之处在于它们都是开口合同，合同价因成本增加而变化。按事先确定的单位工时费用标准和单位材料费用标准进行付款。买方承担工作量变动的风险；卖方承担单价风险。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-044", "s": "成本加激励费用合同下，实际成本大于目标成本，卖方可得的付款总数为()。", "o": ["目标成本+目标费用-买方应负担的成本超支", "目标成本+目标费用+买方应负担的成本超支", "目标成本+目标费用+卖方应负担的成本超支", "目标成本+目标费用-卖方应负担的成本超支"], "a": 1, "an": "P495:成本加激励费用(CPIF),为卖方报销一切合法成本，并在卖方达到合同规定的绩效目标时，向卖方支付预先确定的激励费用。在CPIF合同下：如果实际成本大于目标成本卖方可以得到的付款总数=“目标成本+目标费用+买方应负担的成本超支”如果实际成本小于目标成本卖方可以得到的付款总数=“目标成本+目标费用-买方应享受的成本节约”。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-045", "s": "()是获取卖方应答、选择卖方并授予合同的过程。", "o": ["规划采购管理", "实施采购", "控制采购", "结束采购"], "a": 1, "an": "P483,注意：结束采购在第四版已经没有了，所以不用考虑实施采购是获取卖方应答、选择卖方并授予合同的过程。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-046", "s": "某公司准备采购一批设备，附加技术服务。在供方选择时应优先选择()。", "o": ["①②", "③④", "①③", "②④"], "a": 2, "an": "P479,基于质量或技术方案得分：邀请一些组织提交建议书，同时列明技术和成本详情；如果技术建议书可以接受，再邀请它们进行合同谈判。采用此方法，会先对技术建议书进行评估，考察技术方案的质量。如果经过谈判，证明它们的财务建议书是可接受的，那么就会选择技术建议书得分最高的卖方。首先，这题明确说明了需要技术服务，那么应该按基于质量或技术方案得分的方案来选择，所以①选项肯定有。其次在这个方案中有明确说明，如果经过谈判，证明它们的财务建议书是可接受的，也就是说只要在预算范围内就可以接受。②不是很妥当，因为设备成本和服务成本最低的并不一定意味着在预算范围内。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-047", "s": "确保买卖双方履行法律协议，满足项目需求是()过程的主要作用之一。", "o": ["规划采购管理", "实施采购", "控制采购", "结束采购"], "a": 2, "an": "P487,注意：结束采购在第四版已经没有了，所以不用考虑规划采购管理：确定是否从项目外部获取货物和服务，如果是，则还要确定将在什么时间、以什么方式获取什么货物和服务。实施采购：选定合格卖方并签署关于货物或服务交付的法律协议。控制采购：确保买卖双方履行法律协议，满足项目需求。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-048", "s": "关于合同类型的说法中不正确的是()。", "o": ["总承包合同就是只与同一个卖方订立承包合同", "采用总承包合同的方式一般适用于经验丰富、技术实力雄厚且组织管理协调能力强的卖方", "单项承包合同就是买方分别与不同的卖方订立项目单项承包合同", "有时为了方便，分包方可以暂时共用承包商的资质"], "a": 3, "an": "P493:订立项目分包合同必须同时满足5个条件：①经过买方认可；②分包的部分必须是项目非主体工作；③只能分包部分项目，而不能转包整个项目；④分包方必须具备相应的资质条件；⑤分包方不能再次分包", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-049", "s": "在与客户签订合同时，可以增加一些条款，如限定客户提出需求变更的时间，规定何种情况的变更可以接受，拒绝或部分接受，规定发生需求变更时必须执行变更管理流程等内容属于针对需求变更的()。", "o": ["合同管理", "需求基线管理", "文档管理", "过程管理"], "a": 0, "an": "老题目，很有意义。变更方面控制流程的约定应在合同中进行约束，故属于合同管理内容。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-050", "s": "裁剪项目采购管理过程时需要考虑的因素不包括()。", "o": ["采购的复杂性", "物理地点", "治理和法规环境", "资源的可用性"], "a": 3, "an": "P475,裁剪项目采购管理过程时需要考虑因素：采购的复杂性、物理地点、治理和法规环境。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-051", "s": "()为卖方报销履行合同工作所发生的一切合法成本(即成本实报实销),买方再给卖方支付一笔利润，完全由买方根据自己对卖方绩效的主观判断来决定，并且卖方通常无权申诉。", "o": ["总价加激励费用合同", "总价加经济价格调整合同", "成本加固定费用合同", "成本加奖励费用合同"], "a": 3, "an": "P495:成本加奖励费用(CPAF)为卖方报销一切合法成本，方再凭自己的主观感觉给卖方支付一笔利润，完全由买方根据自己对卖方绩效的主观判断来决定奖励费用，并且通常不允许申诉。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-052", "s": "在敏捷或适应型环境中的采购管理可以采用的方法不包括()。", "o": ["与特定卖方进行协作来扩充团队。", "通过主体协议来管理整体协作关系。", "通过频繁的变更来调整采购的方向。", "针对某些可交付成果采用敏捷或适应型方法。"], "a": 2, "an": "P475,在敏捷或适应型环境中，可能需要与特定卖方进行协作来扩充团队。这种协作关系能够营造风险共担式采购模型，让买方和卖方共担项目风险和共享项目收益。在大型项目上，可能针对某些可交付成果采用敏捷或适应型方法，而对其他部分则采用更稳定的方法。在这种情况下，可以通过主体协议，如主要服务协议(MSA)来管理整体协作关系，而将敏捷或适应型工作写入附录或补充文件。这样一来，变更只针对敏捷或适应型工作，而不会对主体协议造成影响。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-053", "s": "在采购规划过程中，需要考虑组织过程资产等一系列因素，以下()不属于采购规划时需要考虑的。", "o": ["立项管理文件", "风险登记册", "采购工作说明书", "干系人登记册"], "a": 2, "an": "P476-478,规划采购的输入：立项管理文件、项目章程、项目管理计划、范围管理计划、质量管理计划、资源管理计划、范围基准、风险登记册、干系人登记册、需求文件、需求跟踪矩阵、里程碑清单、资源需求、项目团队派工单、事业环境因素、组织过程资产。采购工作说明书是规划采购管理的输出", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-054", "s": "买方为卖方报销履行合同工作所发生的一切合法成本，买方再凭自己的主观感觉给卖方支付一笔利润。完全由买方根据自己对卖方绩效的主观绩效的主观判断来决定奖励费用，则双方签订的是()。", "o": ["成本加奖励费用合同", "成本加固定费用合同", "成本加激励费用合同", "总价加激励费用合同"], "a": 0, "an": "P496:成本加奖励费用(CPAF)为卖方报销一切合法成本，方再凭自己的主观感觉给卖方支付一笔利润，完全由买方根据自己对卖方绩效的主观判断来决定奖励费用，并且通常不允许申诉。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-055", "s": "采购文档是采购时用于达成法律协议的各种书面文书，不包括()。", "o": ["供方选择标准", "资金筹措方案", "采购工作说明书", "招标文件"], "a": 1, "an": "P484-485,采购文档可包括：招标文件：包括发给卖方的信息邀请书、建议邀请书、报价邀请书，或其他文件，以便卖方编制应答文件。采购工作说明书：向卖方清晰地说明目标、需求及成果，以便卖方据此做出量化应答。独立成本估算：可由内部或外部人员编制，用于评价投标人提交的建议书的合理性。供方选择标准：描述如何评估投标人的建议书，包括评估标准和权重。为了减轻风险买方可能决定与多个卖方签署协议，以便在单个卖方出问题并影响整体项目时，降低由此导致的损失。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-056", "s": "不属于规划采购管理的输入的是()。", "o": ["风险登记册", "干系人登记册", "需求文件", "采购策略"], "a": 3, "an": "P476-478,采购策略是规划采购管理的输出", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-057", "s": "()不属于实施采购的工具与技术。", "o": ["自制外购分析", "数据分析", "人际关系与团队技能", "广告"], "a": 0, "an": "P485-486,实施采购的工具与技术：1.专家判断；2.广告；3.投标人会议；4.数据分析；5.人际关系与团队技能。自制外购分析是规划采购管理的工具和技术，所以A不正确。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-058", "s": "项目采购是一项复杂的工作，编制详细可行的项目采购计划有助于项目成功。()属于编制项目采购计划所必须考虑的内容。", "o": ["采购工作说明书", "项目范围说明书", "自制/外购决定", "合同收尾规程"], "a": 1, "an": "P477,AC均是规划采购管理的输出，B属于范围基准，是规划采购管理的输入", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-059", "s": "()不属于编制采购计划的输入。", "o": ["项目管理计划", "需求文档", "项目组织过程资产", "项目工作说明书"], "a": 3, "an": "P476-478,规划采购的输入：立项管理文件、项目章程、项目管理计划、范围管理计划、质量管理计划、资源管理计划、范围基准、风险登记册、干系人登记册、需求文件、需求跟踪矩阵、里程碑清单、资源需求、项目团队派工单、事业环境因素、组织过程资产。采购工作说明书是规划采购管理的输出", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-060", "s": "关于实施采购的描述，正确的是()。", "o": ["复杂且高风险的采购在授予卖方合同前要由组织授权管理者审批", "采购管理计划中应包含清晰且详细的采购目标、需求及成果", "实施采购过程主要作用是确保买卖双方履行法律协议，满足项目需求", "实施采购过程的输出包括卖方履行的工作绩效达成情况"], "a": 0, "an": "P486,对于较复杂、高价值和高风险的采购，在授予合同前，要把选定卖方报给组织高级管理人员审批。A正确采购管理计划不是采购工作说明书，其主要内容是决定将如何去管理采购。所以B不正确实施采购是获取卖方应答、选择卖方并授予合同的过程。C不正确卖方履行的工作绩效达成情况是控制采购的输出。D不正确", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-061", "s": "以下不属于规划采购管理的组织过程资产的是()。", "o": ["预先批准的卖方清单", "正式的采购政策", "卖方以往绩效或声誉", "合同类型"], "a": 2, "an": "P477-478,卖方以往绩效或声誉属于事业环境因素。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-062", "s": "以下不属于采购文档的是()。", "o": ["采购工作说明书", "独立成本估算", "供方选择标准", "自制或外购决策"], "a": 3, "an": "P484-485,采购文档可包括：招标文件：包括发给卖方的信息邀请书、建议邀请书、报价邀请书，或其他文件，以便卖方编制应答文件。采购工作说明书：向卖方清晰地说明目标、需求及成果，以便卖方据此做出量化应答。独立成本估算：可由内部或外部人员编制，用于评价投标人提交的建议书的合理性。供方选择标准：描述如何评估投标人的建议书，包括评估标准和权重。为了减轻风险买方可能决定与多个卖方签署协议，以便在单个卖方出问题并影响整体项目时，降低由此导致的损失。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-063", "s": "关于编制采购管理计划过程的描述正确的是()。", "o": ["在进行自制外购分析时，有能力自制的则完全不用考虑外购", "编制采购管理计划时，需要考虑采购工作说明书和干系人登记册", "市场调研包括考察行业情况和具体卖方的能力", "调研充分时，不需要与潜在投标人进行会议交流"], "a": 2, "an": "P478,A一看就不正确。B中的采购工作说明书，是规划采购管理的输出。D不正确。如有需要，是可以在调研时与潜在投标人进行会议交流以获取更多的详细信息。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-064", "s": "实施采购最后的成果是()。", "o": ["选定的卖方", "变更请求", "交付的采购物", "签订的协议"], "a": 3, "an": "P483,实施采购是获取卖方应答、选择卖方并授予合同的过程。本过程的主要作用是，选定合格卖方并签署关于货物或服务交付的法律协议。本过程的最后成果是签订的协议，包括正式合同。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-065", "s": "()不属于规划采购阶段的工具与技术。", "o": ["专家判断", "会议", "广告", "数据分析"], "a": 2, "an": "P478-479,广告属于实施采购的工具和技术", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-066", "s": "关于“自制/外购”分析的描述不正确的是()。", "o": ["有能力自行研制某种产品的情况下也有可能需要外部采购", "决定外购后，需要进一步分析是购买还是租借", "总价合同对进行“自制/外购”分析过程没有影响", "任何预算限制都有可能影响“自制/外购”分析"], "a": 2, "an": "P479,自制或外购分析用于确定某项工作或可交付成果最好是由项目团队自行完成，还是应该从外部采购。制定自制或外购决策时应考虑的因素包括：组织当前的资源配置及其技能和能力，对专业技术的需求，不愿承担永久雇用的义务，以及对独特技术专长的需求；还要评估与每个自制或外购决策相关的风险。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-067", "s": "()适用于标准化或常规采购。此类采购有成熟的实践与标准，有具体明确的预期成果，可以用不同的成本来取得。", "o": ["最低成本", "仅凭资质", "基于质量或技术方案得分", "唯一来源"], "a": 0, "an": "P479,最低成本：适用于标准化或常规采购。此类采购有成熟的实践与标准，有具体明确的预期成果，可以用不同的成本来取得。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-068", "s": "()邀请一些组织提交建议书，同时列明技术和成本详情；如果技术建议书可以接受，再邀请它们进行合同谈判。采用此方法，会先对技术建议书进行评估，考察技术方案的质量。如果经过谈判，证明它们的财务建议书是可接受的，那么就会选择技术建议书得分最高的卖方卧泮。", "o": ["最低成本", "仅凭资质", "基于质量或技术方案得分", "唯一来源"], "a": 2, "an": "P479,基于质量或技术方案得分：邀请一些wo组织 niu提交建议书，同时列明技术和成本详情；如果技术建议书可以接受，再邀请它们进行合同谈判。采用此方法，会先对技术建议书进行评估，考察技术方案的质量。如果经过谈判，证明它们的财务建议书是可接受的，那么就会选择技术建议书得分最高的卖方。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-069", "s": "()买方要求特定卖方准备技术和财务建议书，然后针对建议书开展谈判。由于没有竞争，因此仅在有适当理由时才采用此方法，而且应将其视为特殊情况。", "o": ["最低成本", "仅凭资质", "基于质量或技术方案得分", "唯一来源"], "a": 3, "an": "P479,唯一来源：买方要求特定卖方准备技术和财务建议书，然后针对建议书开展谈判。由于没有竞争，因此仅在有适当理由时才采用此方法，而且应将其视为特殊情况。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-070", "s": "常用于标准化或常规采购的选择方法是()。", "o": ["最低成本", "仅凭资质", "基于质量或技术方案得分", "基于质量和成本"], "a": 0, "an": "P479,最低成本：适用于标准化或常规采购。此类采购有成熟的实践与标准，有具体明确的预期成果，可以用不同的成本来取得。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-071", "s": "按照采购控制程序的规定，在采购合同招标前，由项目部提交采购项目的工作说明书(SOW)。某项目按计划要采购一批笔记本电脑，项目经理给采购部提交了采购文件，主要内容有数量、配置、性能和交货日期。以下叙述正确的是()。", "o": ["项目经理提交的采购文件不是SOW", "该采购文件是SOW,如果符合文件规定和流程，采购部可接受", "只要是项目经理给的采购文件，采购部就可以接受", "只有在项目外包时才有采购工作说明书，物品采购可以不产生SOW"], "a": 1, "an": "P481,项目经理提交的采购文件就是SOW(工作说明书)。所以B正确。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-072", "s": "如果需要卖方提供关于拟采购货物和服务的更多信息，就使用()。", "o": ["信息邀请书", "报价邀请书", "建议邀请书", "招标公告"], "a": 0, "an": "P481,招标文件可以是信息邀请书、报价邀请书、建议邀请书，或其他适当的采购文件。信息邀请书(RFT):如果需要卖方提供关于拟采购货物和服务的更多信息，就使用信息邀请书。随后一般还会使用报价邀请书或建议邀请书。报价邀请书(RFQ):如果需要供应商提供关于将如何满足需求和或将需要多少成本的更多信息，就使用报价邀请书。建议邀请书(RFP):如果项目中出现问题且解决办法难以确定，就使用建议邀请书。这是最正式的“邀请书”文件。采购文件会包括规定的应答格式、相关的采购工作说明书，以及所需的合同条款。", "cm": ""}, {"c": 16, 一些不可预见的事项，包括要求修改或变更合同条款的情况，例如，改变系统的功能、开发进度、成本支付及双方各自承担的责任等。一般在合同订立之后，引起项目范围、合同有关各方权利责任关系变化的事件，均可以看作是合同变更。合同变更指由于一定的法律事实而改变合同的内容的法律行为，具有特征：①项目合同的双方当事人必须协商一致；②改变了合同的内容；③变更的法律后果是将产生新的债权和债务关系。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-079", "s": "以下关于协议/采购合同的说法中不正确的是()。", "o": ["买方可能为最终产品的所有人、分包商、收购机构、服务需求者或购买方", "卖方可以是承包商、供货商、服务提供商或供应商", "在复杂项目中，可能需要同时或先后管理多个合同", "采购中的绩效报告一般不属于协议"], "a": 3, "an": "P486,协议文本的主要内容包括：①采购工作说明书或主要的可交付成果；②进度计划、里程碑，或进度计划中规定的日期；③绩效报告；④定价和支付条款；⑤检查、质量和验收标准：⑥担保和后续产品支持；⑦激励和惩罚；⑧保险和履约保函；⑨下属分包商批准；⑩一般条款和条件：变更请求处理；终止条款和替代争议解决方法等。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-080", "s": "采购文档不包括()。", "o": ["招标文件", "采购工作说明书", "独立成本估算", "采购预算"], "a": 3, "an": "P484-485,采购文档：招标文件：包括发给卖方的信息邀请书、建议邀请书、报价邀请书等。采购工作说明书：明确的采购目标、需求及成果，以便卖方做出量化应答。独立成本估算：可由内部或外部人员编制，用于评价投标人提交的建议书的合理性。供方选择标准：描述如何评估投标人的建议书，包括评估标准和权重。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-081", "s": "当()时，项目不应从外部进行采购。", "o": ["自制成本高于外购", "技术人员能力不足", "与其他项目有资源冲突", "项目有保密要求"], "a": 3, "an": "ABC都可以成为外购的理由，D肯定不行，有保密要求的时候，当遵守保密要求", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-082", "s": "以下关于不同项目合同类型的叙述中，不正确的是()。", "o": ["成本补偿合同也称成本加酬金合同，承包人无成本风险", "总价合同又称固定价格合同，适用于工期短、风险大的项目", "工时和材料合同又称单价合同，是综合了固定价格合同和成本补偿合同两者优点的一种合同类型", "固定单价合同中合同单价一次性明确，固定不变，即不再因为环境的变化和工程量的增减而变化"], "a": 1, "an": "P496:总价合同：工作范围很明确，且项目的设计已具备详细的细节。卖方承担成本风险。买方负责范围变更风险。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-083", "s": "根据供方选择标准，选择最合适的供方属于()阶段的工作。", "o": ["规划采购", "实施采购", "控制采购", "结束采购"], "a": 1, "an": "P486,选定的卖方是实施采购的输出", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-084", "s": "项目()的结果一经管理层确认，将对项目的实际采购活动产生现实性的指导，是项目采购活动的准绳。", "o": ["工作说明书", "自制和外购分析", "范围说明书", "采购计划编制"], "a": 3, "an": "一看到为某某活动提供指导或指南，那么肯定是这个活动领域的管理计划。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-085", "s": "实施采购过程的依据包括()。", "o": ["采购工作说明书", "资源日历", "变更请求", "协议"], "a": 0, "an": "P484-485,BCD均属于实施采购过程的输出，只有A正确", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-086", "s": "以下关于外包和外包管理的叙述中，不正确的是()。", "o": ["外包是为了专注发展企业的核心竞争力，将其它的职能都外包给具有成果和技术优势的第三方供应商(或业务流程外包商)", "将以前内部自行管理的领域外包后，该领域的整体品质有可能会降低", "需要根据合同的承诺跟踪承包商实际完成的情况和成果", "从外包风险管理的角度考虑，应尽可能将项目外包给同一家供应商"], "a": 3, "an": "可以通过将外包工作进行分解，交给不同的外包商实施，通过这种组合方式来降低成本，而不是将项目仅仅外包给一家供应商。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-087", "s": "某公司按总价合同方式约定订购3000米高规格的铜缆，由于建设单位原因，工期暂停了半个月，待恢复施工后，承建单位以近期铜价上涨为理由，要求建设单位赔偿购买电缆增加的费用，并要求适当延长工期，以下说法中，()是正确的。", "o": ["建设单位应该赔偿承建单位采购电缆增加的费用", "监理单位应该保护承建单位的合法利益，因此应该支持承建单位的索赔要求", "索赔是合同双方利益的体现，可以使项目造价更趋于合理", "铜价上涨是承建单位应承担的项目风险，不应该要求赔偿费用"], "a": 3, "an": "老题目，很有意义。索赔管理。由于建设单位原因，工期暂停了半个月，所以要求适当延长工期正确。但是合同采用的是总价合同，所以材料价格上涨风险应当由承建单位负担。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-088", "s": "以下说法不正确的是()。", "o": ["实施采购需要在整个项目期间定期开展", "大多数政府机构都要求公开发布采购广告，或在网上公布拟签署的政府合同的信息", "由于IT行业的专业性壁垒较高，采购谈判应由项目经理和项目管理团队成员主导", "对于较复杂、高价值和高风险的采购，在授予合同前，要把选定卖方报给组织高级管理人员审批"], "a": 2, "an": "P486:谈判应由采购团队中拥有合同签署职权的成员主导。项目经理和项目管理团队的其他成员可以参加谈判并提供必要的协助", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-089", "s": "()的主要作用是，确保买卖双方履行法律协议，满足项目需求。", "o": ["规划采购管理", "实施采购", "控制采购", "结束采购"], "a": 2, "an": "P487,控制采购是管理采购关系、监督合同绩效、实施必要的变更和纠偏，以及关闭合同的过程。本过程的主要作用是，确保买卖双方履行法律协议，满足项目需求。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-090", "s": "评估和选择最佳系统设计方案时，甲认为可以采用点值评估方法，即根据每一个价值因素的重要性，综合打分在选择最佳的方案。乙根据甲的提议，对系统A和系统B进行评估，评估结果如下表所示，那么乙认为()评估因素的重要性系统A系统B评估值评估值硬件40%9080软件40%8085供应商支持20%8090", "o": ["最佳方案是A", "最佳方案是B", "条件不足，不能得出结论", "只能用成本/效益分析方法做出判断"], "a": 2, "an": "老题目，加权算法，也要会", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-091", "s": "关于合同管理的描述，不正确的是()。*①合同管理包括：合同签订管理、合同履行管理、合同变更管理、合同档案管理、合同违约索赔管理*②对于合同中需要变更、转让、解除等内容应有详细说明*③如果合同中有附件，对于附件的内容也应精心准备，当主合同与附件产生矛盾时，以附件为主*④为了使签约各方对合同有一致的理解，合同一律使用行业标准合同*⑤签订合同前应了解相关环境，做出正确的风险分析判断", "o": ["①②", "③④", "②⑤", "①⑤"], "a": 1, "an": "P498:*③错误。如果合同有附件，对于附件的内容也应精心准备，并注意保持与主合同一致，不要相互之间产生矛盾。*④ 错误。对合同中质量条款应具体写清规格、型号、适用的标准等，避免合同订立后因为适用标准是采用国际、国家、地方、行北还是其他标准等问题产生纠纷。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-092", "s": "规划采购管理是记录项目采购决策，(),识别潜在卖方的过程。", "o": ["明确预算成本", "明确采购方法", "明确采购目标", "明确采购质量"], "a": 1, "an": "P475,规划采购管理是记录项目采购决策，明确采购方法，识别潜在卖方的过程。本过程的主要作用是确定是否从项目外部获取货物和服务，如果是，则还要确定将在什么时间、以什么方式获取什么货物和服务。货物和服务可从执行组织的其他部门采购，或者从外部渠道采购。本过程仅开展一次或仅在项目的预定义点开展。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-093", "s": "在选择潜在卖方是，基于既定加权标准对进行卖方打分，则卖方得分()评分项权重评定人1打分评定人2打分评定人3打分技术水平50%232企业资质30%112经验20%322", "o": ["1.9", "2.2", "2", "2.03"], "a": 3, "an": "老题目，加权算法，也要会当前项得分= 当前项打分的平均值*当前项的权重项目得分= 所有项得分之和所以，项目得分=(2+3+2)/3*50?1+1+2)/3*30+(3+2+2)/3*20?.03", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-094", "s": "关于实施采购的说法中不正确的是()。", "o": ["采购谈判应由采购团队中拥有合同签署职权的成员主导", "项目经理和项目管理团队的其他成员可以参加采购谈判并提供必要的协助", "选定的卖方是在建议书评估或投标评估中被判断为最有竞争力的投标人，选定的卖方一定是唯一的", "在授予合同前，要把选定卖方报给组织高级管理人员审批"], "a": 2, "an": "本题是蜗牛老师自己出的题，虽然课本上没有明确说明选定的卖方究竟是唯一还是可以有多个。但是从招投标法中可知，一般评标委员会推荐选定的几个卖方，最后具体是和谁签署，还需要甲方判断，所以，选定的卖方应该是有多个。第二，一个项目中往往有多项采购，每个采购都有不同的选定卖方，所以选定的卖方应该也有多个。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-095", "s": "供方选择标准是以下哪个文件的一个组成部分()。", "o": ["采购工作说明书", "采购文档", "项目章程", "卖方建议书"], "a": 1, "an": "P484-485,采购文档：招标文件：包括发给卖方的信息邀请书、建议邀请书、报价邀请书等。采购工作说明书：明确的采购目标、需求及成果，以便卖方做出量化应答。独立成本估算：可由内部或外部人员编制，用于评价投标人提交的建议书的合理性。供方选择标准：描述如何评估投标人的建议书，包括评估标准和权重。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-096", "s": "()包含用于管理采购过程的完整支持性记录。", "o": ["采购文档", "采购合同", "协议", "采购管理计划"], "a": 0, "an": "P489,采购文档包含用于管理采购过程的完整支持性记录，包括工作说明书、支付信息、承包商工作绩效信息、计划、图纸和其他往来函件。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-097", "s": "合同管理包括()、合同履行管理、合同变更管理、()、合同违约索赔管理。", "o": ["合同签订管理、合同补充管理", "合同规划管理、合同补充管理", "合同签订管理、合同档案管理", "合同规划管理、合同档案管理"], "a": 2, "an": "P497:合同管理包括：合同的签订管理、合同的履行管理、合同的变更管理、合同档案管理和合同违约索赔管理。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-098", "s": "某项目需要在半年内完成，目前项目范围不清楚，所需资源类型可以确定。这种情况下，最好签订()合同。", "o": ["总价", "成本补偿", "工料", "采购单"], "a": 2, "an": "当前项目范围不清楚，所以可以直接排除A和D。B和C之间的区别在于，成本补偿合同需要买方承担风险，适合特别信得过的卖方，而题目中没有提到这个要点，所以本题选C更合适", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-099", "s": "以下一般不属于合同内容的是()。", "o": ["标的内容和范围", "项目的质量要求", "某一个非核心功能模块的具体实现方法", "名词术语解释"], "a": 2, "an": "P496-497:合同内容应包括：(1)项目名称。(2)标的内容和范围。(3)项目的质量要求。(4)项目的计划、进度、地点、地域和方式。(5)项目建设过程中的各种期限。(6)技术情报和资料的保密。(7)风险责任的承担。(8)技术成果的归属。(9)验收的标准和方法。(10)价款、报酬(或使用费)及其支付方式。(11)违约金或者损失赔偿的计算方法。(12)解决争议的方法。(13)名词术语解释。C不正确，核心功能模块倒是有可能会规定需要采用既定的开发方法，但是非核心功能模块的具体实现方法一般不可能在合同中去约定。", "cm": ""}, {"c": 16, "cn": "项目采购管理", "no": "16-100", "s": "在处理索赔的过程中，需要以合同为依据，合同解释非常重要。()原则不属于合同解释的原则。", "o": ["整体解释", "适用法律", "实时纠偏", "公平诚信"], "a": 2, "an": "P501:合同解释原则解释说明主导语言原则如果合同存在两种语言的文本，必须约定哪一种语言是主导语言。当两者不一致时，应该以主导语言文本为准。适用法律原则合同中应该规定以哪个国家的法律作为合同的适用法律，合同的解释必须根据适用法律进行。整体解释原则特殊条件优先于一般条件，具体规定优先于笼统规定，手写条文优先于印刷条文，单价优先于总价，价格的文字表达优先于阿拉伯数字表达，技术规范优先于图纸。公平诚信原则如果按整体解释原则进行解释后仍含糊不清，则可按不利于合同起草一方(一般为买方)的原则进行解释。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-001", "s": "关于干系人管理的描述，不正确的是()。", "o": ["干系人分析在项目立项时进行，以便尽早了解干系人对项目的影响", "识别干系人的方法包含组织相关会议、专家判断、干系人分析等", "干系人分析是系统地收集干系人各种定性和定量信息的一种方法", "典型的项目干系人包含客户、用户、高层领导、项目团队和社会成员等"], "a": 0, "an": "P503,为提高项目成功的概率，尽早开始识别干系人并引导干系人参与。当项目章程被批准、项目经理被委任，以及团队开始组建之后就可以开展相关管理工作。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-002", "s": "某项目经理在编制干系人管理计划，绘制的如下表格是()。干系人不知晓抵制中立支持领导干系人1CD干系人2CD干系人3DC", "o": ["干系人职责分配矩阵", "干系人优先矩阵", "干系人参与矩阵", "干系人亲和图"], "a": 2, "an": "P512,干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较。对干系人参与水平进行分类的方式之一", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-003", "s": "()是通过与干系人进行沟通协作，以满足其需求与期望、处理问题，并促进干系人合理参与的过程。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 2, "an": "P512,管理干系人参与是通过与干系人进行沟通协作，以满足其需求与期望、处理问题，并促进干系人合理参与的过程。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-004", "s": "关于项目干系人管理的描述，正确的是()。", "o": ["识别干系人过程的输出文件包括干系人登记册、工作绩效信息、变更请求", "监管机构、环保人士、媒体与项目关联程度低，不需要纳入干系人管理", "识别干系人参与的过程需要在整个项目期间定期开展", "干系人参与计划是规划干系人参与过程的输入文件"], "a": 2, "an": "P505,A不正确，识别干系人过程的输出文件没有工作绩效信息B不正确，只要是和项目相关的人都需要纳入干系人管理C正确。识别干系人参与的过程需要在整个项目期间定期开展D不正确，干系人参与计划是规划干系人参与过程的输出文件", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-005", "s": "以下关于干系人管理过程的作用不正确的是()。", "o": ["识别干系人过程的主要作用是，使项目团队能够建立对每个干系人或干系人群体的适度关注", "规划干系人参与过程的主要作用是，提供与干系人进行有效互动的可行计划", "管理干系人参与过程的主要作用是，及时向干系人提供相关信息，引导干系人有效参与项目", "监督干系人参与过程的主要作用是，随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果"], "a": 2, "an": "P512,管理干系人参与过程的主要作用是，尽可能提高干系人的支持度，并降低干系人的抵制程度。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-006", "s": "监督干系人参与时，()用于确定干系人群体和个人在项目任何特定时间的状态。", "o": ["根本原因分析", "优先级排序", "职责分配矩阵", "干系人分析"], "a": 3, "an": "P516-517,适用于监督干系人参与过程的数据分析技术主要包括：备选方案分析：在干系人参与效果没有达到期望要求时，应该开展备选方案分析，评估应对偏差的各种备选方案。根本原因分析：开展根本原因分析，确定干系人参与未达预期效果的根本原因。干系人分析：确定干系人群体和个人在项目任何特定时间的状态。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-007", "s": "关于干系人参与度评估矩阵，以下说法，错误的是()。", "o": ["C代表每个干系人的当前参与水平", "D是项目团队评估出来的", "中立型了解项目，会支持项目工作及其成果", "领导型了解项目及其潜在影响，而且积极参与以确保项目取得成功"], "a": 2, "an": "P512,干系人参与度评估矩阵：用于将干系人当前参与水平与期望参与水平进行比较，干系人参与水平可分为如下：*①不了解型：不知道项目及其潜在影响。*②抵制型：知道项目及其潜在影响，但抵制项目工作或成果可能引发的任何变更。*③中立型：了解项目，但既不支持，也不反对。*④支持型：了解项目及其潜在影响，并且会支持项目工作及其成果。*⑤领导型：了解项目及其潜在影响，而且积极参与以确保项目取得成功。C代表每个干系人的当前参与水平，而D是项目团队评估出来的、为确保项目成功所必不可少的参与水平(期望的)。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-008", "s": "()用于获得支持或达成关于支持项目工作或成果的协议。", "o": ["冲突管理", "文化意识", "谈判", "观察和交谈"], "a": 2, "an": "P514,冲突管理：项目经理应确保及时解决冲突。文化意识：有助于项目经理和团队通过考虑文化差异和干系人需求。谈判：用于获得支持或达成关于支持项目工作或成果的协议。观察和交谈：及时了解项目团队成员和其他干系人的工作和态度。政策意识：通过了解项目内外的权力关系，建立政策意识。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-009", "s": "引导干系人参与，以便获取、确认或维持他们对项目成功的持续承诺，属于干系人管理中的那个过程的活动()。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 2, "an": "P513,在管理干系人参与过程中，需要开展多项活动，包括：引导干系人参与，以便获取、确认或维持他们对项目成功的持续承诺；通过谈判和沟通的方式管理干系人期望；处理与干系人管理有关的风险或潜在关注点，预测干系人可能引发的问题；澄清和解决已识别的问题等。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-010", "s": "关于干系人管理，正确的是()。", "o": ["干系人参与计划必须是正式的、详细的项目文件，以确保满足项目的需要", "规划干系人参与过程是管理干系人参与过程的前置流程，不受管理干系人参与过程的影响", "管理干系人参与过程的输出包括变更请求、组织过程资产、事业环境因素", "管理干系人参与过程的主要作用是尽可能提高干系人的支持度、降低抵制程度"], "a": 3, "an": "P512,A不正确，所有的管理计划都可以是正式的，也可以是非正式的B不正确，规划干系人参与需要反复开展，需要根据干系人管理的其它过程反馈来不断地调整计划C不正确，管理干系人参与过程的输出是干系人参与计划，一般来说，事业环境因素肯定不会是输出", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-011", "s": "下列节点可以不用重新开展识别干系人、排列其优先级以及引导其参与项目等相关活动()。", "o": ["项目进入其生命周期的不同阶段", "当前干系人不再与项目工作有关，或者在项目的干系人群体中出现了新的干系人成员", "组织内部或更大领域的干系人群体发生重大变化", "项目成员小王的工作手机号发生了变化"], "a": 3, "an": "P503,应该经常开展识别干系人、排列其优先级以及引导其参与项目等相关活动。至少要在以下时点开展这些活动：◆ 项目进入其生命周期的不同阶段；◆ 当前干系人不再与项目工作有关，或者在项目的干系人群体中出现了新的干系人成员；", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-012", "s": "关于项目干系人管理的描述，不正确的是()。", "o": ["应把干系人满意度作为一个关键项目目标来进行管理", "规划干系人是一个反复的过程，应由项目经理定期开展", "项目干系人管理包含项目需求管理、沟通管理和人力资源管理", "建立沟通管理计划是为管理干系人的期望提供指导和信息"], "a": 2, "an": "P504,项目干系人管理包括识别干系人、规划干系人参与、管理干系人和监督干系人参与。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-013", "s": "识别干系人的依据不包括()。", "o": ["可行性研究报告", "项目章程", "风险登记册", "问题日志"], "a": 2, "an": "P506-507,识别干系人的依据包括：立项管理文件、项目章程、沟通管理计划、干系人参与计划、需求文件、协议、问题日志、变更日志", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-014", "s": "()应作为项目目标加以识别和管理。", "o": ["干系人沟通率", "干系人参与度", "干系人变更数", "干系人满意度"], "a": 3, "an": "P503,干系人满意度应作为项目目标加以识别和管理。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-015", "s": "识别干系人过程()。", "o": ["需要在整个项目期间定期开展", "本过程需要在整个项目期间开展", "仅开展一次", "仅在项目的预定义时开展"], "a": 0, "an": "P505,识别干系人：需要在整个项目期间定期开展", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-016", "s": "以下说法中不正确的是()。", "o": ["为提高项目成功的概率尽早开始识别干系人并引导干系人参与", "当项目管理计划制订后，就可以开始识别干系人工作了", "识别干系人和引导干系人参与的过程需要迭代开展", "当组织内部或更大领域的干系人群体发生重大变化时，需要重新识别干系人"], "a": 1, "an": "P506,首次识别干系人时还没有项目管理计划，之后识别干系人时，可以参考项目管理计划里的沟通计划等因素。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-017", "s": "()有助于项目经理和团队通过考虑文化差异和干系人需求。", "o": ["冲突管理", "文化意识", "谈判", "观察和交谈"], "a": 1, "an": "P514,冲突管理：项目经理应确保及时解决冲突。文化意识：有助于项目经理和团队通过考虑文化差异和干系人需求。谈判：用于获得支持或达成关于支持项目工作或成果的协议。观察和交谈：及时了解项目团队成员和其他干系人的工作和态度。政策意识：通过了解项目内外的权力关系，建立政策意识。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-018", "s": "()及时了解项目团队成员和其他干系人的工作和态度。", "o": ["冲突管理", "文化意识", "谈判", "观察和交谈"], "a": 3, "an": "P514,冲突管理：项目经理应确保及时解决冲突。文化意识：有助于项目经理和团队通过考虑文化差异和干系人需求。谈判：用于获得支持或达成关于支持项目工作或成果的协议。观察和交谈：及时了解项目团队成员和其他干系人的工作和态度。政策意识：通过了解项目内外的权力关系，建立政策意识。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-019", "s": "干系人对项目的影响能力通常在项目()阶段最大。", "o": ["启动", "规划", "执行", "收尾"], "a": 0, "an": "老题目，有参考意义。干系人对项目的影响能力通常在项目启动阶段最大，而后随着项目进展逐渐降低。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-020", "s": "()是方格模型的改良形式。把方格中的要素组合成三维模型，作为一个多维模型，它将干系人视为一个多维实体，便于分析，从而有助于沟通策略的制定。", "o": ["权利/利益方格", "干系人立方体", "凸显模型", "影响/作用方格"], "a": 1, "an": "P508,干系人立方体：权力利益方格模型的改良形式。立方体把上述方格中的要素组合成三维模型，项目经理和团队可据此分析干系人并引导干系人参与项目。作为一个多维模型，它将干系人视为一个多维实体，便于分析，从而有助于沟通策略的制定。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-021", "s": "()过程的主要作用之一是，尽可能提高干系人的支持度，并降低干系人的抵制程度。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 2, "an": "P512,管理干系人参与：尽可能提高干系人的支持度，并降低干系人的抵制程度。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-022", "s": "头脑风暴是一种通用的数据收集和创意技术；()是头脑风暴的改良形式。", "o": ["思维导图", "亲和图", "焦点小组", "头脑写作"], "a": 3, "an": "P507,头脑风暴：用于识别干系人的头脑风暴技术包括头脑风暴和头脑写作。头脑风暴是一种通用的数据收集和创意技术；头脑写作是头脑风暴的改良形式。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-023", "s": "使用()来跟踪每个干系人参与水平的变化，对干系人参与加以监督。", "o": ["干系人分析", "备选方案分析", "干系人参与计划", "干系人参与度评估矩阵"], "a": 3, "an": "P517,适用于监督干系人参与过程的数据表现技术主要是干系人参与度评估矩阵。使用干系人参与度评估矩阵来跟踪每个干系人参与水平的变化，对干系人参与加以监督。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-024", "s": "根据干系人的权力、紧迫度和合法性对干系人进行分类的是()。", "o": ["凸显模型", "影响/作用方格", "权利/利益方格", "权利/影响方格"], "a": 0, "an": "P508:凸显模型：通过评估干系人的权力、紧迫性和合法性(参与的适当性),对干系人进行分类。在凸显模型中，也可以用邻近性取代合法性。适用于复杂的干系人大型群体。凸显模型可用于确定已识别干系人的相对重要性。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-025", "s": "以下不属于项目干系人的是()。", "o": ["监管机构", "供应商", "实际用户", "软考办"], "a": 3, "an": "P503,当前新技术快速发展，“干系人”一词的外延正在扩大，从传统意义上的员工、供应商和高层管理者扩展到涵盖各式群体，包括监管机构、环保人士、金融组织、媒体，以及那些自认为是干系人的人员(他们认为自己会受项目工作或成果的影响)。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-026", "s": "监督干系人参与过程的作用是()。", "o": ["维持或提升干系人参与活动的效率和效果", "提高干系人对项目的支持度，并尽可能降低干系人对项目的抵制", "提供与干系人进行有效互动的可行计划", "项目团队能够建立对每个干系人或干系人群体的适度关注"], "a": 0, "an": "P515,监督干系人参与：随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-027", "s": "以下关于项目干系人管理的发展趋势和新兴实践说法不正确的是()。", "o": ["识别所有干系人，而非在限定范围内。", "确保所有团队成员都涉及引导干系人参与的活动。", "定期审查干系人群体，需要与整体项目风险的审查工作并行开展。", "关注干系人有效参与程度的正面与负面价值。"], "a": 2, "an": "P503-504,项目干系人管理的发展趋势和新兴实践主要包括：● 识别所有干系人，而非在限定范围内。● 确保所有团队成员都涉及引导干系人参与的活动。● 定期审查干系人群体，可与单个项目风险的审查工作并行开展。● 应用“共创”概念，咨询受项目工作或成果影响最大的干系人，视其为合作伙伴。● 关注干系人有效参与程度的正面与负面价值。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-028", "s": "关于识别干系人过程的描述，不正确的是()。", "o": ["干系人登记册是识别干系人过程的主要输出记录与识别关系人的信息", "变更日志、问题日志、需求文件可以作为识别干系人过程的输入", "对干系人进行分类的方法，包括权力利益方格、因果图、回归分析、凸显模型等", "识别干系人的主要作用是使项目团队能够建立对每个干系人或干系人群体的适度关注"], "a": 2, "an": "P507-508,因果图，回归分析均不属于干系人分类方法", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-029", "s": "根据干系人管理的权力/利益方格，对于项目建设方主管领导应该()。", "o": ["令其满意", "重点管理", "监督", "随时告知"], "a": 1, "an": "P508:虽然这个知识点课本没有，但是它会考，而且经常考。重点关注：权利大，利益大的干系人令其满意：权利大，利益小的干系人随时告知：权利小，利益大的干系人监督伙花较少精力：权利小，利益小的干系人项目建设方主管领导权利很大、对项目结果也很关注，要重点管理。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-030", "s": "识别项目干系人管理过程在()可以重复开展。*①每个阶段开始时；②项目出现重大变化时；③进行可行性研究时；④组织出现重大变化时；⑤编制项目章程时", "o": ["③④⑤", "①②③", "②③④", "①②④"], "a": 3, "an": "P505:识别干系人管理过程通常在编制和批准项目章程之前或同时首次开展，之后在项目生命周期过程中必要时重复开展，至少应在每个阶段开始时，以及项目或组织出现重大变化时重复开展。每次重复开展识别干系人管理过程，都应通过查阅项目管理计划组件及项目文件，来识别有关的项目干系人。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-031", "s": "随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果，属于()过程的主要作用。", "o": ["识别干系人", "规划干系人参与", "管理干系人参与", "监督干系人参与"], "a": 3, "an": "P515,监督干系人参与：随着项目进展和环境变化，维持或提升干系人参与活动的效率和效果。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-032", "s": "()用于确保发送给干系人的信息被接收和理解。", "o": ["反馈", "演示", "积极倾听", "领导力"], "a": 0, "an": "P517,反馈：用于确保发送给干系人的信息被接收和理解。演示：为干系人提供清晰的信息。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-033", "s": "()是通过干系人的权力、紧迫性、合法性对干系人进行分类。", "o": ["凸显模型", "权力利益方格", "干系人立方体", "影响方向"], "a": 0, "an": "P508,凸显模型是通过干系人的权力、紧迫性、合法性对干系人进行分类。", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-034", "s": "关于干系人参与计划的描述，不正确的是()。", "o": ["干系人参与计划是项目管理计划的组成部分", "干系人参与计划基于项目的需要和干系人的期望而制定", "干系人参与计划是识别干系人过程的输出", "干系人参与计划制订了干系人有效参与和执行项目决策的策略和行动"], "a": 2, "an": "P512,干系人参与计划是规划干系人参与过程的输出", "cm": ""}, {"c": 17, "cn": "项目干系人管理", "no": "17-035", "s": "在权利/利益方格中，针对“权力小、对项目结果关注度高”的干系人，应该采取的策略是()。", "o": ["重点管理", "花最少的精力监督", "令其满意", "随时告知"], "a": 3, "an": "P50
