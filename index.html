": ""}, {"c": 1, "cn": "信息化发展", "no": "1-093", "s": "产业数字化是指在新一代数字科技支撑和引领下，以()为关键要素，以()为核心，以()为主线，对产业链上下游的全要素数字化升级、转型和再造的过程。", "o": ["价值释放、数据赋能、数据", "数据、价值释放、数据赋能", "数据赋能、数据、价值释放", "价值释放、数据、数据赋能"], "a": 1, "an": "产业数字化是指在新一代数字科技支撑和引领下，以数据为关键要素，以价值释放为核心，蜗牛老师以数据赋能为主线，对产业链上下游的全要素数字化升级、转型和再造的过程。产业数字化作", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-094", "s": "下列不属于信息基础设施的是()。", "o": ["通信网络基础设施", "新技术基础设施", "算力基础设施", "重大科技基础设施"], "a": 3, "an": "新型基础设施主要包括如下三个方面。信息基础设施。信息基础设施主要指基于新一代信息技术演化生成的基础设施。信息基础设施包括：", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-095", "s": "融合基础设施包括()。①智能交通基础设施；②算力基础设施；③科教基础设施；④智慧能源基础设施", "o": ["①②", "②③", "①④", "②④"], "a": 2, "an": "融合基础设施主要指深度应用互联网、大数据、人工智能等技术，支撑传统基础设施转型升级，进而形成的融合基础设施。融合基础设施包括智能交通基础设施、智慧能源基础设施等。融合基础设施重在“应用新”", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-096", "s": "产业数字化具有的典型特征包括：以()变革生产工具；以()资源为关键生产要素；以数字内容重构产品结构；以()为市场配置纽带；以服务平台为产业生态载体；以数字善治为发展机制条件。", "o": ["数字科技、数据、信息网络", "数据、服务平台、信息网络", "信息网络、数字科技、数据", "数据、数字科技、信息网络"], "a": 0, "an": "产业数字化具有的典型特征包括：以数字科技变革生产工具；以数据资源为关键生产要素；以数字内容重构产品结构；以信息网络为市场配置纽带；以服务平台为产业生态载体；以数字善治为发展机制条件", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-097", "s": "()以“信息技术+治理”为典型特征的技管结合，以及数字化公共服务。", "o": ["产业智能化", "产业数字化", "数字云", "数字化治理"], "a": 3, "an": "数字化治理通常指依托互联网、大数据、人工智能等技术和应用，创新社会治理方法与手段，优化社会治理模式，推进社会治理的科学化、精细化、高效化，助力社会治理现代化。数字化治理是数字经济的组成部分之一，包括但不限于多元治理，以“信息技术+治理”为典型特征的技管结合，以及数字化公共服务等", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-098", "s": "以下关于数据价值化的“三化”框架，说法正确的是()。", "o": ["数据资产化：是使无序、混乱的原始数据成为有序、有使用价值的数据资源", "数据资产化：主要包括两种方式，数据信贷融资与数据证券化", "数据资产化：是数据通过流通交易给使用者或者所有者带来的经济利益的过程。数据资产化是实现数据价值的核心，其本质是形成数据交换价值，初步实现数据价值的过程", "数据资本化：是使无序、混乱的原始数据成为有序、有使用价值的数据资源"], "a": 2, "an": "数据价值化是指以数据资源化为起点，经历数据资产化、数据资本化阶段，实现数据价值化的经济过程。上述三个要素构成数据价值化的“三化”框架，即数据资源化、数据资产化、数据资本化，细", "cm": ""}, {"c": 1, "cn": "信息化发展", "no": "1-099", "s": "不属于新型基础设施建设发展重点的是()。", "o": ["强化数字转型、智能升级、融合创新支撑，布局建设信息基础设施、融合基础设施、创新基础设施等新型基础设施", "建设泛在智联的数字基础设施体系，建立高效利用的数据要素资源体系", "建设高速泛在、天地一体、集成互联、安全高效的信息基础设施，增强数据感知、传输、存储和运算能力", "扩容骨干网互联节点，新设一批国际通信出入口，全面 "], "a": 0, "an": "人工智能技术研究方面主要聚焦在热点技术、共性技术和新兴技术三个方面", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-065", "s": "以下网络存储模式中，真正实现即插即用的是()。", "o": ["DAS", "NAS", "open SAN", "智能化 SAN"], "a": 1, "an": "可见真正实现即插即用的是NAS", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-066", "s": "以下不属于自然语言处理的主要应用的是()。", "o": ["舆情监测", "文本分类", "人脸识别", "语音识别"], "a": 2, "an": "自然语言处理主要应用于机器翻译、舆情监测、自动摘要、观点提取、文本分类、问题回答、", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-067", "s": "在下列应用场景中，属于SaaS(软件即服务)模式的是()。", "o": ["供应商通过Internet 提供软件，消费者从供应商处租用基于Web的软件来管理企业经营活动", "供应商开拓新的IT基础设施业务，消费者通过Internet 从计算机基础设施获得服务", "消费者从供应商处购买软件的License", "消费者从互联网下载和使用免费软件"], "a": 0, "an": "按照云计算服务提供的资源层次，可以分为IaaS、PaaS和 SaaS三种服务类型。IaaS(基础设施即服务),向用户提供计算机能力、存储空间等基础设施方面的服务。IaaS服务单纯出租资源，盈利能力有限。【仅仅提供了一个场所】PaaS(平台即服务),向用户提供虚拟的操作系统、数据库管理系统、Web应用等平台化的服务。PaaS 服务的重点不在于直接的经济效益，而更注重构建和形成紧密的产业生态。【不光提供了场所，还提供了配套的生产设备】SaaS(软件即服务),向用户提供应用软件(如CRM、办公软件等)、组件、工作流等虚拟化软件的服务，SaaS向用户提供多租户、可定制的应用能力，使软件提供商从软件产品的生产者转变为应用服务的运营者。【直接提供做好了的产品给你】", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-068", "s": "()是利用公开密钥进行加密的技术。", "o": ["AES", "IDEA", "DES", "RSA"], "a": 3, "an": "1978年美国麻省理工学院的三名密码学者R.L.Rivest,A、Shamir和L.Adlelnan 提出了一种基于大合数因子分解困难性的公开密钥密码，简称为RSA密码。由于RSA密码，既可用于加密，又可用于数字签名，安全、易懂，因此RSA密码已成为目前应用最广泛的公开密钥密码。公开密钥密码有基于大合数因子分解困难性的 RAS 密码类和基于离散对数问题困难性的 ELGamal 密码类。RSA属于非对称加密技术，利用RSA密码可以同时实现数字签名和数据加密。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-069", "s": "以下关于人工智能的说法，错误的是()。", "o": ["人工智能的关键技术主要涉及机器学习、自然语言处理、专家系统等技术", "机器学习是一种自动将模型与数据匹配，并通过训练模型对数据进行“学习”的技术。机器学习的研究主要聚焦在机器学习算法及应用、强化学习算法、近似及优化算法和规划问题等方面。神经网络是机器学习的一种形式", "专家系统是一个智能计算机程序系统，通常由人机交互界面、知识库、推理机、解释器、综合数据库、知识获取等6个部分构成", "自然语言处理就是一般地研究自然语言"], "a": 3, "an": "自然语言处理并不是一般地研究自然语言，而在于研制能有效地使用自然语言通信的计算机", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-070", "s": "信息必须依赖其存储、传输、处理及应用的载体(媒介)而存在。信息系统安全可以划分设备安全、数据安全、内容安全和()。", "o": ["行为安全", "通信安全", "主机安全", "信息安全"], "a": 0, "an": "信息系统安全可以划分为以下四个层次：设备安全、数据安全、内容安全、行为安全。其中数据安全即是传统的信息安全。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-071", "s": "大数据是具有体量大、结构多样、时效性强等特征的数据，下面的那个单位体量最大()。", "o": ["TB", "PB", "ZB", "EB"], "a": 2, "an": "大数据的数据体量巨大，从TB级别跃升到PB级别(1PB=1024TB)、EB级别(1EB=1024PB),甚至达到ZB级别(1ZB=1024EB)。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-072", "s": "A公司是一家云服务提供商，向用户提供老租户可定制的办公软件和客户关系管理软件，A公司所提供的此项云服务属于()服务类型。", "o": ["IaaS", "PaaS", "Saas", "DaaS"], "a": 2, "an": "按照云计算服务提供的资源层次，可以分为IaaS、PaaS和SaaS三种服务类型。IaaS(基础设施即服务),向用户提供计算机能力、存储空间等基础设施方面的服务。IaaS服务单纯出租资源，盈利能力有限。【仅仅提供了一个场所】PaaS(平台即服务),向用户提供虚拟的操作系统、数据库管理系统、Web应用等平台化的服务。PaaS 服务的重点不在于直接的经济效益，而更注重构建和形成紧密的产业生态。【不光提供了场所，还提供了配套的生产设备】SaaS(软件即服务),向用户提供应用软件(如CRM、办公软件等)、组件、工作流等虚拟化软件的服务，SaaS向用户提供多租户、可定制的应用能力，使软件提供商从软件产品的生产者转变为应用服务的运营者。【直接提供做好了的产品给你】", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-073", "s": "以下关于信息安全的说法中错误的是()。", "o": ["信息系统安全可以划分为：设备安全、数据安全、内容安全、行为安全", "发信者将明文数据加密成密文，称为加密过程。收信者将密文恢复成明文，称为解密过程", "在对称密钥体制，加密密钥和解密密钥相同", "在非对称加密解密中，公众利用私钥发送加密后的密文给收信者，收信者利用公钥进行解密"], "a": 3, "an": "在非对称加密解密中，公众利用公钥发送加密后的密文给收信者，收信者利用私钥进行解密。大家一定要记住，公钥是公开的，公众都知道，但是私钥只能收信者一人拥有，不公开", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-074", "s": "关于信息安全的描述正确的是()。", "o": ["网络安全技术主要包括：熊猫烧香、入侵检测与防护、VPN、安全扫描、网络蜜罐技术、用户和实体行为分析技术等", "为了保证信息的保密性，就需要采用信息加密技术对信息进行伪装，使得信息非法窃取者无法理解信息的真实含义(暗号)", "加密技术包括两个元素：公钥和密钥", "密钥加密技术的密码体制分为对称密钥体制和非对称密钥体制两种"], "a": 3, "an": "网络安全技术主要包括：防火墙、入侵检测与防护VPN、安全扫描、网络蜜罐技术、用户和实体行为分析技术等。为了保证信息的安全性，就需要采用信息加密技术对信息进行伪装，使得信息非法窃取者无法理解信息的真实含义(暗号)。加密技术包括两个元素算法和密钥", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-075", "s": "以下关于大数据的说法中，错误的是()。", "o": ["大数据主要特征包括：数据海量、数据类型多样、数据价值密度高、数据处理速度快", "大数据技术架构主要包含大数据获取技术、分布式数据处理技术和大数据管理技术，以及大数据应用和服务技术", "大数据获取的研究主要集中在数据采集、整合和清洗三个方面", "大数据应用和服务技术：主要包含分析应用技术和可视化技术"], "a": 0, "an": "大数据主要特征包括：数据海量、数据类型多样、数据价值密度低、数据处理速度快", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-076", "s": "关于网络存储技术的描述，正确的是()。", "o": ["DAS是一种易于扩展的存储枝术", "NAS系统与DAS系统相同，都没有自己的文件系统", "NAS可以使用TCP/IP作为其网络传输协议", "SAN采用了文件共享存取方式"], "a": 2, "an": "直接附加存储 DAS存储操作依赖于服务器，DAS方式很难扩展，DAS基本上已经被NAS所代替网络附加存储 NAS通过网络接口与网络直接相连，NAS的性能特点是进行小文件级的共享存取，NAS存储支持即插即用，NAS可以很经济地解决存储容量不足的问题，但难以获得满意的性能FC SAN 高速，专用，可靠，有两个较大的缺陷，分别是成本和复杂性存储区域网络【掌握】通过专用高速网将一个或多个网络存储设备和服务器连接起来的专用存储系统。它没有采用文件共享存取方式，而是采用块(block)级别存储IP SAN是基于IP网络实现数据块级别存储方式的存储网络。设备成本低，配置技术简单，可共享和使用大容量的存储空间。使用最广IB SAN结构紧密，系统的性能、可靠性和有效性高，能缓解各硬件设备之间的数据流量拥塞。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-077", "s": "关于网络存储技术的描述，不正确的是()。", "o": ["当存储容量增加时，采用直接附加存储(DAS)方式很难扩容", "网络附加存储(NAS)支持即插即用，可经济地解决存储容量不足的问题", "光纤通道存储区域网络(FCSAN)相对成本较低，配置简单", "网际协议存储区域网络(IPSAN)设备成本低，可共享和使用大容量存储空间"], "a": 2, "an": "直接附加存储DAS存储操作依赖于服务器，DAS方式很难扩展，DAS基本上已经被NAS所代替网络附加存储NAS通过网络接口与网络直接相连，NAS的性能特点是进行小文件级的共享存取，NAS存储支持即插即用，NAS可以很经济地解决存储容量不足的问题，但难以获得满意的性能FC SAN 高速，专用，可靠，有两个较大的缺陷，分别是成本和复杂性存储区域网络【掌握】通过专用高速网将一个或多个网络存储设备和服务器连接起来的专用存储系统。它没有采用文件共享存取方式，而是采用块(block)级别存储IP SAN是基于IP网络实现数据块级别存储方式的存储网络。设备成本低，配置技术简单，可共享和使用大容量的存储空间。使用最广IB SAN 结构紧密，系统的性能、可靠性和有效性高，能缓解各硬件设备之间的数据流量拥塞。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-078", "s": "下列主流的分布式计算系统中，常用于离线的快速的大数据处理的是()。", "o": ["Hadoop", "Spark", "Storm", "Map Reduce"], "a": 1, "an": "主流的分布式计算系统有Hadoop、Spark和 Storm。Hadoop常用于离线的复杂的大数据处理Spark常用于离线的快速的大数据处理Storm常用于在线的实时的大数据处理", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-079", "s": "关于存储技术的描述不正确的是()。", "o": ["开放系统的存储分为：内置存储和外挂存储", "外挂存储根据连接的方式分为封闭系统的存储和开放系统的存储", "存储虚拟化是“云存储”的核心技术之一", "绿色存储技术是指从节能环保的角度出发，用来设计生产能效更佳的存储产品，降低数据存储设备的功耗，提高存储设备每瓦性能的技术"], "a": 1, "an": "外挂存储根据连接的方式分为直连式存储(DAS)和网络化存储(FAS)。存储分类根据服务器类型分为：封闭系统的存储和开放系统的存储", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-080", "s": "在大数据关键技术中，Hadoop的分布式文件系统HDFS属于大数据()。", "o": ["存储技术", "分析技术", "并行分析技术", "挖掘技术"], "a": 0, "an": "HDFS是分布式计算中数据存储管理的基础，所以选A", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-081", "s": "网络安全态势感知在()的基础上，进行数据整合，特征提取等，应用一系列态势评估算法，生成网络的整体态势情况。", "o": ["安全应用软件", "安全基础设施", "安全网络环境", "安全大数据"], "a": 3, "an": "网络安全态势感知是在大规模网络环境中阿牛，对能够引起网络态势发生变化的安全要素进行获取、理解、显示，并据此预测未来的网络安全发展趋势。安全态势感知不仅是一种安全技术，也是一种新兴的安全概念。它是一种基于环境的、动态的、整体的洞悉安全风险的能力。安全态势感知的前提是安全大数据，其在安全大数据的基础上进行数据整合、特征提取等，然后应用一系列态势评估算法生成网络的整体态势状况，应用态势预测算法预测态势的发展状况，并使用数据可视化技术，将态势状况和预测情况展示给安全人员，方便安全人员直观便捷地了解网络当前状态及预期的风险。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-082", "s": "以下关于存储的内容，说法错误的是()。", "o": ["开放系统的存储分为：内置存储和外挂存储。外挂存储根据连接的方式分为直连式存储(DAS)和网络化存储(FAS)。网络化存储根据传输协议又分为网络接入存储(NAS)和存储区域网络(SAN)", "存储虚拟化是“云存储”的核心技术之一，它把来自一个或多个网络的存储资源整合起来，向用户提供一个抽象的逻辑视图，用户可以通过这个视图中的统一逻辑接口来访问被整合的存储资源。用户在访问数据时并不知道真实的物理位置", "绿色存储技术是指从节能环保的角度出发，用来设计生产能效更佳的存储产品，降低数据存储设备的功耗，提高存储设备每瓦性能的技术", "DAS容量扩充能力高"], "a": 3, "an": "DAS容量扩充能力低", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-083", "s": "以下关于数据结构模型的说法中错误的是()。", "o": ["常见的数据结构模型有三种：层次模型、网状模型和关系模型，网状模型和关系模型又统称为格式化数据模型", "一个层次模型在理论上可以包含任意有限个记录类型和字段", "网状数据库是导航式(Navigation)数据库，用户在操作数据库时不但说明要做什么,还要说明怎么做", "关系模型是在关系结构的数据库中用二维表格的形式表示实体以及实体之间的联系的模型"], "a": 0, "an": "常见的数据结构模型有三种：层次模型、网状模型和关系模型，层次模型和网状模型又统称为格式化数据模型", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-084", "s": "以下关于数据结构模型的说法中错误的是()。", "o": ["数据结构模型是数据库系统的核心", "在层次模型中，同一双亲的子女结点称为兄弟结点，没有子女结点的结点称为叶结点", "网状模型是一种可以灵活地描述事物及其之间关系的数据库模型", "关系模型是采用键值对结构表达实体类型及实体间联系的数据模型"], "a": 3, "an": "关系模型是采用二维表格结构表达实体类型及实体间联系的数据模型", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-085", "s": "以下关于数据库的说法中错误的是()。", "o": ["数据库根据存储方式可以分为关系型数据库(SQL)和非关系型数据库(No SQL)", "事务处理的四种原则是原子性、一致性、隔离性、持久性", "非关系型数据库是分布式的，也遵循ACID原则", "关系数据库系统采用关系模型作为数据的组织方式"], "a": 2, "an": "非关系型数据库是分布式的、非关系型的、不保证遵循ACID原则的数据存储系统。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-086", "s": "关于数据库的描述正确的是()。", "o": ["数字化结构模型是数据库系统的核心", "常见的数据结构模型有三种：层次模型、网状模型和数据模型", "层次模型和关系模型又统称为格式化数据模型", "层次模型是数据库系统最早使用的一种模型，它用“树”结构表示实体集之间的关联"], "a": 3, "an": "数据结构模型是数据库系统的核心。A错误。常见的数据结构模型有三种：层次模型、网状模型和关系模型，层次模型和网状模型又统称为格式化数据模型。B错误。层次模型和网状模型又统称为格式化数据模型。C错误。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-087", "s": "以下说法中，错误的是()。", "o": ["常见的数据结构模型有三种：层次模型、网状模型和关系模型", "关系模型是在关系结构的数据库中用二维表格的形式表示实体以及实体之间的联系的模型", "数据库根据存储方式可以分为关系型数据库(SQL)和非关系型数据库(Not Only SQL,No SQL)", "数据仓库是一个面向主题的、集成的、非易失的且随时间变化的数据集合，用于支持实时业务"], "a": 3, "an": "数据仓库是一个面向主题的、集成的、非易失的且随时间变化的数据集合，用于支持管理决策。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-088", "s": "以下关于数据库的说法中错误的是()。", "o": ["常见的非关系数据库分为：键值数据库、列存储数据库、面向文档数据库、图形数据库", "关系型数 c": 2, "cn": "信息技术发展", "no": "2-103", "s": "()向用户提供虚拟的操作系统、数据库管理系等服务，满是户个性化的应用部署需求。", "o": ["SaaS", "PaaS", "IaaS1", "DaaS"], "a": 1, "an": "按照云计算服务提供的资源层次，可以分为IaaS、PaaS和SaaS三种服务类型。IaaS(基础设施即服务),向用户提供计算机能力、存储空间等基础设施方面的服务。IaaS服务单纯出租资源，盈利能力有限。【仅仅提供了一个场所】PaaS(平台即服务),向用户提供虚拟的操作系统、数据库管理系统、Web 应用等平台化的服务。PaaS 服务的重点不在于直接的经济效益，而更注重构建和形成紧密的产业生态。【不光提供了场所，还提供了配套的生产设备】SaaS(软件即服务),向用户提供应用软件(如 CRM、办公软件等)、组件、工作流等虚拟化软件的服务，SaaS向用户提供多租户、可定制的应用能力，使软件提供商从软件产品的生产者转变为应用服务的运营者。【直接提供做好了的产品给你】", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-104", "s": "关于区块链的描述，不正确的是()。", "o": ["区块链的共识机制可有效防止记账节点信息被篡改", "区块链可在不可信的同络进行可信的信息交换", "存储在区块链的交易信息是高度加密的", "区块链是一个分布式共享账本和数据库"], "a": 2, "an": "区块链阿牛是一个分布式的共享账本和数据库，具有去中心化、不可篡改、全程留痕、可以追溯、集体 维护、公开透明等特点。存储在区块链上的交易信息是公开的，但是账户身份信息是高度加密的，只有在数据拥有者授权的情况下才能访问到，从而保证了数据的安全和个人的隐私。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-105", "s": "微信中语音转换为文字的功能，主要应用了()技术。", "o": ["虚拟现实", "专家系统", "自然语言处理", "大数据"], "a": 2, "an": "P67:自然语言处理主要应用于机器翻译、舆情监测、自动摘要、观点提取、文本分类、问题回答、文本语义对比、语音识别、中文OCR 等方面。所以，C正确。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-106", "s": "百度大语言模型“文心一言”的核心技术是()。", "o": ["大数据", "NLP", "专家系统", "云计算"], "a": 1, "an": "自然语言处理NLP研究能实现人与计算机之间用自然语言进行有效通信的各种理论和方法。自然语言处理主要应用于机器翻译、舆情监测、自动摘要、观点提取、文本分类、问题回答、文本语义对比、语音识别、中文OCR等方面。文心一言的核心技术之一是自然语言处理(NLP)。NLP是一种让计算机理解和处理人类语言的技术。通过NLP,文心一言能够准确地识别用户的意图，从而提供精准的回答和建议。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-107", "s": "()是通过多等级的特征和变量来预测结果的神经网络模型，它使用一种称为反向传播的技术，通过模型进行预测或对输出进行分类。", "o": ["神经网络", "深度学习", "强化学习", "机器学习"], "a": 1, "an": "神经网络：是机器学习的一种形式，它根据输入、输出、变量权重或将输入与输出关联的\"特征\"来分析问题。它类似于神经元处理信号的方式。深度学习：是通过多等级的特征和变量来预测结果的神经网络模型，深度学习模型中的每个特征通常对于人类观察者而言意义不大，使得该模型的使用难度很大且难以解释。深度学习模型使用一种称为反向传播的技术，通过模型进行预测或对输出进行分类。强化学习：是机器学习的另外一种方式，指机器学习系统制订了目标而且迈向目标的每一步都会得到某种形式的奖励。机器学习模型：是以统计为基础的，它们往往比基于人类假设和回归分析的传统“手工”分析模型更准确。自动化机器学习模型更容易创建，而且能够揭示更多的数据细节", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-108", "s": "以下说法中不正确的是()。", "o": ["计算机硬件技术将向超高速、超大型、平行处理、智能化的方向发展", "NB-IoT是面向物联网、低时延场景的窄带物联网", "eMTC是增强型机器类型通信", "IIoT是工业物联网"], "a": 0, "an }, {"c": 2, "cn": "信息技术发展", "no": "2-173", "s": "在区块链网络中，每台物理设备均可作为该网络中的一个节点，任意节点可自由加入且拥有一份完整的数据库拷贝，属于区块链特征中的()。", "o": ["多中心化", "多方维护", "时序数据", "开放共识"], "a": 3, "an": "区块链的典型特征：多中心化、多方维护、时序数据、智能合约、不可篡改、开放共识、安全可信。多中心化运用纯数学方法代替中心化组织机构在多个分布式节点之间构建信任关系，从而建立可信的分布式系统。多方维护激励机制可确保分布式系统中的所有节点均可参与数据区块的验证过程，并通过共识机制选择特定节点将新产生的区块加入到区块链中。时序数据区块链运用带有时间戳信息的链式结构来存储数据信息，为数据信息添加时间维度的属性，从而可实现数据信息的可追溯性。智能合约区块链技术能够为用户提供灵活可变的脚本代码，以支持其创建新型的智能合约。不可篡改在区块链系统中，因为相邻区块间后序区块可对前序区块进行验证，若篡改某一区块的数据信息，则需递归修改该区块及其所有后序区块的数据信息，然而每一次哈希的重新计算代价是巨大的，且须在有限时间内完成，因此可保障链上数据的不可篡改性", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-174", "s": "2022年3月，提请“十三届全国人大五次会议”审查的计划报告提出，实施“东数西算”工程，关于该工程的描述不正确的是：()。", "o": ["我国西部地区可再生资源丰富，具备发展数据中心的潜力", "我国通信网络建设飞速发展，带宽持续增加", "人工智能的发展是此工程可以实施的技术基础", "我国东部地区存在大量的算力需求"], "a": 2, "an": "“东数西算”即“东数西算工程”,指通过构建数据中心、云计算、大数据一体化的新型算力网络体系，将东部算力需求有序引导到西部，优化数据中心建设布局，促进东西部协同联动。简单地说，就是让西部的算力资源更充分地支撑东部数据的运算，更好为数字化发展赋能。这个主要是数据中心建设，人工智能主要强调的是算法和应用，C不正确。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-175", "s": "虚拟现实技术的主要特征包括：沉浸性、交互性、多感知性、构想性和()。", "o": ["自主性", "抗否认性", "可审计性", "可靠性"], "a": 0, "an": "P63:虚拟现实技术的主要特征包括沉浸性、交互性、多感知性、构想性(也称想象性)和自主性", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-176", "s": "区块链在我国的合法运用不包括()。", "o": ["银行征信管理", "区块链版权服务平台", "比特币交易平台", "基于区块链的健康管理信息系统"], "a": 2, "an": "比特币在我国法律内不允许", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-177", "s": "()不属于人工智能的典型应用。", "o": ["自动驾驶", "送餐机器人", "非接触测温仪", "无人超市"], "a": 2, "an": "非接触测温仪属于感应设备", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-178", "s": "()属于人工智能应用领域。①自动驾驶；②智能搜索引擎；③人脸识别；④3D打印", "o": ["①②④", "①③④", "②③④", "①②③"], "a": 3, "an": "3D打印不是人工智能的应用。", "cm": ""}, {"c": 2, "cn": "信息技术发展", "no": "2-179", "s": "使用者在虚拟空间中可以与周围物体进行互动，可以拓宽认知范围，创造客观世界不存在的场景或不可能发生的环境，指的是虚拟现实的()特征", "o": ["交互性", "多感知性", "构想性", "自主性"], "a": 2, "an": "构想性也称想象性，使用者在虚拟空间中可以与周围物体进行互动，可以拓宽认知范围，创造客观世界不存在的场景或不可能发生的环境。小鹅通淘宝扫码购课微信公众号扫码加老师Q扫码加老师V蜗牛软考小鹅通店铺", "cm": ""}, {"c": 3, "cn": "信息系统治理", "no": "3-001", "s": "IT治理是描述组织采用有效的机制对信息技术和数据资源开发利用，平衡信息化发展和数字化转型过程中的风险，确保实现组织的  5, "cn": "信息系统工程", "no": "5-031", "s": "()是网上数据共享服务的重要方式。", "o": ["数据目录服务", "数据查询与浏览及下载服务", "数据分发服务", "云网盘"], "a": 1, "an": "数据服务主要包括数据目录服务、数据查询与浏览及下载服务、数据分发服务。数据目录服务。是用来快捷地发现和定位所需数据资源的一种检索服务，是实现数据共享的重要基础功能服务之一数据查询与浏览及下载服务。是网上数据共享服务的重要方式，用户使用数据的方式有查询数据和下载数据两种。数据分发服务。是指数据的生产者通过各种方式将数据传送到用户的过程。分发服务的核心内容包括数据发布、数据发现、数据评价和数据获取。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-032", "s": "数据标准化分为四个阶段，其中将产生数据需求及相关的元数据、域值等文件，属于()阶段。", "o": ["确定数据需求", "制定数据标准", "批准数据标准", "实施数据标准"], "a": 0, "an": "P153,数据标准化具体过程包括确定数据需求、制定数据标准、批准数据标准和实施数据标准四个阶段确定数据需求：将产生数据需求及相关的元数据、域值等文件。制定数据标准：要处理“确定数据需求”阶段提出的数据需求。如果现有的数据标准不能满足该数据需求，可以建议制定新的数据标准，也可建议修改或者封存已有数据标准。批准数据标准：数据管理机构对提交的数据标准建议、现行数据标准的修改或封存建议进行审查一经批准，该数据标准将扩充或修改数据模型。实施数据标准：在各信息系统中实施和改进已批准的数据标准。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-033", "s": "下列不属于数据存储介质类型的是()。", "o": ["磁带", "机械硬盘", "光盘", "磁盘"], "a": 1, "an": "存储介质的类型主要有磁带、光盘和磁盘三种", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-034", "s": "文本或数字表格、程序源代码属于()。", "o": ["一维数据可视化", "二维数据可视化", "三维数据可视化", "多维数据可视化"], "a": 0, "an": "表5-12 常见数据可视化表现方式表现方式说明化维数据可视可视化取决于数据大小和用户想用数据来处理什么任务一维数据就是简单的线性数据，如文本或数字表格、程序源代码都基于一维数据。一维数据二维数据可视化在数据可视化中，二维数据是指由两种主要描述属性构成的数据，如一个物体的宽度和高|度、一个城市的平面地图、建筑物的楼层平面图等都是二维数据可视化的实例。最常见的二维数据可视化就是地理信息系统(Geographic Information System,GIS)三维数据可视化三维数据比二维数据更进了一层，它可以描述立体信息。三维数据可以表示实际的三维物体，因此可视化的许多应用是三维可视化。物体通过三维可视化构成计算机模型，供操作及试验，以此预测真实物体的实际行为多维数据可视化在可视化环境中，多维数据所描述事物的属性超过三维，为了实现可视化，往往需要降维化时态数据实际上是二维数据的一种特例，即二维中有一维是时间轴。它以图形方式显示随着|时间变化的数据，是可视化信息最常见、最有用的方式之一时态数据可视层次数据可视化层次数据即树形数据，其数据内在结构特征为：每个节点都有一个父节点(根节点除外)。节点分兄弟节点(拥有同一个父节点的节点)和子节点(从属该节点的节点)。拥有这种结构的数据很常见，如商业组织、计算机文件系统和家谱图都是按树形结构排列的层次数据", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-035", "s": "制定一个数据元标准的步骤是()。①界定业务范围②开展业务流程分析与信息建模③描述数据的内容，质量等信息④提取数据元并规范属性⑤发布数据元标准并维护", "o": ["①②③⑤④", "③①②④⑤", "①④②③⑤", "③①④②⑤"], "a": 1, "an": "《蜗牛软考综合一本通》-5.2.2 数据标准化★★★★★表5-10 数据元制定的基本过程步骤说 明描述用于描述数据的内容、覆盖范围、质量、管理方式、数据的所有者、数据的提供方式等信息，是数据与用户之间的桥梁。界定业务范围通过对业务范围的明确界定，确定所要研究的数据元的范围。开展业务流程分析与信息建模数据虽然是任何业务的核心所在，但并不能脱离业务流程而单独存在，它总是服务于业务流程，因此通过对业务流程的透彻分析，并建立清晰的数据模型，可以理清整个业务流程中涉及的所有数据元。借助于信息模型，提取数据元，并按照一定的规则规范其属性GB/T18391《信息技术数据元的规范与标准化》清晰地给出了如何对数据元进行描述的方法，以及如何赋予数据元属性的值。比如如何描写数据元的定义，如何对数据元进行命名，如何区分数据元的数据类型等。对于代码型的数据元，编制其值域，即代码表代码表的编写可以按照GB/T7026《标准化工作导则信息分类编码标准的编写规定》进行。与现有的国家标准或行业标准进行协调这一步是非常重要的工作，编制数据元标准首先要与相应的国家标准保持一致。首先，如果能直接使用现有的国家标准，则可直接使用，或在国家标准的基础上进行扩展；其次要与相关的行业标准保持一致；然后还必须考虑与本行业或领域内已有标准保持最大兼容性，因此要全面考虑协调性和配套性。发布实施数据元标准并建立相应的动态维护管理机制数据元的标准化工作是一项长期持续的工作，任何行业或领域的数据元标准化工作都不可能在短时间内全部完成，它不仅需要各级业务部门的长期工作和共同努力，还需要根据业务需求的不断变化对其进行修改、补充和完善。因此，需要一种动态维护管理的机制来保障数据元标准化的持续进行。通过建立数据元注册系统，对数据元进行动态维护管理，一方面可以方便用户定位、查找和交换数据元规范，另一方面可以有效保证数据元标准的时效性", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-036", "s": "在系统集成栈中处于最顶层的是()。", "o": ["应用集成", "数据集成", "网络集成", "硬件集成"], "a": 0, "an": "P169:在集成的堆栈上，应用集成在最上层，主要解决应用的互操作性的问题", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-037", "s": "每次所备份的数据只是相对于上一次备份后改变的数据，是()备份策略。", "o": ["完全备份", "差分备份", "增量备份", "冷热备份"], "a": 2, "an": "完全备份：每次都对需要进行备份的数据进行全备份。差分备份：每次所备份的数据只是相对上一次完全备份之后发生变化的数据。增量备份：每次所备份的数据只是相对于上一次备份后改变的数据。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-038", "s": "城市的平面地图、建筑物的楼层平面图等属于()。", "o": ["一维数据可视化", "二维数据可视化", "三维数据可视化", "多维数据可视化"], "a": 1, "an": "表5-12 常见数据可视化表现方式表现方式说明维数据可视化一维数据就是简单的线性数据，如文本或数字表格、程序源代码都基于一维数据。一维数据|可视化取决于数据大小和用户想用数据来处理什么任务二维数据可视化在数据可视化中，二维数据是指由两种主要描述属性构成的数据，如一个物体的宽度和高|度、一个城市的平面地图、建筑物的楼层平面图等都是二维数据可视化的实例。最常见的二维数据可视化就是地理信息系统(Geographic Information System,GIS)三维数据可视化三维数据比二维数据更进了一层，它可以描述立体信息。三维数据可以表示实际的三维物体，因此可视化的许多应用是三维可视化。物体通过三维可视化构成计算机模型，供操作及试验，以此预测真实物体的实际行为多维数据可视化在可视化环境中，多维数据所描述事物的属性超过三维，为了实现可视化，往往需要降维化时态数据实际上是二维数据的一种特例，即二维中有一维是时间轴。它以图形方式显示随着|时间变化的数据，是可视化信息最常见、最有用的方式之一时态数据可视层次数据可视化层次数据即树形数据，其数据内在结构特征为：每个节点都有一个父节点(根节点除外)。节点分兄弟节点(拥有同一个父节点的节点)和子节点(从属该节点的节点)。拥有这种结构的数据很常见，如商业组织、计算机文件系统和家谱图都是按树形结构排列的层次数据网络数据可视化网络数据指与任意数量的其他节点有关系的节点的数据。网络数据中的节点不受与它有关系|的其他节点数量的约束(不同于层次节点有且只有一个父节点),网络数据没有固有的层次结|构，两个节点之间可以有多条连接路径，也就是说节点间关系的属性和数量是可变的", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-039", "s": "下列关于集成的说法中不正确的是()。", "o": ["应用集成主要是为了解决应用的互操作性的问题", "数据集成主要是为了解决数据互通的问题", "网络集 设计方法来集成数据", "声明式方法，利用中间件集成异构数据库，该方法不需要改变原始数据的存储和管理方式", "中间件位于异构数据库系统(数据层)的下方，为不同数据库提供转换服务"], "a": 3, "an": "异构数据集成方法旧纳起来主要有两种，分别是过程式方法和声明式方法。过程式方法。一般是根据一组信息需求，采用一种点对点的设计方法来集成数据。声明式方法。利用中间件集成异构数据库，该方法不需要改变原始数据的存储和管理方式。中间件位于异构数据库系统(数据层)和应用程序(应用层)之间，向下协调各数据库系统，向上为访间集成数据的应用提供统一的数据模式和数据访问的通用接口。各数据库仍完成各自的任务，中间件则主要为异构数据源提供一个高层次的检索服务。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-056", "s": "以下说法中不正确的是()。", "o": ["数据模式是数据的概念、组成、结构和相互关系的总称", "数据分类有分类对象和分类依据两个要素", "所有类型的数据都能够进行编码，如关于产品、人、国家、货币、程序、文件、部件等各种各样的信息", "数据编码是将事物或概念(编码对象)赋予具有一定规律和易于人类识别处理的符号"], "a": 3, "an": "P152:数据编码是将事物或概念(编码对象)赋予具有一定规律和易于计算机、人识别处理的符号，形成代码元素集合。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-057", "s": "容灾系统衡量指标RPO指的是()。", "o": ["当灾难发生时系统恢复的时间", "当灾难发生时允许丢失的数据量", "当灾难发生时可以持续工作的时间", "当灾难发生时系统不允许丢失的数据量"], "a": 1, "an": "根据容灾系统保护对象的不同，容灾系统分为应用容灾和数据容灾两类。数据备份是数据容灾的基础。容灾不是简单备份。【GX202305】衡量容灾系统有两个主要指标：RPO和RTO,其中RPO代表了当灾难发生时允许丢失的数据量；而RTO则代表了系统恢复的时间。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-058", "s": "()确立代码与事物或概念之间的一一对应关系，以保证数据的准确性和相容性，为信息集成与资源共享提供良好的基础。", "o": ["元数据标准化", "数据元标准化", "数据模式标推化", "数据分类与编码标准化"], "a": 3, "an": "P152::数据分类与编码标准化是简化信息交换、实现信息处理和信息资源共享的重要前提，是建立各种信息管理系统的重要技术基础和信息保障依据。通过分类与编码标准化，可以最大限度地消除对信息命名、描述、分类和编码莴刘的不一致造成的混乱、误解等现象，可以减少信息的重复采集、加工、存储等操作，使事物的名称和代码的含义统一化、规范化，确立代码与事物或概念之间的一一对应关系，以保证数据的准确性和相容性，为信息集成与资源共享提供良好的基础。数据分类与编码的作用主要包括用于信息系统的共享和互操作，统一数据的表示法和提高信息处理效率", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-059", "s": "建库流程的顺序是()。", "o": ["前期控制、精度评价、过程控制、系统检测", "前期控制、系统检测、过程控制、精度评价", "前期控制、精度评价、系统检测、过程控制", "前期控制、过程控制、系统检测、精度评价"], "a": 3, "an": "P156:建库流程的顺序是前期控制、过程控制、系统检测、精度评价", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-060", "s": "()是一种面向数据流的方法，它以SRS和SA阶段所产生的DFD和数据字典等文档为基础，是一个自顶向下、逐步求精和模块化的过程。", "o": ["结构化设计", "面向对象分析", "结构化分析", "设计模式"], "a": 0, "an": "P138,结构化设计(SD)是一种面向数据流的方法，它以SRS和SA阶段所产生的DFD和数据字典等文档为基础，是一个自顶向下、逐步求精和模块化的过程", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-061", "s": "衡量容灾系统或能力的主要指标是：()。", "o": ["远程镜像技术", "RTO/RPO", "异地容灾", "数据备份策略"], "a": 1, "an": "从技术上看，衡量容灾系统有 个专门的接口比使用单一的总接口要好。组合重用原则：要尽量使用组合，而不是继承关系达到重用目的。迪米特原则(最少知识法则):一个对象应当对其他对象有尽可能少的了解。本原则与结构化方法的低耦合原则是一致的。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-068", "s": "图中的软件架构设计属于()风格。", "o": ["虚拟机风格", "调用、返回风格", "独立构件风格", "数据流风格"], "a": 3, "an": "P130:数据流风格--管道过滤器★★★★★★★管道过滤器过滤器过滤器过滤器过滤器管道", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-069", "s": "软件架构中，()模式包括主程序/子程序、数据抽象和面向对象，以及层次结构。", "o": ["数据流", "调用/返回", "虚拟机", "独立构件"], "a": 1, "an": "P130:①数据流风格。数据流风格包括批处理序列和管道/过滤器两种风格。②调用/返回风格。调用/返回风格包括主程序/子程序、数据抽象和面向对象，以及层次结构。③独立构件风格。独立构件风格包括进程通信和事件驱动的系统。④虚拟机风格。虚拟机风格包括解释器和基于规则的系统。⑤仓库风格。仓库风格包括数据库系统、黑板系统和超文本系统", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-070", "s": "以下说法中不正确的是()。", "o": ["研究软件架构的根本目的是解决好软件的复用、质量和维护问题", "软件架构设计的一个核心问题是能否达到架构级的软件复用", "架构评估过程中，评估人员所关注的是系统的功能属性", "软件架构评估技术主要分为三类，分别是基于调查问卷的方式、基于场景的方式和基于度量的方式。这三种评估方式中，基于场景的评估方式最为常用"], "a": 2, "an": "P130:架构评估过程中，评估人员所关注的是系统的质量属性", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-071", "s": "()包括多种保密服务，为了防止网络中各系统之间的数据被截获或被非法存取而泄密，提供密码加密保护。", "o": ["数据保密服务", "对等实体认证服务", "数据完整性服务", "禁止否认服务"], "a": 0, "an": "P173-P174,安全服务包括对等实体认证服务、数据保密服务、数据完整性服务、数据源点认证服务、禁止否认服务和犯罪证据提供服务等。*(1)对等实体认证服务：用于两个开放系统同等层中的实体建立链接或数据传输时，对方实体的合法性、真实性进行确认，以防假冒。*(2)数据保密服务：包括多种保密服务，为了防止网络中各系统之间的数据被截获或被非法存取而泄密，提供密码加密保护。数据保密服务可提供链接方式和无链接方式两种数据保密，同时也可对用户可选字段的数据进行保护。*(3)数据完整性服务：用以防止非法实体对交换数据的修改、插入、删除以及在数据交换过程中的数据丢失。*(4)数据源点认证服务：用于确保数据发自真正的源点，防止假冒。*(5)禁止否认服务：用以防止发送方在发送数据后否认自己发送过此数据，接收方在收到数据后否认自己收到过此数据或伪造接收数据，由两种服务组成：不得否认发送和不得否认接收。*(6)犯罪证据提供服务：指为违反国内外法律法规的行为或活动，提供各类数字证据、信息线索等。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-072", "s": "数据标准化分为四个阶段，其中()阶段数据管理机构对提交的数据标准建议、现行数据标准的修改或封存建议进行审查。", "o": ["确定数据需求", "制定数据标准", "批准数据标准", "实施数据标准"], "a": 2, "an": "P153,数据标准化具体过程包括确定数据需求、制定数据标准、批准数据标准和实施数据标准四个阶段确定数据需求：将产生数据需求及相关的元数据、域值等文件。制定数据标准：要处理“确定数据需求”阶段提出的数据需求。如果现有的数据标准不能满足该数据需求，可以建议制定新的数据标准，也可建议修改或者封存已有数据标准。批准数据标准：数据管理机构对提交的数据标准建议、现行数据标准的修改或封存建议进行审查一经批准，该数据标准将扩充或修改数据模型。实施数据标准：在各信息系统中实施和改进已批准的数据标准。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-073", "s": "研究软件架构的根本目的是解决软件的复用、质量和维护问题，软件架构设计是软件开发过程中关键的一步，因此需要对其进行评估，在这一活动中，评估人员关注的是系统的()属性。", "o": ["功能", "性能", "质量", "安全"], "a": 2, "an": "P130:架构评估过程中，评估人员莴刘所关注的是系统的质量属性", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-074", "s": "从目前已有的软件架构评估技术来看，可以归纳为三类主要的评估方式，分别是()的方式、()的方式和()的方式。", "o": ["基于调查问卷、基于场景、基于度量", "基于质量、基于场景、基于响应", "基于成本效益分析、基于场景、基于度量", "基于成本效益分析、基于场景、基于响应"], "a": 0, "an": "P130:从目前已有的软件架构评估技术来看，可以归纳为三类主要的评估方式，分别是基于调查问卷(或检查表)的方式、基于场景的方式和基于度量的方式", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-075", "s": "用一系列攻击性操作来代表安全性方面的需求，属于基于()的软件体系结构评估方式。", "o": ["调查问卷或检查表", "场景", "度量", "实际运行"], "a": 1, "an": "P130:从目前已有的软件架构评估技术来看，可以归纳为三类主要的评估方式，分别是基于调查问卷(或检查表)的方式、基于场景的方式和基于度量的方式。基于场景的方式分析软件架构对场景的支持程度，从而判断该架构对这一场景所代表的质量需求的满足程度。例如，用一系列对软件的修改来反映易修改性方面的需求，用一系列攻击性操作来代表安全性方面的需求等", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-076", "s": "系统可在不同的硬件平台上运行，指的是系统的()属性。", "o": ["可移植", "可扩展", "可互用", "可靠性"], "a": 0, "an": "P131:对操作系统来说，可移植性被理解为系统可在不同的硬件平台上运行", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-077", "s": "程序的执行速度及程序所需占用的内存空间指的是()。", "o": ["程序效率", "算法效率", "存储效率", "I/O效率"], "a": 0, "an": "P141①程序效率。程序的效率是指程序的执行速度及程序所需占用的内存空间。②算法效率。源程序的效率与详细设计阶段确定的算法的效率直接相关。在详细设计翻译转换成源程序代码后，算法效率反映为程序的执行速度和存储容量的要求。③存储效率。存储容量对软件设计和编码的制约很大。因此要选择可生成较短目标代码且存储压缩性能优良的编译程序，有时需要采用汇编程序，通过程序员富有创造性的努力，提高软件的时间与空间效率。提高存储效率的关键是程序的简单化。④I/O效率。输入/输出可分为两种类型：一种是面向人(操作员)的输入/输出；另一种是面向设备的输入/输出。如果操作员能够十分方便、简单地输入数据，或者能够十分直观、一目了然地了解输出信息，则可以说面向人的输入/输出是高效的。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-078", "s": "跟传统的编译类似，将软件编译形成RPM包或者Jar包，属于镜像部署三个环节中的()。", "o": ["Build", "Ship", "Run", "Over"], "a": 0, "an": "P143,完整的镜像部署包括三个环节：Build—Ship—Run。Build:将软件编译形成RPM包或者Jar包Ship:将所需的第三方依赖和第三方插件安装到环境中Run:在不同的地方启动整套环境。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-079", "s": "以下说法中不正确的是()。", "o": ["对于新建系统的数据元提取，一般适用“自上而下”的提取法", "对于已建系统的数据元提取，一般适用“自下而上”的提取法", "数据是任何业务的核心所在，它可以单独存在", "数据元一般来说由三部分组成、对象、特性、表示"], "a": 2, "an": "P151:数据虽然是任何业务的核心所在，但并不能脱离业务流程而单独存在，它总是服务于业务流程", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-080", "s": "质量功能部署(QFD)将软件需求分为常规需求、()和意外需求。", "o": ["期望需求", "业务需求", "系统需求", "行为需求"], "a": 0, "an": "P131:QFD将软件需求分为三类，分别是常规需求、期望需求和意外需求。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-081", "s": "用户在一个应用中填写联系信息表，那么这些信息将被映射到相邻应用的相应字段，属于连接应用组件中的()。", "o": ["应用编程接口", "事件驱动型操作", "数据映射", "API"], "a": 2, "an": "数据映射。数据映射是指将数据从一个系统映射到另一个系统，可以定义数据的交换方式，从而简化后续的数据导出、分组或分析工作。例如，用户在一个应用中填写联系信息表，那么这些信息将被映射到相邻应用的相应字段。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-082", "s": "()中的对象不是由特定的编程语言及其程序设计环境所支持的对象，而是由系统平台直接支持的对象。", "o": ["VB", "COM", "C#", "C++"], "a": 1, "an": "COM中的对象是一种二进制代码对象，其代码形式是DLL或EXE执行代码。COM中的对象都被直接注册在Windows的系统库中，所以COM中的对象都不再是由特定的编程语言及其程序设计环境所支持的对象，而是由系统平台直接支持的对象。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-083", "s": "由安全机制、OSI网络参考模型、安全服务三个轴形成的信息安全系统三维空间中，操作系统漏洞检测与修复属于()。", "o": ["平台安全", "应用完全", "通信安全", "授权和审计安全"], "a": 0, "an": "《蜗牛软考综合一本通》--5.4.2 安全系统★★★★★安全机制包含基础设施实体安全、平台安全、数据安全、通信安全、应用安全、运行安全、管理安全、授权和审计安全、安全防范体系等。*(1)基础设施实体安全。基础设施实体安全主要包括机房安全、场地安全、设施安全、动力系统安全、灾难预", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-084", "s": "()它是按用户的观点来对数据和信息建模，也就是说，把现实世界中的客观对象抽象为某一种信息结构，这种信息结构不依赖于具体的计算机系统，也不对应某个具体的DBMS。", "o": ["信息模型", "逻辑模型", "物理模型", "数据模型"], "a": 0, "an": "P148:概念模型也称信息模型，它是按用户的观点来对数据和信息建模，也就是说，把现实世界中的客观对象抽象为某一种信息结构，这种信息结构不依赖于具体的计算机系统，也不对应某个具体的DBMS", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-085", "s": "元数据类型中用来描述单一数字对象的内容、属性及外在特征的元数据称之为()。", "o": ["内容元数据", "专门元数据", "服务元数据", "元元数据"], "a": 1, "an": "P150,信息内容内容元数据标记数字对象内容及结构的元数据内容对象专门元数据描述单一数字对象的内容、属性及外在特征的元数据内容对象集合资源集合元数据", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-086", "s": "在常用的OOD原则中，()原则是设计功能单一的类，该原则与结构化方法的()原则是一致的。", "o": ["单职、高内聚", "组合重用、低耦合", "迪米特、低耦合", "开闭、高内聚"], "a": 0, "an": "P139:常用的OOD原则包括：单职原则：设计功能单一的类。本原则与结构化方法的高内聚原则是一致的。开闭原则：对扩展开放，对修改封闭。里氏替换原则：子类可以替换父类。依赖倒置原则：要依赖于抽象，而不是具体实现；要针对接口编程，不要针对实现编程。接口隔离原则：使用多个专门的接口比使用单一的总接口要好。组合重用原则：要尽量使用组合，而不是继承关系达到重用目的。迪米特原则(最少知识法则):一个对象应当对其他对象有尽可能少的了解。本原则与结构化方法的低耦合原则是一致的。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-087", "s": "()是数据库、文件和数据交换的基本数据单元。", "o": ["比特", "字段", "记录", "数据元  "no": "5-147", "s": "OOA的任务是“()”,OOD的任务是“()”。", "o": ["做什么、怎么做", "怎么做、做什么", "需求分析、需求设计", "用例模型、分析模型"], "a": 0, "an": "P136:OOA的任务是“做什么”,OOD的任务是“怎么做”。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-148", "s": "在OOA方法中，构建用例模型一般需要经历四个阶段，分别是识别参与者、合并需求获得用例、细化用例描述和调整用例模型，其中那()个阶段是必须的。", "o": ["识别参与者、合并需求获得用例、调整用例模型", "识别参与者、合并需求获得用例、细化用例描述", "识别参与者、细化用例描述、调整用例模型", "合并需求获得用例、细化用例描述、调整用例模型"], "a": 1, "an": "136:在00A方法中，构建用例模型一般需要经历四个阶段，分别是识别参与者、合并需求", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-149", "s": "软件需求可以分为功能需求、性能需求、外部接口需求、设计约束和质量属性等几类。以下选项中，()均属于功能需求。①对特定范围内修改所需的时间不超过3秒。②按照订单及原材料情况自动安排生产排序。③系统能够同时支持1000个独立站点的并发访问。④系统可实现对多字符集的支持，包括GBK、BIG5和UTF-8等。⑤定期生成销售分析报表。⑥系统实行同城异地双机备份，保障数据安全。", "o": ["①②⑤", "②⑤", "③④⑤", "③⑥"], "a": 1, "an": "①对特定范围内修改所需的时间不超过3秒。【性能需求】②按照订单及原材料情况自动安排生产排序。【功能需求】③系统能够同时支持1000个独立站点的并发访问。【性能需求】④系统可实现对多字符集的支持，包括GBK、BIG5和UTF-8等。【设计约束】⑤定期生成销售分析报表。【功能需求】⑥系统实行同城异地双机备份，保障数据安全。【设计约束】", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-150", "s": "在面向对象系统中()关系表示一个较大的“整体”类包含一个或多个“部分”类。", "o": ["概化", "合成", "泛化", "聚合"], "a": 3, "an": "P138:聚合是关联关系的一种特例，它体现的是整体与部分、拥有的关系，即has-a的关系，此时整体与部分之间是可分离的，它们可以具有各自的生命周期，部分可以属于多个整体对象，也可以为多个整体对象共享；比如计算机与CPU、公司与员工的关系等；表现在代码层面，和关联关系是一致的，只能从语义级别来区分。所以此题选D。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-151", "s": "执行者与用例之间的关系是()。", "o": ["包含关系", "泛化关系", "关联关系", "扩展关系"], "a": 2, "an": "P137-138:类之间的主要关系有关联、依赖、泛化、聚合、组合和实现等关联-> 关联体现的是对象实例之间的关系，而不表示两个类之间的关系依赖-> 两个类A和B,如果B的变化可能会引起A的变化，则称类A依赖于类B。描述的是两个类之间的关系泛化-> 泛化关系描述了一般事物与该事物中的特殊种类之间的关系，也就是父类与子类之间的关系。共享聚集-> 通常简称为聚合关系，它表示类之间的整体与部分的关系，其含义是“部分”;可能同 时属于多个“整体“部分”与“整体”的生命周期可以不相同。例如，汽车和车轮就是聚合关系，车子坏了，车轮还可以用；车轮坏了，可以再换一个新的。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-152", "s": "()不需要了解代码的逻辑结构。", "o": ["控制流测试", "黑盒测试", "数据量测试", "白盒测试"], "a": 1, "an": "P141:白盒测试也称为结构测试，主要用于软件单元测试中。白盒测试将程序看作是一个透明的白盒，测试人员完全清楚程序的结构和处理算法，按照程序内部逻辑结构设计测试用例。白盒测试方法主要有控制流测试、数据流测试和程序变异测试等。另外，使用静态测试的方法也可以实现白盒测试。例如：使用人工检查代码的方法来检查代码的逻辑问题，也属于白盒测试的范畴。黑盒测试也称为功能测试，主要用于集成测试、确认测试和系统测试中。黑盒测试将程序看作是一个不透明的黑盒，完全不考虑程序的内部结构和处理算法，而只检查程序功能是否能按照SRS的要求正常使用。黑盒测试根据SRS所规定的功能来设计测试用例。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-153", "s": "在应用集成中，有多个组件帮助协调连接各种应用。其中()利用特定的数据结构，帮助开发人员快速访问其他应用的功能。", "o": ["事件驱动型操作", "API", "数据映射", "RNN"], "a": 1, "an": "押对原题可以帮助协调连接各种应用的组件有：*(1)应用编程接口：API是定义不同软件交互方式的程序和规则，可以支持应用之间相互通信。API利用特定的数据结构，帮助开发人员快速访问其他应用的功能。*(2)事件驱动操作：当触发器(即事件)启动一个程序或一组操作时，系统就会执行事件驱动型操作。*(3)数据映射：将数据从一个系统映射到另一个系统，可以定义数据的交换方式，从而简化后续的数据导出、分组或分析工作。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-154", "s": "()不属于常见的数据质量评价过程。", "o": ["确定使用的数据质量定量元素及数据质量范围", "确定数据质量度量方法", "确定数据质量评价的第三方组织", "选择并使用数据质量评价方法"], "a": 2, "an": "数据质量评价过程：确定适用的数据质量定量元素及数据质量范围确定数据质量度量方法", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-155", "s": "元数据类型中用来描述元数据的标记语言、格式语言、标识符、扩展机制、转换机制等的元数据称之为()。", "o": ["内容元数据", "专门元数据", "服务元数据", "元元数据"], "a": 3, "an": "P150,信息内容内容元数据标记数字对象内容及结构的元数据内容对象专门元数据描述单一数字对象的内容、属性及外在特征的元数据内容对象集合对象的管理与保存资源集合元数据按照科学、主题、资源类型、用户范围、生成过程，使用管理范围形成的信息资源集合的描述管理元数据数字对象加工、存档、结构、技术处理、存取、控制、版权管理以及相关系统等方面的信息描述对象的服务服务过程服务系统服务元数据数字资源服务的揭示与表现、服务过程、服务系统等方面的相关信息的描述元数据的管理元元数据对元数据的标记语言、格式语言、标识符、扩展机制、转换机制等的描述", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-156", "s": "以下说法中，错误的是()。", "o": ["需求过程：主要包括需求获取、需求分析、需求规格说明书编制、需求验证与确认等", "使用结构化分析 SA方法进行需求分析。一般使用实体关系图(E-R图)表示数据模型，用数据流图DFD表示功能模型，用状态转换图 STD 表示行为模型", "构件图描述一个封装的类和它的接口、端口，以及由内嵌的构件和连接件构成的内部结构", "面向对象设计OOD是OOA方法的延续，其基本思想包括抽象、封装和可扩展性，其中可扩展性主要通过继承和泛化来实现"], "a": 3, "an": "P139,面向对象设计(0OD是00A方法的延续，其基本思想包括抽象、封装和可扩展性，其中可扩展性主要通过继承和多态来实现", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-157", "s": "每次所备份的数据只是相对上一次完全备份之后发生变化的数据，是()备份策略。", "o": ["完全备份1", "差分备份", "增量备份", "冷热备份"], "a": 1, "an": "", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-158", "s": "()是.NET中的网络编程结构，可以方便、高效地构建、运行和发布网络应用", "o": ["ADO.NET", "C#", "C++", "ASP.NET"], "a": 3, "an": "ASP.NET是.NET中的网络编程结构，可以方便、高效地构建、运行和发布网络应用", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-159", "s": "在部署的时候准备新旧两个部署版本，通过域名蜗牛解析：切换的方式将用户使用环境切换到新版本中，当出现问题的时候，可以快速地将用户环境切回旧版本，并对新版本进行修复和调整，指的是()方式。", "o": ["蓝绿部署", "滚动发布", "灰度发布", "金丝雀部署"], "a": 0, "an": "P144,在部署原则中提到两大部署方式为蓝绿部署和金丝雀部署。蓝绿部署：是指在部署的时候准备新旧两个部署版本，通过域名解析切换的方式将用户使用环境切换到新版本中，当出现问题的时候，可以快速地将用户环境切回旧版本，并对新版本进行修复和调整。金丝雀部署：是指当有新版本发布的时候，先让少量用户使用新版本，并且观察新版本是否存在问题。如果出现问题，就及时处理并重新发布；如果一切正常，就稳步地将新版本适配给所有的用户。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-160", "s": "常见的备份策略主要有三种()。", "o": ["物理备份、云备份和节点备份", "物理备份、差分备份和增量备份", "完全备份、云备份和物理备份", "完全备份、差分备份和增量备份"], "a": 3, "an": "P154:常见的备份策略主要有三种：完全备份、差分备份和增量备份。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-161", "s": "应用集成的技术要求不包括()", "o": ["互操作性", "可移植性", "简单性", "透明性"], "a": 2, "an": "对应用集成的技术要求大致有：具有应用间的互操作性、具有分布式环境中应用的可移植性、具有系统中应用分布的透明性。【202311】", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-162", "s": "每次都对需要进行备份的数据进行全备份，是()备份策略。", "o": ["完全备份", "差分备份", "增量备份", "冷热备份"], "a": 0, "an": "完全备份：每次都对需要进行备份的数据进行全备份。差分备份：每次所备份的数据只是相对上一次完全备份之后发生变化的数据。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-163", "s": "关于软件测试的描述，不正确的是()。", "o": ["采用桌前检查代码走查和代码审查属于动态测试方法", "控制流测试和数据流测试属于白盒测试方法", "软件测试可分为单元测试、集成测试、确认测试、系统测试等类别", "回归测试的目的是在软件变更后，变更部分的正确性和对变更需求的符合性以及功能、性能等要求的不损害性"], "a": 0, "an": "P141:桌前检查代码走查和代码审查属于静态测试方法。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-164", "s": "数据模型可划分为()。", "o": ["概念模型、逻辑模型、物理模型", "概念模型、逻辑模型、实体模型", "关系模型、逻辑模型、实体模型", "关系模型、逻辑模型、物理模型"], "a": 0, "an": "P147:数据模型可划分为三类：概念模型、逻辑模型和物理模型。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-165", "s": "以下属于数据备份结构的是()。", "o": ["DAS备份结构", "NAS备份结构", "SAN 备份结构", "FC-SAN备份结构"], "a": 0, "an": "P154:当前最常见的数据备份结构可以分为四种：DAS备份结构、基于LAN的备份结构、LAN-FREE备份结构和 SERVER-FREE备份结构", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-166", "s": "()定位于在修改数据时，保证新值在一定范围内符合逻辑上的完整性。", "o": ["保证数据的操作完整性", "保证数据库的完整性", "保证数据的语义完整性", "防止非法的数据访问"], "a": 2, "an": "在修改数据时，保证新值在一定范围内符合逻辑上的完整性。对数据值的约束通过完整性保证数据的语约束来描述。可以针对数据库定义完整性约束(定义数据库处于正确状态的条件),也可以义完整性针对变换定义完整性约束(修改数据库时需要验证的条件)", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-167", "s": "以下说法中不正确的是()。", "o": ["数据挖掘分析所需的数据量比传统数据分析所需的数据量大，数据量越大，数据挖掘的效果越好", "传统数据分析主要运用统计学的方法、手段对数据进行分析，而数据挖掘综合运用数据统计、人工智能、可视化等技术对数据进行分析", "传统数据分析通常是回顾型和验证型的，通常分析已经发生了什么,而数据挖掘通常是预测型和发现型的，预测未来的情况，解释发生的原因", "传统数据分析由于研究较早，其分析方法已经很过时，而数据挖掘除基于统计学等方法外，其分析方法很成熟"], "a": 3, "an": "数据挖掘与传统数据分析的区别：两者分析对象的数据量有差异。数据挖掘所需的数据量比传统数据分析所需的数据量大，数据量越大，数据挖掘的效果越好；两者运用的分析方法有差异。传统数据分析主要运用统计学的方法、手段对数据进行分析，而数据挖掘综合运用数据统计、人工智能、可视化等技术对数据进行分析；两者分析侧重有差异。传统数据分析通常是回顾型和验证型的，而数据挖掘通常是预测型和发现型的。两者成熟度不同。传统数据分析相当成熟，而数据挖掘除基于统计学等方法外，部分方法仍处于发展阶段。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-168", "s": "在组织范围内能够量化地管理和实现预期的组织和项目目标，属于软件能力成熟度等级()。", "o": ["第2级", "第3级", "第4级", "第5级"], "a": 2, "an": "P145等级特征结果：软件过程和结果具有不确定性。1级初始级行为：没有完整管理规范，依赖个人。2级项目规范级结果：项目基本可按计划实现预期的结果行为：有一定的管理规范3级组织改进级结果：在组织范围内能够稳定地实现预期的项目目标行为：能够根据自身特征，持续改进4级量化提升级结果：能够量化地管理和实现预期的组织和项目目标行为：能够建立量化的质量与过程绩效目标，预测结果5级创新引领级结果：实现组织业务目标的持续提升，引领行业发展行为：组织自身软件建设经验作为行业最佳案例进行推广", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-169", "s": "()考虑的主要问题包括命名、确定字段类型和编写必要的存储过程与触发器等。", "o": ["逻辑模型", "概念模型", "数据需求", "物理模型"], "a": 3, "an": "P149:物理模型考虑的主要问题包括命名、确定字段类型和编写必要的存储过程与触发器等。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-170", "s": "下列基本实施中属于安全工程过程域的是()。", "o": ["监测和控制技术工程项目", "管理配置", "规划技术工程项目", "评估脆弱性"], "a": 3, "an": "P178:由基本实施组成的11个安全工程过程域包括：PA01——实施安全控制、PA02——评估影响、PA03——评估安全风险、PAO4——评估威胁、PA05——评估脆弱性、PA06——建立保证论据、PA07——协调安全、PA08——监控安全态、PA09——提供安全输入、PA10——确定安全需求、PA11—— 验证和证实安全。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-171", "s": "通用实施(Generic Practices,GP),由被称为公共特性的逻辑域组成，公共特性分为5个", "o": ["Level 1", "Level 2", "Level 3", "Level 4"], "a": 2, "an": "Level 1—非正规实施级：(基本)Level 2—规划和跟踪级：(规范化)Level 3—充分定义级：(标准化)Level 4—量化控制级：(可测量、量化)Level 5—持续改进级：(改进)", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-172", "s": "保护数据库不受非授权的修改，以及不会因为病毒、系统中的错误等导致的存储数据破坏，应采取()安全策略来应对。", "o": ["保证数据的操作完整性", "保证数据库的完整性", "保证数据的语义完整性", "防止非法的数据访问"], "a": 1, "an": "保证数据库的完整性该需求指的是保护数据库不受非授权的修改，以及不会因为病毒、系统中的错误等导致的存储数据破坏。这种保护通过访问控制、备份/恢复以及一些专用的安全机制共同实现。备份/恢复在数据库管理系统领域得到了深入的研究，它们的主要目标是在系统发生错误时保证数据库中数据的一致性", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-173", "s": "如果一个开放系统提供在系统各构件之间交换信息的机制，也称该系统支持()。", "o": ["互操作性", "可移植性", "可重用性", "交互性"], "a": 0, "an": "如果一个 1:用户通过对授权访问的数据进行推导，得到机密信息，应采取防止推导的安全策略来应对", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-181", "s": "攻击者利用一定的方式影响用户访问数据或使用资源的行为属于()。", "o": ["非授权的信息泄露", "非授权的信息修改", "拒绝服务", "人为错误"], "a": 2, "an": "拒绝服务：包括会影响用户访问数据或使用资源的行为", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-182", "s": "数据清理主要包括数据分析、()和数据修正三个步骤。", "o": ["数据挖掘", "数据转换", "数据埋点", "数据检测"], "a": 3, "an": "P156:数据清理主要包括数据分析、数据检测和数据修正三个步骤", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-183", "s": "信息系统的“安全空间”,指的是()。", "o": ["安全机制、安全设施和安全服务", "安全机制、安全平台和安全人员", "安全机制、网络参考模型和安全服务", "安全人员、安全设施 和安全服务"], "a": 2, "an": "信息安全系统三维空间包括安全机制、网络参考模型和安全服务。X轴是\"安全机制”。Y轴是“OSI网络参考模型”。Z轴是\"安全服务\"。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-184", "s": "(ISSE-CMM)是一种衡量信息安全系统工程实施能力的方法，其包括()三部分。", "o": ["管理过程、风险过程和保证过程", "工程过程、安全过程和保证过程", "工程过程、风险过程和保证过程", "安全过程、风险过程和保证过程"], "a": 2, "an": "ISSE将信息安全系统工程实施过程分解为：工程过程、风险过程和保证过程三部分。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-185", "s": "通过对授权访问的数据进行推导分析获取非授权的信息属于()。", "o": ["非授权的信息泄露", "非授权的信息修改", "拒绝服务", "人为错误"], "a": 0, "an": "P161:非授权的信息泄露：未获授权的用户有意或无意得到信息。通过对授权访问的数据进行推导分析获取非授权的信息也属于这一类", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-186", "s": "以下说法中不正确的是()。", "o": ["数据挖掘分析所需的数据量比传统数据分析所需的数据量大，数据量越大，数据挖掘的效果越好", "数据集成就是将驻留在不同数据源中的数据进行整合，向用户提供统一的数据视图，其属于黑盒集成", "传统数据分析通常是回顾型和验证型的，通常分析已经发生了什么,而数据挖掘通常是预测型和发现型的，预测未来的情况，解释发生的原因", "传统数据分析由于研究较早，其分析方法相当成熟，而数据挖掘除基于统计学等方法外，部分方法仍处于发展阶段"], "a": 1, "an": "数据集成就是将驻留在不同数据源中的数据进行整合，向用户提供统一的数据视图，使得用户能以透明的方式访问数据，数据集成属于白盒集成。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-187", "s": "()不属于应用集成的技术要求。", "o": ["系统中应用分布的透明性", "应用间数据的存储", "分布式环境中应用的可移植性", "应用间的互操作性"], "a": 1, "an": "对应用集成的技术要求大致有：*(1)具有应用间的互操作性：应用的互操作性提供不同系统间信息的有意义交换，即信息的语用交换，而不仅限于语法交换和语义交换。此外，它还提供系统间功能服务的使用功能，特别是资源的动态发现和动态类型检查。*(2)具有分布式环境中应用的可移植性：提供应用程序在系统中迁移的潜力并且不破坏应用所提供的或正在使用的服务。这种迁移包括静态的系统重构或重新安装以及动态的系统重构。*(3)具有系统中应用分布的透明性：分布的透明性屏蔽了由系统的分布所带来的复杂性。它使应用编程者不必关心系统是分布的还是集中的，从而可以集中精力设计具体的应用系统，这就大大减少了应用集成编程的复杂性。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-188", "s": "利用特定的数据结构，帮助开发人员快速访问其他应用的功能，属于连接应用组件中的()。", "o": ["COM", "事件驱动型操作", "数据映射", "API"], "a": 3, "an": "应用编程接口(API)。API是定义不同软件交互方式的程序和规则，可以支持应用之间相互通信。API利用特定的数据结构，帮助开发人员快速访问其他应用功能。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-189", "s": "()是指从数据中发现控制数据的一般规则，定义出数据清理的规则，并选择合适的算法。", "o": ["数据分析", "数据检测", "数据修正", "数据处理"], "a": 0, "an": "数据分析：是指从数据中发现控制数据的一般规则，比如字段域、业务规则等。通过对数据的分析，定义出数据清理的规则，并选择合适的算法", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-190", "s": "()认为凡是满足这个词局部的所有字符的信息，都为命中的信息。", "o": ["截词检索技术", "临近检索技术", "限定字段检索技术", "限制检索技术"], "a": 0, "an": "截词检索技术是指用截断的词的一个局部进行检索，并认为凡是满足这个词局部的所有字符的信息，都为命中的信息", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-191", "s": "()是数据库的第一道安全防线，是授权、审计等的前提条件。", "o": ["防止非法的数据访问", "审计和日志", "标识和认证", "防止推导"], "a": 2, "an": "标识和认证同计算机系统的用户管理类似，使用的方法也非常类似。与其他系统一样，标识和认证也是数据库的第一道安全防线。标识和认证是授权、审计等的前提条件", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-192", "s": "()的意义在于防止程序之间出现非授权的信息传递。", "o": ["审计和日志", "标识和认证", "防止推导", "限界"], "a": 3, "an": "限界限界的意义在于防止程序之间出现非授权的信息传递。信息传递出现在\"授权通道”“存储通道\"和“隐通道\"中。授权通道通过授权的操作提供输出信息，例如编辑或编译一个文件。存储通道是存储区，一个程序向其中存储数据，而其他程序可以读取。隐通道指的是使用系统中并非设计用来进行通信的资源在主体间通信的信道", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-193", "s": "信息安全系统工程(ISSE)将信息安全系统工程的实施过程分为工程过程(),保证过程三个基本的部分。", "o": ["策划过程", "风险过程", "支持过程", "质量过程"], "a": 1, "an": "ISSE将信息安全系统工程实施过程分解为：工程过程、风险过程和保证过程三个基本的部分。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-194", "s": "系统集成的内容包括()、()、()集成。", "o": ["技术、数据、应用", "界面、数据、控制", "技术、数据、控制", "界面、数据、应用"], "a": 0, "an": "P163:系统集成的内容包括技术环境的集成、数据环境的集成和应用程序的集成", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-195", "s": "通过设置口令、密码和访问权限保护网络资源属于网络安全中的()。", "o": ["防火墙技术", "数据加密技术", "访问控制", "权限管理"], "a": 2, "an": "P164:安全子系统。网络安全主要关注的内容包括；使用防火墙技术，防止外部的侵犯；使用数据加密技术，防止任何人从通信信道窃取信息；访问控制，主要是通过设置口令、密码和访问权限保护网络资源。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-196", "s": "防止通信信道的信息被窃取，可以使用()。", "o": ["防火墙技术", "数据加密技术", "访问控制", "权限管理"], "a": 1, "an": "P164:使用数据加密技术，防止任何人从通信信道窃取信息。目前主要的加密技术包括对称加密算法(如DES)和非对称加密算法(如RSA)", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-197", "s": "数据集成可以分为基本数据集成、多级视图集成、()和多粒度数据集成四个层次。", "o": ["多维度集成", "单视图集成", "范式集成", "模式集成"], "a": 3, "an": "P165:数据集成可以分为基本数据集成、多级视图集成、模式集成和多粒度数据集成四个层次", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-198", "s": "对组织的标准化过程族进行裁剪，属于公共特性的成熟度等级种的()。", "o": ["非正规实施级", "规划和跟踪级", "充分定义级", "量化控制级"], "a": 2, "an": "Level 3:充分定义级", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-199", "s": "()不属于选择网络服务器的考虑因素。定义标准化过程3.1.1 对过程进行标准化3.1.2 对组织的标准化过程族进行裁剪3.2.1 在过程域的实施中使用充分定义的过程执行已定义的过程3.2.2 对过程域的适当工作产品进行缺陷评审3.2.3 通过使用已定义过程的数据管理该过程3.3.1 协调工程科目内部的沟通协调安全实施3.3.2 协调组织内不同组间的沟通3.3.3 协调与外部组间的沟通", "o": ["CPU的速度和数量", "内存容量和性能", "总线结构和类型", "服务商的类型"], "a": 3, "an": "P165:选择网络服务器时要考虑以下因素：①CPU的速度和数量；②内存容量和性能；③总线结构和类型；④磁盘容量和性能；⑤容错性能；⑥网络接口性能；⑦服务器软件等。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-200", "s": "J2EE的体系结构可以分为客户端层、服务器端组件层、()和信息系统层。", "o": ["网络层", "应用层", "EJB层", "中间件"], "a": 2, "an": "J2EE的体系结构可以分为客户端层、服务器端组件层、EJB层和信息系统层。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-201", "s": "从信息系统集成技术角度来看，()在最上层。主要解决()问题。", "o": ["数据集成、互通", "网络集成、互连", "软件集成、互适应", "应用集成、互操作性"], "a": 3, "an": "应用集成在最上层，主要解决应用的互操作性的问题。【GX202305】应用集成(互操作性)数据集成(互通)回络集成(互连)图5-10 系统集成栈", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-202", "s": "()可对用户可选字段的数据进行保护。", "o": ["对等实体认证服务", "数据保密服务", "数据完整性服务", "数据源点认证服务"], "a": 1, "an": "安全服务包括对等实体认证服务、数据保密服务、数据完整性服务、数据源点认证服务、禁止否认服务和犯罪证据提供服务等。*(1)对等实体认证服务：用于两个开放系统同等层中的实体建立链接或数据传输时，对方实体的合法性、真实性进行确认，以防假冒。*(2)数据保密服务：包括多种保密服务，为了防止网络中各系统之间的数据被截获或被非法存取而泄密，提供密码加密保护。数据保密服务可提供链接方式和无链接方式两种数据保密，同时也可对用户可选字段的数据进行保护。*(3)数据完整性服务：用以防止非法实体对交换数据的修改、插入、删除以及在数据交换过程中的数据丢失。*(4)数据源点认证服务：用于确保数据发自真正的源点，防止假冒。*(5)禁止否认服务：用以防止发送方在发送数据后否认自己发送过此数据，接收方在收到数据后否认自己收到过此数据或伪造接收数据，由两种服务组成：不得否认发送和不得否认接收。*(6)犯罪证据提供服务：指为违反国内外法律法规的行为或活动，提供各类数字证据、信息线索等。", "cm": ""}, {"c": 5, "cn": "信息系统工程", "no": "5-203", "s": "依据ISSE-CMM中公共特性的成熟度等级定义，()不属于ISSE-CMM的Level2:规划和", "o": ["将过程域执行的方法形成标准化和程序化", "对组织的标准化过程族进行裁剪文档", "在执行过程域中，使用文档化的标准和程序", "验证过程与可用标准的一致性"], "a": 1, "an": "第5章 信息系统工程P179,对组织的标准化过程族进行裁剪文档是Level3充分定义级的内容表5-15 公共特性的成熟度等级定义级别公  0, "an": "P187:有效和高效的项目管理是一个组织的战略能力。它使组织能够：*①将项目成果与业务目标联系起来*②更有效地展开市场竞争*③实现可持续发展*④通过适当调整项目管理计划，以应对外部环境改变给项目带来的影响等", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-027", "s": "关于项目描述，不正确的是()。", "o": ["时间、成本、范围和质量等项目管理测量指标，历来被视为确定项目是否成功的最重要的因素。确定项目是否成功还应考虑项目目标的实现情况", "从一个项目从范围、进度、预算来看是成功的，从业务角度来看应该也是成功的", "项目管理就是将知识、技能、工具与技术应用于项目活动，以满足项目的要求", "项目是组织创造价值和效益的主要方式"], "a": 1, "an": "P187,有可能一个项目从范围、进度、预算来看是成功的，但从业务角度来看并不成功，这是因为业务需求或市场环境在项目完成之前发生了变化", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-028", "s": "项目带来的效益可以是有形的、无形的或两者兼而有之，下列属于有形效益的是()。", "o": ["市场份额", "商标", "公共利益", "战略联盟"], "a": 0, "an": "P185:项目带来的效益可以是有形的、无形的或两者兼而有之。有形效益的例子包括：货币资产、股东权益、公共事业、固定资产、工具、市场份额等。无形效益的例子包括：商誉、声誉、商标、公共利益、战略联盟、品牌认知度等", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-029", "s": "一般而言，项目的范围确定后，项目的三个基本目标是()。", "o": ["时间、成本、质量标准", "时间、功能、成本", "成本、功能、质量标准", "时间、功能、质量标准"], "a": 0, "an": "P187,时间、成本、范围和质量等项目管理测量指标，历来被视为确定项目是否成功的最重要的因素", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-030", "s": "从项目、项目集、项目组合管理的目标来看，()注重于开展“正确”的工作，即“做正确的事”。", "o": ["项目组合管理", "单个项目管理", "大项目管理", "项目集管理"], "a": 0, "an": "P188,从组织的角度看：①项目和项目集管理的重点在于以“正确”的方式开展项目集和项目，即“正确地做事”;②项目组合管理则注重于开展“正确”的项目集和项目，即“做正确的事”。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-031", "s": "项目带来的效益可以是有形的、无形的或两者兼而有之，下列属于无形效益的是()。", "o": ["品牌认知度", "货币资产", "市场份额", "工具"], "a": 0, "an": "P185:项目带来的效益可以是有形的、无形的或两者兼而有之。有形效益的例子包括：货币资产、股东权益、公共事业、固定资产、工具、市场份额等。无形效益的例子包括：商誉、声誉、商标、公共利益、战略联盟、品牌认知度等", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-032", "s": "以下说法中不正确的是()。", "o": ["项目管理注重项目内部的依赖关系，以确定管理项目的最佳方法", "项目集管理注重项目集组成部分之间的依赖关系，以确定管理这些项目的最佳方法", "项目组合中的项目集和项目应有依赖关系", "运营管理是另外一个领域，不属于项目管理范围"], "a": 2, "an": "P190,项目组合中的项目集或项目不一定存在彼此依赖或直接相关的关联关系。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-033", "s": "关于项目及项目管理基础的描述，不正确的是()。", "o": ["项目是为提供一项独特产品、服务或成果所做的临时性努力", "项目所产生的产品、服务或成果具有临时性特点", "项目工作的目的在于得到特定的结果，即项目是面向目标的", "项目管理和日常运营管理的目标有着本质的不同"], "a": 1, "an": "P185:虽然项目是临时性工作，但其可交付成果可能会在项目终止后依然存在。B不正确", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-034", "s": "( 项目，对工作进行优先级排序，并提供所需资源，与组织战略保持一致", "项目集管理通过对其组成部分进行协调，对它们之间的依赖关系进行控制，从而实现既定收益", "项目管理使组织的目标得以实现"], "a": 0, "an": "P190,BCD是书中原话，A应该是项目组合、项目集和项目都需要符合组织战略，由组织战略驱动，并以不同的方式服务于战略目标的实现", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-042", "s": "关于项目组合和项目集的描述，不正确的是()。", "o": ["项目组合和项目集中都可能包含日常运作业务", "项目集是项目组合的一部分", "项目组合中的项目既可以位于项目集之内，也可以位于项目集之外", "项目组合中的项目集和项目应有依赖关系"], "a": 3, "an": "P190,项目组合中的项目集或项目不一定存在彼此依赖或直接相关的关联关系。D选项错误。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-043", "s": "某系统集成项目的项目经理在制定项目章程时，必须要考虑涉及并影响项目的环境和组织因素。()不属于环境和组织因素的内容。", "o": ["公司文化和结构", "员工绩效评估记录", "变更控制流程", "项目管理信息系统"], "a": 2, "an": "P191-192,变更控制流程属于流程类文件，属于组织过程资产", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-044", "s": "关于项目经理相关能力的描述，不正确的是()。", "o": ["项目管理、战略和商务、领导力是项目经理需要关注的技能", "人际交往占据项目经理的绝大部分工作内容", "领导力关注近期目标，关注可操作性的问题和问题的解决", "战略和商务技能有助于项目经理了解与项目相关的商业因素"], "a": 2, "an": "P198,项目经理需要重点关注三个方面的关键技能包括项目管理、战略和商务、领导力。项目管理：与项目、项目集和项目组合管理特定领域相关的知识、技能和行为，可以帮助达成项目目标。战略和商务：关于行业和组织的知识和专业技能，有助于提高绩效并取得更好的业务成果。领导力：指导、激励和带领团队所需的知识、技能和行为，可以帮助组织达成业务目标。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-045", "s": "为应对汽油紧缺，阿牛汽车公司批准一个低油耗车型的研发项目。这属于促成项目创建因素的()。", "o": ["新技术", "市场需求", "干系人需求", "社会需要"], "a": 1, "an": "P186。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-046", "s": "()的特点是先基于初始需求制订一套高层级的计划，再逐渐把需求细化到适合特定的规划周期所需的详细程度。", "o": ["预测型项目生命周期", "混合型项目生命周期", "适应型项目生命周期", "瀑布型项目生命周期"], "a": 2, "an": "P215,适应型生命周期。采用适应型开发方法的项目又称敏捷型或变更驱动型项目，适合于需求不确定，不断发展变化的项目。在每次迭代前，项目和产品愿景的范围被明确定义和批准，每次选代(又称“冲剌”)结束时，客户会对具有功能性的可交付物进行审查。审查时关键干系人会提供反馈，项目团队会更新项目待办事项列表，以确定下一次迭代中特性和功能的优先级。适应型项目生命周期的特点是先基于初始需求制定一套高层级计划，再逐渐把需求细化到适合特定规划周期所需的详细程度。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-047", "s": "价值交付系统包括项目如何创造价值、价值交付组件和信息流。其中，价值交付组件包括()。①战略；②项目组合；③项目集；④项目；⑤运营；⑥产品；⑦市场环境", "o": ["②③④⑤⑥", "②③④⑥⑦", "①②③④⑤", "①②③④⑥"], "a": 0, "an": "P221,可以单独或共同使用多种组件(例如项目组合、项目集、项目、产品和运营)以创造价值", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-048", "s": "价值驱动的项目管理知识体系关注价值的实现，包含了项目管理原则、绩效域、项目生命周期、过程组、十大知识领域和价值交付系统，其中()是基础，是所有项目干系人在整个项目生命周期过程中各项活动的行动指南。" ；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作；服务优先于领导是()。", "o": ["放任型", "交易型", "服务型", "魅力型"], "a": 2, "an": "P201,项目经理可以采用多种领导力风格，包括：①放任型(允许团队自主决策和设定目标，又被称为“无为而治型”);②交易型(根据目标、反馈和成就给予奖励);③服务型(做出服务承诺，处处先为他人着想；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作；服务优先于领导);④变革型(通过理想化特质和行为、鼓舞性激励、促进创新和创造，以及个人关怀提高追随者的能力);⑤魅力", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-087", "s": "可以将组成项目的各个过程归纳为5个过程组，启动过程组包括制定项目章程和()两个过程。", "o": ["收集需求", "识别项目干系人", "定义范围", "组织项目团队"], "a": 1, "an": "P220-221,启动过程组定义并批准项目或项目阶段。包括“制定项目章程”和“识别项目干系人”两个过程。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-088", "s": "关于项目价值的描述，不正确的是()。", "o": ["项目存在于组织中，为干系人创造价值", "价值以过程为导向并定量定义，以获得预期的经济收益为目标", "项目可通过提高效率、生产力、效果或响应能力来创造价值", "价值是项目成功的最终指标，可创造满足需要的新产品、服务或结果"], "a": 1, "an": "P205,关键点。项目管理者在坚持“聚焦于价值”原则时，应该关注的关键点包括：①价值是项目成功的最终指标；②价值可以在整个项目进行期间、项目结束或完成后实现；价值可以从定性和/或定量的角度进行定义和衡量；④以成果为导向，可帮助项目团队获得预期收益，从而创造价值；⑤评估项目进展并做出调整，使期望的价值最大化。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-089", "s": "处处先为他人着想；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作的能力是()领导力风格。", "o": ["服务型", "交易型", "变革型", "魅力型"], "a": 0, "an": "P201,服务型(做出服务承诺，处处先为他人着想；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作；服务优先于领导);", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-090", "s": "针对领导力和管理二者的区别，属于领导力的特征的是()。", "o": ["直接利用职位", "关注系统和架构", "关注可操作性的问题和问题的解决", "激发信任"], "a": 3, "an": "P200,", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-091", "s": "“领导力”指通过讨论或辩论方式与他人合作，带领他们从一个位置到另一个位置。哪个不属于领导力()。斤", "o": ["创新", "挑战现状", "关注人际关系", "关注赢利"], "a": 3, "an": "P200,团队管理与团队领导力的区别。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-092", "s": "根据项目的背景及其目标、干系人、治理和环境的不同应用合适的项目开发方法，使用“合适”的过程来实现预期成果，同时最大化价值、管理成本并提高速度是()原则。", "o": ["勤勉、尊重和关心他人", "营造协作的项目管理团队环境", "根据环境进行裁剪", "为实现目标而驱动变革"], "a": 2, "an": "P208,原则七：根据环境进行裁剪：根据项目的背景及其目标、干系人、治理和环境的不同应用合适的项目开发方法，使用“合适”的过程来实现预期成果，同时最大化价值、管理成本并提局速度。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-093", "s": "()指挥一个人执行一系列已知的预期行为从一个位置到另一个位置。()指通过讨论或辩论方式与他人合作，带领他们从一个位置到另一个位置。①人际关系技能；②沟通；③管理；④领导力", "o": ["①②", "①③", "②③", "③④"], "a": 3, "an": "P200,\"领导力”不等同于”管理”。\"管理\"指指挥一个人执行一系 管理概论", "no": "6-101", "s": "处处先为他人着想；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作的能力是()领导力风格。", "o": ["服务型", "交易型", "变革型", "魅力型"], "a": 0, "an": "项目经理可以采用多种领导力风格，包括：【口诀：夫人双脚没变】*①放任型(允许团队自主决策和设定目标，又被称为“无为而治型”);*②交易型(根据目标、反馈和成就给予奖励);*③服务型(做出服务承诺，处处先为他人着想；关注他人的成长、学习、发展、自主性和福利；关注人际关系、团体与合作；服务优先于领导);*④变革型(通过理想化特质和行为、鼓舞性激励、促进创新和创造，以及个人关怀提高追随者的能力);*⑤魅力型(能够激励他人；精神饱满、热情洋溢、充满自信；说服力强);*⑥交互型(结合了交易型、变革型和魅力型领导的特点)等。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-102", "s": "“无为而治型”是()领导力风格。", "o": ["放任型", "交易型", "变革型", "魅力型"], "a": 0, "an": "P201,放任型(允许团队自主决策和设定目标，又被称为“无为而治型”);", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-103", "s": "以下说法中，不正确的是()。", "o": ["项目经理还应该：①展现项目管理的价值；②提高组织对项目管理的接受度；③提高组织内现有PMO的效率。", "项目经理可能与其他项目经理一起，向PMO、项目组合或项目集经理报告。", "项目经理需要和职能经理经常沟通，但是不用向其报告", "在某些情况下，项目经理可以是临时被委任的外部顾问。"], "a": 2, "an": "P197,基于组织结构，项目经理有可能向职能经理报告。而在其他情况下，项目经理可能与其他项目经理一起，向PMO、项目组合或项目集经理报告。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-104", "s": "()是PMO应具备的特征。*①对PMO所辖全部项目的共享资源进行管理*②识别和制定项目管理方法、最佳实践和标准*③指导、辅导、培训和监督*④在项目约束条件下完成特定的项目成果性目标*⑤制定和管理项目政策、程序、模板及其他共享的文件(组织过程资产)", "o": ["①②③④", "②③④⑤", "①②③⑤", "①②③④⑤"], "a": 2, "an": "P194,PMO的一个主要职能是通过各种方式向项目经理提供支持，包括：①对PMO所辖全部项目的共享资源进行管理；②识别和制定项目管理方法、最佳实践和标准；③指导、辅导、培训和监督；④通过项目审计，监督项目对项目管理标准、政策、程序和模板的合规性；⑤制定和管理项目政策、程序、模板及其他共享的文件(组织过程资产);⑥对跨项目的沟通进行协调等。*④完成特定的项目成果性目标这个是项目组要做的事，不是PMO要做的事。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-105", "s": "关于领导力与管理的描述，不正确的是()。", "o": ["“管理”指指挥一个人执行一系列已知的预期行为从一个位置到另一个位置", "“领导力”指通过讨论或辩论方式与他人合作，带领他们从一个位置到另一个位置", "为获得成功，项目经理必须注重管理能力的锻炼，领导力可以在项目中成长", "直接利用职位权力属于管理"], "a": 2, "an": "P201,为获得成功，项目经理必须同时采用领导力和管理这两种方式。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-106", "s": "()对整个组织范围内的一个或多个项目承担最终责任。", "o": ["项目经理", "职能经理", "运营经理", "PMO"], "a": 3, "an": "P197,PMO、项目组合或项目集经理对整个组织范围内的一个或多个项目承担最终责任。", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-107", "s": "以下()不是领导力风格。", "o": ["放任型", "交易型", "共享型", "变革型"], "a": 2, "an": "P201,①放任型②交易型③服务型④变革型⑤魅力型⑥交互型", "cm": ""}, {"c": 6, "cn": "项目管理概论", "no": "6-108", "s": "()原则，使受影响者做好准备 目可行性研究报告：③报送组织的申请报告及主管部门的初审意见；④项目关键建设条件和工程等的协议文件：⑤必需的其他文件和资料等", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-015", "s": "项目可行性研究中，开发总成本一般不包括()。", "o": ["行政管理费", "销售与分摊费用", "财务费用和折旧", "运行维护费用"], "a": 3, "an": "P232:开发总成本一般划分为四大类：研发成本、行政管理费、销售与分销费用、财务费用和折旧。前三类成本的总和称为经营成本。开发成本在项目可行性研究中的用途为计算盈亏，计算净周转资金的需要量，并用于财务评价。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-016", "s": "以下()不属于项目评估的依据。", "o": ["项目建议书及其批准文件", "项目可行性研究报告", "报送组织的申请报告及主管部门的初审意见", "项目章程"], "a": 3, "an": "P234,项目评估的依据主要包括：①项目建议书及其批准文件；②项目可行性研究报告；③报送组织的申请报告及主管部门的初审意见；④项目关键建设条件和工程等的协议文件；⑤必需的其他文件和资料等。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-017", "s": "软、硬件租金、人员工资及福利、水电等公用设施使用费属于()。", "o": ["直接支出", "支持型", "非一次性支出", "项目支出"], "a": 2, "an": "P226:一次性支出包括开发费、培训费、差旅费、初试数据录入、设备购置费等费用非一次性支出包括软、硬件租金、人员工资及福利、水电等公用设施使用费，以及其他消耗品支出等。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-018", "s": "关于可行性研究的描述，正确的是()。", "o": ["试验室和中间工厂的试验是初步可行性研究的主要内容", "详细可行性研究一般是在对市场或者客户情况进行调查后，对项目进行的初步评估", "初步可行性研究与详细可行性研究在占有资源和研究细节方面是相同的", "辅助研究用于解决项目的核心问题，为判断是否具备必要的技术、实验、人力条件提供支持"], "a": 3, "an": "《蜗牛软考综合一本通》-7.2.2 初步可行性研究★★★★P228:定义：初步可行性研究一般是在对市场或者客户情况进行调查后，对项目进行的初步评估。可以从如下方面进行衡量，以便决定是否开始详细可行性研究：分析项目的前途，从而决定是否应该继续深入调查研究；初步估计和确定项目中的关键技术及核心问题，以确定是否需要解决；初步估计必须进行的辅助研究，以解决项目的核心问题，并判断是否具备必要的技术、实验、人力条件作为支持等。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-019", "s": "以下关于可行性研究的说法中，错误的是()。", "o": ["将有项目时的成本(效益)与无项目时的成本(效益)进行比较叫做增量净效益法(有无比较法)", "可行性研究的方法很多，如经济评价法、市场预测法、投资估算法和增量净效益法等", "投资费用一般包括固定资金及流动资金两大部分，固定资金中又分为设计开发费、设备费、场地费、安装", "初步可行性研究必须用到增量净效益法"], "a": 3, "an": "P230-231,初步可行性研究不是必须要用到。详细可行性研究可以用。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-020", "s": "项目评估指在()的基础上，由()根据国家颁布的政策、法规、方法、参数和条例等条件下进行评价、分析和论证。", "o": ["项目立项申请；项目承建方", "项目可行性研究；项目建设方", "项目立项申请；第三方", "项目可行性研究；第三方"], "a": 3, "an": "《蜗牛软考202405高项冲刺精华》-第7章【考点5】项目评估与决策★★★★★项目评估指在项目可行性研究的基础上，由第三方(国家、银行或有关机构),对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行评价、分析和论证，进而判断其是否可行的一个评估过程。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-021", "s": "()是项目发展周期的初始阶段，是国家或上级主管部门选择项目的依据，也是可行性研究的依据。", "o": ["项目建议书", "项目评估", "项目决策", "项目规划"], "a": 0, "an": "P225:立项申请又称为项目建议书，是项目建设单位向上级主管部门提交项目申请时所必须的文件，是该项目建设筹建单位根据国民经济的发展、国家和地方中长期规划、产业政策、生产力布局、国内外市场、所在地的内外部条件、组织发展战略等，提出的某一具体项目的建议文件，是对拟建项目提出的框架性总体设想。项目建议书是项目发展周期的初始阶段，是国家或上级主管部门选择项目的依据，也是可行性研究的依据。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-022", "s": "某系统开发项目邀请第三方进行项目评估，()不是项目评估的依据。", "o": ["项目建议书及其批准文件", "项目可行性研究报告", "报送单位的申请报告及主管部门的初审意见", "项目变更管理策略"], "a": 3, "an": "P234:项目评估的含义及其依据：项目评估指在项目可行性研究的基础上，由第三方(国家、银行或有关机构),对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行评价、分析和论证，进而判断其是否可行的一个评估过程。项目评估是项目投资前期蜗进行牛决策老管理师的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门高件的审批决策提供科学依据。项目评估的最终成果是项目评估报告。项目评估的依据包括如下项目：项目建议书及其批准文件。项目可行性研究报告。报送单位的申请报告及主管部门的初审意见。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-023", "s": "详细可行性研究的内容不包括()。", "o": ["网络物理布局设计", "信息系统架构及技术方案的确定", "投资、成本估算与资金筹措", "项目计划的制定"], "a": 3, "an": "P231:详细可行性研究所涉及的主要内容和方法包括：(1)市场需求预测。(2)部件和投入的选择供应。(3)信息系统架构及技术方案的确定。项目可行性研究中技术评价应反映下述几个方面；技术的先进性、技术的实用性、技术的可靠性、技术的连锁效果、技术后果的危害性等。(4)技术与设备选择。(5)网络物理布局设计。(6)投资、成本估算与资金筹措。项目总成本一般划分为四大类：研发成本、行政管理费、销售与分销费用、财务费用和折旧。前三类成本的总和称为经营成本。项目成本在项目可行性研究中的用途为计算盈亏，计算净周转资金的需要量，并用于财务评价。(7)经济评价及综合分析。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-024", "s": "某项目的可行性报告中有如下描述：“⋯为了规避风险，采用模块化开发的方法，即每个模块可以单独开发与销售，放到整个系统中又可以与其他模块协同工作，能够有效降低开发成本与风险⋯项目采用面向对象的、模块化的建模与开发方法，主体采用B/S结构，使用 Java语言开发，技术 手段成熟⋯开发出的系统可以提供较好的平台扩展性，能够有效推动项目成果的产业化，具有较 好的市场前景⋯项目运行严格执行采购招投标制，深入贯彻《国有企业物资采购管理暂行规定》,进一步堵塞管理漏洞⋯”这段描述中没有涉及的是()。", "o": ["技术可行性", "运行环境可行性", "风险因素及对策", "经济可行性"], "a": 1, "an": "P226-228:可行性研究包括技术可行性、经济可行性、社会效益可行性、运行环境可行性等。“为了规避风险，采用模块化开发的方法，即每个模块可以单独开发与销售，放到整个系统 中又可以与其他模块协同工作，能够有效降低开发成本与风险”就是考虑了风险因素和对策。“项目采用面向对象的、模块化的建模与开发方法，主体采用B/S结构，使用Java语言开发，技术手段成熟”属于技术可行性。“开发出的系统可以提供较好的平台扩展性，能够有效推蜗动项目牛成果老的师产业化，具有较好的市场前景”考虑了项目的投入产出，属于经济可行性。“项目运行严格执行采购招投标制，深入贯彻《国有企业物资采购管理暂行规定》,进一步堵塞管理漏洞”是关于项目建设内容，而运行环境主要考虑系统建成后，系统运行的管理制度、人员、素质等因素，因此，答案应是B。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-025", "s": "项目评估的依据主要包括：项目建议书及其批准文件、()报送组织的申请报告及主管部门的初审意见、项目关键建设条件和工程等的协议文件、必需的其他文件和资料等。", "o": ["需求调研报告", "绩效测量报告", "成本预测报告", "项目可行性研究报告"], "a": 3, "an": "P234,项目评估的依据包括如下：", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-026", "s": "项目可行性研究阶段的经营成本不包括()。", "o": ["财务费用", "研发成本", "行政管理费", "销售与分销费用"], "a": 0, "an": "P232:大多数投资前的项目可行性研究报告只算开发总成本，这是因为在项目可行性研究阶段对各项成本，无论是配件、劳动力或管理费用，作为整体估算要比计算单位产品成本简单一些。开发总成本一般划分为四大类：研发成本、行政管理费、销售与分销费用、财务费用和折旧。前三类成本的总和称为经营成本。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-027", "s": "关于项目可行性研究的描述不正确的是()。", "o": ["初步可行性研究报告，必须包含项目的主要投资支出", "初步的可行性研究报告可作为正式文件，支持项目决策", "初步可行性研究报告的核心内容不包括项目进度安排", "初步可行性研究是详细可行性研究的基础"], "a": 2, "an": "《蜗牛软考202405高项冲刺精华》第7章-【考点3】初步可行性研究★★★★P228:初步可行性研究的结果及研究的主要内容基本与详细可行性研究相同，应包含项进度安排，所以C不正确", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-028", "s": "关于可行性研究的描述，正确的是()。", "o": ["详细可行性研究由项目经理负责", "可行性研究报告在项目章程制定之后编写", "详细可行性研究是不可省略的", "可行性研究报告是项目执行文件"], "a": 2, "an": "P225:可行性研究是立项时期的工作，这个时候项目还没确定。所以ABD都不正确。机会研究、初步可行性研究、详细可行性研究、评估与决策是投资前时期的四个阶段。在实际工作中，前三个阶段依项目的规模和繁简程度可把前两个阶段省略或合二为一，但详细可行性研究是不可缺少的。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-029", "s": "项目经理窝件依据当前技术发展趋势和所掌握的技术能否支撑该项目的开发，进行可行性研究。小李进行的可行性研究属于()。", "o": ["经济可行性分析", "技术可行性分析", "运行环境可行性分析", "其他方面的可行性分析"], "a": 1, "an": "P226:技术可行性分析是指在当前市场的技术、产品条件限制下，能否利用现在拥有的以及可能拥有的技术能力、产品功能、人力资源来实现项目", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-030", "s": "在可行性报告中，“是否存在人力资源不足的问题，是否可以通过社会招聘或培训获得所需人", "o": ["技术可行性分析", "经济可行性分析", "社会效益可行性分析", "运行环境可行性分析"], "a": 0, "an": "P226:技术可行性分析一般应当考虑的因素：进行项目开发的风险。在给定的限制范围和时间期限内，能够设计出预期的系统并实现必须的功能和性能。人力资源的有效性。可以用于项目开发的技术人员队伍是否可以建立，是否存在人力资源不足、技术能力欠缺等问题，是否可以在市场上或者通过培训获得所需要的熟练技术人员。技术能力的可能性。相关技术的发展趋势和当前所掌握的技术是否支持该项目的开发，市场上是否存在支持该技术的开发环境、平台和工具。物资(产品)的可用性。是否存在可以用于建立系统的其他资源，如一些设备以及可行的替代产品等。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-031", "s": "()需要对项目在技术、经济、社会、运行环境、法律等方面进行深入的调查研究和分析，是一项费时、费力的工作。", "o": ["初步可行性研究", "详细可行性研究", "项目建议与立项中请", "评估与决策"], "a": 1, "an": "P228:初步可行性研究一般是在对市场或者客户情况进行调查后，对项目进行的初步评估。详细可行性研究需要对项目在技术、经济、社会、运行环境、法律等方面进行深入的调查研究和分析，是一项费时、费力的工作，特别是大型的或比较复杂的项目更是如此", "cm": ""}, {"c": 7, "cn": "项目立项管  ""}, {"c": 7, "cn": "项目立项管理", "no": "7-046", "s": "某系统开发项目邀请第三方进行项目评估，()不是项目评估的依据。", "o": ["项目建议书及其批准文件", "项目可行性研究报告", "项目章程", "报送单位的申请报告及主管部门的初审意见"], "a": 2, "an": "P234:项目评估的含义及其依据：项目评估指在项目可行性研究的基础上，由第三方(国家、银行或有关机构),对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行评价、分析和论证，进而判断其是否可行的一个评估过程。项目评估是项目投资前期蜗进行牛决策老管理师的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门的审批决策提供科学依据。项目评估的最终成果是项目评估报告。项目评估的依据包括如下项目：项目建议书及其批准文件。项目可行性研究报告。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-047", "s": "()用于分析品牌效益、竞争力效益、技术创新效益、人员提升收益、管理提升效益等的影响。", "o": ["技术可行性研究", "经济可行性分析", "运行环境可行性分析", "社会效益可行性研究"], "a": 3, "an": "P227:社会效益可行性研究用于分析品牌效益、竞争力效益、技术创新效益、人员提升收益、管理提升效益等的影响", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-048", "s": "()是项目投资前期进行决策管理的重要环节，其目的是审查项目的可行性研究的可靠性、真实性和客观性，为银行的贷款决策或者行政主管部门的审批决策提供科学依据。", "o": ["项目初步可行性研究", "项目详细可行性研究", "项目评估", "项目机会可行性研究"], "a": 2, "an": "P234:项目评估是项目投资前期进行决策管理的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门的审批决策提供科学依据", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-049", "s": "()当诸如设备和软件配置、处理速度要求、系统的工作负荷类型和负荷量等关键性因素变化时，对支出和收益产生影响的估计。", "o": ["支出分析", "收益分析", "收益投资比", "敏感性分析"], "a": 3, "an": "P226。敏感性分析。当诸如设备和软件配置、处理速度要求、系统的工作负荷类型和负荷量等关键性因素变化时，对支出和收益产生影响的估计。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-050", "s": "关于可行性研究的描述，不正确的是()。", "o": ["项目除了需要考虑经济可行性分析外，往往还需要对项目的社会效益进行分析", "运行环境是制约信息系统发挥效益的关键", "环境效益是对组织内部关注的效益", "信息系统项目的可行性研究除了前面介绍的技术、经济、社会效益和运行环境可行性分析外，还包括了诸如法律可行性、政策可行性等方面的可行性分析"], "a": 2, "an": "P227:对组织内部：品牌效益、竞争力效益、技术创新效益、人员提升收益、管理提升效益。对社会发展：公共效益、文化效益、环境效益、社会责任感效益、其他收益。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-051", "s": "项目建议书中不包含()。", "o": ["产品方案或服务的市场预测", "项目建设必需的条件", "项目可行性研究", "项目的必要性"], "a": 2, "an": "P225:", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-052", "s": "关于项目评估和项目论证的描述。不正确的是：()。", "o": ["项目论证应该围绕市场需求、开发技术、财务经济三个方面展开调查和分析", "项目论证一般可分为机会研究、初步可行性研究和详细可行性研究三个阶段", "项目评估由项目建设单位实施，目的是审查项目可行性研究的可靠性。真实性、和客观性，为银行的贷款决策或行政主管部门的审批决策提供依据", "项目评估的依据包括项目建议书及其批准文件、项目可行性研究报告、报送单位的申请报告及主管部门的初审意见等一系列文件"], "a": 2, "an": "P234:项目评估是由第三方实施。项目评估指在项目可行性研究的基础上，由第三方(国家、银行或有关机构)根据国家颁布的政策、法规、方法、参数和条例等，从项目(或企业)、国民经济、社会角度出发，对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行评价、分析和论证，进而判断其是否可行的一个评估过程。在第三版中有项目论证，第四版里没有，虽然这题里有项目论证，但是错的地方在项目评估里，所以我们也可以参考", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-053", "s": "在进行项目可行性分析时，需要在()过程中针对投入/产出进行对比分析，以确定项目的收益率和投资回收期等。", "o": ["经济可行性分析", "技术可行性分析", "运行环境可行性分析", "法律可行性分析"], "a": 0, "an": "P226:经济可行性分析主要是对整个项目的投资及所产生的经济效益进行分析，具体包括支出分析、收益分析、投资回报分析以及敏感性分析等。除了上述的经济方面的分析外，一般还需要对项目的社会效益进行分析。例如，通过项目的实施，可以在管理水平、技术手段、人员素质等方面获得潜在的效益。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-054", "s": "项目建议书中不包含()。", "o": ["产品方案或服务的市场预测", "项目建设必需的条件", "项目的市场预测", "风险因素及对策"], "a": 3, "an": "P225:项目建议书应该包括的核心内容如下。*①项目的必要性。*②项目的市场预测。*③产品方案或服务的市场预测。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-055", "s": "关于项目评估与决策的描述，不正确的是()。", "o": ["项目评估是项目投资前期进行决策管理的重要环节", "项目评估的最终成果是项目评估报告", "项目评估是由第三方开展的判断项目是否可行的一个评估过程", "项目评估为银行的贷款决策或行政主管部门的审批决策提供科学依据"], "a": 2, "an": "P234:项目评估是项目投资前期进行决策管理的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门的审批决策提供科学依据。", "cm": ":项目评估的目的是审查可行性研究的可靠性、真实性和客观性，评估一个项目是否可行，是可行性研究的内容，不是项目评估的内容。"}, {"c": 7, "cn": "项目立项管理", "no": "7-056", "s": "在可行性报告中，“相关技术的发展趋势和当前所掌握的技术是否支持该项目的开发，市场上是否存在支持该技术的开发环境、平台和工具”属于()的内容。", "o": ["技术可行性分析", "经济可行性分析", "社会效益可行性分析", "运行环境可行性分析"], "a": 0, "an": "P226:技术可行性分析一般应当考虑的因素：进行项目开发的风险。在给定的限制范围和时间期限内，能够设计出预期的系统并实现必须的功能和性能。人力资源的有效性。可以用于项目开发的技术人员队伍是否可以建立，是否存在人力资源不足、技术能力欠缺等问题，是否可以在市场上或者通过培训获得所需要的熟练技术人员。技术能力的可能性。相关技术的发展趋势和当前所掌握的技术是否支持该项目的开发，市场上是否存在支持该技术的开发环境、平台和工具。物资(产品)的可用性。是否存在可以用于建立系统的其他资源，如一些设备以及可行的替代产品等。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-057", "s": "关于可行性研究的描述，不正确的是()。", "o": ["技术可行性决定了项目方向，技术路线估计错误会影响项目最终成败", "信息系统项目可行性研究还包括法律可行性、社会可行性等方面", "运行环境是信息系统发挥效益的关键，需重点分析其运行环境的可行性", "经济可行性分析是对经济效益进行分析，不含对项目的社会效益分析"], "a": 3, "an": "P226:经济可行性分析主要是对整个项目的投资及所产生的经济效益进行分析，具体包括支出分析、收益分析、投资回报分析以及敏感性分析等。除了上述的经济方面的分析外，一般还需要对项目的社会效益进行分析。例如，通过项目的实施，可以在管理水平、技术手段、人员素质等方面获得潜在的效益。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-058", "s": "以下关于项目可行性研究内容的叙述，()是不正确的。", "o": ["技术可行性是从项目实施的技术角度，合理设计技术方案，并进行评审和评价", "经济可行性主要是从资源配置的角度衡量项目的价值，从项目的投资及所产生的经济效益进行分析", "可行性研究不涉及合同责任、知识产权等法律方面的可行性问题", "社会可行性主要分析项目对社会的影响，包括法律道德、民族宗教、社会稳定性等"], "a": 2, "an": "P228:信息系统项目的可行性研究除了技术、经济和运行环境可行性分析外，还包括了诸如法律可 行性、社会可行性等方面的可行性分析。也会涉及到合同责任、知识产权等法律方面的可行性问 题。社会可行性主要分析项目对社会的影响，包括法律道德、民族宗教、社会稳定性等。故C是不正确的。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-059", "s": "辅助(功能)研究是项目可行性研究中的一项重要内容。以下叙述中，正确的是()。", "o": ["辅助(功能)研究只包括项目的某一方面，而不是项目的所有方面", "辅助(功能)研究只能针对项目的初步可行性研究内容进行辅助的说明", "辅助(功能)研究只涉及项目的非关键部分的研究", "辅助(功能)研究的费用与项目可行性研究的费用无关"], "a": 0, "an": "P228:辅助(功能)研究包括项目的一个或几个方面，但不是所有方面，并且只能作为初步项目可行性研究、项目可行性研究和大规模投资建议的前提或辅助。辅助研究分类如下：*①对要设计开发的产品进行的市场研究，包括市场的需求预测以及预期的市场渗透情况。*②配件和投入物资的研究，包括项目使用的基本配件和投入物资的当前和预测的可获得性，以及这些配件和投入的目前和预测的未来价格趋势。*③试验室和中间工厂的试验，根据需要进行试验以决定具体配件是否合适，设计方案是否可行。*④网络物理布局设计。*⑤规模的经济性研究，一般作为技术选择研究的一个部分进行。如果牵扯到几种技术和几种市场规模，则分开进行这些研究，但研究不扩大到复杂的技术问题中去。这些研究的主要任务是在考虑各种选择的技术、投资费用、开发成本和价格之后，评价最具经济性的设计开发规模。这种研究通常对几种规模的设计开发能力进行分析，研究该项目的主要特性，并计算出每种规模的结果。*⑥设备选择研究，如果项目的设备涉及的部门多，来源分散，而且成本各不相同就要进行这种研究。一般在投资或实施阶段进行设备定货，包括准备投标、招标并对其进行评价，以及定货和交货。如果涉及巨额投资，项目的构成和经济性在极大的程度上取决于设备的类型及其成本和经营成本，所选设备直接影响项目的经营效果。在这种情况下，如果得不到标准化的成本，那么设备选择研究就是必不可少的。", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-060", "s": "某信息系统项目最终完成的详细可行性研究报告的主要内容包括以下部分：①项目背景；②可行性研究的结论；③项目提出的技术背景；④项目的技术发展现状；⑤编制项目建议书的过程及必要性；⑥市场情况调查分析；⑦客户现行系统业务、资源、设施情况调查。该可行性报告缺少()。", "o": ["风险分析、项目实施进度计划", "风险分析、项目评估方法", "市场需求预测、项目计划", "市场需求预测、项目评估方法"], "a": 0, "an": "P233:", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-061", "s": "项目评估一般包括以下几个步骤，正确的执行顺序是()。*①成立评估小组*②分析与评估*③开展调查研究*④编写、讨论、修改评估报告*⑤评估报告定稿并发布*⑥召开专家论证会", "o": ["①②③④⑤⑥", "②①③⑤④⑥", "①②③④⑥⑤", "①③②④⑥⑤"], "a": 3, "an": "P234-235:项目评估的工作程序：成立评估小组一开展调查研究一分析与评估一编写、讨论、修改评估报告一召开专家论证会一评估报告定稿并发布", "cm": ""}, {"c": 7, "cn": "项目立项管理", "no": "7-062", "s": "项目评估报告内容大纲不包括()。", "o": ["项目概况", "详细评估意见", "总结和建议", "项目建议书"], "a": 3, "an": "P235:项目评估报告内容大纲应包括项目概况、详细评估意见、总结和建议等内容", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-001", "s": "随着新技术的不断涌现，社交网络、多元文化、虚拟团队和新的价值观等的出现，组织和项目所处的环境发生了很大变化。在执行并管理整合时，项目经理需要意识到项目背景和这些新因素，决定如何在项目中最好地利用这些新环境因素，以获得项目成功。这是属于()。", "o": ["背景层面执行整合", "认知层面执行整合", "过程层面执行整合", "管理层面执行整合"], "a": 0, "an": "P237,过程层面执行整合项目管理过程中有些过程可能只发生一次，但很多过程在整个项目期间会相互重叠并重复发生多次。认知层面执行整合项目经理应尽量熟练掌握所有项目管理知识领域，帮助项目经理将经验、见解、领导力、技术以及商业管理技能运用到项目管理中，并帮助项目经理整合这些知识领域所涵盖的过程，实现预期的项目结果。背景层面执行整合在执行并管理整合时，项目经理需要意识到项目背景和环境因素，决定如何在项目中最好地利用这些新环境因素，以获得项目成功。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-002", "s": "作为项目的一种特征或属性，复杂性是指()。*①包含多个部分*②不同部分之间存在差异性*③不同部分之间的动态交互作用*④交互作用产生的行为远远大于各部分简单的相加", "o": ["①②③", "②③④", "①③④", "①②③④"], "a": 2, "an": "P238:项目的复杂性来源于组织的系统行为、人类行为以及组织或环境中的不确定性。作为项目的一种特征或属性，复杂性的含义：①包含多个部分；②不同部分之间存在一系列关联：③不同部分之间的动态交互作用；④这些交互作用所产生的行为远远大于各部分简单的相加(侧如突发性行为)。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-003", "s": "用于在出现偏差时选择要执行的纠正措施或纠正措施和预防措施的组合，属于()。", "o": ["备选方案分析", "偏差分析", "趋势分析", "决策"], "a": 0, "an": "P260:备选方案分析：用于在出现偏差时选择要执行的纠正措施或纠正措施和预防措施的组合。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-004", "s": "以下()不属于整合管理的过程。", "o": ["制定项目章程", "指导与管理项目工作", "管理项目知识", "识别干系人"], "a": 3, "an": "P240,D识别干系人属于干系人管理的过程", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-005", "s": "项目执行过程中，客户要求对项目范围进行修改，项目经理首先应该()。", "o": ["向CCB提交正式的交更请求", "通知客户在项目进展过程中不可以进行范围修改", "重写项目计划添加新的需求并实施", "听取高级管理层关于预算和资源计划的建议"], "a": 0, "an": "P262,出现变更，首先就要提交变更请求", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-006", "s": "通常由项目管理团队开展大部分规划工作。在初始规划工作完成、执行(在发)阶段开始时，项目团队其他成员才参与进来。这种情况下，开工会议将在项目执行阶段开始时召开。这种适用于()。", "o": ["小型项目", "大型项目", "多阶段项目", "迭代型项目"], "a": 1, "an": "P247,开工会议召开时机取决于项目特征：对于小型项目：通常由同一个团队开展项目规划和执行。这种情况下，由于执行团队参与了规划，项目在启动之后就会开工。对于大型项目：通常由项目管理团队开展大部分规划工作。在初始规划工作完成、执行(在发)阶段开始时，项目团队其他成员才参与进来。这种情况下，开工会议将在项目执行阶段开始时召开。对于多阶段项目：通常在每个阶段开始时都要召开一次开工会议。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-007", "s": "关于项目整合管理的描述不正确的是()。", "o": ["批准的变更请求可能导致修改正式受控的项目文件", "CCB通过对变更方案的审查决策，对变更进行管理实施和控制", "组织的结构文化管理实践和可持续性是影响指导与管理项目工作过程的因素", "项目管理计划的任何组件都可用作指导与管理项目工作的输入"], "a": 1, "an": "第8章-项目整合管理P252,B不正确，CCB是决策机构，不负责具体的管理实施和控制", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-008", "s": "利用已有的组织知识来创造或改进项目成果，是()过程的作用。", "o": ["管理项目知识", "指导与管理项目工作", "监控项目工作", "结束项目或阶段"], "a": 0, "an": "P255:管理项目知识定义管理项目知识是使用现有知识并生成新知识，以实现项目目标并且帮助组织学习的过程。作用①利用已有的组织知识来创造或改进项目成果；②使当前项目创造的知识可用于支持组织运营和未来的项目或阶段。开展次数需要在整个项目期间开展", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-009", "s": "关于项目整体变更控制的描述，正确的是()。", "o": ["项目整体变更控制过程只用于项目的执行和监控阶段", "只有客户或项目管理人员才能提出变更申请请求", "每项记录在案的变更请求都必须由一位责任人批准或否决", "CCB对变更请求的审批结果不可更改"], "a": 2, "an": "P262,每项记录在案的变更请求都必须由一位责任人批准或否决，这个责任人通常是项目发起人或项目经理", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-010", "s": "变更控制工具需要支持的配置管理活动不包括()。", "o": ["识别配置项", "记录并报告配置项状态", "进行配置项核实与审计", "配置项控制"], "a": 3, "an": "P264,配置控制和变更控制的关注点不同：配置控制重点关注可交付成果及各个过程的技术规范；变更控制则重点关注识别、记录、批准或否决对项目文件、可交付成果或基准的变更。识别配置项：识别与选择配置项，为定义与核实产品配置、标记产品和文件、管理变更和明确责任提供基础。进行配置项核实与审计：通过配置核实与审计，确保项目的配置项组成的正确性，以及相应的变更都被登记、做出变更决定：审查变更，批准、否决、推迟对项目文件、可交付成果或基准的变更或做出其他决定。变更控制工具需要支持的配置管理活动包括：记录并报告配置项状态：对各个配置项的信息进行记录和报告。评估、批准、跟踪和正确实施，确保配置文件所规定的功能要求都已实现。跟踪变更：确认变更被登记、评估、批准和跟踪，并向干系人传达最终结果。变更控制工具还需要支持的变更管理活动包括：识别变更：识别并选择过程或项目文件的变更项。记录变更：将变更记录为合适的变更请求。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-011", "s": "以下不属于项目管理计划的是()。", "o": ["项目生命周期描述", "开发方法", "范围基准", "项目进度计划"], "a": 3, "an": "P239,项目进度计划属于项目文件(范围、需求、进度、成本、质量、资源、沟通、风险、采购、干系人、变更、配置)管理计划项目管理计划十二管理计划：四基准+1描述+1方法：(范围、进度、成本、绩效测量)基准；项目生命周期描述；开发方法", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-012", "s": "在项目执行的过程中，一名干系人确定了一个新需求，该需求对项目是否成功起到关键的作用，项目经理接下来应该()。", "o": ["为该需求建立变更请求，提交给变更控制委员会审批", "评估重要性，以确定是否执行变更流程", "寻求项目发起人对变更的批准", "考虑该需求比较关键，安排相关人员进行修改"], "a": 0, "an": "P262,出现变更，首先就要提交变更请求。B在本题中不合适，说了该需求对项目是否成功起到关键的作用，所以不用再评估重要性，以确定是否执行变更流程", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-013", "s": "对于项目整合管理，在整个项目期间开展的过程不包括()。", "o": ["制订项目管理计划", "指导与管理项目工作", "管理项目知识", "实施整体变更控制"], "a": 0, "an": "P240,制订项目管理计划仅开展一次或仅在项目的预定义时开展", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-014", "s": "关于实施整体变更控制过程，不正确的是()。", "o": ["在基准确定之前，变更无须正式受控于实施整体变更控制过程", "变更请求可能影响项目范围、产品范围以及任一项目管理计划组件或任一项目文件", "在整个项目生命周期的任何时间，并不是所有参与项目的干系人都可以提出变更请求", "尽管也可以口头提出，但所有变更请求都必须以书面形式记录，并纳 前终止，只要关键干系人都允许，客户付完尾款后就可以终止项目"], "a": 3, "an": "P266,如果项目在完工前提前终止，结束项目或阶段过程还需要制定程序，调查和记录提前", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-098", "s": "配置管理和变更管理是项目管理中非常重要的组成部分，两者相比，配置管理重点关注()。", "o": ["项目可交付成果及各个过程技术之间的匹配", "识别、记录对项目文件的更改", "批准或否决对项目文件的改变", "对项目可交付成果或基准变更的记录"], "a": 0, "an": "P264,配置控制重点关注可交付成果及各个过程的技术规范之间的匹配问题，而变更控制则着眼于识别、记录、批准或否决对项目文件、可交付成果或基准的变更", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-099", "s": "()属于工作绩效数据。*①关键绩效指标(KPI);②挣值分析；③进度活动的实际开始日期；④可交付成果状态；⑤合同绩效信息；*⑥缺陷的数量", "o": ["①②③④", "①③④⑥", "②③⑤⑥", "③④⑤⑥"], "a": 1, "an": "P253,工作绩效数据是在执行项目工作的过程中，从每个正在执行的活动中收集到的原始观察结果和测量值。数据通常是最低层次的细节，在工作执行过程中收集数据，再交由10大知识领域的相应的控制过程做进一步分析。例如，工作绩效数据包括已完成的工作、关键绩效指标(KPI)、技术绩效测量结果、进度活动的实际开始日期和完成日期、已完成的故事点、可交付成果状态、进度进展情况、变更请求的数量、缺陷的数量、实际发生的成本、实际持续时间等。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-100", "s": "()不属于变更管理中涉及的配置管理活动。", "o": ["识别配置项", "记录并报告配置项状态", "进行配置项核实与审计", "版本管理"], "a": 3, "an": "P264,变更管理中涉及的配置管理活动包括：识别配置项、记录并报告配置项状态、进行配置项核实与审计", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-101", "s": "关于变更请求，()是不正确的。", "o": ["批准的变更请求是实施整体变更控制过程的输出，包括经项目经理审查和批准的变更请求，必要时需要经变更控制委员会(CCB)审查和批准", "CCB是作业机构，不是决策机构", "通常CCB的工作是通过评审手段来决定项目基准是否需要变更，但不提出变更方案", "CCB由项目所涉及的主要干系人共同组成，通常包括用户和项目所在组织管理层的决策人员"], "a": 1, "an": "P252,CCB是决策机构，不是作业机构", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-102", "s": "变更控制工具还需要支持的变更管理活动不包括()。", "o": ["识别变更", "做出变更决定", "跟踪变更", "结束变更"], "a": 3, "an": "P264,变更控制工具还需要支持的变更管理活动包括：识别变更：识别并选择过程或项目文件的变更项记录变更：将变更记录为合适的变更请求做出变更决定：审查变更，批准、否决、推迟对项目文件、可交付成果或基准的变更或做出其他决定跟踪变更：确认变更被登记、评估、批准和跟踪，并向干系人传达最终结果", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-103", "s": "()是为实现项目目标而领导和执行项目管理计划中所确定的工作，并实施已批准变更的过程。", "o": ["制定项目管理计划", "制定项目章程", "指导与管理项目工作", "监控项目工作"], "a": 2, "an": "P251,指导与管理项目工作是为实现项目目标而领导和执行项目管理计划中所确定的工作，并实施已批准变更的过程", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-104", "s": "属于整体变更控制成果的是()。*①变更请求；②项目管理计划更新；③工作绩效信息；④工作绩效报告；⑤变更日志；⑥项目文件更新", "o": ["①②⑤", "④⑤⑥", "②③⑥", "②⑤⑥"], "a": 3, "an": "P265,整体变更控制的输出包括：批准的变更请求，变更日志，项目管理计划更新，项目文件更新", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-105", "s": "关于可交付成果的理解，不正确的是()。", "o": ["可交付成果是在某一过程、阶段或项目完成时，必须产出的任何独特并可核实的产品、成果或服务能力", "可交付成果包含项目管理计划中的组成部分", "可交付成果完成后，如需变更，只要不涉及到基准，可以不执行变更控制，但是如果涉及基准，那么就需要执行变更控制", "用配置管理工具和程序来支持对可交付成果的多个版本的控制"], "a": 2, "an": "P253,可交付成果是在某一过程、阶段或项目完成时，必须产出的任何独特并可核实的产品、成果或服务能力。它通常是项目的结果，包括项目管理计划的组成部分。一旦完成了可交付成果的第一个版本，就应该执行变更控制。用配置管理工具和程序来支持对可交付成果(如文件、软件和构件)的多个版本的控制。", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-106", "s": "关于实施整体变更控制过程，不正确的是()。", "o": ["在基准确定之前，变更无须正式受控于实施整体变更控制过程", "变更请求可能影响项目范围、产品范围以及任一项目管理计划组件或任一项目文件", "在整个项目生命周期的任何时间，并不是所有参与项目的干系人都可以提出变更请求", "尽管也可以口头提出，但所有变更请求都必须以书面形式记录，并纳入变更管理和(或)配置管理系统中"], "a": 2, "an": "P262,实施整体变更控制过程贯穿项目始终，项目经理对此承担最终责任。变更请求可能影响项目范围、产品范围以及任一项目管理计划组件或任一项目文件。在整个项目生命周期的任何时间，参与", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-107", "s": "下面针对项目整体变更控制过程的叙述不正确的是()。", "o": ["配置管理的相关活动贯穿整体变更控制始终", "整体变更控制过程主要体现在确定项目交付成果阶段", "整体变更控制过程贯穿于项目的始终", "整体变更控制的结果可能引起项目范围、项目管理计划、项目交付成果的调整"], "a": 1, "an": "P262,B错误。整体变更控制过程贯穿于项目的始终", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-108", "s": "指导与管理项目工作过程的输出包括()。*①可交付成果；②工作绩效数据；③批准的变更请求；④项目文件更新", "o": ["①③④", "①②④", "②③④", "①②③"], "a": 1, "an": "P253-254,批准的变更请求是指导与管理项目工作的输入，而不是输出", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-109", "s": "结束项目或阶段过程的主要作用包括()。*①存档项目或阶段信息*②利用已有的组织知识，改进项目成果*③对项目工作的可交付成果进行综合管理*④确定项目工作的基础*⑤释放组织团队资源", "o": ["①②⑤", "①⑤", "①③⑤", "①④"], "a": 1, "an": "P266,结束项目或阶段定义结束项目或阶段是终结项目、阶段或合同的所有活动的过程。作用①存档项目或阶段信息，完成计划的工作；②释放组织团队资源以展开新的工作。开展次数仅开展一次或仅在项目的预定义时开展", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-110", "s": "关于配置控制和变更控制的理解，不正确的是()。", "o": ["配置控制重点关注可交付成果及各个过程的技术规范", "变更控制则重点关注识别、记录、批准或否决对项目文件、可交付成果或基准的变更", "通过配置核实与审计，确保项目的配置项组成的正确性", "变更管理活动需要变更控制工具的支持，配置管理活动不需要"], "a": 3, "an": "P264,配置管理活动和变更管理活动都需要变更控制工具的支持", "cm": ""}, {"c": 8, "cn": "项目整合管理", "no": "8-111", "s": "()不是“指导与管理项目执行”过程的成果。", "o": ["可交付成果", "工作绩效数据", "变更请求", "项目管理计划"], "a": 3, "an": "P253-254,D错误。项目管理计划是制订项目管理计划的成果。指导与管理项目执行过程的成果有：可交付成果、工作绩效数据、变更请求、项目管理计划更新、项目文件更新、问题日志。", "cm": ""}, {"c": 8
