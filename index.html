且要让管理层能够监视和控制项目的进度和预算", "WBS中的元素必须有人负责，而且只有一个人负责", "分包出去的工作的WBS不需要包含在整个项目中"], "a": 3, "an": "P288,WBS应包括项目管理工作(因为管理是项目具体工作的一部分),也要包括分包出去的工作", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-007", "s": "关于范围管理的描述，正确的是()。", "o": ["定义范围管理是为了记录如何定义、确认和控制项目范围及产品范围，而创建范围管理计划的过程", "范围管理计划包含配置管理活动和需求优先级排序过程", "范围管理计划是非常详细的正式的计划", "规划范围管理的作用是在整个项目期间对如何管理范围提供指南和方向"], "a": 3, "an": "P275,规划范围管理是为了记录如何定义、确认和控制项目范围及产品范围，而创建范围管理计划的过程。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-008", "s": "以下关于范围管理的说法错误的是()。", "o": ["在敏捷型生命周期中，范围会在整个项目期间被定义和再定义", "在敏捷型生命周期中，在每次迭代中，都会重复开展两个过程：①确认范围；②控制范围", "需求比较明确，变化不大的情况适用采取敏捷型开发方法", "在预测型项目中，经过批准的项目范围说明书、工作分解结构(WBS)和相应的WBS词典构成项目范围基准"], "a": 2, "an": "P274,采用敏捷或适应型生命周期，旨在应对大量变更，需要干系人持续参与项目。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-009", "s": "以下属于功能需求的是()。", "o": ["可靠性", "安全性", "流程", "服务水平"], "a": 2, "an": "P280,解决方案需求：为满足业务需求和干系人需求，产品、服务或成果必须具备的特性、功能和特征。解决方案需求又进一步分为功能需求和非功能需求：功能需求：描述产品应具备的功能，例如，产品应该执行的行动、流程、数据和交互；非功能需求：是对功能需求的补充，是产品正常运行所需的环境条件或质量要求，例如，可靠性、保密性、性能、安全性、服务水平、可支持性、保留或清除等", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-010", "s": "在WBS字典中，可不包括的是()。", "o": ["工作概述", "账户编码", "管理储备", "资源需求"], "a": 2, "an": "WBS词典可能包括账户编码标识、工作描述、假设条件和制约因素、负责人或组织单元、进度里程碑、相关的进度活动、所需资源、成本估算、质量要求、验收标准、技术参考文献、协议信息等。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-011", "s": "项目范围是否完成和产品范围是否完成分别以()作为衡量标准。", "o": ["项目管理计划，产品需求", "范围说明书，WBS", "范围基线，范围定义", "合同，工作说明书"], "a": 0, "an": "P272,产品范围：指某项产品、服务或成果所具有的特征和功能。产品范围的完成情况是根据产品需求来衡量的。项目范围：包括产品范围，是为交付具有规定特性与功能的产品、服务或成果而必须完成的工作。项目范围的完成情况是根据项目管理计划来衡量的。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-012", "s": "关于确认范围管理过程的叙述，正确的是()。", "o": ["项目团队成员主要关注项目范围中自己参与的元素和负责的元素", "项目实施单位的管理层主要关注产品或服务范围，客户主要关注项目制约因素", "确认范围过程的作用是为所要支付的内容提供架构", "符合验收标准的可交付成果应由项目经理正式签字批准"], "a": 0, "an": "P290-291,管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织承受范围，是否在投入产出上具有合理性。【老板关心钱】客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。【客户关心产品和服务】项目管理人员关注项目制约因素：关心项目可交付成果是否足够和必须完成，时间、资金和资源是否足够，主要的潜在风险和预备解决的方法。【管理人员关注能否完成】项目团队成员主要关心项目范围中自己参与的元素和负责的元素。【成员关注自己负责的活】", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-013", "s": "项目组成员小李常驻用户现场开发，经常收到用户提出的新需求。针对有些新需求。针对有些修改工作量很小的需求，小李直接进行了修改，用户对此非常满意，但却遭到项目经理的批评，这是因为()。", "o": ["小李没有把项目经理放在眼里", "项目经理认为小李收了用户的好处", "小李的行为可能造成项目范围蔓延", "小李所作的工作没有给项目带来经济效益"], "a": 2, "an": "P293,范围变更过程中经常遇见的问题：项目范围蔓延。未经控制的产品或项目范围的扩大(未对时间、成本和资源做相应调整)被称为范围蔓延。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-014", "s": "在项目开发阶段，用需求跟踪矩阵进行跟踪时发现，某交付成果在需求跟踪矩阵里并未找到出处，这种情况一般是()所造成。", "o": ["确认范围没做好", "范围蔓延", "范围镀金", "定义范围有问题"], "a": 2, "an": "某交付成果在需求跟踪矩阵里并未找到出处，这说明可能，第一：需求跟踪矩阵中的需求记录遗漏了，第二：范围镀金了，也就是做了个原本没有的需求。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-015", "s": "()是控制范围常用的工具和技术。", "o": ["引导式研讨会", "产品分析", "偏差分析", "标杆对照"], "a": 2, "an": "P294,偏差分析：用于将基准与实际结果进行比较，以确定偏差是否处于临界值区间内或是否有必要采取纠正或预防措施。趋势分析：旨在审查项目绩效随时间的变化情况，以判断绩效是正在改善还是正在恶化。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-016", "s": "()属于项目范围控制使用的工具和技术。", "o": ["偏差分析", "实验设计", "敏感性分析", "回归分析"], "a": 0, "an": "P294,控制范围工具与技术：数据分析(偏差分析、趋势分析)", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-017", "s": "适用于规划范围管理的数据分析技术是(),用于评估、收集需求，详述项目和产品范围，创造产品，确认范围和控制范围的各种方法。", "o": ["备选方案分析", "趋势分析", "根本原因分析", "偏差分析"], "a": 0, "an": "P276。适用于规划范围管理的数据分析技术是备选方案分析。备选方案分析技术用于评估、收集需求，详述项目和产品范围，创造产品，确认范围和控制范围的各种方法。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-018", "s": "()把从头脑风暴中获得的创意整合成一张图，用以反映创意之间的共性与差异，激发新创意。", "o": ["亲和图", "思维导图", "文件分析", "系统交互图"], "a": 1, "an": "P279,思维导图：把从头脑风暴中获得的创意整合成一张图，用以反映创意之间的共性与差异，激发新创意。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-019", "s": "高件作为一个大项目的项目经理，最近将其中一个子项目分派给了一个分包商，李华是分包商的项目经理，刚刚从事项目管理工作，但是与王工比较熟悉。王工可建议李华首先()。", "o": ["遵照王工为项目制定的WBS,直接使用王工确定的工作包来管理子项目", "制定该子项目的WBS", "建立类似的编码结构，以便于应用公共项目管理信息系统", "建立一个WBS词典来显示详细的人员分工"], "a": 1, "an": "王工作为承建方项目经理分配给分包商的WBS肯定不会制订的很精确，所以需要分包商的", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-020", "s": "()不是收集需求时数据收集的方法。", "o": ["头脑风暴", "投票", "焦点小组", "标杆对照"], "a": 1, "an": "P278,收集需求的方法：1.专家判断；2.数据收集(头脑风暴、访谈、焦点小组、问卷调查、标杆对照);3.数据分析(文件分析);4.决策(投票、独裁型决策制定、多标准决策分析);5.数据表现(亲和图、思维导图);6.人际关系与团队技能(名义小组技术、观察和交谈、引导);7.系统交互图；8.原型", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-021", "s": "关于项目范围确认及有关活动，以下说法错误的是()。", "o": ["可以通过检查来实现范围的确认", "检查包括测量、审查与确认等活动", "范围确认的目的就是形成项目范围说明书", "检查也可被称为审查、产品评审和走查"], "a": 2, "an": "P289,C错误。范围确认的目的是阶段性的验收项目的可交付成果，提高项目验收的可能性。形成项目范围说明书是定义范围的工作。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-022", "s": "在()生命周期中，项目开始时就对项目可交付成果进行定义，对任何范围变化都要进行变更管理。", "o": ["预测型", "适应型", "敏捷型", "迭代型"], "a": 0, "an": "P274,在预测型项目中，经过批准的项目范围说明书、工作分解结构(WBS)和相应的WBS词典构成项目范围基准。只有通过正式变更控制程序，才能进行基准变更。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-023", "s": "关于需求管理的描述，正确的是()。", "o": ["需求文件应该是一份包括内容提要、细节描述和附件等的详细文件", "只有明确的(可测量和可测试的)、可跟踪的、完整的、相互独立的，且全部干系人愿意认可的需求，才能作为基准", "需求文件之间的跟踪用于检查需求分解中可能出现的错误或遗漏", "需求跟踪矩阵中可以不体现测试策略和测试场景的跟踪结果"], "a": 2, "an": "P281,需求管理也可以是一份简单文件，也可以是详细文件；所以A错误只有明确的(可测量和可测试的)、可跟踪的、完整的、相互协调的，且主要干系人愿意认可的需求，才能作为基准；所以B错误需求跟踪矩阵中可以体现测试策略和测试场景的跟踪结果；所以D错误", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-024", "s": "()含有与需求相关的信息，在确认范围中被使用。", "o": ["需求跟踪矩阵", "需求文件", "质量报告", "经验教训登记册"], "a": 0, "an": "P291,可作为确认范围过程输入的项目文件主要包括：*(1)需求文件：将需求与实际结果比较，以决定是否有必要进行变更，采取纠正措施或预防措施。*(2)需求跟踪矩阵：含有与需求相关的信息，包括如何确认需求。*(3)质量报告：该报告内容可包括由团队管理或需上报的全部质量保证事项、改进建议，以及在控制质量过程中发现的情况的概述。在验收产品之前，需要查看所有这些内容。*(4)经验教训登记册：在项目早期获得的经验教训可以运用到后期阶段，以提高验收可交付成果的效率与效果。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-025", "s": "以下关于范围变更的说法错误的是()。", "o": ["范围变更是不可避免的，范围变更如果不加以控制可能引起范围蔓延", "客户对产品的需求发生变化其实就是一种范围变更", "范围变更过程中应多让客户参与，以免后期进行范围确认时发生问题", "范围变更控制流程与整体变更控制流程应分开设计，确保项目发生范围变更时遵从范围变更控制流程，由于范围变更引起了其他变更时遵从整体变更流程"], "a": 3, "an": "P293,控制范围过程应该与其他项目管理知识领域的控制过程协调开展。D错误。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-026", "s": "()不属于需求跟踪矩阵的内容。", "o": ["业务需要、机会、目的和目标", "项目目标", "测试策略和测试场景", "项目的验收标准"], "a": 3, "an": "P281,跟踪需求的内容包括：①业务需要、机会、目的和目标；②项目目标；③项目范围和WBS可交付成果；④产品设计；⑤产品开发；⑥测试策略和测试场景；⑦高层级需求到详细需求等", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-027", "s": "描述产品、服务或成果的边界和验收标准，属于()过程的作用。", "o": ["收集需求", "确认范围", "规划范围管理", "定义范围"], "a": 3, "an": "P272-273,定义范围作用：描述产品、服务或成果的边界和验收标准。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-028", "s": "()描述了项目可交付物和产生这些可交付物所必须做项目工作，就此在所有项目干系人之间建立了共识。", "o": ["SOW", "配置管理计划", "范围说明书", "工作分解结构"], "a": 2, "an": "P284,项目范围说明书是对项目范围、主要可交付成果、假设条件和制约因素的描述。它记录了整个范围，包括：项目和产品范围；详细描述了项目的可交付成果；代表项目干系人之间就项目范围所达成的共识。为便于管理干系人的期望，项目范围说明书可明确指出哪些工作不属于蜗牛老师项目范围。项目范围说明书帮助项目团队进行更详细的规划，在执行过程中指导项目团队工作，并为评价变更请求或额外工作是否超过项目边界提供基准。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-029", "s": "关于收集需求的描述，不正确的是：()。", "o": ["德尔菲技术通过组织专家讨论，并投票来排列最有用创意", "QFD对质量需求分为基本需求、期望需求和意外需求", "概括性的需求说明文件不能作为基准", "如不能将设计元素或测试案例回溯到需求文件，就可能出现镀金行为"], "a": 0, "an": "P279,A错误。名义小组技术：是用于促进头脑风暴的一种技术，通过投票排列最有用的创意，以便进一步开展头脑风暴或优先排序", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-030", "s": "数据收集技术中，()说法是错误的。", "o": ["焦点小组是召集预定的干系人和主题专家，了解他们对所讨论的产品、服务或成果的期望和态度。由一位受过训练的主持人引导大家进行互动式讨论", "问卷调查是指设计一系列书面问题，向众多受访者快速收集信息", "访谈通过与干系人直接交谈，来获取信息的正式或非正式的方法。访谈的典型做法是向被访者提出预设和即兴的问题，并记录他们的回答", "头脑风暴通过投票排列最有用的创意，以便进一步开展头脑风暴或优先排序"], "a": 3, "an": "P279,名义小组技术是用于促进头脑风暴的一种技术，通过投票排列最有用的创意，以便进一步开展头脑风暴或优先排序", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-031", "s": "范围确认中，()关心项目的可交付成果是否足够完成产品或服务。", "o": ["项目管理人员", "客户", "项目团队成员", "高层领导"], "a": 1, "an": "P290-291,确认范围主要是项目干系人对项目的范围进行确认和接受的工作。每个人对项目范围所关注的方面是不同的：*(1)管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织承受范围是否在投入产出上具有合理性。*(2)客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。*(3)项目管理人员主要关注项目制约因素关心项目可交付成果是否足够和必须完成，时间、资金和资源是否足够，主要的潜在风险和预备解决的方法。*(4)项目团队成员主要关注项目范围中自己参与的元素和负责的元素通过定义范围中的时间检查自己的工作时间是否足够，自己在项目范围中是否有多项工作，而这些工作是否有冲突的地方。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-032", "s": "()属于控制范围的活动。", "o": ["与客户仔细讨论项目范围说明书，并请客户签字", "当客户提出新的需求时，说服用户放弃新的需求", "确认项目范围是否覆盖了需要完成的产品或服务进行的所有活动", "确认每项工作是否有明确的质量标准"], "a": 1, "an": "A错误。属于定义范围B正确。影响范围变更的因素属于控制范围活动。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-033", "s": "表示需求和别的系统元素之间的联系链的最普遍方式是使用需求跟踪能力矩阵。如果软件开发人员发现，有一个孤立的设计元素在需求跟踪能力矩阵中不能回溯到需求，但其表明一个正当的功能，则说明()。", "o": ["需求规格说明书漏掉了一项需求", "设计元素不满足用户需求", "需求规格不满足用户需求", "在需求跟踪能力矩阵中不需要建立用户需求与设计元素之间的联系"], "a": 0, "an": "依题意：一个正当的功能说明功能是必须得。在需求规格说明书里找不到出处，说明需求规格说明书有误，漏掉了需求。所以选A", "cm": "本题虽然是老题，但也有一定的参考价值"}, {"c": 9, "cn": "项目范围管理", "no": "9-034", "s": "规划范围管理需要参考项目管理计划中的()。", "o": ["项目生命周期描述", "风险管理计划", "干系人登记册", "进度管理计划"], "a": 0, "an": "P275,规划范围管理中使用的项目管理计划组件主要包括：质量管理计划：在项目中实施组织的质量政策、方法和标准的方式会影响管理项目和产品范围的方式。项目生命周期描述：定义了项目从开始到完成所经历的一系列阶段。开发方法：开发方法定义了项目是采用预测型、适应型还是混合型开发方法。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-035", "s": "以下关于需求跟踪的叙述中，不正确的是()。", "o": ["需求跟踪是为了确认需求，并保证需求被实现", "需求跟踪可以改善产品质量", "需求跟踪可以降低维护成本", "需求跟踪能力矩阵用于表示需求和别的系统元素之间的联系链"], "a": 0, "an": "P281,需求跟踪矩阵是把产品需求从其来源连接到能满足需求的可交付成果的一种表格。使用需求跟踪矩阵，把每个需求与业务目标或项目目标联系起来，有助于确保每个需求都具有业务价值。需求跟踪矩阵提供了在整个项目生命周期中跟踪需求的一种方法，有助于确保需求文件中被批准的每项需求在项目结束的时候都能实现并交付。最后，需求跟踪矩阵还为管理产品范围变更提供了框架需求跟踪只是跟踪需求，并不是确认需求", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-036", "s": "由客户或者发起人正式签字批准的文件是()。", "o": ["核实的可交付成果", "工作绩效信息", "验收的可交付成果", "可交付成果"], "a": 2, "an": "P292:验收的可交付成果：符合验收标准的可交付成果应该由客户或发起人正式签字批准。应该从客户或发起人那里获得正式文件，证明干系人对项目可交付成果的正式验收。这些文件将提交给结束项目或阶段过程。核实的可交付成果，是控制质量的输出，属于内部验收结果。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-037", "s": "范围管理计划中不包含()。", "o": ["制定项目范围说明书", "确定如何审批和维护范围基准", "正式验收已完成的项目可交付成果", "确定并正式验收可交付成果的正确性"], "a": 3, "an": "P276,范围管理计划用于指导如下过程和相关工作：*①制定项目范围说明书*②根据详细项目范围说明书创建WBS*③确定如何审批和维护范围基准*④正式验收已完成的项目可交付成果", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-038", "s": "小王负责一个管理信息系统项目，最近在与客户共同进行的质量审查中发现一个程序模块不符合客户的需求，进行追溯时，也未发现相应的变更请求。最终小王被迫对这一模块进行再设计并重新编程。造成此项返工的原因可能是()。", "o": ["未进行需求管理", "未进行范围确认", "未进行变更管理", "质量管理过严"], "a": 1, "an": "进行追溯时，也未发现相应的变更请求，说明有过需求管理。造成问题的原因应该是未进行范围确认，所以选B。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-039", "s": "范围管理中，需要裁剪的考虑因素不包括()。", "o": ["知识和需求管理", "确认和控制", "开发方法", "WBS的结构"], "a": 3, "an": "P274,裁剪时应考虑的因素包括：(1)知识和需求管理(2)确认和控制(3)开发方法(4)需求的稳定性(5)治理", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-040", "s": "()是把产品需求从其来源连接到能满足需求的可交付成果的一种表格。", "o": ["系统交互图", "决策矩阵", "需求跟踪矩阵", "UC矩阵"], "a": 2, "an": "P281,需求跟踪矩阵是把产品需求从其来源连接到能满足需求的可交付成果的一种表格。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-041", "s": "关于需求的理解，不正确的是()。", "o": ["让干系人积极参与需求的探索和分解工作，并仔细确定、记录和管理对产品、服务或成果的需求，能直接促进项目成功", "为更好地对项目进行了解，收集需求的过程应在整个项目期间定期开展", "需求是指根据特定协议或其他强制性规范，产品、服务或成果必须具备的条件或能力", "需求包括发起人、客户和其他干系人的已量化且书面记录的需要和期望"], "a": 1, "an": "P276,收集需求：仅开展一次或仅在项目的预定义时开展。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-042", "s": "关于需求收集的描述，不正确的()。", "o": ["需求文件描述的是各单一需求如何满足项目的业务需求", "作为基准的需求应该是明确的、可量化的、完整的和相互独立的", "需求跟踪矩阵是一种表格，可以把每个需求与业务目标联系起来", "测试策略和测试场景也是需求跟踪的内容"], "a": 1, "an": "P280,需求文件描述各种单一需求将如何满足与项目相关的业务需求。一开始，可能只有高层级的需求，然后随着有关需求信息的增加而逐步细化。只有明确的(可测量和可测试的)、可跟踪的、完整的、相互协调的，且主要干系人愿意认可的需求，才能作为基准。所以B错误。需求跟踪矩阵通常包括有以下内容，具体取舍根据项目需要：①业务需要、机会、目的和目标；②项目目标；*③项目范围和WBS可交付成果；④产品设计；⑤产品开发；⑥测试策略和测试场景；⑦高层级需求到详细需求等", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-043", "s": "下面属于项目范围控制活动的是()。", "o": ["对项目的绩效情况进行分析，确定是否偏离设定的范围基准", "对详细的范围说明书进行评审，提交客户签字确认", "与客户充分沟通以获取项目的详细需求", "与客户开展审查或检查活动，判断工作和交付成果是否符合设定的标准"], "a": 0, "an": "B属于定义范围的工作。C属于收集需求的工作。D属于确认范围的工作。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-044", "s": "在项目范围确认时，经常会使用群体决策技术，在以下群体决策技术中，()是根据群体中超过50??员的意见作出决策。", "o": ["一致同意原则", "大多数原则", "相对多数原则", "独裁原则"], "a": 1, "an": "不是课本原话。大多数原则获得群体中超过50??员的支持，就能做出决策。把参与决策的小组人数定为奇数，防止因平局而无法达成决策", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-045", "s": "在预测型生命周期中，在开展确认范围、控制范围及其他控制过程时，()被用作比较的基础。", "o": ["基准", "未完成项", "WBS", "需求跟踪矩阵"], "a": 0, "an": "P274,在预测型生命周期中，在开展确认范围、控制范围及其他控制过程时，基准被用作比较的基础。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-046", "s": "在创建工作分解结构过程中，项目相关人员要()。", "o": ["进行时间估算和成本估算", "执行WBS", "对WBS 给予确认并对此达成共识", "编制绩效报告"], "a": 2, "an": "AD都和创建WBS无关，B执行WBS的工作属于指导和制订项目工作，C正确", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-047", "s": "某公司承担了一个新项目，为一家小型制造企业开发协同工作系统。该制造企业之前没有使用过协同工作系统，业务比较复杂，需求会持续变更，作为项目经理应通过()来确保项目顺利完成。", "o": ["项目前期多花时间，尽可能的明确和细化需求", "更改项目完成时间，提前进行验收，以便处理验收时发现的问题", "在开发中采用迭代开发的方式，及时调整功能", "制定需求管理计划，规划如何分析、记录和管理需求"], "a": 3, "an": "A错误。既然需求会持续变更，那么前期就不应该过于细化需求。B错误。明显不正确C没有D好。D最切合题意。通过制订一系列的流程和方法来应对各种可能发生的变化，这是是范围管理的首要事情。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-048", "s": "以下关于需求跟踪的叙述中，()是不正确的。", "o": ["逆向需求跟踪检查设计文档、代码、测试用例等工作产品是否都能在《需求规格说明书》中找到出处", "需求跟踪矩阵可以把每个需求与业务目标或项目目标联系起来", "需求跟踪矩阵为管理产品范围变更提供框架", "如果按照“需求开发-系统设计-编码-测试”这样的顺序开发产品，由于每一步的输出就是下一步的输入，所以不必担心设计、编程、测试会与需求不一致，可以省略需求跟踪"], "a": 3, "an": "D错误，虽然遵守了流程，但不代表就不会遗漏需求，所以还是要用跟踪矩阵跟踪", "cm": "本题虽然是老题，但也有一定的参考价值"}, {"c": 9, "cn": "项目范围管理", "no": "9-049", "s": "以下说法正确的是()。", "o": ["可交付成果经过客户确认后就不能再变更了", "核实的可交付成果是确认范围的输出", "验收的可交付成果需要得到客户的正式签字确认", "确认范围过程通常先于控制质量过程，二者也可同时进行"], "a": 2, "an": "可交付成果：是指导与管理项目工作的输出，属于原始内部交付成果。一旦完成了可交付成果的第一个版本，就应该执行变更控制。可以变更，但是要走变更流程。核实的可交付成果，是控制质量的输出，属于内部验收结果。验收的可交付成果：符合验收标准的可交付成果应该由客户或发起人正式签字批准。应该从客户或发起人那里获得正式文件，证明干系人对项目可交付成果的正式验收。这些文件将提交给结束项目或阶段过程。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-050", "s": "关于确认范围的描述，不正确的是()。", "o": ["确认范围的作用之一是确保验收过程具有客观性", "确认范围过程通常先于控制质量过程，二者也可同时进行", "在确认范围时，要检查可交付成果是否有明确的质量标准", "管理层、客户、项目管理人员在确认范围时的关注点有所不同"], "a": 1, "an": "P290,通常情况下，在确认范围前，项目团队需要先进行质量控制工作，例如，在确认软件项目的范围之前，需要进行系统测试等工作，以确保确认工作的顺利完成。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-051", "s": "在需求文件中，()的需求可作为基准使用。*①可测量和可测试；②项目经理认可；③完整且可跟踪；④相对独立无依赖", "o": ["①②", "①③", "③④", "②③"], "a": 1, "an": "P280,只有明确的(可测量和可测试的)、可跟踪的、完整的、相互协调的，且主要干系人愿意认可的需求，才能作为基准", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-052", "s": "某项目在执行过程中，软件的需求基线已经确定后，客户需要增加新的功能，但该需求变更会对已经完成系统的稳定性有较大影响。作为项目负责人处理这些需求变更，下列()做法是不合适的。", "o": ["利用原型法给用户提供预览，以帮助准确把握用户的真实需求", "可以跟客户说不，并与其商议在后续项目或下一版本中满足他们的要求", "秉承“客户至上”的原则，召集有关人员开始变更工作，满足客户的要求", "利用在项目初期文档化的视图、范围、限制，与变更项比较，决定是否采用此项变更"], "a": 2, "an": "P293,控制项目范围确保所有变更请求、推荐的纠正措施或预防措施都通过实施整体变更控制过程进行处理。在变更实际发生时，也需要采用控制范围过程来管理这些变更。控制范围过程应该与其他项目管理知识领域的控制过程协调开展。未经控制的产品或项目范围的扩大(未对时间、成本和资源做相应调整)被称为范围蔓延。项目经理应该首先对变更申请做初审评估，帮助客户把握真实需求，影响客户的变更因素，这些都属于控制范围的范畴。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-053", "s": "()不是规划范围管理过程的输入。", "o": ["项目章程", "项目管理计划", "质量管理计划", "需求管理计划"], "a": 3, "an": "P275,需求管理计划规划范围管理过程的输出", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-054", "s": "需要在整个项目期间定期开展的过程是()。", "o": ["定义范围", "创建WBS", "确认范围", "控制范围"], "a": 2, "an": "P272-273,规划范围管理：仅开展一次或仅在项目的预定义时开展收集需求：仅开展一次或仅在项目的预定义时开展定义范围：需要在整个项目期间反复开展创建WBS:仅开展一次或仅 )反映当前需求。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-063", "s": "以下关于范围管理的说法中，不正确的是()。", "o": ["标杆对照所采用的可比组织可以是内部的，也可以是外部的", "WBS最低层的组成部分称为工作包，包括计划的工作", "范围基准是经过批准的范围说明书、WBS和相应的WBS词典，范围基准是项目管理计划的组成部分", "高层管理主要关注项目可交付成果是否足够和必须完成，时间、资金和资源是否足够"], "a": 3, "an": "P290-291,管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织承受范围，是否在投入产出上具有合理性。【老板关心钱】客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。【客户关心产品和服务】项目管理人员关注项目制约因素：关心项目可交付成果是否足够和必须完成，时间、资金和资源是否足够，主要的潜在风险和预备解决的方法。【管理人员关注能否完成】项目团队成员主要关心项目范围中自己参与的元素和负责的元素。【成员关注自己负责的活】", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-064", "s": "需求管理计划是项目管理计划的组成部分，其内容不包括()。", "o": ["如何规划、跟踪和报告各种需求活动", "配置管理活动", "测量指标及使用这些指标的理由", "如何定义和分解范围"], "a": 3, "an": "P276,需求管理计划是项目管理计划的组成部分，主要内容包括：*①如何规划、跟踪和报告各种需求活动*②配置管理活动，例如，如何启动变更，如何分析其影响，如何进行追溯、跟踪和报告，以及变更审批权限*③需求优先级排序过程*④测量指标及使用这些指标的理由*⑤反映哪些需求属性将被列入跟踪矩阵等。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-065", "s": "范围管理裁剪时需要考虑的因素不包括()。", "o": ["知识和需求管理", "需求的稳定性", "治理", "WBS的层级"], "a": 3, "an": "P274,裁剪时应考虑的因素包括：知识和需求管理，确认和控制，开发方法，需求的稳定性，治理。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-066", "s": "()用于确认项目可交付成果的成功完成或其他项目需求的实现的任何条件或标准。", "o": ["业务需求", "解决方案需求", "质量需求", "过渡与就绪需求"], "a": 2, "an": "P281,质量需求：用于确认项目可交付成果的成功完成或其他项目需求的实现的任何条件或标准，例如，测试、认证、确认等。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-067", "s": "关于项目范围管理过程的描述不正确的是()。", "o": ["采用敏捷或适应型生命周期，旨在应对大量变更，需要干系人持续参与项目", "在预测型项目中，只有通过正式变更控制程序才能变更项目范围基准", "在预测型项目中，通过多次迭代来开发可交付成果，使用未完成项反映当前需求", "在适应型或敏捷型生命周期中，在每次迭代开始时都可以定义或批准详细的范围"], "a": 2, "an": "P274,敏捷或适应型◆ 敏捷或适应型方法特意在项目早期缩短定义和协商范围的时间，为后续细化范围、明确范围争取更◆ 规划阶段：每次迭代开始时定义和批准详细的范围。在每次迭代中，都会重复开展三个过程：①收◆ 执行和控制阶段：在适应型或敏捷型生命周期中，发起人和客户代表应该持续参与项目。在每次迭多的时间。敏捷方法有目的地构建和审查原型，并通过多次发布版本来明确需求，范围会在整个项集需求；②定义范围；③创建WBS。目期间被定义和再定义。采用敏捷或适应型生命周期，旨在应对大量变更，需要干系人持续参与项目。通过多次迭代来开发可交付成果。", "cm": "◆ 敏捷型管理：在开始时只花少量时间进行范围定义，目的是为了快速进入开发状态。在之后的开发过程◆ 预测型管理：在开始时花大量时间进行详细的需求分析和范围定义，形成范围基准。在之后的开发过程中，会存在大量的变更，通过快速迭代和反复确认来管理范围。中，按照计划来进行，有涉及基准的变更，那么走变更流程，通过变更控制来管理范围。"}, {"c": 9, "cn": "项目范围管理", "no": "9-068", "s": "关于收集需求管理过程及相关技术的描述，正确的是()。", "o": ["需求跟踪矩阵是把产品需求从其来源链接到能满足需求的可交付成果的一种表格", "原型法是一种结构化的头脑风暴形式，通过投票排列最有用的创意", "故事板是一种原型技术，是对产品范围的可视化描绘，可以直观显示业务系统的交互方式", "收集需求管理过程为规划范围管理过程莫定基础，需要反复开展，贯穿于整个项目生命周期"], "a": 0, "an": ";P276-281,原型法：在实际制造预期产品之前，先造出该产品的模型。原型包括微缩产品、计算机生成的二维和三维模型、实体模型或模拟。原型法支持渐进明细的理念，需要经历从模型创建、用户体验、反馈收集到原型修改的反复循环过程。【比如：售楼中心都会有一个沙盘】故事板是一种原型技术，通过一系列的图像或图示来展示顺序或导航路径。【PPT】D不正确，规划范围管理过程是收集需求的基础", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-069", "s": "关于范围控制的描述，正确的是()。", "o": ["控制进度是控制范围的一种有效的方式", "项目执行组织本身发生变化不会引起范围变更", "范围变更控制必须和其他控制过程综合在一起", "政府政策的变化不可以成为范围变更的理由"], "a": 2, "an": "A错误。范围是基础，控制范围能有效控制进度和成本，但是控制进度和成本不一定能控制范围。B错误。项目执行组织发生变化，那么事业环境因素和资源有可能就会发生变化，可能会缺少相关资源，那么有可能会引起范围变更。C正确。变更肯定需要走变更流程，那么需要和变更控制综合到一起。D一看就不正确，还有什么比政府政策更大的呢。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-070", "s": "关于范围确认和范围控制的描述，正确的是()。", "o": ["当变更会对进度，成本产生较大影响时，变更申请不应该被通过", "客户和项目团队成员往往有在当前版本中加入所有功能的意愿", "确认范围后该项目的范围不能再更改", "由于政府政策调整而导致项目范围的变更申请，可直接通过"], "a": 1, "an": "A错误。变更只要通过了CCB的审批，那么按变更流程去执行即可C错误。确认范围后项目范围并非不可在修改，只是再次修改可能会引起时间、资源上的变化。D错误。因为政策原因调整也需要走变更流程。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-071", "s": "关于确认范围和质量控制的描述，不正确的是：()。", "o": ["确认范围关注可交付成果的验收", "质量控制关注可交付成果的正确性及是否满足质量要求", "确认范围和质量控制均由组织内部质量部门实施", "确认范围和质量控制都可以通过检查的方法来进行"], "a": 2, "an": "P290,确认范围过程与控制质量过程的不同之处在于，前者关注可交付成果的验收，而后者关注可交付成果的正确性及是否满足质量要求。控制质量过程通常先于确认范围过程，但二者也可同时进行。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-072", "s": "以下关于可交付成果的说法错误的是()。", "o": ["可交付成果是指导与管理项目的输出之一", "从控制质量过程输出的核实的可交付成果是确认范围过程的输入", "验收的可交付成果是确认范围过程的输出之一，由获得授权的干系人正式签字批准", "结束项目或阶段的输入是最终产品"], "a": 3, "an": "P266,结束项目或阶段的输出是最终产品、服务或成果", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-073", "s": "关于范围管理计划的描述，不正确的是()。", "o": ["包括收集需求和管理需求的过程", "包括制定项目范围说明书", "规定了正式验收已完成的项目可交付成果", "规定了根据详细项目范围说明书创建WBS"], "a": 0, "an": "P276,范围管理计划用于指导如下过程和相关工作：*①制定项目范围说明书*②根据详细项目范围说明书创建WBS*③确定如何审批和维护范围基准*④正式验收已完成的项目可交付成果A属于需求管理计划的内容", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-074", "s": "在项目范围管理中，企业管理层主要关注()。", "o": ["产品的范围", "项目范围投入产出的合理性", "交付成果是否满足质量要求", "项目过程的合理性"], "a": 1, "an": "P290-291,管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织承受范围，是否在投入产出上具有合理性。客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。项目管理人员主要关注项目制约因素：关心项目可交付成果是否足够和必须完成，时间、资金和资源是否足够，主要的潜在风险和预备解决的方法。项目团队成员主要关心项目范围中自己参与的元素和负责的元素。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-075", "s": "在需求跟踪过程中，检查设计文档、代码、测试用例等工作成果是否都能在《产品需求规格说明书》中找到出处的方法属于()。", "o": ["逆向跟踪", "正向跟踪", "双向跟踪", "系统跟踪"], "a": 0, "an": "从说明书到产品是正向跟踪，从产品到说明书是逆向跟踪。", "cm": "本题虽然是老题，但也有一定的参考价值"}, {"c": 9, "cn": "项目范围管理", "no": "9-076", "s": "关于范围确认和质量控制的说法，错误的是()。", "o": ["确认范围应该贯穿项目的始终", "通常情况下，在确认范围前，项目团队需要先进行质量控制工作", "验收的可交付成果是范围确认的输入", "确认范围的一般步骤包括：①确定需要进行范围确认的时间；②识别范围确认需要哪些投入；③确定范围正式被接受的标准和要素；④确定范围确认会议的组织步骤；⑤组织范围确认会议"], "a": 2, "an": "P292,验收的可交付成果是范围确认的输出", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-077", "s": "()包括收到的变更请求的数量，接受的变更请求的数量或者确认和完成的可交付成果的数量；控制范围过程产生的()包括收到的变更的分类、识别的范围偏差和原因、偏差对进度和成本的影响，以及对将来范围绩效的预测。", "o": ["工作绩效报告；工作绩效信息", "工作绩效数据；工作绩效信息", "工作绩效信息；工作绩效报告", "工作绩效数据；工作绩效报告"], "a": 1, "an": "P294-295,工作绩效数据：包括已完成的工作、关键绩效指标(KPI)、技术绩效测量结果、进度活动的实际开始日期和完成日期、已完成的故事点、可交付成果状态、进度进展情况、变更请求的数量、缺陷的数量、实际发生的成本、实际持续时间等。工作绩效信息：包括收到的变更的分类、识别的范围偏差和原因、偏差对进度和成本的影响，以及对将来范围绩效的预测。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-078", "s": "某项目经理在定义项目范围时绘制了如下所示的WBS。根据该图，下列说法中()是不正确的。项目阶段1阶段2可交付成果3子项目：4子项目：*中可交付成果2.1 可交付成果2.2 可交付成果2.3可交付成果4.1果亦可交付成果4.m重可交付成果2.2.1 可交付成果2.2.2可交付成果4.1.J⋯**工作包2.2.2.1可交付成果4.1.2工作包3.1工作包4.1.2.1子项目：2.2.2.2工作包3.2工作包4.1.2.2工作包3.3工作包2.2.2.2.1工作包4.1.2.3工作包2.2.2.2.2", "o": ["可重新设计该图，将项目生命周期阶段作为第一层", "可重新设计该图，按照组织结构形式进行工作分解", "可重新设计该图，以列表形式展示", "可重新设计该图，将外包出去的摸块从图中去除以达到精简目的"], "a": 3, "an": "P288,WBS 应包括项目管理工作，也要包括分包出去的工作。所以D不正确", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-079", "s": "关于范围管理相关的描述，不正确的是()。", "o": ["范围管理计划描述了如何定义，制定，监督，控制和确认项目范围", "范围管理计划可以是正式的或非正式，非常详细或高度概括的", "需求管理计划描述如何分析、记录和管理需求", "需求管理计划是编制范围管理计划时的依据"], "a": 3, "an": "P276,需求管理计划是范围管理计划的输出", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-080", "s": "某项目已制定了详细的范围说明书，并完成了WBS分解。在项目执行过程中，项目经理在进行下一周工作安排的时候，发现WBS中遗漏了一项重要的工作，那么接下来他应该首先()。", "o": ["组织项目组讨论，修改WBS", "修改项目管理计划，并重新评审", "汇报给客户，与其沟通，重新编写项目文档", "填写项目变更申请，对产生的工作量进行估算，等待变更委员会审批"], "a": 3, "an": "遗漏了一项重要的工作，所以涉及基准。所有针对基准的变更，必须遵循变更控制流程进行，在提交变更申请后，由CCB进行批准。所以选D 可交付成果4.1.x", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-081", "s": "关于工作分解结构(WBS)的描述，正确的是()。", "o": ["WBS 必须符合项目范围", "WBS元素必须由多个人负责", "WBS 必需控制在5-8层", "WBS 的编制只需要项目团队成员参与"], "a": 0, "an": "P287-288,A正确。B错误。WBS 中的元素必须有人负责，而且只由一个人负责，尽管实际上可能需要多个人参与。C错误。WBS 可以控制在4-6 层，不是必需，更不是5-8层D错误。WBS 的编制需要所有(主要)项目干系人参与，需要团队成员的参与。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-082", "s": "在软件项目中，()是确保需求不在开发过程中“丢失”的一个有效措施。", "o": ["做好需求变更管理", "做好需求确认", "做好需求回溯", "做好需求追溯"], "a": 3, "an": "需求不在开发过程中“丢失”,那么肯定要做好需求追溯。如果是为了防止范围镀金那么就是做好需求回溯。", "cm": "本题虽然是老题，但也有一定的参考价值"}, {"c": 9, "cn": "项目范围管理", "no": "9-083", "s": "项目范围说明包括的内容有()。*①产品范围描述；②需求跟踪矩阵；③项目除外责任；④干系人登记册；⑤可交付成果；⑥验收标准", "o": ["①②④⑥", "①③⑤⑥", "①②③⑤", "①②⑤⑥"], "a": 1, "an": "P284,项目范围说明书描述要做和不要做的工作的详细程度，决定着项目管理团队控制整个项目范围的有效程度。详细的项目范围说明书包括内容有：【口诀：产教研外】产品范围描述：项目章程和需求文件中所述的产品、服务或成果特征。可交付成果：为完成某一过程、阶段或项目而必须产出的任何独特并可核实的产品、成果或服务能力，可交付成果也包括各种辅助成果，如项目管理报告和文件。验收标准：可交付成果通过验收前必须满足的一系列条件。项目的除外责任：明确说明哪些内容不属于项目范围，有助于管理干系人的期望及减少范围蔓延。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-084", "s": "某公司在项目执行过程中，对项目需求进行收集分析，并形成正式的项目文档，并由客户签字确认，但在交货时发现，实际产品与客户的要求大相径庭，客户拒绝付款。经调查研究发现，需求来源和低层需求实现不完全匹配，这可能是在()方面出了问题。", "o": ["制定需求管理计划", "维护对需求的双向跟踪性", "求得对需求的承诺", "管理需求变更"], "a": 1, "an": "需求来源和低层需求实现不完全匹配，这说明是需求跟踪出了问题。", "cm": "本题虽然是老题，但也有一定的参考价值"}, {"c": 9, "cn": "项目范围管理", "no": "9-085", "s": "详细的项目范围说明书不包括()。", "o": ["产品范围描述", "可交付成果", "WBS", "项目的除外责任"], "a": 2, "an": "P284,详细的项目范围说明书包括内容有：【口诀：产教研外】产品范围描述：项目章程和需求文件中所述的产品、服务或成果特征。可交付成果：为完成某一过程、阶段或项目而必须产出的任何独特并可核实的产品、成果或服务能力，可交付成果也包括各种辅助成果，如项目管理报告和文件。验收标准：可交付成果通过验收前必须满足的一系列条件。项目的除外责任：明确说明哪些内容不属于项目范围，有助于管理干系人的期望及减少范围蔓延。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-086", "s": "在项目验收过程中不宜采用()方法确定可交付成果是否符合需求和验收标准。", "o": ["决策", "检查", "观察", "独裁"], "a": 2, "an": "P292,确认范围的工具技术：①检查；②决策，AB正确。D选项，独裁也是一种群体决策技术，正确。C选项，观察是收集需求的工具技术，错误", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-087", "s": "某软件项目实施过程中产生的一个文档的主要内容如下所示，该文档的主要作用是()。", "o": ["工作分解需求识别需求规格说明书v1.0设计说明书V1.0源代码库SDV.1测试用例库TCV.1功能B0012.1节6.2节3.2节6.2节MainFrame.javaEvent.java用例01V1.1用例02V2.1功能B002⋯⋯⋯⋯⋯⋯⋯⋯", "测试说明", "需求跟踪", "设计验证"], "a": 2, "an": "这文档是一个需求跟踪矩阵，用来进行需求跟踪。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-088", "s": "需求跟踪矩阵的作用是()。", "o": ["可以体现需求与后续工作成果之间的对应关系", "固化需求，防止变更", "明确项目干系人对于需求的责任", "对于需求复杂的项目，可以用来明确需求"], "a": 0, "an": "P281,需求跟踪矩阵是把产品需求从其来源连接到能满足需求的可交付成果的一种表格。使用需求跟踪矩阵，把每个需求与业务目标或项目目标联系起来，有助于确保每个需求都具有业务价值。需求跟踪矩阵提供了在整个项目生命周期中跟踪需求的一种方法，有助于确保需求文件中被批准的每项需求在项目结束的时候都能实现并交付。最后，需求跟踪矩阵还为管理产品范围变更提供了框架", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-089", "s": "项目范围确认的依据不包括()。", "o": ["需求文件", "需求跟踪矩阵", "工作绩效数据", "验收的可交付成果"], "a": 3, "an": "P291,验收的可交付成果是范围确认的输出。不是输入或依据", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-090", "s": "某公司中标一个企业信息化系统开发项目，合同中该项目包括：人事系统、OA系统和生产系统。下图为项目经理制作的WBS,此处项目经理违反了关于WBS的()原则。企业信息化系统蜗牛老师绘制0A系统人事系统邮件服务考情管理生产系统设备管理公文流转合同管理运行管理员工培训员工培训检修计划", "o": ["WBS需要考虑将不同的人员的工作分开", "WBS中各项工作是为提供可交付成果服务的", "可以按照系统子系统来逐层分解WBS", "一个工作单元只能从属于某个上层单元"], "a": 3, "an": "图片里员工培训既属于系统又属于人事系统，违背“一个工作单元只能从属于某个上层单元，避免交叉从属。”", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-091", "s": "应根据()来编制详细的项目范围说明书。*①可交付成果；②假设条件；③制约因素；④WBS", "o": ["①②③用印申请", "①②④绩效管理", "①③④", "②③④"], "a": 0, "an": "P282,应根据项目启动过程中记载的主要可交付成果、假设条件和制约因素来编制详细的项目范围说明书。在项目范围说明书定义前，还没有WBS,所以BCD错误。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-092", "s": "项目进入设计阶段时，GB/T22239《信息安全技术 网络安全等级保护 基本要求》己经升级版本，而项目需求是按旧版本策划的。()直接影响项目进度。", "o": ["提高需求评审评率", "执行项目范围变更", "与项目干系人沟通", "重新进行成本估算"], "a": 1, "an": "课本无原话。执行范围变更，按照新的等保要求变更项目需求，会影响进度。范围是基础，范围的变更势必会引起进度和成本的变更。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-093", "s": "()是在确认范围中使用的工具与技术。", "o": ["决策", "网络图", "控制图表", "关键路径法"], "a": 0, "an": "P292,可用于确认范围过程的决策技术是投票，当由项目团队和其他干系人进行验收时，使用投票来形成结论", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-094", "s": "在确认范围过程中，()主要关注项目范围对项目进度、资金和资源的影响，这些因素是否超过了组织承受范围，是否在投入产出上具有合理性。", "o": ["客户", "管理层", "项目经理", "项目团队成员"], "a": 1, "an": "P290-291,管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织承受范围，是否在投入产出上具有合理性。客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。项目管理人员主要关注项目制约因素：关心项目可交付成果是否足够和必须完成，时间、资金和资源是否足够，主要的潜在风险和预备解决的方法。项目团队成员主要关心项目范围中自己参与的元素和负责的元素。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-095", "s": "关于WBS的描述，正确的是()。", "o": ["WBS中的各项工作为可交付成果提供服务", "WBS的内容一般会超出完成可交付成果的活动范围", "WBS中的元素可以由一人或多人负责", "WBS应包括分包的工作，但不包括管理工作"], "a": 0, "an": "P287-288,WBS分解注意事项：WBS必须是面向可交付成果的；A正确WBS必须符合项目的范围：在WBS中，所有下一级的元素之和必须100??上一级的元素。B错误WBS的底层应该支持计划和控制；WBS中的元素必须有人负责，而且只有蜗牛老师一个人负责，这个规定又称为独立责任原则。C错误WBS应控制在4~6层，同一级元素的大小应该相似，一个工作单元只能从属于某个上层单元，避免交叉从属。WBS应包括项目管理工作，也要包括分包出去的工作。D错误WBS的编制需要所有(主要)项目干系人的参与：WBS并非是一成不变的，在完成了WBS之后的工作中，仍然有可能需要对WBS进行修改。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-096", "s": "在项目实施过程中，客户提出新的功能需求时，正确的做法是()。", "o": ["由项目经理发起变更管理流程来决定是否增加该功能", "由项目经理根据项目执行情况来决定是否增加该功能", "由实施人员根据经验判断来决定是否增加该功能", "由项目的投资人高件决定是否增加该功能"], "a": 0, "an": "有变更时，正确的做法应该是通过发起变更管理流程来处理。选项B错误，变更不是项目经理自己来决定是否增加功能，通过变更流程。选项C也是错误的，更不是由实施人员。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-097", "s": "关于项目范围确认的描述，不正确的是()。", "o": ["范围确认应贯穿项目的始终", "范围确认的主要作用是使验收过程具有客观性", "范围确认过程关注可交付成果的正确性以及是否满足质量要求", "范围确认时，应检查每个交付成果是否有明确的里程碑，里程碑是否明确可辨别"], "a": 2, "an": "P290,确认范围过程与控制质量过程的不同之处在于，前者关注可交付成果的验收，而后者关注可交付成果的正确性及是否满足质量要求；控制质量过程通常先于确认范围过程，但二者也可同时进行。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-098", "s": "按照下图所示的项目分解结构，其中空白处的内容应为()", "o": ["需求开发、系统测试", "需求开发、系统交付", "需求确认、系统测试", "需求确认、系统交付"], "a": 2, "an": ";这是一个分解到三层的WBS,第一空上一层是需求阶段，前面工作包是需求调研、然后是需求分析、最后肯定是需求确认了。第二空上层是测试与验收，后面的工作包分别是文档准备、验收，前面肯定是测试相关的工作了。所以选C。项目管理制定项目计划质量控制", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-099", "s": "进行范围确认是项日管理中一项非常重要的工作，制定和执行确认程序时，第一项工作一般是()。", "o": ["确定需要进行确认范围的时间", "识别确认范围需要哪些投入", "确定确认范围正式被接受的标准和要素", "确定确认范围会议的组织步骤"], "a": 0, "an": "P290,确认范围的一般步骤：确定需要进行确认范围的时间识别确认范围需要哪些投入确定范围正式被接受的标准和要素某信息管理系统需求阶段设计阶段需求调研网络设计需求分析图纸准备设备选型集成准备集成实施测试与验收技术文件编制硬件集成硬件采购网络调测文档准备培训设定现场培训验收", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-100", "s": "详细的项目范围说明书不包括()。", "o": ["产品范围描述", "可交付成果", "项目基准", "验收标准"], "a": 2, "an": "P284,详细的项目范围说明书内容有：产品范围描述、可交付成果、验收标准、项目的除外责任", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-101", "s": "范围基准包括()*①经过批准的范围说明书；②项目章程；③WBS词典；④WBS;⑤项目管理计划", "o": ["①②⑤", "①②④", "①③④", "①④⑤"], "a": 2, "an": "P288,范围基准是经过批准的范围说明书、WBS和相应的WBS词典，只有通过正式的变更控制程序才能进行变更，它被用作比较的基础。范围基准是项目管理计划的组成部分。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-102", "s": "关于项目范围说明书的理解，不正确的是()。", "o": ["项目范围说明书可明确指出哪些工作不属于本项目范围", "项目范围说明书使项目团队能进行更详细的规划，并为评价变更请求或额外工作是否超过项目边界提供基准", "项目范围说明书描述要做和不要做的工作的详细程度，决定着项目管理团队控制整个项目范围的有效程度", "项目范围说明书不能代表项目干系人之间就项目范围所达成的共识"], "a": 3, "an": "P284,项目范围说明书是对项目范围、主要可交付成果、假设条件和制约因素的描述。它记录了整个范围，包括：项目和产品范围；详细描述了项目的可交付成果；代表项目干系人之间就项目范围所达成的共识。为便于管理干系人的期望，项目范围说明书可明确指出哪些工作不属于本项目范围。项目范围说明书帮助项目团队进行更详细的规划，在执行过程中指导项目团队工作，并为评价变更请求或额外工作是否超过项目边界提供基准。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-103", "s": "()不属于项目范围说明书的内容。", "o": ["批准的项目原因", "项目验收标准", "项目可交付成果", "产品范围描述"], "a": 0, "an": "P284,详细的项目范围说明书内容有：产品范围描述、可交付成果、验收标准、项目的除外责任", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-104", "s": "把项目可交付成果和项目工作分解成较小、更易于管理的组件的过程是()。", "o": ["创建工作分解结构", "收集需求", "确认范围", "范围控制"], "a": 0, "an": "P284,创建工作分解结构把项目可交付成果和项目工作分解成较小、更易于管理的组件的过", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-105", "s": "()为完成某一过程、阶段或项目而必须产出的任何独特并可核实的产品、成果或服务能力，其也包括各种辅助成果，如项目管理报告和文件。", "o": ["产品范围描述", "可交付成果", "验收标准", "项目的除外责任"], "a": 1, "an": "P284,可交付成果：为完成某一过程、阶段或项目而必须产出的任何独特并可核实的产品、成果或服务能力，可交付成果也包括各种辅助成果，如项目管理报告和文件。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-106", "s": "以下说法不正确的是()。", "o": ["项目章程和项目范围说明书的内容存在一定程度的重叠", "项目章程包含高层级的信息，而项目范围说明书则是对范围组成部分的详细描述", "由于在收集需求过程中识别出的所有需求未必都包含在项目中，所以定义范围过程需要从需求文件中选取最终的项目需求，然后制定出关于项目及其产品、服务或成果的详细描述", "项目章程的内容和项目范围说明书的内容存在冲突时，应以项目章程为主"], "a": 3, "an": "课本无原话。项目章程只是高层级上的要求，会包含一部分项目需求，但是不会特别详细。实际，是以项目范围说明书为主。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-107", "s": "定义范围最重要的任务就是详细定义项目的范围边界，()不适合用于描述某个项目的范围。", "o": ["系统开发完成后，开发人员针对系统操作为客户举行两次以上的培训", "服务软件在对外传输数据过程中不允许以明文形式传输", "将主会场原有的标清视频会议系统替换为高清(1080P)视频会议系统", "智能数据分析系统核心功能在2个月内完成，以满足验收要求"], "a": 3, "an": "A为项目的交付成果。B为验收标准。C为产品范围描述ABC都属于项目范围，D属于进度要求", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-108", "s": "关于WBS描述正确的是()。", "o": ["WBS分解得越详细越利于项目的执行", "WBS的元素可以几个人同时负责", "WBS完成后，就不能对WBS进行修改", "WBS中下级元素之和等于上级元素"], "a": 3, "an": "P287-288:A错误。WBS分解得越详细越利于项目的执行(过细的分解会造成管理努力的无效耗费、资源使用效率低下、工作实施效率降低，同时造成WBS各层级的数据汇总困难)B错误。WBS的元素可以几个人同时负责(有且只有一个负责人)C错误。WBS完成后，就不能对WBS进行修改(WBS并非是一成不变的。在完成了WBS之后的工作中，仍然有可能需要对WBS进行修改)D正确。WBS中下级元素之和等于上级元素", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-109", "s": "项目范围基线包括()。", "o": ["批准的项目范围说明书、WBS及WBS字典", "项目初步范围说明书、WBS及WBS字典", "批准的项目范围说明书，WBS字典", "项目详细范围说明书、WBS"], "a": 0, "an": "P288,项目的范围基准是经过批准的项目范围说明书、WBS和WBS词典。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-110", "s": "关于项目范围定义的描述，不正确的是()。", "o": ["范围定义是制定目标和产品详细描述的过程", "范围定义过程的输出包括范围管理计划、干系人登记册、需求文件", "范围说明书是对项目范围、可交付成果、假设条件相同和制约因素等的描述", "项目进行中，往往需要多次反复开展范围定义的活动"], "a": 1, "an": "P282,范围管理计划是规划范围管理的输出，干系人登记册是识别干系人的输出，需求文件是收集需求的输出，B是完全错误", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-111", "s": "()是审查项目绩效随时间的变化情况，以判断绩效是正在改善还是正在恶化。", "o": ["偏差分析", "趋势分析", "检查", "挣值管理"], "a": 1, "an": "P295,趋势分析：旨在审查项目绩效随时间的变化情况，以判断绩效是正在改善还是正在恶化。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-112", "s": "某信息系统应用软件的WBS分解结构图如下图，其中空白方框处应该填写的内容是()。某企业信息综合管理系统开发项目项目管理确定需求设计开发总体需求概要设计总体西求(37)详细设计接口定义", "o": ["产品需求", "需求规格说明书搭建网络程序编码", "需求评审测试安装调试现场勘查单元测试软件安装调试综合布线集成测试系统调试网络调试系统测试验收", "需求变更"], "a": 0, "an": "WSB的同一层使用的分解方式应该一致，所以和总体需求一致的答案中就只有产品需求了", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-113", "s": "关于确认范围的描述，正确的是()。", "o": ["确认范围是在正式验收阶段才执行的过程", "分解技术是确认范围的主要工具与技术", "客户主要关心产品范围和可交付成果", "确认范围强调的是结束项目所要做的流程性工作"], "a": 2, "an": "A错误。确认范围是阶段性工作，贯穿整个项目生命周期B错误。分解技术是创建WBS的工具与技术。D错误。结束项目所要做的流程性工作是项目收尾。C正确。客户主要关心的是产品的范围，关心项目的可交付成果是否足够完成产品或服务。", "cm": ""}, {"c": 9, "cn": "项目范围管理", "no": "9-114", "s": "要把整个项目工作分解为工作包，通常需要开展如下活动：*①识别和分析可交付成果及相关工作*②()*③自上而下逐层细化分解*④为WBS组成部分制定和分配标识编码*⑤核实可交付成果分解的程度是否恰当", "o": ["确定WBS的结构和编排方法", "收集需求", "指定责任人", "范围定义"], "a": 0, "an": "P284,要把整个项目工作分解为工作包，通常需要开展 ", "s": "在进行项目活动历时估算时，()属于参数估算。", "o": ["从以前类似计划活动的实际持续时间为依据来估算", "用需要完成工作的数量乘以完成单位工作所需时间为估算活动时间的依据", "利用有可能的历时估算，最乐观的历时估算和最悲观的历时估算来计算", "利用以历时信息为依据的专家判断估算"], "a": 1, "an": "P312,参数估算是利用历史数据和一些变量之间的统计关系，计算活动资源成本", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-007", "s": "项目进度管理中“定义活动”过程的主要作用不包含()。", "o": ["准确地进行项目估算", "规划项目进度", "监控项目执行", "提供项目验收标准"], "a": 3, "an": "P302,定义活动过程就是识别和记录为完成项目可交付成果而需采取的所有活动。其主要作用是，将工作包分解为活动，作为对项目工作进行估算、进度规划、执行、监督和控制的基础", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-008", "s": "在一个复杂的信息系统项目中，由于资源限制，项目经理发现关键资源(如资深开发人员卧牛)经常在不同的项目任务之间被重新分配，这导致项目进度频繁延误和质量波动，为了有效控制资源并减少对进度延迟和成本超支的影响，项目经理优先采取的措施是()。", "o": ["增加资源储备以应对未来的资源需求波动", "严格限制资源在项目间的共享，确保资源专注于当前任务", "实施资源平衡策略，优化不同任务间的资源分配", "缩减项目范围以匹配可用资源的能力"], "a": 2, "an": "题目说了为了有效控制资源并减少对进度延迟和成本超支的影响，所以A措施不合适题目说了由于资源限制，所以B措施不合适缩减项目范围以匹配可用资源的能力，这个肯定不合适", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-009", "s": "关于活动排序的描述，不正确的是()。", "o": ["在单代号网络图中，每项活动有唯一的活动号，每项活动都标明了活动的持续时间", "双代号网络图中流入同一节点的活动，均有共同的紧后活动", "双代号网络图中，任两项活动的紧前事件和紧后事件代号至少有一个不相同", "滞后量是紧后活动相对于紧前活动需要推迟的时间量，一般用负值表示"], "a": 3, "an": "P309,D错误。滞后量一般用正值表示，比如 SS+15,A的说法也有点问题，但是如果是六标图那么也可以说的过去，根据错中选错原则，选D", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-010", "s": "()不属于项目进度计划的图形表示方式。", "o": ["横道图", "矩阵图", "项目进度网络图", "里程碑图"], "a": 1, "an": "P323:常用项目进度计划图形方式：横道图：横道图也称为“甘特图”,是展示进度信息的一种图表方式。里程碑图：里程碑图与横道图类似，但仅标示出主要可交付成果和关键外部接口的计划开始或完成日期。项目进度网络图：项目进度网络图通常用活动节点法绘制。项目进度网络图也可以是包含时间刻度的进度网络图，称为“时标图”。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-011", "s": "在进行项目活动历时估算时，如果很难获得项目工作的详细信息，可采用()作为项目活动历时估算的工具。", "o": ["参数是估算", "类比估算", "预留时间估算", "历时的三点估算"], "a": 1, "an": "P312,既然无法获得项目工作的详细信息，那么参数估算和三点估算肯定就不行，预留时间估算这个工具不存在，用类比估算是刚刚好。类比估算主要是在无法获得项目详细信息的时候，用以前类似项目工作的完成时间来估计当前工作的完成时间。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-012", "s": "关于进度管理的描述，不正确的是()。", "o": ["项目开展过程中，关键路径可能会发生变化", "关键路径上的活动的总浮动时间和自由浮动时间都为0", "资源平滑技术通常会导致项目关键路径变长", "关键链法在关键路径法基础上，考虑了资源因素"], "a": 2, "an": "P319:资源平滑不会改变项目关键路径，完工日期也不会延迟。资源平衡往往导致关键路径的改变，通常是延长。这2者之间的区别要会。", "cm": " 和明确活动要求。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-021", "s": "()不是活动历时估算依据。", "o": ["范围基准", "资源需求", "风险登记册", "项目进度计划"], "a": 3, "an": "P311-312,项目进度计划是活动历时估算过程之后的制定进度计划过程的交付物，不是活动历时估算过程的依据。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-022", "s": "进度控制是避免工期拖延的一种方法。进度控制中的纠正行为通常加速某些活动以确保这些活动能够及时完成。为了重新编制和执行进度表，纠正行为通常要求()。", "o": ["做大家都不喜欢的决策", "及时调整基线", "进行原因分析", "资源平衡"], "a": 2, "an": "P327,控制进度作为实施整体变更控制过程的一部分，关注内容包括：*①判断项目进度的当前状态*②对引起进度变更的因素施加影响*③重新考虑必要的进度储备*④判断项目进度是否已经发生变更*⑤在变更实际发生时对其进行管理首先就要进行原因分析，其次才决定是否调整基准", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-023", "s": "在关键路径上增加资源不一定会缩短项目的工期，这是因为()。", "o": ["关键路径上的活动是不依赖于时间和资源的", "关键活动所配置的资源数量总是充足的", "关键活动的历时是固定不变的", "增加资源有可能导致产生额外的问题并且降低效率"], "a": 3, "an": "P321:赶工并非总是切实可行的，因它可能导致风险和/或成本的增加，所以D正确。ABC明显错误", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-024", "s": "定义活动时需要参考的依据不包括()。", "o": ["进度管理计划", "范围基准", "进度基准", "活动清单模板"], "a": 2, "an": "P302:进度基准更新是定义活动的输出", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-025", "s": "估算活动持续时间时需要参考的依据不包括()。", "o": ["估算依据", "进度管理计划", "风险登记册", "范围基准"], "a": 0, "an": "P314,估算依据是估算活动持续时间的输出", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-026", "s": "某项活动最可能时间8天，最乐观时间7天，最悲观时间12天，则该活动的期望持续时间为()。", "o": ["7天", "8天", "9天", "10天"], "a": 2, "an": "P313,基于贝塔分布：(7+12+4*8)/6=51/6基于三角分布：(7+12+8)/3=9", "cm": "注意在第三版常常默认用贝塔分布，如果用贝塔算不出结果时，需要用三角分布计算"}, {"c": 10, "cn": "项目进度管理", "no": "10-027", "s": "()用于追踪迭代未完项中尚待完成的工作。它分析与理想燃尽图的偏差。可使用预测趋势线来预测迭代结束时可能出现的偏差。", "o": ["趋势分析", "迭代燃尽图", "挣值分析", "偏差分析"], "a": 1, "an": "P328,迭代燃尽图：这类图用于追踪迭代未完项中尚待完成的工作。它分析与理想燃尽图的偏差。可使用预测趋势线来预测迭代结束时可能出现的偏差。燃尽图中先用对角线表示理想的燃尽情况，再每天画出实际剩余工作，最后基于剩余工作计算出趋势线以预测完成情况", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-028", "s": "将工作包分解为进度活动，作为对项目工作进行进度估算、规划、执行、监督和控制的基础是()。", "o": ["定义活动", "排列活动排序", "制定进度计划", "规划进度管理"], "a": 0, "an": "P298,定义活动是识别和记录为完成项目可交付成果而须采取的具体行动的过程。本过程的主要作用是，将工作包分解为进度活动，作为对项目工作进行进度估算、规划、执行、监督和控制的基础", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-029", "s": "关于估算活动持续时间的说法中不正确的是()。", "o": ["估算活动持续时间的主要作用是确定完成每个活动所需花费的时间量", "随着数据越来越详细，越来越准确，持续时间估算的准确性和质量也会越来越高", "帕金森定律指出人们只有在最后一刻，即快到期限时才会全力以赴", "类比估算是一种使用相似活动或项目的历史数据来估算当前活动或项目的持续时间或成本的技术"], "a": 2, "an": "P311,员工激励：项目经理还需要了解拖延症和帕金森定律。前者指出，人们只有在最后一刻，即快到期限时才会全力以赴；后者指出，只要还有时间，工作就会不断扩展，直到用完所有的时间。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-030", "s": "在计划编制完成后，项目团队认为所制定的进度时间太长，分析表明不能改变工作网络图，但该项目有附加的资源可利用。蜗项牛目经理采用的最佳方式是()。", "o": ["快速追踪项目", "引导一项蒙特卡洛分析", "利用参数估算", "赶工"], "a": 3, "an": "分析表明不能改变工作网络图，说明工作不能并行，所以A不正确。B是风险量化分析工具，C只是提高了估算时间的准确度，对项目进度提前没有任何帮助，只有D最适合。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-031", "s": "以下项目活动中，存在S-S关系的活动组合是()*①功能验收；②单元测试；③功能开发；④需求确认；⑤系统集成", "o": ["④-③", "③-②", "③-⑤", "①-⑤"], "a": 1, "an": "P306,首先，我们要搞明白的是这5个选项之间的先后顺序，一般来讲是这样排序：*④需求确认③功能开发②单元测试①功能验收⑤系统集成然后再来看，那些活动可以并行。*④-③,一般来说是需求确认完毕之后，才能功能开发。当然实际也会遇到，所有的需求还没确认完，就提前开发的情况，但是也是将那些已经确认了的部分进行开发，题目说的是功能开发，显然，必须要等它的需求确认万了才能开始。A可以作为候选答案。*③-②,单元测试，可以测试某一个小模块，一个功能一般由更多小的模块组成，所以可以边开发，边测试，也就是功能开发开始，单元测试才能开始。B比A更优*③-⑤,明显错误*①-⑤,功能验收必须全部完成了，也就是所有模块测试完了，才能进行集成联调", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-032", "s": "进度管理中，需要裁剪的考虑因素不包括()。", "o": ["生命周期方法", "活动估算的方法", "资源可用性", "技术支持"], "a": 1, "an": "P299,裁剪时应考虑的因素包括：生命周期方法；资源可用性；项目维度；技术支持。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-033", "s": "以下关于进度计划新实践的说法中错误的是()。", "o": ["应在整个项目期间保持项目进度计划的灵活性，并根据知识、风险理解程度和增值活动等情况的改变对其进行调整。", "具有未完成项的迭代型进度计划，允许在整个开发生命周期期间进行变更。", "按需进行的进度计划方法，将需求记录在用户故事中，然后在建造之前按优先级排序并优化用户故事，最后在规定的时间内开发产品功能。", "具有未完成项的迭代型进度计划方法，通常用于向客户交付增量价值，或多个团队并行开发大量的、内部关联的、较小的功能。"], "a": 2, "an": "P297,具有未完成项的迭代型进度计划：这种方法将需求记录在用户故事中，然后在建造之前按优先级排序并优化用户故事，最后在规定的时间内开发产品功能。这一方法通常用于向客户交付增量价值，或多个团队并行开发大量的、内部关联的、较小的功能。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-034", "s": "制订进度计划时需要参考的依据不包括()。", "o": ["进度基准", "范围基准", "资源需求", "资源日历"], "a": 0, "an": "P316-317:进度基准是制订进度计划的输出", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-035", "s": "定义活动的主要作用是将工作包分解为进度活动，作为对项目工作进行进度估算、()的基础。", "o": ["规划、执行、监督和控制", "规划、定义、监督和控制", "规划、执行、定义和控制", "规划、执行、监督和定义"], "a": 0, "an": "定义活动是识别和记录为完成项目可 项活动所具有的多重属性，用来扩充对活动的描述", "活动属性不会随时间而演进", "活动属性可用于识别开展工作的地点、编制开展活动的项目日历，以及相关的活动类型", "在项目初始阶段，活动属性包括唯一活动标识、WBS 标识和活动名称"], "a": 1, "an": "P303:活动属性是指每项活动所具有的多重属性，用来扩充对活动的描述，活动属性随着项目进展情况演进并更新。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-050", "s": "关于进度控制的说法中不正确的是()。", "o": ["进度控制的主要作用是在整个项目期间保持对进度基准的维护", "进度控制在项目中期需要尤其关注", "将工作外包时，需要定期考察供应商的进度是否正常", "控制进度流程应作为实施整体变更控制过程的一部分"], "a": 1, "an": "P327,项目进度控制要在整个项目期间保持对进度基准的维护，不会说特别在某一时刻重点关注。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-051", "s": "()不属于排列活动顺序过程的工具与技术。", "o": ["关键路径法", "提前量和滞后量", "紧前关系绘图法", "箭线图法"], "a": 0, "an": "P305-309,关键路径法是制定进度计划的工具", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-052", "s": "关于进度管理的描述，不正确的是()。", "o": ["里程碑的持续时间可以为零，也可以不为零", "活动需要消耗资源和花费成本，里程碑不需要资源和成本", "活动属性可能随着项目的推进而变化", "一个项目中可能有几个达到里程碑程度的关键事件"], "a": 0, "an": "P303,里程碑是项目生命周期中的一个时刻，里程碑的持续时间为零，里程碑既不消耗资源也不花费成本，通常是指一个主要可交付成果的完成", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-053", "s": "快速跟进是一种进度压缩技术，()属于快速跟进技术。", "o": ["加班", "增加项目组成员", "加快关键路径上的活动", "将正常情况下按顺序进行的活动或阶段改为至少是部分并行开展"], "a": 3, "an": "P321:快速跟进是将原本串行的工作改为并行施工，需要注意的是并不是所有的活动都可以并行施工，并行施工会带来风险。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-054", "s": "A、B两项活动之间的关系是SF+5,这说明()。", "o": ["A结束后5天，B才能开始", "A结束前5天，B才能开始", "A开始前5天，B才能结束", "A开始后5天，B才能结束"], "a": 3, "an": "P309,提前量是相对于紧前活动、紧后活动可提前的时间量，提前量一般用负值表示。滞后量是相对于紧前活动、紧后活动要推迟的时间量，滞后量一般用正值表示。B、C活动之间的关系是SS,意思是C为B的紧后，只有B开始，C才能开始。B、C活动之间的关系是SS+10,正值代表滞后，就是说B开始10天后，C才能开始B、C活动之间的关系是SS-10,负值代表提前，就是说B开始10天前，C就可以开始【蜗牛点评】对于这种逻辑关系题，首先要判断它们的逻辑关系，再来判断是提前还是滞后。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-055", "s": "控制进度时需要参考的依据不包括()。", "o": ["假设日志", "进度基准", "范围基准", "绩效测量基准"], "a": 0, "an": "P327,*①项目管理计划(进度管理计划、进度基准、范围基准、绩效测量基准)*②项目文件(资源日历、项目进度计划、项目日历、进度数据、经验教训登记册)*③工作绩效数据；④组织过程资产假设日志更新是控制进度的输出", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-056", "s": "“定义活动”过程的输出不包括()。", "o": ["活动清单", "范围基准", "里程碑清单", "活动属性"], "a": 1, "an": "P303-304,定义活动的输出包括：1.活动清单；2.活动属性；3.里程碑清单；4.变更请求；*5.项目管理计划更新(进度基准、成本基准);范围基准是输入。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-057", "s": "项目进度管理经常采用箭线图法，以下对箭线图的描述不正确的是()。", "o": ["流入同一节点的活动，有相同的后继活动", "虚活动不消耗时间，但消耗资源", "箭线图中可以有两条关键路径", "两个相关节点之间只能有一条箭线"], "a": 1, "an": "P308,虚活动不消耗时间，也不消耗资源，只是为了弥补箭线图在表达活动依赖关系方面的不足。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-058", "s": "项目进度管理过程中，可用于控制进度过程的数据分析技术包括()。", "o": ["蒙特卡洛分析", "计划评审技术(PERT)", "参数估算", "挣值分析"], "a": 3, "an": "P328:控制进度的工具与技术：1.数据分析；2.关键路径法；3.项目管理信息系统；4.资源优化；5.提前量和滞后量；6.进度压缩蒙特卡洛分析，风险定量分析工具计划评审技术(PERT),成本和进度的估算技术参数估算，成本和进度的估算技术", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-059", "s": "在()规定可以开展进度活动的可用工作日和工作班次，它把可用于开展进度活动的时间段(按天或更小的时间单位)与不可用的时间段区分开来。", "o": ["项目日历", "资源日历", "项目团队派工单", "物质资源分配单"], "a": 0, "an": "P324,在项目日历中规定可以开展进度活动的可用工作日和工作班次，它把可用于开展进度活动的时间段(按天或更小的时间单位)与不可用的时间段区分开来。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-060", "s": "以下关于制订进度计划的说法不正确的是()。", "o": ["敏捷或适应型发布规划基于项目路线图和产品发展愿景，提供了高度概括的发布进度时间轴(通常是3~6个月)", "进度基准是经过批准的进度模型，只有通过正式的变更控制程序才能进行变更，用作与实际结果进行比较的依据", "进度基准应包含基准开始日期和基准结束日期", "概括性进度计划，也叫里程碑图"], "a": 3, "an": "P323:进度计划的三种形式：里程碑进度计划，也叫里程碑图。概括性进度计划，也叫横道图。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-061", "s": "在控制进度过程的数据分析技术中，()可以通过检查项目绩效随时间的变化情况，确定绩效是在改善还是恶化。", "o": ["储备分析", "蒙特卡洛分析", "趋势分析", "假设情景分析"], "a": 2, "an": "P327:趋势分析：检查项目绩效随时间的变化情况，以确定绩效是在改善还是在恶化。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-062", "s": "关于估算活动持续时间过长的工具与技术的描述，不正确的是：()。", "o": ["类比估算是一种精确的估算方法，适用于项目详细信息充分、项目需求明确的情况", "专家判断依赖于专家的可用性和经验，可能受到主观判断的影响", "三点估算考虑了估算中的不确定性和风险，有助于界定活动持续时间的近似区间", "参数估算是一种基于历史数据和项日参数，使用某种算法来计算成本或持续时间的估算技术"], "a": 0, "an": "P312:类比估算：是一种使用相似活动或项目的历史数据来估算当前活动或项目的持续时间或成本的技术，这是一种粗略的估算方法。在项目详细信息不足时，经常使用类比估算来估算项目持续时间。相对于其他估算技术，类比估算通常成本较低、耗时较少，但准确性也较低。类比估算可以针对整个项目或项目中的某个部分进行，也可以与其他估算方法联合使用。如果以往活动是本质上而不是表面上类似，并且从事估算的项目团队成员具备必要的专业知识，那么类比估算可靠性会比较高。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-063", "s": "以下不具有“完成-开始”关系的两个活动是()。", "o": ["系统设计，设计评审", "系统分析，需求评审", "需求评审，周例会", "确定项目范围，制定WBS"], "a": 2, "an": "P306,两个活动之间的“完成-开始”关系是指前序活动结束后，后续活动才能开始。周例会是一个周期性的管理活动，它与需求评审没有固定的“完成-开始”关系。本题的其他三项选择中的活动都有“完成-开始”关系。所以选C", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-064", "s": "一位软件工程师在进行软件项目持续时间估算时，按照“代码行”为单位进行估算，采用的估算方法是()。", "o": ["三点估算", "类比估算", "参数估算", "专家判断"], "a": 2, "an": "P312:这题大家的争议焦点在C和D之间，在软件工程中按照“代码行”为单位进行估算，属于面向规模的度量，属于参数估算的一种。既然题目明确说明要按代码行进行估算，那么肯定是按照既定的参数模型来计算开发的时长，这里用专家判断不合适。这题很明确，应该选C。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-065", "s": "项目经理小张在查看各组研发计划时，发现有三个小组计划在同一周进行系统架构设计，而项目组只有一位资深架构师李工蜗牛老师，不可能在一周内完成三组的架构设计工作。于是小张和各组长商量", "o": ["资源平衡", "资源平滑", "赶工", "快速跟进"], "a": 1, "an": "“不影响项目进度的前提下，错开活动”,说明是资源平滑，资源平滑不影响项目的工期", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-066", "s": "()估算方法将以往类似项目的相关信息作为估算未来项目的基础，是一种快速估算方法，适用于项目经理只能识别WBS的几个高层级的情况。", "o": ["类比", "基线", "自下而上", "参数"], "a": 0, "an": "P312:类比估算是一种使用相似活动或项目的历史数据来估算当前活动或项目的持续时间或成本的技术。类比估算以过去类似项目的参数值(如持续时间、预算、规模、重量和复杂性等)为基础，来估算当前和未来项目的同类参数或指标。这是一种粗略的估算方法，有时需要根据项目复杂性方面的已知差异进行调整，在项目详细信息不足时，经常使用类比估算来估算项目持续时间。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-067", "s": "关于进度管理的描述，正确的是()。", "o": ["在项目详细信息不足时，经常使用参数估算来估算项目持续时间", "虚活动不消耗资源，但是可能消耗时间", "参数估算可以针对整个项目或项目中的某个部分，并可以与其他估算方法联合使用", "拖延症认为只要还有时间，工作就会不断扩展，直到用完所有的时间"], "a": 2, "an": "P312:参数估算可以针对整个项目或项目中的某个部分，并可以与其他估算方法联合使用。在项目详细信息不足时，经常使用类比估算来估算项目持续时间虚活动不消耗资源，也不消耗时间拖延症认为人们只有在最后一刻，即快到期限时才会全力以赴", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-068", "s": "在某个信息系统项目中，存在新老系统切换问题，在设置项目计划网络图时，新系统上线和老系统下线之间应设置成()的关系。", "o": ["结束一开始(FS型)", "结束一结束(FF型)", "开始一结束(SF型)", "开始一开始(SS型)"], "a": 2, "an": "P306,新系统上线，老系统才能下线。所以新系统上线和老系统下线之间的关系是开始一结束", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-069", "s": "关于进度管理，不正确的是()。", "o": ["在项目进行过程中，关键路径可能会不断变化", "自由浮动时间是指在不延误任何紧后活动的最早开始时间且不违反进度制约因素的前提下，活动可以从最早开始时间推迟或拖延的时间量", "关键链法建立在关键路径法之上，考虑了资源分配、资源优化、资源平衡和活动历时不确定性对关键路径", "资源平滑技术可能导致关键路径改变，通常是延长"], "a": 3, "an": "P319,资源平滑不会改变项目关键路径，完工日期也不会延迟。也就是说，活动只在其自由浮动时间和总浮动时间内延迟。因此，资源平滑技术可能无法实现所有资源的优化。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-070", "s": "项目进度控制是依据项目进度基准计划对项目的实际进度进行监控，使项目能够按时完成，以下关于项目进度控制的叙述中()是不正确的。", "o": ["项目进度至关重要，因此进度控制需要在项目初期优先关注", "进度控制必须与其他变化控制，包括成本控制与范围控制紧密结合", "项目进度控制是项目整体控制的一个组成部分", "对项目进度的控制，应重点关注项目进展报告和执行状态报告"], "a": 0, "an": "P327,项目进度控制要在整个项目期间保持对进度基准的维护，不应该只在项目初期优先关注。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-071", "s": "只有在验证请求者身份合法后，服务器才开始向客户端传输数据，这是()-()关系。", "o": ["FS", "FF", "SS", "SF"], "a": 0, "an": "P306,验证请求者身份合法后才开始向客户端传输数据，前面结束后面才能开始，所以属于FS型", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-072", "s": "关于进度管理的描述，正确的是()。", "o": ["里程碑的持续时间可以为零，也可以不为零", "帕金森定律认为只要还有时间，工作就会不断扩展，直到用完所有的时间", "活动A和B之间的依赖关系为SS-8天，则表明活动A开始8天后活动B开始", "软件项目的测试活动取决子外部硬件的到货、属于强制性依赖关系"], "a": 1, "an": "P311,里程碑是事件，是节点，不占资源，不耗时间活动A和B之间的依赖关系为SS-8天，则表明活动A开始8天前活动B开始外部依赖关系是项目活动与非项目活动之间的依赖关系，这些依赖关系往往不在项目团队的控制范围内。例如，软件项目的测试活动取决于外部硬件的到货帕金森定律：只要还有时间，工作就会不断扩展，直到用完所有的时间。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-073", "s": "活动B可在活动A 完成前5天开始，则关系表示为()。", "o": ["SS+5", "SS-5", "FS+5", "FS-5"], "a": 3, "an": "P309,活动B必须在A完成后开始，所以属于FS型，现在说的是活动B可在活动A完", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-074", "s": "监控系统项目中，甲方要求采用防护等级为IP67的摄像头，这属于()。", "o": ["强制性依赖关系", "选择性依赖关系", "外部依赖关系", "内部依赖关系"], "a": 0, "an": "P308,强制性依赖关系：强制性依赖关系是法律或合同要求的或工作内在性质决定的依赖关系，又称硬逻辑关系或硬依赖关系。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-075", "s": "排列活动顺序时需要参考的依据不包括()。", "o": ["假设日志", "范围基准", "进度管理计划", "项目进度网络图"], "a": 3, "an": "P305,项目进度网络图是排列活动顺序的输出", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-076", "s": "如果一个项目的SPI=0.75,CPI=0.9,此时项目经理最适合采取()方式来控制项目进度。", "o": ["快速跟进", "赶工", "资源平衡", "蒙特卡洛分析"], "a": 0, "an": "SPI和CPI均小于1,说明项目处于进度落后且成本超支的状态，故需要采取快速跟进的方法，并行施工，以缩短项目实际进度与计划进度的偏差，并且不额外增加新的成本。这里赶工不可取，因为赶工会增加成本。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-077", "s": "关于排列活动的说法中不正确的是()。", "o": ["带有多个紧前活动的活动代表路径汇聚，而带有多个紧后活动的活动则代表路径分支", "项目进度网络图中的每项活动都至少有一项紧前活动和一项紧后活动", "排列活动顺序过程旨在将项目活动列表转化为图表，作为发布进度基准的第一步", "排列活动顺序主要作用是定义工作之间的逻辑顺序，以便在既定的所有项目制约因素下获得最高的效率"], "a": 1, "an": "P304:除了首尾两项，每项活动都至少有一项紧前活动和一项紧后活动，B说的不完全正确", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-078", "s": "控制项目进度时常用的技术不包括()。", "o": ["趋势分析", "偏差分析", "统计抽样", "关键路径法"], "a": 2, "an": "P328,控制进度工具：1.数据分析(挣值分析、迭代燃尽图、绩效审查、趋势分析、偏差分析、假设情景分析);2.关键路径法；3.项目管理信息系统；4.资源优化；5.提前量和滞后量；6.进度压缩", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-079", "s": "关于以下说法，()是不正确的。", "o": ["收益递减规律：在保持其他因素不变的情况下，增加一个用于确定单位产出所需投入的因素(如资源)会最终达到一个临界点，在该点之后的产出或输出会随着增加这个因素而递减", "增加资源数量，比如两倍投入资源完成工作的时间应可以缩短一半", "通过采购最新技术，制造工厂可以提高产量，而这可能会影响持续时间和资源需求", "拖延症认为人们只有在最后一刻，即快到期限时才会全力以赴；帕金森定律认为只要还有时间，工作就会不断扩展，直到用完所有的时间"], "a": 1, "an": "P311,资源数量：增加资源数量，比如两倍投入资源但完成工作的时间不一定能缩短一半，因为投入资源可能会增加额外的风险，比如如果增加太多活动资源，可能会因知识传递、学习曲线、额外合作等其他相关因素而造成持续时间增加", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-080", "s": "在制定进度计划时，可以采用多种工具与技术，如关键路径法、资源平衡技术、资源平滑技术等，在以下叙述中，不正确的是()。", "o": ["项目的关键路径可能有一条或多条", "随着项目的开展，关键路径法可能也随着不断变化", "资源平衡技术往往会导致关键路径延长", "资源平滑技术往往会改变项目关键路径，导致项目进度延迟"], "a": 3, "an": "P319,相对于资源平衡而言，资源平滑不会改变项目关键路径，完工日期也不会延迟。也就是说，活动只在其自由浮动时间和总浮动时间内延迟。因此，资源平滑技术可能无法实现所有资源的优化", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-081", "s": "关于项目活动之间依赖关系的描述，不正确的是()。", "o": ["项目团队按照领域内的最佳实践来安排活动，属于选择性依赖关系", "如果打算进行快速跟进，应当审查相应的选择性依赖关系", "软件项目的测试活动取决子外部硬件的到货、属于强制性依赖关系", "项目现场准备需要经过政府的审批，属于外部依赖关系"], "a": 2, "an": "P308,外部依赖关系：外部依赖关系是项目活动与非项目活动之间的依赖关系，这些依赖关系往往不在项目团队的控制范围内。例如，软件项目的测试活动取决于外部硬件的到货", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-082", "s": "关于进度管理的描述，正确的是()。", "o": ["类比估算以过去类似项目的都数值为依据，来估算未来项目的同类参数或指标，因此准确性较高", "参数估算的准确性取决于参数模型的成熟度和基础数据的可靠性，准确性低，不能用于估算整个项目", "可以对单个活动成整个项目预留应急储备。也可以针对单个活动和整个项目都预留应急储备", "管理储备用来应对已经核实的已识别风险，以及已经制定应急或减轻措施的已识别风险"], "a": 2, "an": "P312,类比估算通常成本较低、耗时较少，但准确性也较低。A错误参数估算的准确性取决于参数模型的成熟度和基础数据的可靠性。参数估算可以针对整个项目或项目中的某个部分，并可与其他估算方法联合使用。B错误管理储备用来应对会影响项目的“未知-未知”风险。D错误", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-083", "s": "以下关于估算活动持续时间如何开展的描述，正确的是()。", "o": ["仅开展一次", "仅在项目的预定义点开展", "仅开展一次或仅在项目的预定义点开展", "需要在整个项目期间开展"], "a": 3, "an": "估算活动持续时间是根据资源估算的结果，估算完成单项活动所需工作时段数的过程。本过程的主要作用是确定完成每个活动所需花费的时间量。本过程需要在整个项目期间开展。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-084", "s": "关于制定进度计划的工具和技术的描述，不正确的是()。", "o": ["总浮动的时间等于本活动的最迟完成时间减去本活动的最早完成时间", "自由浮动时间等于紧后活动的最早开始时间的最小值减去本活动的最早完成时间", "资源平滑技术通过缩短项目的关键路径来缩短完工时间", "关键路径上活动的总浮动时间与自由浮动时间都为0"], "a": 2, "an": "P319,资源平滑不会改变项目关键路径，完工日期也不会延迟。活动只在其自由浮动时间和总浮动时间内延迟。因此，资源平滑技术可能无法实现所有资源的优化。", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-085", "s": "在系统集成项目中，只有各个设备组件完成，团队才能对其进行测试，设备组件完成和测试活动之间属于()关系。", "o": ["外部强制性依赖关系", "外部选择性依赖", "内部强制性依赖", "内部选择性依赖"], "a": 2, "an": "P308,内部依赖关系：内部依赖关系是项目活动之间的紧前关系，通常在项目团队的控制之中。例如，只有机器组装完毕，团队才能对其测试，这是一个内部的强制性依赖关系", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-086", "s": "估算活动持续时间的输出不包括()。", "o": ["项目管理计划", "项目文件更新", "持续时间估算", "估算依据"], "a": 0, "an": "项目管理计划是估算活动持续时间的输入", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-087", "s": "通过增加资源来压缩进度工期的技术称为()。", "o": ["快速跟进", "持续时间缓冲", "赶工", "提前量管理"], "a": 2, "an": "P321,赶工。通过增加资源，以最小的成本增加来压缩进度工期的一种技术", "cm": ""}, {"c": 10, "cn": "项目进度管理", "no": "10-088", "s": "如果一个项目的SPI=0.85,CPI=0.9,下面的那种方法不适用()。", "o": ["快速跟进", "赶工", "经过客户同意，减小活动范围或降低活动要求", "改进方法或技术，以提高生产效率"], "a": 1, "an": "SPI和CPI均小于1,说明项目处于进度落后且成本超支的状态。ACD都可以用，但是B不行，因为赶工会增加成本", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-001", "s": "关于成本管理的描述，不正确的是：()。", "o": ["在项目过程中，不应只关心完成项目活动所需资源的成本，也需考虑项目决策对项目最终产品的使用和维护成本的影响", "成本估算和成本预算是两个过程，即使是很小的项目，也需要由不同的人员来分别完成，以保证估算和预算过程的客观性和独立性", "全生命周期成本管理经常与价值工程技术结合使用，用于降低成本，缩短时间，提高项目可交付成果的质量和绩效，并优化决策过程", "项目成本管理应当考虑项目干系人的需要，不同的项目干系人可能在不同的时间以不同的方式测算项目的成本"], "a": 1, "an": "P334,就某些项目，特别是小项目而言，成本估算和成本预算之间的关系极其密切，以致可以将其视为一个过程，由一个人在较短的时间内完成。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-002", "s": "在进行成本估算时，()不是直接成本。", "o": ["项目人员的工资", "项目所用的材料", "电费", "分包商的费用"], "a": 2, "an": "P336:电费一般为多个项目共同分摊。直接成本直接可以归属于项目工作的成本为直接成本。如项目团队差旅费、工资、项目使用的物料及设备使用费等间接成本来自一般管理费用科目或几个项目共同担负的项目成本所分摊给本项目的费用，就形成了项目的间接成本，如税金、额外福利和保卫费用等。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-003", "s": "发生成本失控的原因主要包括：()。*①对工程项目认识不足；②组织制度不健全；③方法问题；④技术的制约；⑤需求管理不当", "o": ["①②③④", "①②③⑤", "①②④⑤", "①②③④⑤"], "a": 3, "an": "P335:成本失控的原因：①对工程项目认识不足；②组织制度不健全；③方法问题；④技术的制约；⑤需求管理不当。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-004", "s": "用于估算成本的项目管理 本或资源使用报告中出现未经批准的变更；*⑧向干系人报告所有经批准的变更及其相关成本；*⑨设法把预期的成本超支控制在可接受的范围内等。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-012", "s": "某项目投资20万，考虑到风险，预留了10??理储备和5??急储备，则该项目的总预算为()。", "o": ["20万", "21万", "23万", "22万"], "a": 2, "an": "P348:应急储备为20*5?万，管理储备为20*10?万。所以总预算为20+1+2=23万。总预算是包含管理储备的。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-013", "s": "某企业董事会讨论全年重大项目成本管理计划，为控制风险，要求每个项目可接受的成本区间为不超过土5这属于管理计划中()的规定。", "o": ["精确度", "绩效测量规则", "绩效测量规划", "准确度"], "a": 3, "an": "P340:关于准确度和精确度的区别在课上给同学们详细讲过。准确度有多准确，代表偏差的正负多少。精确度是精确到小数点后几位等等代表精度", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-014", "s": "关于制定预算的描述，不正确的是()。", "o": ["项目预算包括经批准用于执行项目的全部资金", "成本基准是经过批准且按时间段分配的项目预算", "制定预算过程的主要作用是确定项目所需资金", "制定预算是汇总所有单个活动或工作包的估算成本，建立一个经批准的成本基准的过程"], "a": 2, "an": "P341,确定项目所需资金是估算成本的作用制 定预算规划定义制定预算是汇总所有单个活动或工作包的估算成本，建立一个经批准的成本基准的过程。作用确定可以依据其来进行监督和控制项目绩效的成本基准。开展次数仅开展一次或仅在项目的预定义时开展", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-015", "s": "关于成本管理的描述，正确的是()。", "o": ["应急储备可取成本估算值的某一百分比、某个固定值来确定", "项目进度发生变化但范围没有变化，对成本估算不产生影响", "项目经理无权调用管理储备，因为管理储备不在成本基准之中，所以使用管理储备后，成本基准不会受到影响", "沉没成本是一种历史成本，在投资决策时应充分考虑沉没成本"], "a": 0, "an": "P344:进度变化可能会涉及赶工，需要增加成本等使用管理储备后，成本基准就会跟着变化，所以需要更新成本基准P336:沉没成本：指由于过去的决策已经发生了的，而不能由现在或将来的任何决策改变的成本。沉没成本是一种历史成本，对现有决策而言是不可控成本，会很大程度上影响人们的行为方式与决策，在投资决策时应排除沉没成本的干扰", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-016", "s": "关于成本管理的描述，正确的是()。", "o": ["当项目完工时，成本偏差(CV)可能为零，也可能不为零", "项目资金需求不包括预计债务", "当面对未知-未知的风险时，项目经理可以调用部分应急储备", "项目团队差旅费，人力资源部的工资可以归属于项目工作的直接成本"], "a": 0, "an": "P354-356:CV=EV-AC,项目完工时，可能为零，也可能不为零项目资金需求包括预计支出及预计债务应急储备用在应对已知-未知的风险人力资源部的工资属于公司共同分担的成本，对于项目而言是间接成本", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-017", "s": "挣得进度绩效 SPI(t)>1,代表的意思是()。", "o": ["进度超前", "进度落后", "成本超支", "成本节约"], "a": 0, "an": "P337:挣得进度绩效：SPI(t)=ES/AT,SPI(t)>1,进度超前；SPI(t)<1,进度落后。", "cm": ""}, {"c": 11, "cn": "项目成本管理", "no": "11-018", "s": "以下关于成本基准特点的叙述中，不正确的是()。", "o": ["按时间分段计算，用做度量和监督成本绩效的基准", "成本基准反映整个项目生命期的实际成本支出", "按时段汇总估算的成本编制而成", "通常以S曲线的形式表示"], "a": 1, "an": "P350:实际成本(AC):是在给定时 o": "12-003", "s": "以下说法中不正确的是()。", "o": ["项目合同通常是进行项目质量管理的主要依据", "质量方针是组织内部的行为准则", "质量目标是指“在质量方面所追求的目的”,它是落实质量方针的具体要求，它从属于质量方针", "质量目标可以不用很明确，只要能够描述清楚，保证质量目标容易被沟通和理解"], "a": 3, "an": "P359,质量目标是指“在质量方面所追求的目的”,它是落实质量方针的具体要求，它从属于质量方针，应与利润目标、成本目标、进度目标等相协调。质量目标必须明确、具体，尽量用定量化的语言进行描述，保证质量目标容易被沟通和理解。质量目标应分解落实到各部门及项目的全体成员，以便于实施、检查和考核。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-004", "s": "质量管理工具()常用于找出导致项目问题产生的潜在原因。", "o": ["控制图", "鱼骨图", "散点图", "直方图"], "a": 1, "an": "P376:因果图：因果图又称“鱼骨图”“why-why分析图”和“石川图”,将问题陈述的原因分解为离散的分支，有助于识别问题的主要原因或根本原因。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-005", "s": "关于质量审计的说法中不正确的是()。", "o": ["审计是用于确定项目活动是否遵循了组织和项目的政策、过程与程序的一种结构化且独立的过程", "为了保证审计的真实性，质量审计只能由组织外部的团队开展", "质量审计可事先安排，也可随机进行", "质量审计还可确认已批准的变更请求(包括更新、纠正措施、缺陷补救和预防措施)的实施情况"], "a": 1, "an": "P371:审计是用于确定项目活动是否遵循了组织和项目的政策、过程与程序的一种结构化且独立的过程。质量审计通常由项目外部的团队开展，如组织内部审计部门、项目管理办公室(PMO)或组织外部的审计师。质量审计可事先安排，也可随机进行；可由内部或外部审计师进行。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-006", "s": "关于质量管理的描述，不正确的是()。", "o": ["“检查”—— 对结果进行检查", "项目合同通常是进行项目质量管理的主要依据", "从项目作为一次性的活动来看，项目质量体现在由WBS反映出的项目范围内所有的阶段、子项目、项目工作单元的质量构成，即项目的工作质量", "控制质量关注工作成果与质量要求的比较，确保结果可接受"], "a": 0, "an": "P359,“检查”——保证错误不落到客户手中", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-007", "s": "()是一种展示两个变量之间关系的图形，可在一支轴上展示计划的绩效，在另一支轴上展示实际绩效。", "o": ["流程图", "直方图", "矩阵图", "散点图"], "a": 3, "an": "P376:散点图：可在一支轴上展示计划的绩效，在另一支轴上展示实际绩效。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-008", "s": "质量审计目标不包括()。", "o": ["识别全部正在实施的良好及最佳实践", "识别所有违规做法、差距及不足", "分享所在组织和/或行业中类似项目的良好实践", "保证软件系统或软件产品充分满足用户要求的质量而进行的有计划、有组织的活动"], "a": 3, "an": "P371:质量审计目标一般包括：识别全部正在实施的良好及最佳实践；识别所有违规做法、差距及不足；分享所在组织和/或行业中类似项且的良好实践；积极主动地提供协助，以改进过程的执行，从而帮助团队提高生产效率；强调每次审计都应对组织经验教训知识库的积累做出贡献等。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-009", "s": "质量控制的方法、技术和工具有很多，其中(61)可以用来分析过程是否稳定，是否发生了异常情况。因果图直观地反映了项目中可能出现的问题与各种潜在原因之间的关系。", "o": ["因果图", "控制图", "散点图", "帕累托图"], "a": 1, "an": "P376:因果图：用于识别质量缺陷和错误可能造成的结果。控制图：用于确定一个过程是否稳定。可以使用质量控制图及七点运行定律寻找数据中的规律。七点运行定律是指如果在一个质量控制图中，连续的7个数据点都低于平均值或高于平均值，或者都是上升的，或者都是下降的，那么这个过程就需要因为非随机问题而接受检查。七点原则：三种情况(持续升、降、在一边)直方图：可按来源或组成部分展示缺陷数量。散点图：可在一支轴上展示计划的绩效，在另一支轴上展示实际绩效。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-010", "s": "下面4种质量管理水平，最高的是()。", "o": ["通常，代价最大的方法是让客户发现缺陷", "控制质量过程包括先检测和纠正缺陷，再将可交付成果发送给客户", "将质量融入项目和产品的规划和设计中", "通过质量保证检查并纠正过程本身"], "a": 2, "an": "P359,按有效性递增排列的五种质量管理水平通常，代价最大的方法是让客户发现缺陷。控制质量过程包括先检测和纠正缺陷，再将可交付成果发送给客户。通过质量保证检查并纠正过程本身。将质量融入项目和产品的规划和设计中。在整个组织内创建一种关注并致力于实现过程和产品质量的文化。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-011", "s": "下面说法中不正确的是()。", "o": ["工作质量是指产品的使用价值及其属性，而产品质量则是工作质量的保证", "为引导变更，敏捷方法要求多个质量与审核步骤贯穿整个项目，而不是在面临项目结束时才执行", "对管理质量负有责任的岗位与团队，包括项目经理、项目团队、项目发起人、执行组织的管理层，甚至是客户", "在问卷调查中识别的缺陷相关成本属于一致性成本"], "a": 0, "an": "P358:质量通常是指产品的质量，广义上的质量还包括工作质量。产品质量是指产品的使用价值及其属性；而工作质量则是产品质量的保证，它反映了与产品质量直接有关的工作对产品质量的保证程度", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-012", "s": "()可能是图形、数据或定性文件，其中包含的信息可帮助其他过程和部门采取纠正措施，以实现项目质量期望。", "o": ["质量控制测量结果", "质量测量指标", "测试与评估文件", "质量报告"], "a": 3, "an": "P372:质量报告可能是图形、数据或定性文件，其中包含的信息可帮助其他过程和部门采取纠正措施，以实现项目质量期望。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-013", "s": "以下说法中不正确的是()。", "o": ["全面质量管理，以质量为中心，以结果为基础。由结构、技术、人员和变革推动者4个要素组成", "全面质量管理有4个核心的特征：全员参加的质量管理、全过程的质量管理、全面方法的质量管理和全面结果的质量管理", "全员参加的质量管理。要求全部员工，无论高层管理者还是普通办公职员或一线工人，都要参与质量改进活动。参与“改进工作质量管理的核心机制”,是全面质量管理的主要原则之一", "全面结果的质量管理。全面结果的质量管理指对产品质量、工作质量、工程质量和服务质量等进行全面质量管理"], "a": 0, "an": "P360,A不正确。全面质量管理，以质量为中心，以全员参与为基础。由结构、技术、人员和变革推动者4个要素组成", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-014", "s": "()监督并记录质量活动执行结果，以便评估绩效，并推荐必要的变更。", "o": ["质量规划", "质量保证", "质量控制", "质量改进"], "a": 2, "an": "P361-362,规划质量管理是识别项目及其可交付成果的质量要求和标准，并准备对策确保符合质量要求的过程。管理质量是把组织的质量政策用于项目，并将质量管理计划转化为可执行的质量活动的过程。控制质量是为了评估绩效，确保项目输出完整、正确且满足客户期望，而监督和记录质量管理活动执行结果的过程。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-015", "s": "()可以作为项目质量控制中问题识别和问题分析的工具。", "o": ["帕累托分析", "直方图", "核对表", "因果分析"], "a": 3, "an": "P376:因果图：用于识别质量缺陷和错误可能造成的结果", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-016", "s": "以下质量管理水平有效性最高的是()。", "o": ["在整个组织内创建一种关注并致力于实现过程和产品质量的文化", "将质量融入项目和产品的规划和设计中", "通过质量保证检查并纠正过程本身，而不仅仅是特殊缺陷", "控制质量过程包括先检测和纠正缺陷，再将可交付成果发送给客户"], "a": 0, "an": "P359,按有效性递增排列的五种质量管理水平通常，代价最大的方法是让客户发现缺陷。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-017", "s": "以下说法不正确的是()。", "o": ["测试的目的是找出产品或服务中存在的错误、缺陷、漏洞或其他不合规问题", "测试只在项目结束时进行，目的是为了检测产品缺陷", "软件测试可能包括单元测试、集成测试、接口测试等", "硬件开发中，测试可能包括环境应力筛选、老化测试、系统测试"], "a": 1, "an": "P375-376:测试可以贯穿于整个项目，也可以在项目结束时进行。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-018", "s": "下面说法中不正确的是()。", "o": ["产品质量是指产品的使用价值及其属性", "工作质量则是产品质量的保证，它反映了与产品质量直接有关的工作对产品质量的保证程度", "一个产品质量越好，其等级也越高", "低质量的产品会因质量低劣而无效和/或低效，不会被使用者接受"], "a": 2, "an": "P358,质量与等级是两个不同的概念。质量作为实现的性能或成果，是“一系列内在特性满足要求的程度(ISO 9000)”。等级是对用途相同但技术特性不同的可交付成果的级别分类。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-019", "s": "以下关于项目质量管理的新趋势和新兴实践的说法中不正确的是()。", "o": ["全面质量管理(TQM)、六西格玛和精益六西格玛等属于质量改进举措。", "管理层在其质量职责内，肩负着为项目提供具有足够能力的资源的相应责任。", "在敏捷环境中，干系人与项目管理团队合作可确保在整个项目期间始终做到客户满意。", "PDCA中计划是质量改进的基础"], "a": 3, "an": "P360-361,休哈特*阿牛提出并经戴明完善的“计划一实施一检查一行动(PDCA)”循环是质量改进的基础。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-020", "s": "以下关于质量管理的叙述中，不正确的是()。", "o": ["产品等级高就是质量好", "质量管理注重预防胜于检查", "质量方针由最高管理者批准并发布", "质量目标是落实质量方针的具体要求，从属于质量方针"], "a": 0, "an": "P358,质量与等级的区别。例如：一个低等级(功能有限)、高质量(无明显缺陷，用户手册易读)的软件产品，该产品适合一般使用，可以被认可。一个高等级(功能繁多)、低质量(有许多缺陷，用户手册杂乱无章)的软件产品，该产品的功能会因质量低劣而无效和/或低效，不会被使用者接受", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-021", "s": "()过程的作用之一是识别无效过程和导致质量低劣的原因。", "o": ["规划质量", "管理质量", "检查质量", "控制质量"], "a": 1, "an": "P368,管理质量的作用：*①提高实现质量目标的可能性；*②识别无效过程和导致质量低劣的原因；*③使用控制质量过程的数据和结果向干系人展示项目的总体质量状态。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-022", "s": "()用于比较和分析质量测量指标和实际结果测量。", "o": ["统计抽样", "绩效审查", "根本原因分析(RAC)", "审计"], "a": 1, "an": "P375:统计抽样：是指从目标总体中选取部分样本用于检查。绩效审查：比较和分析质量测量指标和实际结果测量。根本原因分析(RAC):根本原因分析用于识别缺陷成因。可以检查单个活动的成果，也可以检查项目的最终产品。检查也可称为审查、同行审查、审计或巡检等。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-023", "s": "以下说法中不正确的是()。", "o": ["“预防”— 保证过程中不出现错误", "“检查”—— 对结果进行检查", "“公差”—— 结果的可接受范围", "“控制界限”—— 在统计意义上稳定的过程或过程绩效的普通偏差的边界"], "a": 1, "an": "P359,项目管理团队应了解的与统计相关的术语包括：“预防”——保证过程中不出现错误；“检查”——保证错误不落到客户卧牛 手中；“公差”——结果的可接受范围；“控制界限”——在统计意义上稳定的过程或过程绩效的普通偏差的边界", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-024", "s": "“为了评估绩效，确保项目输出完整、正确，并满足客户期望，而监督和记录质量管理活动执行结果的过程”是项目质量管理过程中的()。", "o": ["规划质量管理", "管理质量", "控制质量", "改进质量"], "a": 2, "an": "P361-362,规划质量管理是识别项目及其可交付成果的质量要求、标准，并书面描述项目将如何证明符合质量要求、标准的过程。管理质量是把组织的质量政策用于项目，并将质量管理计划转化为可执行的质量活动的过程。控制质量是为了评估绩效，确保项目输出完整、正确且满足客户期望，而监督和记录质量管理活动执行结果", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-025", "s": "在管理质量中，()用来确定项目活动是否遵循了组织和项目的政策、过程与程序。", "o": ["实验设计", "基准分析", "过程分析", "质量审计"], "a": 3, "an": "P371:质量审计是一种独立的结构化审查，用来确定项目活动是否遵循了组织和项目的政策、过程与程序。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-026", "s": "项目质量管理通过质量规划、管理质量、质量控制程序和过程以及连续的过程改进活动来实现，其中()关注项目执行过程中的质量。", "o": ["管理质量", "质量规划", "质量控制", "质量改进"], "a": 0, "an": "P361-362,管理质量有时被称为“质量保证”,但“管理质量”的定义比“质量保证”更广，因其可用于非项目工作。在项目管理中，质量保证着眼于项目使用的过程，旨在高效地执行项目过程", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-027", "s": "下图属于质量管理中的()工具缺陷/日期日期1日期2日期3日期4小划痕1222大划痕0100弯曲3312缺少组件502I颜色配错2013标签错误1212合计71966", "o": ["核对单", "核查表", "统计抽样表", "矩阵图"], "a": 1, "an": "P375:核查表：又称计数表，用于合理排列各种事项，以便有效地收集关于潜在质量问题的有用数据。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-028", "s": "软件项目的质量，主要用()和软件测试两种方法配合使用来保证。", "o": ["技术评审", "用户试用", "流程外包", "迭代开发"], "a": 0, "an": "老题目，有点价值。软件质量保证是指为保证软件系统或软件产品充分满足用户要求的质量而进行的有计划、有组织的活动，这些活动贯穿于软件生产的各个阶段即整个生命周期。SQA由各项任务构成，这些任务的参与者有两种人，分别是软件开发人员和质量保证人员。前者负责技术工作，后者负责质量保证的计划、监督、记录、分析及报告工作。软件开发人员通过采用可靠的技术、方法和措施，进行正式的技术评审，执行软件测试来保证软件产品的质量。质量保证人员则辅助软件开发人员得到高质量的最终产品。", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-029", "s": "下面那种测试一般由开发人员进行()。", "o": ["单元测试", "集成测试", "回归测试", "验收测试"], "a": 0, "an": "一般单元测试都是由开发人员自行进行，主要是对模块或代码段进行测试", "cm": ""}, {"c": 12, "cn": "项目质量管理", "no": "12-030", "s": "()是结果的可接受范围。", "o": ["检查", "预防", "公差", "控制界限"], "a": 2, "an": "P359,项目管理团队应了解的与统计相关的术语包括：“预防”——保证过程中不出现错误；“检查”——保证错误不落到客户手中；“公差”——结果的可接受范围；“控制界限”——在统计意义上稳定的过程或过程绩效的普通偏差的边界", "cm": " 27", "s": "()的主要作用是概述和指导资源的选择，并将其分配给相应的活动。", "o": ["获取资源", "管理资源", "控制资源", "规划资源"], "a": 0, "an": "P396,获取资源是获取项目所需的团队资源、设施、设备、材料、用品和其他资源的过程。本过程的主要作用是，概述和指导资源的选择，并将其分配给相应的活动。本过程应根据需要在整个项目期间定期开展。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-028", "s": "规划资源管理时需要考虑的依据是()。", "o": ["团队章程", "资源管理计划", "项目章程", "项目团队派工单"], "a": 2, "an": "P389-390:A不正确。团队章程是规划资源管理的输出B不正确。资源管理计划是规划资源管理的输出D不正确。项目团队派工单是获取资源的输出", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-029", "s": "()不是“建设项目团队”过程的输入。", "o": ["认可与奖励", "项目团队派工单", "资源日历", "资源管理计划"], "a": 0, "an": "P401,认可与奖励属于建设项目团队的工具，一般输入都是各种文件或者环境或者组织资产", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-030", "s": "某项目团队每周组织羽毛球活动，根据马斯洛需求层次理论，该活动满足了项目成员()的需求。", "o": ["生理", "受尊重", "社会交往", "自我实现"], "a": 2, "an": "P383-384,马斯洛需求层次理论需求层次定义常见的激励措施生理需求对衣食住行等需求，最低级别的基本需求。员工宿舍、工作餐、工作服、班车、工资、补贴、奖金安全需求对人身安全、生活稳定、不致失业以及免遭痛苦、威胁或疾病等的需求。养老保险、医疗保障、长期劳动合同、意外保险、失业保险社会交往需求对友谊、爱情以及隶属关系的需求。定期员工活动、聚会、比赛、俱乐部受尊重需求自尊心和荣誉感。荣誉来自别人，自尊来自自己。荣誉性的奖励，形象、地位的提升，颁发奖章，作为导师培训别人自我实现需求实现自己的潜力，发挥个人能力到最大程度，使自己越来越成为自己所期望的人物给他更多的空间让他负责、让他成为智囊团、参与决策、参与公司的管理会议马斯洛需求层次理论有如下的3个假设：只有未被满足的需求能够影响其行为，已得到满足的需求不再影响其行为。人的需求按重要性从低到高排成金字塔形状。当人的某一级的需求得到满足后，才会追求更高一级的需求，如此逐级上升，成为他工作的动机。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-031", "s": "()有助于采取措施解决问题、调整沟通方式、解决冲突和改进团队互动。", "o": ["团队绩效评价", "工作绩效报告", "团队章程", "虚拟团队"], "a": 0, "an": "P406,项目管理团队应该持续地对项目团队绩效进行正式或非正式的评价。不断地评价项目团队绩效，有助于采取措施解决问题、调整沟通方式、解决冲突和改进团队互动。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-032", "s": "关于资源管理的描述，不正确的是()。", "o": ["内部资源由职能经理或资源经理负责获取(分配),外部资源则通过采购过程获得", "RAM可确保任何一项任务都只有一个人负责", "在虚拟团队的环境中，个人工作技能变得尤为重要", "集中办公既可以是临时的，也可以贯穿整个项目"], "a": 2, "an": "P399,在虚拟团队的环境中，沟通规划变得尤为重要", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-033", "s": "()识别了各个工作包中每项活动所需的资源类型和数量。", "o": ["资源需求", "资源分解结构", "资源管理计划", "估算范围"], "a": 0, "an": "P395,资源需求，资源需求识别了各个工作包中每项活动所需的资源类型和数量。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-034", "s": "在规划资源管理的数据表现技术中常见的层级型表现形式不包括()。", "o": ["工作分解结构", "组织分解结构", "资源分解结构", "RACI矩阵"], "a": 3, "an": "P391:RACI矩阵不属于层级型表现形式。层级型有：工作分解结构(WBS):有助于明确高层级的职责。组织分解结构(OBS):按照组织现有的部门、单元或团队排列，并在每个部门下列出项目活动或工作包。资源分解结构：按资源类别和类型，对团队和实物资源的层级列表，用于规划、管理和控制项目工作，每向下一个层级代表对资源的更详细描述，直到信息细到可以与工作分解结构(WBS)相结合。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-035", "s": "将问题推迟到准备充分的时候，或者将问题推给其他人员解决属于冲突管理中的()。", "o": ["撤退/回避", "缓和/包容", "妥协/调解", "强迫/命令"], "a": 0, "an": "P406-407,撤退/回避从实际或潜在冲突中退出，将问题推迟到准备充分的时候，或者将问题推给其他人员解决。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-036", "s": "以下说法中不正确的是()。", "o": ["设备、材料、设施属于实物资源。", "团队资源管理相对于实物资源管理，包含了技能和能力要求。", "项目团队成员可以是兼职的。", "团队资源指的是人力资源，包括人员所使用的设备，居住条件等。"], "a": 3, "an": "P380:团队资源指的是人力资源。人员所使用的设备，居住条件，这些是实物资源。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-037", "s": "有关建设团队的描述，不正确的是()。", "o": ["通过各种活动提高团队成员之间的信任和认同感，增进协作", "借助管理层和相关干系人的帮助，使项目组获得有效资源支持", "通过有效手段提高团队成员的知识和技能，实现有效交付", "通过塑造良好的团队文化，提高个人和团队的生产率"], "a": 1, "an": "P400,建设项目团队是提高工作能力，促进团队成员互动，改善团队整体氛围，以提高项目绩效的过程。本过程的主要作用是：改进团队协作，增强人际技能，激励团队成员，降低人员离职率，提升整体项目绩效。B属于干系人管理的范畴。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-038", "s": "关于资源管理过程，()描述是不正确的。", "o": ["获取资源作用是概述和指导资源的选择，将选择的资源分配给相应的活动", "管理团队作用是改进团队协作、增强人际关系技能、激励员工、减少摩擦以及提升整体项目绩效", "控制资源作用是确保所分配的资源适时、适地可用于项目，资源在不再需要时被释放", "规划资源管理作用是根据项目类型和复杂程度确定适用于项目资源的管理方法和管理程度"], "a": 1, "an": "P387:管理团队是跟踪团队成员工作表现、提供反馈、解决问题并管理团队变更以优化项目绩效的过程。B不正确", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-039", "s": "以下()不是获取资源过程的输出。", "o": ["物质资源分配单", "项目团队派工单", "资源日历", "资源需求"], "a": 3, "an": "P397,资源需求是获取资源的输入", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-040", "s": "虚拟团队管理面临的挑战主要在于()。", "o": ["激励", "文化差异", "沟通", "工作不好监督"], "a": 2, "an": "P386-387,虚拟团队管理面临的挑战主要在于沟通，包括团队成员可能产生孤立感、团队成员之间难以分享知识和经验、难以跟进进度和生产率，以及可能存在时区和文化差异等问题。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-041", "s": "()最直观的反应了团队成员个人与其承担的工作之间的联系。", "o": ["工作分解结构", "组织分解结构", "资源分解结构", "责任分配矩阵"], "a": 3, "an": "P391,矩阵型图表的一个例子是职责分配矩阵(RAM),它显示了分配给每个工作包的项目资源，用于说明工作包或活动与项目团队成员之间的关系。责任分配矩阵就是矩阵型的一种。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-042", "s": "可实现团队高效运行的行为不包含()。", "o": ["使用开放与有效的沟通", "创造团队建设机遇", "建立团队成员间的信任", "考核团队绩效并向成员反馈考核结果"], "a": 3, "an": "P401,可实现团队高效运行的行为主要包括：●使用开放与有效的沟通；", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-043", "s": "虚拟团队的使用能带来很多好处，不包括()。", "o": ["减少出差及搬迁费用", "减少信息分享带来的安全风险", "利用技术来营造在线团队环境", "拉近团队成员与供应商、客户或其他重要干系人的距离"], "a": 1, "an": "P399,虚拟团队模式使人们有可能：在组织内部地处不同地理位置的员工之间组建团队。为项目团队增加特殊技能，即使相应的专家不在同一地理区域。将在家办公的员工纳入团队。在工作班次、工作小时或工作日不同的员工之间组建团队。将行动不便者或残疾人纳入团队。执行那些原本会因差旅费用过高而被否决的项目。节省员工所需的办公室和所有实物设备的开支等。在虚拟团队的环境中，沟通规划变得尤为重要。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-044", "s": "把许多或全部团队成员集中到一个物理地点办公，以增强团队工作能力，是()。", "o": ["预分派", "项目团队派工单", "虚拟团队", "集中办公"], "a": 3, "an": "P402,集中办公把许多或全部团队成员集中到一个物理地点办公，以增强团队工作能力", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-045", "s": "关于虚拟团队的描述，不正确的是()。", "o": ["现代通信技术，如Email、微信等，有助于虚拟团队的沟通和管理", "虚拟团队有助于将行动不便，在家办公或有特殊技能的人纳入团队", "与实体团队相比，虚拟团队成员之间更容易分享知识和经验", "与实体团队相比，在虚拟团队中制定可行的沟通计划更加重要"], "a": 2, "an": "P399,在虚拟团队的环境中，沟通规划变得尤为重要。可能需要花更多时间来设定明确的期望、促进沟通、制定冲突解决方法、召集人员参与决策、理解文化差异，以及共享成功喜悦。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-046", "s": "()是跟踪团队成员工作表现、提供反馈、解决问题并管理团队变更，以优化项目绩效的过程。", "o": ["建设团队", "管理团队", "控制资源", "获取资源"], "a": 1, "an": "P387:管理团队是跟踪团队成员工作表现、提供反馈、解决问题并管理团队变更，以优化项目绩效的过程。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-047", "s": "()旨在帮助各团队成员更加有效地协同工作。", "o": ["冲突管理", "影响力", "谈判", "团队建设"], "a": 3, "an": "P402,团队建设活动旨在帮助各团队成员更加有效地协同工作。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-048", "s": "一般来说，团队发展会经历5个阶段。“团队成员之间相互依靠，平稳高效地解决问题，团队成员的集体荣誉感非常强”是()的主要特征。", "o": ["形成阶段", "震荡阶段", "规范阶段", "发挥阶段"], "a": 3, "an": "P382-383,阶段解释说明形成阶段一个个的个体转变为团队成员。团队往往对未来有美好的期待。震荡阶段个体之间开始争执，互相指责，并且开始怀疑项目经理的能力。规范阶段团队成员开始相互信任，项目经理能够得到团队的认可。发挥阶段团队就像一个组织有序的单位。团队成员的集体荣誉感会非常强。解散阶段工作完成后，项目结束，团队解散。不管目前处于什么阶段，增加一个人或减少一个人，都从形成期重新开始。项目团队建设也可跳过某些阶段。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-049", "s": "建设项目团队的目标不包括()。", "o": ["提高团队成员的知识和技能", "减少团队成员间的文化差异", "创建富有凝聚力的团队文化", "提高团队成员之间的认同感"], "a": 1, "an": "P401,建设项目团队的目标包括：提高团队成员的知识和技能。提高团队成员之间的信任和认同感。创建富有生气、凝聚力和协作性的团队文化。提高团队参与决策的能力。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-050", "s": "()是有效领导力的关键要素。", "o": ["尊重和信任", "畏惧和顺从", "独立和创新", "果断和勇敢"], "a": 0, "an": "P381,领导力是让一个群体为了一个共同的目标而努力的能力。尊重和信任，而非畏惧和顺从，是有效领导力的关键要素。领导力是一种影响力，是对人们施加影响，从而使人们心甘情愿地为实现组织的目标而努力的艺术过程。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-051", "s": "下列过程中不属于项目资源管理的是()。", "o": ["规划资源管理", "估算活动资源", "估算活动持续时间", "获取资源"], "a": 2, "an": "P387:C属于进度管理的过程", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-052", "s": "关于团队管理的描述，不正确的是()。", "o": ["滥用惩罚权力可能会导致项目失败，应谨慎使用", "在赫茨伯格双因素理论中，保健因素的满足可以消除不满，激励因素的满足可以产生满意感", "奖励权利来自于组织的授权，参照权利来自于管理者自身", "X理论可以激发员工主动性，Y理论注重加强管理与惩罚"], "a": 3, "an": "P385:用X理论可以加强管理，但项目团队成员通常比较被动地工作。用Y理论可以激发员工主动性，但对于员工把握工作而言可能又放任过度", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-053", "s": "根据赫茨伯格双因素理论，属于保健因素的()。", "o": ["工资薪水", "升职机会", "领导表扬", "先进激励"], "a": 0, "an": "P384,保健因素：这些因素是与工作环境或条件有关的，包括工作环境、工资薪水、公司政策、个人生活、管理监督、人际关系等。激励因素：这些因素是与员工的工作本身或工作内容有关的，是高层次的需要，包括成就、承认、工作本身、责任、发展机会等。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-054", "s": "以下说法中不正确的是()。", "o": ["对于小型项目，项目管理职责可由整个项目团队分担，或者由项目经理独自承担。", "团队成员在规划阶段就参与进来，既可使他们对项目规划工作贡献专业技能，又可以增强他们对项目的责任感。", "项目经理是由执行组织委派，领导项目团队实现项目目标的个人。", "职业道德是个人的素养，和自身有关，项目经理无权干涉"], "a": 3, "an": "P381,项目经理还应留意并支持职业与道德行为，确保所有团队成员都遵守这些行为。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-055", "s": "某公司任命小王为某信息系统开发项目的项目经理。小王组建的团队经过一段时间的磨合，成员之间项目熟悉和了解。矛盾基本解决，项目经理能够得到团队的认可。由于项目进度落后，小王又向公司提出申请，项目组增加了2名新成员。此时项目团队处于()。", "o": ["震荡阶段", "发挥阶段", "形成阶段", "规范阶段"], "a": 2, "an": "P382-383,阶段解释说明形成阶段一个个的个体转变为团队成员。团队往往对未来有美好的期待。震荡阶段个体之间开始争执，互相指责，并且开始怀疑项目经理的能力。规范阶段团队成员开始相互信任，项目经理能够得到团队的认可。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-056", "s": "关于责任分配矩阵(RAM)的描述，不正确的是()。", "o": ["大型项目中，RAM可分为多个层", "针对具体的一项活动可分配多个成员每个成员承担不同职责", "RAM中用不同的字母表示不同的职责", "RAM中每项活动中可以有一个以上成员对任务负责"], "a": 3, "an": "P391,矩阵型图表能反映与每个人相关的所有活动，以及与每项活动相关的所有人员，它也可确保任何一项任务都只有一个人负责，从而避免职权不清。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-057", "s": "()能让项目经理和项目团队洞察成员的优势和劣势。", "o": ["人际关系技能", "项目绩效评估", "个人和团队评估", "冲突管理"], "a": 2, "an": "P403,个人和团队评估工具能让项目经理和项目团队洞察成员的优势和劣势。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-058", "s": "关于管理者和领导者的描述，不正确的是()。", "o": ["领导者的主要工作是确定方向、统一思想、激励和鼓舞", "管理者负责某件事情的管理或实现某个目标", "领导者设定目标，管理者率众实现目标", "项目经理的身份是管理者而非领导者"], "a": 3, "an": "P381,项目经理具有领导者和管理者的双重身份。对项目经理而言，管理能力和领导能力二者均不可或缺。对于大型复杂项目，领导能力尤为重要。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-059", "s": "()不属于项目团队建设的工具和技巧。", "o": ["预分派", "培训", "集中办公", "认可和奖励"], "a": 0, "an": "P402-403,A错误。预分派属于获取资源的工具", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-060", "s": "获取资源过程的输出中，()识别了每种具体资源可用时的工作日、班次、正常营业的上下班时间、周末和公共假期。", "o": ["组织过程资产更新", "物质资源分配单", "项目团队派工单", "资源日历"], "a": 3, "an": "P394,资源日历：识别了每种具体资源可用时的工作日、班次、正常营业的上下班时间、周末和公共假期", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-061", "s": "()按资源类别和类型，对团队和实物资源的层级列表，用于规划、管理和控制项目工作，每", "o": ["工作分解结构", "组织分解结构", "资源分解结构", "责任分配矩阵"], "a": 2, "an": "P391,资源分解结构：按资源类别和类型，对团队和实物资源的层级列表，用于规划、管理和控制项目工作，每向下一个层级代表对资源的更详细描述，直到信息细到可以与工作分解结构(WBS)相结合。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-062", "s": "以下不属于团队资源独有的选择标准的是()。", "o": ["经验", "国际因素", "态度", "成本"], "a": 3, "an": "P398,资源选择标准：可用性、成本、能力、团队资源独特的：经验、知识、技能、态度、国际因素。实物资源也可能要考虑成本", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-063", "s": "在项目资源管理中，仅开展一次或仅在项目的预定义时开展的过程是()。", "o": ["规划资源管理", "估算活动资源", "获取资源", "建设团队"], "a": 0, "an": "P389:规划资源管理，仅开展一次或仅在项目的预定义时开展", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-064", "s": "某软件技术公司，主营业务为软件项目研发和交付，公司项目经理均为软件项目经理，为扩大发展，公司承接了一个技术改造项目，涉及到硬件的升级和更新及相关软件的开发和部署。关于新项目项目经理的人选，合适的是()。", "o": ["从现有软件项目经理中挑选任命，在新项目中锻炼一下", "从现有软件项目经理中挑选，脱产学习半年后任命", "对外招聘一位有软硬件项目经验的项目经理", "设置2个项目经理，软件部分从现有软件项目经理遴选，硬件部分由公司老总担任"], "a": 2, "an": "A错误。项目的一次性特点要求我们对待项目要慎之又慎。B错误。临时性意味着大部分项目都要在一定的时限内推出产品或提供服务。D错误。项目的一次性特点要求我们对待项目要慎之又慎", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-065", "s": "团队成员的离职率降低，是()过程的输出。", "o": ["规划人力资源管理", "组建项目团队", "建设项目团队", "管理项目团队"], "a": 2, "an": "P404,评价团队有效性的指标可包括：个人技能的改进。团队能力的改进。团队成员离职率的降低。团队凝聚力的加强。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-066", "s": "()是通过考察人们的努力行为与其所获得的最终奖酬之间的因果关系来说明激励过程，并以选择合适的行为达到最终的奖酬目标的理论。", "o": ["马斯洛需求层次理论", "赫茨伯格双因素理论", "X理论与Y理论", "期望理论"], "a": 3, "an": "P385-386,期望理论认为，一个目标对人的激励程度受2个因素影响：目标效价：指实现该目标对个人有多大价值的主观判断。如果实现该目标对个人来说很有价值，个人的积极性就高；反之，积极性就低。期望值：指个人对实现该目标可能性大小的主观估计。只有个人认为实现该目标的可能性很大，才会去努力争取实现；如果个人认为实现该目标的可能性很小，目标激励作用则小，以至完全没有。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-067", "s": "评价团队有效性的指标，不包括()。", "o": ["个人技能的改进", "团队成员离职率的提升", "团队能力的改进", "团队凝聚力的加强"], "a": 1, "an": "P404,评价团队有效性的指标可包括：个人技能的改进。团队能力的改进。团队成员离职率的降低。团队凝聚力的加强。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-068", "s": "关于资源管理的描述，不正确的是()。", "o": ["项目经理具有领导者和管理者的双重身份", "冲突不一定是有害的，“一团和气”不一定是高效的集体", "马斯洛需求层次理论中，受尊重是第三层的需求", "在团队建设的五个阶段中，可以跳过某些阶段"], "a": 2, "an": "P383-384,马斯洛需求层次理论中，受尊重是第四层的需求。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-069", "s": "()按照组织现有的部门、单元或团队排列，并在每个部门下列出项目活动或工作包。", "o": ["工作分解结构", "组织分解结构", "资源分解结构", "责任分配矩阵"], "a": 1, "an": "P391,组织分解结构(OBS):按照组织现有的部门、单元或团队排列，并在每个部门下列出项目活动或工作包。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-070", "s": "()检查项目绩效随时间的变化情况，可用于确定绩效是在改善还是在恶化。", "o": ["备选方案分析", "成本效益分析", "绩效审查", "趋势分析"], "a": 3, "an": "P410:趋势分析检查项目绩效随时间的变化情况，可用于确定绩效是在改善还是在恶化。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-071", "s": "在团队发展的5个阶段中，()的特征是：团队成员开始协同工作，并调整各自的工作习惯和行为来支持团队，团队成员开始相互信任，项目经理能够得到团队的认可。", "o": ["形成阶段", "震荡阶段", "发挥阶段", "规范阶段"], "a": 3, "an": "P382-383,阶段解释说明形成阶段一个个的个体转变为团队成员。团队往往对未来有美好的期待。震荡阶段个体之间开始争执，互相指责，并且开始怀疑项目经理的能力。规范阶段团队成员开始相互信任，项目经理能够得到团队的认可。发挥阶段团队就像一个组织有序的单位。团队成员的集体荣誉感会非常强。解散阶段工作完成后，项目结束，团队解散。不管目前处于什么阶段，增加一个人或减少一个人，都从形成期重新开始。项目团队建设也可跳过某些阶段。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-072", "s": "在项目资源管理中，需要在整个项目期间定期开展的过程是()。", "o": ["获取资源", "建设团队", "管理团队", "控制资源"], "a": 0, "an": "P396:获取资源需要在整个项目期间定期开展，其他三个是持续开展", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-073", "s": "赫兹伯格的双因素激励理论中的激励因素类似于马斯洛的需求层次理论中的“()”。", "o": ["安全和自我实现", "尊重和自我实现", "安全和社会认可", "社会认可和尊重"], "a": 1, "an": "P383-385,激励因素：这些因素是与员工的工作本身或工作内容有关的，是高层次的需要，包括成就、承认、工作本身、责任、发展机会等。对应的是马斯洛需求层次的受尊重和自我实现。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-074", "s": "关于团队建设和管理的描述，不正确的是()。", "o": ["在团队发展的5个阶段中，震荡阶段之后是规范阶段", "团队发展不一定按5个阶段顺序进行，可能会跳过某个阶段", "项目经理注重运用奖励权利和惩罚权利，尽量避免使用专家权利", "成功的冲突管理可以提高生产力，改进工作关系"], "a": 2, "an": "P381-382,对于双重汇报关系和非直接汇报关系人员的管理，项目经理更注重运用奖励权力、专家权力和参照权力，尽量避免使用惩罚权力。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-075", "s": "适用于获取资源过程的决策技术是多标准决策分析，其可使用的选择标准不包括()。", "o": ["国际因素", "成本", "技能", "长相"], "a": 3, "an": "P398,适用于获取资源过程的决策技术是多标准决策分析。选择标准常用于选择项目的实物资源或项目团队。可使用的选择标准包括：可用性、成本、能力、经验、知识、技能、态度、国际因素。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-076", "s": "使用项目资源、做出决策、签字批准、验收可交付成果并影响他人开展项目工作的权力，称之为()。", "o": ["角色", "职责", "职权", "能力"], "a": 2, "an": "P392:职权是指使用项目资源、做出决策、签字批准、验收可交付成果并影响他人开展项目工作的权力", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-077", "s": "改进团队协作、增强人际关系技能、激励员工、减少摩擦以及提升整体项目绩效，是()过程的主要作用。", "o": ["建设团队", "管理团队", "控制资源", "获取资源"], "a": 0, "an": "P400:建设团队的主要作用是：改进团队协作、增强人际关系技能、激励员工、减少摩擦以及提升整体项目绩效。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-078", "s": "在一次项目团队内部会议中，一名成员不同意项目经理的方案，导致会议无法进行。项目经理提出先讨论下一项议题，会后单独与其沟通。项目经理使用的是()。", "o": ["缓和或包容", "妥协或调解", "强迫或命令", "撤退或回避"], "a": 3, "an": "P406-407,撤退/回避：从实际或潜在冲突中退出，将问题推迟到准备充分的时候，或者将问题推给其他人解决。", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-079", "s": "某公司在投标时就将准备安排到该项目的项目经理给指定了，这个时候该项目经理还在外地某个项目出差，请问这属于()。", "o": ["虚拟团队", "预分派", "招募", "变更请求"], "a": 1, "an": "P398,预分派指事先确定项目的实物或团队资源，在如下情况时可采用预分派：在竞标过程中承诺分派特定人员进行项目工作；项目取决于特定人员的专有技能；制定项目章程过程或其他过程已经指定了某些团队成员的工作", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-080", "s": "期望理论是一种通过考察人们的努力行为与其所获得的最终奖酬之间的因果关系，来说明激励过程，并以选择合适的行为达到最终的奖酬目标的理论，以下关于期望理论的说法中不正确的是()。", "o": ["期望理论认为，一个目标对人的激励程度受目标效价和期望值2个因素影响", "目标效价指实现该目标对个人有多大价值的科学、客观的判断。如果实现该目标对个人来说很有价值，个人的积极性就高", "期望值指个人对实现该目标可能性大小的主观估计", "期望理论认为，激励水平等于目标效价和期望值的乘积"], "a": 1, "an": "P386:目标效价指实现该目标对个人有多大价值的主观判断。如果实现该目标对个人来说很有价值，个人的积极性就高", "cm": ""}, {"c": 13, "cn": "项目资源管理", "no": "13-081", "s": "()记录了团队成员及其在项目中的角色和职责，可包括项目团队名录，还需要把人员姓名插入项目管理计划的其他部分，如项目组织图和进度计划。", "o":
