标人发送中标通知书；11组织中标人与采购单位签订合同；12进行合同履行的监督管理，解决中标人与采购单位的纠纷。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-007", "s": "依据《中华人民共和国政府采购法》,在招标采购中，()做法不符合关于废标的规定。", "o": ["出现影响采购公正的违法、违规行为的应予废标", "符合专业条件的供应商或者对招标文作出实质响应的供应商不足三家的应予废标", "投标人的报价均超过了采购预算，采购人不能支付的应予废标", "某投标人被废标后，采购人将废标理由仅通知该投标人"], "a": 3, "an": "废标后，采购人应当将废标理由通知所有投标人。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-008", "s": "某集成企业的软件著作权登记发表日期为2013年9月30日，按照著作权法规定，其权利保护期到()。", "o": ["2063年12月31日", "2063年9月29日", "2033年12月31日", "2033年9月29日"], "a": 0, "an": "软件著作权保护期限为50年(第50年12月31日)。除署名权、修改权没有保护期限限制外，其它都是50年", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-009", "s": "按照招投标法律和法规的规定，开标后允许()。", "o": ["投标人更改投标书的内容和报价", "投标人再增加优惠条件", "投标人对投标书中的错误以澄清", "招标人更改招标文件中说明的评标、定标办法"], "a": 2, "an": "《中华人民共和国招标投标法》第四章开标、评标和中标的第三十九条条文规定：“评标委员会可以要求投标人对投标文件中含义不明确的内容做必要的澄清或者说明，但是澄清或者说明不得超出投标文件的范围或者改变投标文件的实质性内容。”", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-010", "s": "根据中华人民共和国招标投标法()是不恰当的。", "o": ["投标人少于三个的，招标人应当重新招标", "当依法必须进行招标的项目的所有投标被否决时，招标人需重新招标", "招标代理机构违反规定，向A投票机构泄露应当保密的与招标有关的情况的资料、结果为B反对票机构中标，中标无效", "投标人相互串通反反投标或者与招标人串通投标的，投标人以向招标人或者评标委员会成员行贿的手段谋取中标的，中标无效"], "a": 2, "an": "《中华人民共和国招标投标法》第五十条条文规定：“招标代理机构违反本法规定，泄露应当保密的与招标投标活动有关的情况和资料的，前款所列行为影响中标结果的，中标无效。而在本试题中，中标方为投标机构B,而非获得泄密信息的投标机构，因此不能认定该中标结果无效。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-011", "s": "某公司采用邀请招标的方式选择承建单位，实施过程中发生了如下事件：①该公司向3家单位发出招标邀请函，其中包括该公司的股东公司②该公司8月1日发出邀请函，要求对方在8月16日提交投标书③该公司外聘了1名法律专家，连同公司CIO、总经理和党委书记组建了评标委员会④该公司的招标书中公开了项目标底根据上述情况，下面说法中，正确的是()。", "o": ["该公司的股东公司参加投标不符合招投标法规", "该公司拟订的投标截止日期符合招投标法规", "评标委员会的组成不符合招投标法规", "招标书中不准公开项目标底"], "a": 3, "an": "A错误，股东公司可以参加投标；B错误，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日。C错误，并没有说是政府采购D正确，对于设有标底的，标底必须保密", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-012", "s": "根据我国著作权法，作者的署名权、修改权、保护作品完整权是著作权的一部分，他们的保护期限为()。", "o": ["50年", "20年", "15年", "不受限制"], "a": 3, "an": "我国《著作权法》第二十条规定作者的署名权、修改权、保护作品完整权的保护期不受限制。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-013", "s": "以下关于招投标的说法，错误的是()。", "o": ["招标人设有标底的，标底必须保密", "依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日", "国家重点项目和省、自治区、直辖市人民政府确定的地方重点项目不适宜公开招投标的，经相关部门批准，可以不进行招标", "招标人具有编制招标文件和组织评标能力的，可以自行办理招标事宜"], "a": 2, "an": "根据招投标法第第十一条规定：国务院发展计划部门确定的国家重点项目和省、自治区、直辖市人民政府确定的地方重点项目不适宜公开招标的，经国务院发展计划部门或者省、自治区、直辖市人民政府批准，可以进行邀请招标。所以C错误。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-014", "s": "公开招标在开标时，应当由()。", "o": ["招标监督机构主持，邀请所有投标人参加", "招标监督机构主持，投标人自愿参加", "招标人主持，邀请所有投标人参加", "招标人主持，投标人自愿参加"], "a": 2, "an": "根据中华人民共和国招投标法第三十五条规定：开标由招标人主持，邀请所有投标人参加。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-015", "s": "以下对著作仅的表述，()是错误的。", "o": ["中国公民、法人或者其他组织的作品，不论是否发表，享有著作权", "对作品、作品的片段或者不构成作品的数据或者其他材料选择、编排体现独创性的新生作品，称为汇编作品，其著作权由汇编人享有", "公民为完成法人或者其他组织工作任务所创作的作品是职务作品，其一般职务作品的著作权由作者享有", "职务作品完成两年内，作者在任何情况下均不可以许可第三人以与单位使用的相同方式使用该作品"], "a": 3, "an": "公民为完成法人或者其他组织工作任务所创作的作品是职务作品，除本条第二款的规定以外，", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-016", "s": "评标委员会中，技术、经济等方面的专家不得少于成员总数的()。", "o": ["2/3", "1/2", "1/3", "2/5"], "a": 0, "an": "依法必须进行招标的项目，其评标委员会由招标人的代表和有关技术、经济等方面的专家组成，成员人数为五人以上单数，其中技术、经济等方面的专家不得少于成员总数的三分之二。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-017", "s": "下列叙述中，不符合《中华人民共和国招投标法》的是()。", "o": ["招标人采用公开招标发方式的，应该发布招标公告", "招标人采用邀请招标方式的，应当向三个以上具备承担招标项目的能力、资信良好的特定的法人或者其他组织发出投标邀请书", "中标人不得向他人转让中标项目，也不得将中标项目肢解后分别向他人转让", "投标人报价不受限制"], "a": 3, "an": "《招投标法》第三十三条规定：投标人不得以低于成本的报价竞标，也不得以他人名义投标或者以其他方式弄虚作假，骗取中标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-018", "s": "某采购人在履行采购金额为1000万元的政府采购合同中，需要追加与该合同标的相同的货物。根据相关法律，在不改变合同其他条款的前提下，下列说法中正确的是()。", "o": ["可以与供应商协商签订补充合同，但补充合同的采购金额不得超过100万元", "可以与供应商签订补充合同，但须得到省级以上政府授权的机构批准", "采购商不能与供应商签订单一来源的采购合同", "可以与供应商签订补充合同，但补充合同的采购金额不得超过1000万元，如超过1000万元则须得到省级以上授权的机构批准"], "a": 0, "an": "根据《政府采购法》第四十九条的规定：政府采购合同履行中，采购人需追加与合同标的相同的货物、工程或者服务的，在不改变合同其他条款的前提下，可以与供应商协商签订补充合同，但所有补充合同的采购金额不得超过原合同采购金额的百分之十。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-019", "s": "某企业在招标时，首先通过某种资格审查选择部分供应商，并以邮件问询的方式确定它们是否有兴趣参与竞标，然后将采购文件包发给所有有兴趣的供应商，并对供应商反馈的投标文件进行评估，最终将中标消息通知给中标的供应商。以下关于本次招标过程的判断，正确的是()。", "o": ["项目招标之前该企业不应当事先进行资格筛选", "意见征询不应通过邮件的方式进行", "中标结果不应仅凭评估分数确定", "在选定供应商后，招标结果不应只反馈给中标供应商"], "a": 3, "an": "中标人确定后，招标人应当向中标人发出中标通知书，并同时将中标结果通知所有未中标的投标人。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-020", "s": "某招标公司在为委托方的项目进行公开招标的过程如下：①3月15日在互联网上公开了招标事项，写明投标的截止日期是4月1日上午9时整②从本地公证处请了2名工作人员对招标过程进行公证③邀请相关行业的专家和委托方代表各5人成立评审委员会④唱标结束后，请所有投标人离场，待评审委员会得出结论后再通知相关人员⑤确定中标单位后，立即向所有参加投标的企业退还投标保证金上述过程中不正确的包括()。", "o": ["①③⑤", "①②③", "①②④", "②③⑤"], "a": 0, "an": "①错误，时间不能少于20天③错误，评标委员会由招标人的代表和有关技术、经济等方面的专家组成，成员人数为五人以上单数，其中技术、经济等方面的专家不得少于成员总数的三分之二⑤错误，对于未中标的投标保证金，应当在发出中标通知书后一定时间内，尽快退还给投标人", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-021", "s": "某地政府采取询价方式采购网络设备，()是符合招投标法要求的。", "o": ["询价小组由采购人的代表和有关专家共8人组成", "被询价的A供应商提供第一次报价后，发现报价有误，调整后提交了二次报价", "询价小组根据采购需求，从符合资格条件的供应商名单中确定三家供应商，并向其发出询价通知书让其报价", "采购人根据符合采购需求、质量和服务相等且报价最低的原则确定成交供应商，最后将结果通知成交供应商"], "a": 2, "an": "A不正确，需要5人以上单数B不正确，询价小组要求被询价的供应商一次报出不得更改的价格D不正确，采购人根据符合采购需求、质量和服务相等且报价最低的原则确定成交供应商，并将结果通知所有被询价的未成交的供应商。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-022", "s": "根据《中华人民共和国政府采购法》,针对()情况，不能使用单一来源方式采购。", "o": ["只有唯一的供应商可满足采购需求", "招标后没有供应商投标", "发生了不可预见的紧急情况不能从其他供应商处采购", "必须保证原有采购项目一致性或者服务配套的要求，需要继续从原供应商处添购，且添购资金总额不超过原合同采购金额百分之十"], "a": 1, "an": "《中华人民共和国政府采购法》第三十一条符合下列情形之一的货物或者服务，可以依照本法采用单一来源方式采购：(一)只能从唯一供应商处采购的；(二)发生了不可预见的紧急情况不能从其他供应商处采购的；", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-023", "s": "某省级政府对一个信息系统集成项目进行招标，2010年3月1日发招标文件，定于2010年3月20日9点开标。在招投标过程中，()是恰当的。", "o": ["3月10日对招标文件内容做出了修改，3月20日9点开标", "3月20日9点因一家供应商未能到场，在征得其他投标人同意后，开标时间延后半个小时", "3月25日发布中标通知书，4月15日与中标单位签订合同", "评标时考虑到支持地方企业发展，对省内企业要求系统集成二级资质，对省外企业要求系统集成一级资质"], "a": 2, "an": "A不正确，至少要在15日前进行修改B不正确，应当在开标时间开标C正确，在中标通知书发出的30日内签订合同D不正确，所有资质应当统一", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-024", "s": "某市政府采购采用公开招标。招标文件要求投标企业必须通过ISO9001认证并提交ISO9001证书。在评标过程中，评标专家发现有多家企业的投标文件没有按标书要求提供ISO9001证书。依据相关法律法规，以下处理方式中，()是正确的。", "o": ["因不能保证采购质量，招标无效，重新组织招标", "若满足招标文件要求的企业达到三家，招标有效", "放弃对ISO9001证书的要求，招标有效", "若满足招标文件要求的企业不足三家，则转入竞争性谈判"], "a": 1, "an": "这题AC明显错误，只看B和D,D也有错误，招标企业不足三家，需要重新招标", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-025", "s": "下列描述中()不是《中华人民共和国招投标法》的正确内容。", "o": ["招标人采用公开招标方式的，应当发布招标公告", "招标人采用邀请招标方式的，应当向三个以上具备承担招标项目的能力、资信良好的特定的法人或者其他组织发出投标邀请书", "投标人报价不受限制", "中标人不得向他人转让中标项目，也不得将中标项目肢解后分别同他人转让"], "a": 2, "an": "《中华人民共和国招投标法》第四章第三十三条规定，投标人不得以低于成本的报价竞标，也不得以他人名义投标或者以其他方式弄虚作假，骗取中标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-026", "s": "关于政府采购法的描述，正确的是()。", "o": ["各级人民政府财政部门是负责政府采购监督管理的部门，依法履行对政府采购活动的监督管理职责", "集中采购机构是非营利事业法人，也可以是营利性事业法人，根据采购人的委托办理采购事宜", "自然人、法人或者其他组织不能组成一个联合体以一个供应商的身份共同参加政府采购", "竞争性谈判应作为政府采购的主要采购方式"], "a": 0, "an": "在下文中简称《中华人民共和国政府采购法》为采购法。依据采购法第十三条的如下规定：A正确，各级人民政府财政部门是负责政府采购监督管理的部门，依法履行对政府采购活动的监督管理职责。各级人民政府其他有关部门依法履行与政府采购活动有关的监督管理职责。B错误，根据采购法的第十六条如下规定：“集中采购机构为采购代理机构。设区的市、自治州以上人民政府根据本级政府采购项目组织集中采购的需要设立集中采购机构。””集中采购机构是非营利事业法人，根据采购人的委托办理采购事宜。”C错误，依据采购法第二十四条的规定：“两个以上的自然人、法人或者其他组织可以组成一个联合体，以一个供应商的身份共同参加政府采购。\"D错误依据采购法第二十六条的规定：“公开招标应作为政府采购的主要采购方式。”", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-027", "s": "两个以上法人或者其他组织组成联合体投标时，若招标文件对投标人资格条件有规定的，则联合体()。", "o": ["各方的加总条件应符合规定的资格条件", "有一方应具备规定的相应资格条件即可", "各方均应具备规定的资格条件", "主要一方应具备相应的资格条件"], "a": 2, "an": "《中华人民共和国招标投标法》第三十一条的如下规定：“两个以上法人或者其他组织可以组成一个联合体，以一个投标人的身份共同投标。联合体各方均应当具备承担招标项目的相应能力；国家有关规定或者招标文件对投标人资格条件有规定的，联合体各方均应当具备规定的相应资格条件。由同一专业的单位组成的联合体，按照资质等级较低的单位确定资质等级。”", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-028", "s": "根据《中华人民共和国政府采购法》的规定，当()时不采用竞争性谈判方式采购。", "o": ["技术复杂或性质特殊，不能确定详细规格或具体要求", "采用招标所需时间不能满足用户紧急需要", "发生了不可预见的紧急情况不能从其他供应商处采购", "不能事先计算出价格总额"], "a": 2, "an": "第三十条符合下列情形之一的货物或者服务，可以依照本法采用竞争性谈判方式采购1招标后没有供应商投标或者没有合格标的或者重新招标未能成立的；2技术复杂或者性质特殊，不能确定详细规格或者具体要求的；3采用招标所需时间不能满足用户紧急需要的；4不能事先计算出价格总额的。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-029", "s": "按照《中华人民共和国招标投标法》的规定，下列说法中错误的是()。", "o": ["招标人根据招标项目的具体情况，可以组织潜在投标人踏勘项目现场", "招标人不得向他人透露已获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。招标人设有标底的，标底必须在招标文件中载明", "投标人应当按照招标文件的要求编制投标文件。投标文件应当对招标文件提出的实质性要求和条件做出响应", "招标人应当确定投标人编制投标文件所需要的合理时间；但是，依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日"], "a": 1, "an": "招标人设有标底的，标底必须保密。依据《中华人民共和国招标投标法》的如下规定：第二十一条招标人根据招标项目的具体情况，可以组织潜在投标人踏勘项目现场。第二十二条招标人不得向他人透露己获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。招标人设有标底的，标底必须保密。第二十七条投标人应当按照招标文件的要求编制投标文件。投标文件应当对招标文件提出的实质性要求和条件作出响应。招标项目属于建设施工的，投标文件的内容应当包括拟派出的项目负责人与主要技术人员的简历、业绩和拟用于完成招标项目的机械设备等。第二十四条招标人应当确定投标人编制投标文件所需要的合理时间；但是，依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-030", "s": "按照《中华人民共和国招标投标法》的规定，下列说法中正确的是()。", "o": ["投标人在向招标方递交投标文件后，就无权对投标文件进行补充、修改或者撤回", "两个以上法人或者其他组织可以组成一个联合体，以一个投标人的身份共同投标。由同一专业的单位组成的联合体，按照资质等级较高的单位确定资质等级", "中标通知书发出后，中标人放弃中标项目的，不用承担法律责任", "中标人按照合同约定或者经招标人同意，可以将中标项目的部分非主体、非关键性工作分包给他人完成"], "a": 3, "an": "A错误，在开标截止前投标人都可以对投标文件进行补充、修改或者撤回B错误，由同一专业的单位组成的联合体，按照资质等级较低的单位确定资质等级。C错误，中标通知书发出后，招标人改变中标结果的，或者中标人放弃中标项目的，应当依法承担法律责任。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-031", "s": "依据中华人民共和国政府采购法，在招标采购中，关于应予废标的规定，()是不成立的。", "o": ["符合专业条件的供应商或者对招标文件作实质响应的供应商不足三家的应予废标", "出现影响采购公正的违法、违规行为的应予废标", "投标人的报价均超过了采购预算，采购人不能支付的应予废标", "废标后，采购人将废标理由仅通知该投标人"], "a": 3, "an": "根据《中华人民共和国政府采购法》第三十六条在招标采购中，出现下列情形之一的，应予废标：(一)符合专业条件的供应商或者对招标文件作实质响应的供应商不足三家的：(二)出现影响采购公正的违法、违规行为的；(三)投标人的报价均超过了采购预算，采购人不能支付的；(四)因重大变故，采购任务取消的。废标后，采购人应当将废标理由通知所有投标人。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-032", "s": "下列有关中华人民共和国政府采购法的陈述中，错误的是()。", "o": ["政府采购可以采用公开招标方式", "政府采购可以采用邀请招标方式", "政府采购可以采用竞争性谈判方式", "公开招标应作为政府采购的主要采购方式，政府采购不可从单一来源采购"], "a": 3, "an": "第二十六条政府采购采用以下方式：(1)公开招标；(2)邀请招标；(3)竞争性谈判；(4)单一来源采购：(5)询价；(6)国务院政府采购监督管理部门认定的其他采购方式。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-033", "s": "依据中华人民共和国政府采购法中有关供应商参加政府采购活动应当具备的条件，下列陈述中错误的是()。", "o": ["供应商参加政府采购活动应当具有独立承担民事责任的能力", "采购人可以要求参加政府采购的供应商提供有关资质证明文件和业绩情况，对有资质的供应商免于资格审查", "供应商参加政府采购活动应当具有良好的商业信誉和健全的财务会计制度", "供应商参加政府采购活动应当具有依法缴纳税收和社会保障资金的良好记录，并且参加政府采购活动前三年内，在经营活动中没有重大违法记录"], "a": 1, "an": "根据《中华人民共和国政府采购法》的如下规定：第二十二条供应商参加政府采购活动应当具备下列条件：(一)具有独立承担民事责任的能力；(二)具有良好的商业信誉和健全的财务会计制度；(三)具有履行合同所必需的设备和专业技术能力：(四)有依法缴纳税收和社会保障资金的良好记录；(五)参加政府采购活动前三年内，在经营活动中没有重大违法记录；(六)法律、行政法规规定的其他条件。采购人可以根据采购项目的特殊要求，规定供应商的特定条件，但不得以不合理的条件对供应商实行差别待遇或者歧视待遇。第二十三条采购人可以要求参加政府采购的供应商提供有关资质证明文件和业绩情况，并根据本法规定的供应商条件和采购项目对供应商的特定要求，对供应商的资格进行审查。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-034", "s": "下列有关《中华人民共和国政府采购法》的陈述中，错误的是()。", "o": ["任何单位和个人不得采用任何方式，阻挠和限制供应商自由进入本地区和本行业的政府采购市场", "政府采购应当采购本国货物、工程和服务。需要采购的货物、工程或者服务在中国境内无法获取或者无法以合理的商业条件获取的则除外", "政府采购应当采购本国货物、工程和服务。为在中国境外使用而进行采购的则除外", "政府采购实行集中采购和分散采购相结合。其中集中采购由国务院统一确定并公布；分散采购由各省级人民政府公布的采购目录确定并公布"], "a": 3, "an": "根据《中华人民共和国政府采购法》的如下规定：第五条任何单位和个人不得采用任何方式，阻挠和限制供应商自由进入本地区和本行业的政府采购市场。第七条政府采购实行集中采购和分散采购相结合。集中采购的范围由省级以上人民政府公布的集中采购目录确定。属于中央预算的政府采购项目，其集中采购目录由国务院确定并公布；属于地方预算的政府采购项目，其集中采购目录由省、自治区、直辖市人民政府或者其授权的机构确定并公布。纳入集中采购目录的政府采购项目，应当实行集中采购。第十条政府采购应当采购本国货物、工程和服务。但有下列情形之一的除外：(一)需要采购的货物、工程或者服务在中国境内无法获取或者无法以合理的商业条件获取的；(二)为在中国境外使用而进行采购的；(三)其他法律、行政法规另有规定的。前款所称本国货物、工程和服务的界定，依照国务院有关规定执行。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-035", "s": "根据有关法律，招标人与中标人应当自中标通知发出之日()天内，按招标文件和中标人的投标文件订立书面合同。", "o": ["15", "20", "30", "45"], "a": 2, "an": "招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-036", "s": "公开招标是指()。", "o": ["招标人以投标邀请书的方式邀请特定的法人或者其他组织投标", "发布招标广告吸引或者直接邀请众多投标人参加投标并按照规定程序从中选择中标人的行为", "招标人以招标公告的方式邀请不特定的法人或者其他组织投标", "有限招标"], "a": 2, "an": "公开招标，是指招标人以招标公告的方式邀请不特定的法人或者其他组织投标。邀请招标，是指招标人以投标邀请书的方式邀请特定的法人或者其他组织投标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-037", "s": "下列关于投标的叙述中，不正确的是()。", "o": ["两个以上法人可以组成一个联合体，以一个投标人的身份共同投标", "在招标文件要求提交投标文件的截止时间后送达的投标文件，招标人应当拒收", "招标人不得相互串通投标报价", "竞标时，投标人可以自行决定报价，报价数额不受限制"], "a": 3, "an": "投标人不得以低于成本的报价竞标，也不得以他人的名誉投标或者以其他的方式弄虚作假，骗取中标。选项D中报价数额不受限制，错误。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-038", "s": "关于中标候选人的描述，不正确的是()。", "o": ["中标候选人不超过3个，并标明顺序", "排名第一的中标候选人放弃中标需重新招标", "中标候选人公示期不得少于3日", "招标人应当确定排名第一的中标候选人为中标人"], "a": 1, "an": "排名第一的中标候选人放弃中标、因不可抗力不能履行合同、不按照招标文件要求提交履约保证金，或者被查实存在影响中标结果的违法行为等情形，不符合中标条件的，招标人可以按照评标委员会提出的中标候选人名单排序依次确定其他中标候选人为中标人，也可以重新招标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-039", "s": "招标过程中，招标人自收到异议之日起()日内作出答复；作出答复前，应当暂停招标投标活动。", "o": ["3", "5", "7", "9"], "a": 0, "an": "在中标候选人公示期间提出异议。招标人应当自收到异议之日起3日内作出答复；作出答复前，应当暂停招标投标活动。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-040", "s": "关于投标的描述，正确的是()。", "o": ["投标文件应当对招标文件做出实质性响应", "投标人应当在开标前将投标文件送达投标地点", "投标人不得将中标项目的部分工作进行分包", "一个投标人必须是一个法人"], "a": 0, "an": "A正确，投标人应当按照招标文件的要求编制投标文件。投标文件应当对招标文件提出的实质性要求和条件做出实质性响应。B错误，应在提交投标文件的截止时间前，而不是开标前。C错误，经同意可以分包非关键部分；D错误，可以多个法人组成联合体。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-041", "s": "招标人采用资格预审办法对招标人进行资格审查的，应当在开标后由()按照招标文件规定它的标准和方法对招标人的资格进行审查。", "o": ["评标委员会", "资格审查委员会", "认证认可发会", "招标组的委员会"], "a": 0, "an": "招标人采用资格预审办法对招标人进行资格审查的，应当在开标后由正标委员会按照招标文件规定它的标准和方法对招标人的资格进行审查。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-042", "s": "关于招投标的描述，不正确的是()。", "o": ["第一中标候选人无法履约的，要重新投标", "中标候选人应为不超过3个，且应标明排序", "招标人公示中标候选人，公示期不少于3天", "投标人少于3个的，不得开标，招标人应重新招标"], "a": 0, "an": "排名第一的中标候选人放弃中标、因不可抗力不能履行合同、不按照招标文件要求提交履约保证金，或者被查实存在影响中标结果的违法行为等情形，不符合中标条件的，招标人可以按照评标委员会提出的中标候选人名单排序依次确定其他中标候选人为中标人，也可以重新招标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-043", "s": "对技术复杂或者无法精确拟定技术规格的项目，招标人可以分两阶段进行招标，其中不属于第一阶段招标活动的是()①投标人提交不带报价的技术建议；②招标人提供招标文件；③招标人编制招标文件；④投标人提交保证金", "o": ["①②", "①④", "②③", "②④"], "a": 3, "an": "对技术复杂或者无法精确拟定技术规格的项目，招标人可以分两阶段进行招标。第一阶段，投标人按照招标公告或者投标邀请书的要求提交不带报价的技术建议，招标人根据投标人提交的技术建议确定技术标准和要求，编制招标文件。第二阶段，招标人向在第一阶段提交技术建议的投标人提供招标文件，投标人按照招标文件的要求提交包括最终技术方案和投标报价的投标文件。招标人要求投标人提交投标保证金的，应当在第二阶段提出。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-044", "s": "开标时，由专业的负责人进行(),其主要目的是公布投标报价，若有其他内容则看招标文件要求。", "o": ["唱标", "评标", "讲标", "定标"], "a": 0, "an": "开标时，由专业的负责人进行唱标。唱标主要公布投标报价，其他内容看招标文件要求。投标人对开标有异议的，应当在开标现场提出，招标人应当当场做出答复，并进行记录", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-045", "s": "关于项目招投标的描述，正确的是()。", "o": ["资格预审文件或者招标文件的发售期不得少于7天", "投资保证金不得超过招标项目估算价的1%", "一个招标项目只能有一个标底", "中标候选人应当不超过2个并标明排序"], "a": 2, "an": "A错误，资格预审文件或者招标文件的发售期不得少于5日B错误，招标人再招标文件中要求投标人提交投标保证金的，投标保证金不得超过招标项目估算价的2%D错误，中标候选人应当不超过3个并标明排序", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-046", "s": "关于招投标相关的描述，不正确的是()。", "o": ["合同的主要条款应与招标文件和中标人的投标文件内容一致", "招标人和投标人不得再行订立背离合同实质性内容的其他协议", "如果中标人不同意按照招标文件规定条件按时签约，应重新组织招标", "如果所有投标人都没有能够按照招标文件的规定和条件进行签约，则可以宣布本次招标无效"], "a": 2, "an": "如果中标人不同意按照招标文件规定的条件或条款按时签约，招标方有权宣布该标作废而与第二最低评估价投标人进行签约。如果所有投标人都没有能够按照招投标文件的规定和条件进行签约，或者所有投标人的投标价都超出本合同标的预算，则可以在请示有关管理部门之后宣布本次招标无效，而重新组织招标。", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-047", "s": "依据《中华人民共和国招投标法》,不正确的是()。", "o": ["投标人少于3个的不得开标", "招标人和中标人应当在中标通知发出之日起30日内订立面合同", "招标人不可以自行选择招标代理机构", "中标通知书对招标人和中标人具有法律效力"], "a": 2, "an": "《中华人民共和国招标投标法》第十二条 招标人有权自行选择招标代理机构，委托其办理招标事宜。任何单位和个人不得以任何方式为招标人指定招标代理机构", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-048", "s": "关于项目招投标的说法，不正确的是()。", "o": ["中标人确定后，招标人应当视情况向中标人发出中标通知书，将中标结果通知所有未中标的投标人", "依法必须进行招标的项目，招标人应当自收到评标报告之日起3日内公示中标候选人", "招标人在招标文件中要求投标人提交投标保证金的，投标保证金有效期应当与投标有效期一致", "投标人少于3个的，不得开标；招标人应当重新招标"], "a": 0, "an": "中标人确定后，招标人应当向中标人发出中标通知书，并同时将中标结果通知所有未中标的投标人", "cm": ""}, {"c": 24, "cn": "法律法规与标准规范", "no": "24-049", "s": "关于项目招投标的描述，不正确的是()。", "o": ["招标人采用公开招标，应当发布招标公告", "两个或两个以上法人或者其他组织可以组成一个联合体共同投标", "招标人在招标文件中要求投标人提交投标保证金的，投标保证金有效期应长于投标有效期", "评标委员会名单在中标结果确定前需保密"], "a": 2, "an": "招标人在招标文件中要求投标人提交投标保证金的，投标保证金不得超过招标项目估算价的2??投标保证金有效期应当与投标有效期一致淘宝扫码购课微信公众号扫码加老师Q扫码加老师V蜗牛软考小鹅通店铺", "cm": "答案选D。这题起始也很简单，只需要看明白 stakeholders,干系人，就可以推出答案来，四个选项中只有D是和干系人有关的工具和技术。【2023年11月真题-第四批】-72()is the hierarchical breakdown of the entire scope of work by the project team to accomplishthe project objectives and create the required deliverables,It provides detaileddeliverable,activity,and scheduling information about each component in the work breakdownstructure.A、OLA B、SLAC、SOP D、WBS【答案】:D【蜗牛解析】:()是按项目团队完成项目目标并创建所需的可交付成果，它提供了详细的可交付成果、活动和时间表关于工作分解结构中每个组件的信息。"}];
const CHAPTERS = [...new Set(QUESTIONS.map(q=>q.c))].sort((a,b)=>a-b);

// 状态
let mode='order', selectedChap='all', answered=false, cur=0;
let orderList=[], pos=0;
const stat={right:0, wrong:0, total:0};
let wrongIds = new Set();
// 历史错题（持久化，关掉重开仍保留）
let historyWrong = new Set();
try{ const hw = JSON.parse(localStorage.getItem('gw_historyWrong')||'[]'); hw.forEach(n=>historyWrong.add(n)); }catch(e){}

// 初始化章节选择
const sel=document.getElementById('chapSel');
sel.innerHTML='<option value="all">全部章节（'+QUESTIONS.length+'题）</option>'+
  CHAPTERS.map(c=>{const n=QUESTIONS.filter(q=>q.c===c).length;return '<option value="'+c+'">第'+c+'章 '+CHAPTER_NAME(c)+'（'+n+'题）</option>';}).join('');

function CHAPTER_NAME(c){const map={1:'信息化发展',2:'信息技术发展',3:'信息系统治理',4:'信息系统管理',5:'信息系统工程',6:'项目管理概论',7:'项目立项管理',8:'项目整合管理',9:'项目范围管理',10:'项目进度管理',11:'项目成本管理',12:'项目质量管理',13:'项目资源管理',14:'项目沟通管理',15:'项目风险管理',16:'项目采购管理',17:'项目干系人管理',18:'项目绩效域',19:'配置与变更管理',20:'高级项目管理',22:'组织通用治理',23:'组织通用管理',24:'法律法规与标准规范',25:'英语'};return map[c]||('第'+c+'章');}

function buildOrderList(){
  let pool = selectedChap==='all' ? QUESTIONS.slice() : QUESTIONS.filter(q=>q.c==selectedChap);
  if(mode==='random'){ // 洗牌
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  }
  return pool.map(q=>q.no); // 用题目no追踪
}
const byNo={}; QUESTIONS.forEach(q=>byNo[q.no]=q);

function saveHistory(){
  try{ localStorage.setItem('gw_historyWrong', JSON.stringify([...historyWrong])); }catch(e){}
}
// ===== 进度自动保存/恢复（新增）=====
var PROG_KEY='gw_progress_v1';
function saveProgress(){ try{ if(orderList&&orderList.length){ localStorage.setItem(PROG_KEY, JSON.stringify({orderList:orderList, pos:pos, selectedChap:selectedChap, mode:mode, at:Date.now()})); } }catch(e){} }
function tryLoadProgress(){
  try{ const raw=localStorage.getItem(PROG_KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d||!d.orderList||!d.orderList.length||typeof d.pos!=='number') return null;
    if(d.pos>=d.orderList.length) return null;
    if(d.selectedChap!==selectedChap) return null; // 章节变了，放弃旧进度
    return d;
  }catch(e){ return null; }
}
function clearProgress(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }

function refreshHistBtn(){
  const b=document.getElementById('histBtn');
  if(b){ b.innerHTML='📌 练历史错题('+historyWrong.size+')'; b.style.display=historyWrong.size?'':'none'; }
}

function startQuiz(){
  var savedTry=tryLoadProgress();
  if(savedTry){ orderList=savedTry.orderList; pos=savedTry.pos; selectedChap=savedTry.selectedChap; mode=savedTry.mode; var chill=document.getElementById('chapSel'); if(chill) chill.value=(selectedChap==='all'?'all':selectedChap); saveProgress(); return render(); }
  orderList=buildOrderList();
  pos=0; stat.right=0; stat.wrong=0; wrongIds=new Set();
  answered=false;
  document.getElementById('stRight').textContent='0';
  document.getElementById('stWrong').textContent='0';
  document.getElementById('stRate').textContent='0%';
  refreshHistBtn();
  render();
}

// 渲染当前题
function render(){
  const area=document.getElementById('quizArea');
  if(pos>=orderList.length){ return showDone(area); }
  const q=byNo[orderList[pos]];
  const ch=CHAPTER_NAME(q.c);
  document.getElementById('stProgress').textContent=(pos+1)+'/'+orderList.length;

  let opts=q.o.map((t,i)=>'<div class="opt" data-i="'+i+'"><div class="letter">'+String.fromCharCode(65+i)+'</div><div>'+esc(t)+'</div></div>').join('');
  area.innerHTML=
   '<div class="qcard">'+
     '<div class="qmeta"><span class="chip">第'+q.c+'章 '+ch+'</span><span class="qno">'+q.no+'</span></div>'+
     '<div class="stem">'+esc(q.s)+'</div>'+
     '<div class="options">'+opts+'</div>'+
     '<div class="feedback" id="fb"></div>'+
     '<div class="actions">'+
       '<button id="restartBtn" onclick="startQuiz()">↻ 重新开始</button>'+
       '<button id="nextBtn">下一题 →</button>'+
     '</div>'+
   '</div>';

  document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>answer(parseInt(el.dataset.i))));
  const next=document.getElementById('nextBtn');
  next.disabled=true;
  next.onclick=()=>{ if(answered){pos++; answered=false; render();} };
  updateBar();
  saveProgress();
}

function answer(i){
  if(answered) return;
  answered=true;
  const q=byNo[orderList[pos]];
  const correct=i===q.a;
  if(correct){stat.right++;} else {stat.wrong++; wrongIds.add(q.no); historyWrong.add(q.no); saveHistory(); refreshHistBtn();}
  stat.total++;

  const opts=document.querySelectorAll('.opt');
  opts.forEach((el,idx)=>{
    if(idx===q.a) el.classList.add('correct');
    else if(idx===i) el.classList.add('wrong','dim');
    else el.classList.add('dim');
  });

  const fb=document.getElementById('fb');
  if(correct){
    fb.className='feedback show ok';
    fb.innerHTML='<h3>✅ 回答正确！</h3>'+
      (q.an?('<div class="analysis">📖 '+esc(q.an)+'</div>'):'')+
      (q.cm?('<div class="comment">💡 '+esc(q.cm)+'</div>'):'');
  }else{
    fb.className='feedback show err';
    fb.innerHTML='<h3>❌ 回答错误</h3><p>正确答案：<b>'+String.fromCharCode(65+q.a)+'</b> —— '+esc(q.o[q.a]||'')+'</p>'+
      (q.an?('<div class="analysis">📖 '+esc(q.an)+'</div>'):'')+
      (q.cm?('<div class="comment">💡 '+esc(q.cm)+'</div>'):'');
  }
  document.getElementById('stRight').textContent=stat.right;
  document.getElementById('stWrong').textContent=stat.wrong;
  document.getElementById('stRate').textContent=Math.round(stat.right/stat.total*100)+'%';
  document.getElementById('nextBtn').disabled=false;
  updateBar();
}

function updateBar(){
  document.getElementById('pbar').style.width=Math.round(pos/orderList.length*100)+'%';
}

function showDone(area){
  clearProgress();
  const rate=stat.total?Math.round(stat.right/stat.total*100):0;
  let msg= rate>=90?'🏆 太强了！':rate>=70?'👍 很棒！':rate>=50?'💪 继续加油！':'📚 需要加强复习';
  area.innerHTML='<div class="done"><h2>🎉 本轮完成！</h2>'+
   '<div class="big">'+msg+'</div>'+
   '<p>答对 <b class="right">'+stat.right+'</b> 题，答错 <b class="wrong">'+stat.wrong+'</b> 题</p>'+
   '<p>正确率：<b>'+rate+'%</b></p>'+
   '<div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+
     '<button onclick="startQuiz()" style="padding:12px 24px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;font-size:15px;cursor:pointer">再练一轮</button>'+
     '<button onclick="onlyWrong()" style="padding:12px 24px;border:none;border-radius:10px;background:#dc2626;color:#fff;font-weight:600;font-size:15px;cursor:pointer">只练本轮错题('+wrongIds.size+')</button>'+
     (historyWrong.size?('<button onclick="practiceHistory()" style="padding:12px 24px;border:none;border-radius:10px;background:#7c3aed;color:#fff;font-weight:600;font-size:15px;cursor:pointer">📌 练全部存档错题('+historyWrong.size+')</button>'):'')+
   '</div></div>';
  updateBar();
}

function onlyWrong(){
  if(wrongIds.size===0){ alert('本轮没有错题，太棒了！'); return; }
  orderList=[...wrongIds]; pos=0; stat.right=0; stat.wrong=0; wrongIds=new Set();
  document.getElementById('stRight').textContent='0';
  document.getElementById('stWrong').textContent='0';
  render();
}

function practiceHistory(){
  if(historyWrong.size===0){ alert('还没有存档错题。先刷一轮，答错的题会自动存档，下次就能针对性重练。'); return; }
  mode='hist'; selectedChap='all';
  orderList=[...historyWrong]; pos=0; stat.right=0; stat.wrong=0; wrongIds=new Set();
  document.getElementById('modeOrder').classList.remove('active');
  document.getElementById('modeRandom').classList.remove('active');
  document.getElementById('stRight').textContent='0';
  document.getElementById('stWrong').textContent='0';
  render();
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 事件
document.getElementById('modeOrder').onclick=()=>{mode='order';document.getElementById('modeOrder').classList.add('active');document.getElementById('modeRandom').classList.remove('active');startQuiz();};
document.getElementById('modeRandom').onclick=()=>{mode='random';document.getElementById('modeRandom').classList.add('active');document.getElementById('modeOrder').classList.remove('active');startQuiz();};
sel.onchange=()=>{selectedChap=sel.value==='all'?'all':parseInt(sel.value);startQuiz();};
// 错题练习按钮（修复：绑定点击事件）
var hb=document.getElementById('histBtn'); if(hb){ hb.onclick=practiceHistory; }

startQuiz();
</script>
</body>
</html>
